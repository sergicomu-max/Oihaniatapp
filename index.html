n un PAC de –0,6 no significativo.","C":"La tasa de mortalidad por cáncer de cérvix en 2023 fue superior a 5 por 100.000 TEE (Tasa Estandarizada por Edad), con más de 40 defunciones, aunque con una tendencia estable desde 2001.","D":"En 2023 no se registraron fallecimientos por cáncer de cérvix en la CAPV y la tendencia desde 2001 mostró un porcentaje de cambio anual (PAC) negativo y significativo."},"c":"B"},{"id":483,"q":"En relación al desarrollo del cáncer de cuello uterino (CCU), señale la opción correcta: ¿cuál es el orden adecuado de las fases descritas en la historia natural del CCU?","o":{"A":"Persistencia de la infección por Virus del Papiloma Humano-Alto Riesgo (VPH-AR) → infección inicial → invasión de la membrana basal → progresión a lesiones precancerosas.","B":"Infección inicial por VPH-AR → progresión directa a cáncer invasor → persistencia de la infección → invasión de la membrana basal.","C":"Infección inicial por VPH-AR → persistencia de la infección en el tiempo → progresión a lesiones precancerosas → invasión de la membrana basal del epitelio.","D":"Persistencia de la infección → regresión → invasión de la membrana basal → progresión a lesiones precancerosas."},"c":"C"},{"id":484,"q":"Respecto a la prevalencia de los genotipos de Virus de Papiloma Humano (VPH) en España, señale la opción correcta:","o":{"A":"Los genotipos de VPH de alto riesgo más frecuentes son VPH 6 y 11, mientras que el VPH 16 apenas alcanza el 0,5% de prevalencia.","B":"Entre los VPH de alto riesgo oncogénico, el más frecuente en España es el VPH 16 (2,9%), seguido del VPH 52 (1,8%), VPH 51 (1,6%), VPH 31 (1,3%) y VPH 66 (1,2%), mientras que el VPH 18 presenta una prevalencia del 0,5%.","C":"Los tipos VPH 6 y 11 son los genotipos de alto riesgo más frecuentes en España, con prevalencias del 12,2% y 7,5% respectivamente","D":"El conjunto de los tipos de VPH de alto riesgo tiene una prevalencia inferior al 1% en todas las mujeres españolas evaluadas."},"c":"B"},{"id":485,"q":"Respecto a la vacunación frente al virus del papiloma humano (VPH), señale la opción correcta:","o":{"A":"La vacunación que incluye los genotipos VPH 16 y 18 ofrece una protección del 90% frente a los virus oncogénicos y su eficacia es igual independientemente del momento de inicio de las relaciones sexuales.","B":"Los estudios en mujeres de 18-24 años muestran una reducción del 73% en infecciones cervicales tras la vacunación, y la nueva vacuna nonavalente podría reducirlas hasta un 90%.","C":"El inicio de las relaciones sexuales contraindica la vacunación porque disminuye su efectividad por debajo del 10%.","D":"La vacuna nonavalente cubre exclusivamente los genotipos VPH 6 y 11, responsables del 70% de los cánceres de cuello uterino."},"c":"B"},{"id":486,"q":"En relación a las características que debe poseer un modelo de cribado poblacional, señale la opción correcta:","o":{"A":"Debe basarse exclusivamente en la captación oportunista, sin utilizar un censo poblacional ni sistemas de rellamada, y no es necesario respetar intervalos de prueba si se mantiene una participación elevada.","B":"Debe contar con una estructura propia basada en un censo para captar a la población diana, disponer de sistemas de rellamada, alcanzar una cobertura de invitación ideal por encima del 95%, respetar los intervalos de aplicación de la prueba, utilizar una técnica de cribado validada, asegurar el control de calidad, establecer circuitos de derivación y seguimiento, y monitorizar y registrar todo el proceso.","C":"Debe garantizar un sistema organizativo que permita identificar a las mujeres susceptibles de cribado mediante bases de datos clínicas generales, ofreciendo una cobertura de invitación del 75%. Asimismo, es deseable contar con procedimientos de derivación y seguimiento, aunque estos pueden integrarse dentro de los circuitos asistenciales habituales sin necesidad de un dispositivo poblacional dedicado.","D":"Debe disponer de herramientas para invitar a la población, preferentemente mediante canales como SMS o correo electrónico, y procurar mantener la regularidad de las pruebas, priorizando el uso de técnicas diagnósticas validadas cuando sea posible. La organización del cribado puede apoyarse en recursos asistenciales comunes, siempre que exista algún mecanismo básico de supervisión del proceso y se puedan implementar derivaciones según disponibilidad de cada centro."},"c":"B"},{"id":487,"q":"En relación a las pruebas primarias de cribado en el Programa de cribado de cáncer de cérvix de Osakidetza, señale la opción correcta:","o":{"A":"El cribado comienza a los 20 años con citología anual, y el test de VPH-AR se utiliza solo como prueba de confirmación en mujeres mayores de 50 años.","B":"Las mujeres de 25 a 29 años se criban con citología cada 3 años, y las de 30 a 65 años con detección de VPH-AR (genotipado parcial) cada 5 años; además, las mujeres nacidas a partir de 2001 y vacunadas antes de los 15 años inician el cribado a los 30 años con VPH-AR cada 5 años.","C":"Todas las mujeres de entre 25 y 65 años deben de someterse preferentemente a citología cada 3 años, dado que este método ha sido tradicionalmente el más utilizado y permite un seguimiento continuado. El uso del test de VPH-AR debe de reservarse como herramienta secundaria en casos seleccionados.","D":"La periodicidad del cribado puede adaptarse según la disponibilidad de recursos y la organización de cada centro, sin requerir necesariamente intervalos fijos de 3 o 5 años."},"c":"B"},{"id":488,"q":"¿En qué caso está indicado solicitar un co-test como prueba primaria de cribado según el programa de la Comunidad Autónoma del País Vasco (CAPV)?","o":{"A":"En todas las mujeres con VPH positivo, independientemente del genotipo.","B":"En mujeres con citología L-SIL y VPH negativo.","C":"Únicamente en mujeres cuyo cribado previo mostró ASCUS con test de VPH-AR negativo.","D":"En mujeres mayores de 50 años para aumentar la sensibilidad del cribado."},"c":"C"},{"id":489,"q":"Respecto a las infecciones de transmisión sexual (ITS), señale la opción correcta:","o":{"A":"Son enfermedades poco frecuentes en países desarrollados.","B":"Solo afectan a población joven.","C":"Constituyen una de las principales causas de enfermedad a nivel mundial.","D":"No generan complicaciones a largo plazo."},"c":"C"},{"id":490,"q":"¿Cuál de las siguientes complicaciones NO se asocia a ITS en la mujer?","o":{"A":"Hipotiroidismo.","B":"Embarazo ectópico.","C":"Infertilidad.","D":"Enfermedad inflamatoria pélvica."},"c":"A"},{"id":491,"q":"Las ITS son consideradas un problema de salud pública principalmente por:.","o":{"A":"Su fácil diagnóstico.","B":"Su elevada mortalidad exclusivamente.","C":"Su tratamiento complejo exclusivamente.","D":"Su alta incidencia y complicaciones."},"c":"D"},{"id":492,"q":"Respecto a la sífilis, señale la opción correcta:","o":{"A":"Es causada por un virus.","B":"No tiene repercusión en el embarazo.","C":"Puede producir mortalidad fetal si no se trata.","D":"No tiene tratamiento."},"c":"C"},{"id":493,"q":"¿Cuál de los siguientes microorganismos forma parte habitual de la flora vaginal?","o":{"A":"Neisseria gonorrhoeae.","B":"Treponema pallidum.","C":"VIH.","D":"Lactobacilos."},"c":"D"},{"id":494,"q":"La candidiasis vaginal se asocia principalmente a:","o":{"A":"Virus.","B":"Hongos.","C":"Protozoos.","D":"Bacterias."},"c":"B"},{"id":495,"q":"¿Cuál es una de las razones por las que las ITS se consideran un problema de salud pública de gran magnitud?","o":{"A":"Porque afectan también a recién nacidos y producen complicaciones como infertilidad o cáncer cervicouterino.","B":"Porque su diagnóstico es siempre evidente y fácil de identificar.","C":"Porque solo afectan a personas de nivel socioeconómico bajo.","D":"Porque solo se transmiten por vía sexual, lo que limita su prevención."},"c":"A"},{"id":496,"q":"¿Qué relación existe entre el Virus del Herpes Simple (VHS-2) y el VIH?","o":{"A":"El VHS-2 protege contra la infección por VIH al estimular el sistema inmunitario.","B":"El VHS-2 multiplica la transmisión del VIH entre 50 y 300 veces en presencia de úlceras genitales.","C":"El VHS-2 y el VIH no tienen ninguna interacción.","D":"El VHS-2 es una infección que siempre presenta síntomas floridos, ayudando a diagnosticar el VIH."},"c":"B"},{"id":497,"q":"¿Cuál es una de las consecuencias específicas de las infecciones gonocócicas y clamidianas no tratadas en la mujer?","o":{"A":"Ceguera irreversible en el primer año de vida del/ de la recién nacido/a.","B":"Enfermedad inflamatoria pélvica en hasta un 40 % de los casos, y de esos, uno de cada cuatro provoca infertilidad.","C":"Cáncer de cérvix asegurado en todas las mujeres que padecen estas infecciones.","D":"Aparición inmediata de úlceras genitales dolorosas que multiplican el riesgo de VIH."},"c":"B"},{"id":498,"q":"¿Cuál es una de las actividades o consejos que debe realizar el/la matrón/a en la prevención de las ITS?","o":{"A":"Recetar antibióticos de forma inmediata ante cualquier síntoma de infección.","B":"Prescribir tratamiento psicológico exclusivamente a la pareja de la persona paciente sin evaluar a la paciente.","C":"Realizar intervenciones quirúrgicas para tratar las complicaciones de las ITS.","D":"Educación sanitaria en cuanto al empleo del condón para evitar infecciones de transmisión sexual."},"c":"D"},{"id":499,"q":"¿Qué acción debe realizar el/la matrón/a cuando observa o detecta los primeros signos o síntomas de una ITS?","o":{"A":"Iniciar un tratamiento inmediato con antirretrovirales.","B":"Derivar al médico en cuanto se observen o detecten los primeros signos o síntomas.","C":"Esperar varias semanas para confirmar si los síntomas desaparecen espontáneamente.","D":"Notificar el caso únicamente a las autoridades sanitarias sin informar a la paciente."},"c":"B"},{"id":500,"q":"¿Cuál es la clínica del molusco contagioso?","o":{"A":"Prurito, secreción vaginal-Prematuridad.","B":"Proliferaciones verrugosas, carcinoma.","C":"Vesículas dolorosas, sepsis neonatal.","D":"Pápulas cutáneas de superficies lisas, firmes y esféricas, con umbilicación del vértice."},"c":"D"},{"id":501,"q":"De acuerdo con las normas generales de ordenación de las profesiones sanitarias, para poder ejercer una profesión sanitaria será requisito imprescindible:","o":{"A":"La colegiación, cuando una ley estatal establezca esta obligación para el ejercicio de una profesión titulada o algunas actividades propias de ésta.","B":"La inexistencia de inhabilitación o suspensión para el ejercicio profesional por sentencia judicial, aunque no sea firme, durante el periodo de tiempo que fije ésta; por resolución sancionadora impuesta por un colegio profesional sanitario, cuando una ley estatal establezca para este ejercicio la obligación de pertenecer al colegio profesional respectivo durante el periodo de tiempo que fije ésta; o por resolución administrativa sancionadora firme, durante el periodo de tiempo que fije ésta, cuando se ejerz a la profesión en el ámbito de la asistencia sanitaria pública.","C":"Tener suscrito y vigente un seguro de responsabilidad, un aval u otra garantía financiera, ya sean de protección personal o colectiva, que cubra las indemnizaciones que se puedan derivar de la responsabilidad profesional por un eventual daño a las personas , causado con ocasión de la prestación de tal asistencia o servicios, cuando se ejerza la profesión en el ámbito de la asistencia sanitaria pública.","D":"Todo lo anterior."},"c":"A"},{"id":502,"q":"Según lo establecido en la normativa vigente sobre ordenación de las profesiones sanitarias, para poder ejercer una profesión sanitaria:","o":{"A":"Se ha de tener suscrito y vigente un seguro de responsabilidad que cubra las indemnizaciones que se puedan derivar de la responsabilidad profesional por un eventual daño a las personas causado con ocasión de la prestación de tal asistencia o servicios cuan do se ejerza la profesión en el ámbito de la asistencia sanitaria privada, no siendo suficiente un aval u otra garantía financiera de protección colectiva.","B":"Se ha de tener suscrito y vigente un seguro de responsabilidad, un aval u otra garantía financiera, sean de protección personal o colectiva, que cubra las indemnizaciones que se puedan derivar de la responsabilidad profesional por un eventual daño a las pe rsonas causado con ocasión de la prestación de tal asistencia o servicios cuando se ejerza la profesión en el ámbito de la asistencia sanitaria privada.","C":"Se ha de tener suscrito y vigente un seguro de responsabilidad, un aval u otra garantía financiera, sean de protección personal o colectiva, que cubra las indemnizaciones que se puedan derivar de la responsabilidad profesional por un eventual daño a las personas causado con ocasión de la prestación de tal asistencia o servicios cuando se ejerza la profesión en el ámbito de la asistencia sanitaria pública.","D":"Todas las opciones son falsas."},"c":"B"},{"id":503,"q":"Según la normativa vigente, el órgano encargado del Registro Estatal de Profesionales Sanitarios podrá (indíquese la que sea correcta):","o":{"A":"Consultar los datos de carácter personal de la población profesional sanitaria contenidos en los archivos y ficheros del Documento Nacional de Identidad (DNI) y del Número de Identidad de Extranjero (NIE) competencia del Ministerio del Interior, para contr astar la veracidad de la información que consta en el registro.","B":"Consultar los datos de carácter personal de la población profesional sanitaria contenidos en los archivos y ficheros del Documento Nacional de Identidad (DNI) y del Número de Identidad de Extranjero (NIE) competencia del Ministerio del Interior, para contr astar la veracidad de la información que consta en el registro, pero solo si la persona titular no se ha opuesto explícitamente.","C":"Consultar los datos de carácter personal de los profesionales sanitarios contenidos en los archivos y ficheros del Documento Nacional de Identidad (DNI) y del Número de Identidad de Extranjero (NIE) competencia del Ministerio del Interior, para contrastar la veracidad de la información que consta en el registro, pero solo si el titular de los datos da su consentimiento expreso.","D":"Solo podrá consultar los datos de carácter personal de la población profesional sanitaria contenidos en los archivos y ficheros del Documento Nacional de Identidad (DNI) y del Número de Identidad de Extranjero (NIE) en el curso de una investigación sobre u na infracción administrativa."},"c":"A"},{"id":504,"q":"En el marco de la ordenación de las profesiones sanitarias, las personas pacientes:","o":{"A":"Tienen derecho a la libre elección del personal facultativo que debe atenderles, tanto si su ejercicio profesional se desarrolla en el sistema público como en el ámbito privado.","B":"Tienen derecho a la libre elección del personal facultativo que debe atenderles, pero solo si su ejercicio profesional se desarrolla en el sistema público.","C":"Tienen derecho a la libre elección del personal facultativo que debe atenderles, pero solo si su ejercicio profesional se desarrolla en el ámbito privado.","D":"Ninguna de las anteriores es correcta."},"c":"A"},{"id":505,"q":"Según la normativa de ordenación de las profesiones sanitarias, el personal profesional y las personas responsables de los centros sanitarios facilitarán a sus pacientes el ejercicio del derecho a conocer:","o":{"A":"El nombre, la titulación, la especialidad y la hoja de servicios del personal sanitario que les atiende, así como la categoría y función de dicho personal, si así estuvieran definidas en su centro o institución.","B":"El nombre, la titulación y la especialidad del personal sanitario que les atiende y su categoría, pero no su función en su centro o institución.","C":"El nombre, la titulación y la especialidad del personal sanitario que les atiende, así como la categoría y función de dicho personal, si así estuvieran definidas en su centro o institución.","D":"El nombre, la titulación y la especialidad del personal sanitario que les atiende, pero no su categoría y función en su centro o institución."},"c":"C"},{"id":506,"q":"De acuerdo con las normas generales de ordenación de las profesiones sanitarias, el ejercicio del derecho del personal profesional sanitario a la renuncia a la atención a una persona paciente queda condicionado a que (señálese la respuesta incorrecta):","o":{"A":"Su renuncia no conlleve desatención de la persona paciente.","B":"La renuncia se ejerza de acuerdo con procedimientos regulares.","C":"Quede constancia, aunque no sea formal, de la renuncia.","D":"La renuncia se ejerza de acuerdo con procedimientos establecidos y explícitos."},"c":"C"},{"id":507,"q":"Los centros sanitarios revisarán que el personal sanitario de su plantilla cumple los requisitos necesarios para ejercer la profesión conforme a lo previsto en la Ley 44/2003, de 21 de noviembre, de ordenación de las profesiones sanitarias y en las demás n ormas aplicables:","o":{"A":"Cada cinco años como mínimo.","B":"Cada tres años como mínimo.","C":"Cada dos años como mínimo.","D":"Cada cuatro años como mínimo."},"c":"B"},{"id":508,"q":"Según dispone la Ley 44/2003, de 21 de noviembre, de ordenación de las profesiones sanitarias, cuando una actuación sanitaria se realice por un equipo de profesionales (señálese la respuesta incorrecta):","o":{"A":"Se articulará, preferentemente, de forma jerarquizada, atendiendo a los criterios de conocimientos y competencia y, en su caso, al de titulación del personal profesional que integra el equipo, en función de la actividad concreta a desarrollar, de la confia nza y conocimiento recíproco de las capacidades de quienes forman el equipo, y de los principios de accesibilidad y continuidad asistencial de las personas atendidas.","B":"Se articulará de forma jerarquizada o colegiada, atendiendo a los criterios de conocimientos y competencia y, en su caso, al de titulación del personal profesional que integra el equipo, en función de la actividad concreta a desarrollar, de la confianza y conocimiento recíproco de las capacidades de quienes forman el equipo, y de los principios de accesibilidad y continuidad asistencial de las personas atendidas.","C":"Se articulará de forma preferentemente colegiada, atendiendo a los criterios de conocimientos y competencia y, en su caso, al de titulación del personal profesional que integra el equipo, en función de la actividad concreta a desarrollar, de la confianza y conocimiento recíproco de las capacidades de quienes forman el equipo, y de los principios de accesibilidad y continuidad asistencial de las personas atendidas.","D":"Ninguna de las anteriores es correcta."},"c":"D"},{"id":509,"q":"De acuerdo con la Ley 44/2003, de 21 de noviembre, de ordenación de las profesiones sanitarias, diga cuál de los siguientes principios generales de la relación entre las personas que ejercen profesiones sanitarias y las personas atendidas no es tal:","o":{"A":"El personal profesional tiene el deber de hacer un uso racional de los recursos diagnósticos y terapéuticos a su cargo, tomando en consideración, entre otros, los costes de sus decisiones y evitando la sobreutilización, la infrautilización y la inadecuada utilización de los mismos.","B":"El personal profesional tiene el deber de prestar una atención sanitaria técnica y profesional adecuada a las necesidades de salud de las personas que atiende, de acuerdo con el estado de desarrollo de los conocimientos científicos de cada momento y con lo s niveles de calidad y seguridad que se establecen en esta ley y el resto de normas legales y deontológicas aplicables.","C":"El personal profesional tiene el deber de proporcionar a las personas pacientes información precisa sobre su formación profesional, la forma en que han actualizado sus conocimientos y las demandas de responsabilidad que hayan podido derivar en responsabili dades administrativas.","D":"El personal profesional tiene el deber de respetar la personalidad, dignidad e intimidad de las personas a su cuidado y debe respetar su participación en las tomas de decisiones que les afecten. En todo caso, deben ofrecer una información suficiente y adecuada para que puedan ejercer su derecho al consentimiento sobre dichas decisiones."},"c":"C"},{"id":510,"q":"De acuerdo con la Ley 44/2003, de 21 de noviembre, de ordenación de las profesiones sanitarias, los centros sanitarios acreditados para desarrollar programas de formación continuada:","o":{"A":"Deberán contar con jefaturas de estudios, con la coordinación docente y con el personal tutor de la formación que resulten adecuados en función de las actividades a desarrollar, así como con una figura de defensoría del alumnado.","B":"Deberán contar una comisión de docencia, así como con jefaturas de estudios, coordinación docente y personal tutor de la formación que resulten adecuados en función de las actividades a desarrollar.","C":"Deberán contar una comisión de docencia y con una figura de defensoría del alumnado, así como con jefaturas de estudios, coordinación docente y personal tutor de la formación que resulten adecuados en función de las actividades a desarrollar.","D":"Todas las anteriores son incorrectas."},"c":"D"},{"id":511,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, sus disposiciones se aplicarán a:","o":{"A":"A los servicios sanitarios de financiación pública y a los privados, en los mismos términos.","B":"A los servicios sanitarios de financiación pública. También a los privados en lo que se refiere al control de las actividades de salud pública y en materia de garantías de información, seguridad y calidad.","C":"A los servicios sanitarios de financiación pública y a los privados concertados.","D":"Únicamente a los servicios sanitarios de financiación pública."},"c":"B"},{"id":512,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la ciudadanía tendrá los siguientes derechos en el conjunto del Sistema Nacional de Salud:","o":{"A":"A recibir asistencia sanitaria en su comunidad autónoma de residencia.","B":"A recibir el reembolso de los gastos derivados de la asistencia en la sanidad privada cuando se trate de servicios recogidos en el catálogo de prestaciones del Sistema Nacional de Salud.","C":"A recibir el reembolso de los gastos derivados de la asistencia sanitaria del catálogo de prestaciones del Sistema Nacional de Salud que pudiera requerir del servicio de salud de la comunidad autónoma en la que se encuentre desplazado/a.","D":"Ninguna de las respuestas anteriores es correcta."},"c":"A"},{"id":513,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la cartera común de servicios del Sistema Nacional de Salud se articula en torno a las siguientes modalidades:","o":{"A":"Cartera común básica de servicios asistenciales, cartera común suplementaria y cartera común de servicios accesorios.","B":"Cartera común básica nacional de servicios asistenciales y cartera común autonómica de servicios asistenciales.","C":"Cartera común nacional básica de servicios asistenciales, cartera común suplementaria autonómica y cartera común de servicios accesorios autonómicos.","D":"Cartera común nacional y autonómica básica de servicios asistenciales, cartera común nacional y autonómica suplementaria y cartera común nacional y autonómica de servicios accesorios."},"c":"A"},{"id":514,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la cartera común básica de servicios asistenciales del Sistema Nacional de Salud comprende:","o":{"A":"Todas las actividades asistenciales de prevención, diagnóstico, tratamiento y rehabilitación que se realicen en centros sanitarios o sociosanitarios, así como el transporte sanitario urgente, la prestación farmacéutica y la prestación ortoprotésica, cubier tos de forma completa por financiación pública.","B":"Todas las actividades asistenciales de prevención, diagnóstico, tratamiento y rehabilitación que se realicen en centros sanitarios o sociosanitarios, así como el transporte sanitario urgente y la prestación farmacéutica, cubiertos de forma completa por fin anciación pública.","C":"Todas las actividades asistenciales de prevención, diagnóstico, tratamiento y rehabilitación que se realicen en centros sanitarios o sociosanitarios, así como el transporte sanitario urgente, y la prestación ortoprotésica, cubiertos de forma completa por f inanciación pública.","D":"Todas las actividades asistenciales de prevención, diagnóstico, tratamiento y rehabilitación que se realicen en centros sanitarios o sociosanitarios, así como el transporte sanitario urgente, cubiertos de forma completa por financiación pública."},"c":"D"},{"id":515,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la cartera común suplementaria del Sistema Nacional de Salud incluirá las siguientes prestaciones:","o":{"A":"Únicamente la prestación farmacéutica.","B":"Únicamente la prestación ortoprotésica.","C":"Únicamente la prestación farmacéutica y la prestación ortoprotésica.","D":"La prestación farmacéutica, la prestación ortoprotésica y la prestación con productos dietéticos."},"c":"D"},{"id":516,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la prestación de atención primaria no comprenderá:","o":{"A":"La atención a la salud bucodental.","B":"La atención paliativa a personas enfermas terminales.","C":"La rehabilitación básica.","D":"Ninguna de las respuestas anteriores es correcta."},"c":"D"},{"id":517,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, para la elaboración del contenido de la cartera común de servicios del Sistema Nacional de Salud:","o":{"A":"Es preceptivo el informe favorable de la Red Española de Agencias de Evaluación de Tecnologías Sanitarias y Prestaciones del Sistema Nacional de Salud, en relación con la eficacia, eficiencia, efectividad, seguridad y utilidad terapéuticas, así como las ve ntajas y alternativas asistenciales, el cuidado de grupos menos protegidos o de riesgo y las necesidades sociales, así como su impacto económico y organizativo.","B":"Se contará con la participación de la Red Española de Agencias de Evaluación de Tecnologías Sanitarias y Prestaciones del Sistema Nacional de Salud, en la evaluación de la eficacia, eficiencia, efectividad, seguridad y utilidad terapéuticas, así como las v entajas y alternativas asistenciales, el cuidado de grupos menos protegidos o de riesgo y las necesidades sociales, así como su impacto económico y organizativo.","C":"Es preceptivo el informe favorable de las sociedades científicas implicadas, en relación con la eficacia, eficiencia, efectividad, seguridad y utilidad terapéuticas, así como las ventajas y alternativas asistenciales, el cuidado de grupos menos protegidos o de riesgo y las necesidades sociales, así como su impacto económico y organizativo.","D":"Se contará con la participación de las sociedades científicas implicadas, en la evaluación de la eficacia, eficiencia, efectividad, seguridad y utilidad terapéuticas, así como las ventajas y alternativas asistenciales, el cuidado de grupos menos protegidos o de riesgo y las necesidades sociales, así como su impacto económico y organizativo."},"c":"B"},{"id":518,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la exclusión de una técnica, tecnología o procedimiento actualmente incluido en la cartera de servicios se llevará a cabo cuando:","o":{"A":"Se evidencie su falta de eficacia, efectividad o eficiencia, o que el balance entre beneficio y riesgo sea significativamente desfavorable.","B":"Requiera una formación para la que no exista la especialidad médica correspondiente.","C":"Hayan cambiado las condiciones económicas de su implantación.","D":"Todas las respuestas anteriores son correctas."},"c":"A"},{"id":519,"q":"A los efectos de la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la competencia profesional es:","o":{"A":"La acreditación de formación continuada a lo largo del desempeño de su carrera profesional.","B":"La competencia acreditada por el título correspondiente acreditativo de la adquisición de conocimientos requeridos para el desempeño del puesto designado.","C":"La aptitud del personal profesional sanitario para integrar y aplicar los conocimientos, habilidades y actitudes asociados a las buenas prácticas de su profesión para resolver los problemas que se le plantean.","D":"La superación del proceso selectivo oficial convocado por la autoridad competente para la adquisición del vínculo estatutario con los servicios sanitarios."},"c":"C"},{"id":520,"q":"Según dispone la Ley 16/2003, de 28 de mayo, de cohesión y calidad del Sistema Nacional de Salud, la declaración de actuaciones coordinadas en salud pública y en seguridad alimentaria deberán encuadrarse en alguno de los supuestos siguientes:","o":{"A":"Responder a situaciones de especial riesgo o alarma para la salud pública.","B":"Establecer planes preventivos para hacer frente a situaciones de especial riesgo o alarma para la salud pública.","C":"Realizar análisis epidemiológicos que permitan establecer estructuras y recursos según las previsiones en materia de salud pública y seguridad alimentaria.","D":"Las respuestas a ) y b) son verdaderas y la c ) es falsa."},"c":"A"},{"id":521,"q":"Según dispone la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, la ordenación del régimen personal estatutario de los servicios de salud se rige por una serie de principios y criterios. Señale cuales no están entre los mencionados por esta ley.","o":{"A":"Sometimiento pleno a la ley y el derecho.","B":"Igualdad, mérito, capacidad y promoción en el acceso a la condición de personal estatutario.","C":"Integración en el régimen organizativo y funcional del servicio de salud y de sus centros e instituciones.","D":"Coordinación, cooperación y mutua información entre las Administraciones sanitarias públicas."},"c":"B"},{"id":522,"q":"La condición de personal estatutario fijo se adquiere, tal y como prevé la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, por el cumplimiento de los siguientes requisitos:","o":{"A":"Incorporación a una plaza de servicio, institución o centro que corresponda en el plazo fijado en la convocatoria tras la superación de las pruebas de selección.","B":"Superación de las pruebas de selección; nombramiento conferido por el órgano competente; e incorporación a una plaza del servicio, institución o centro que corresponda en el plazo de un mes.","C":"Superación de las pruebas de selección; nombramiento conferido por el órgano competente; e incorporación, previo cumplimiento de los requisitos formales en cada caso establecidos, a una plaza del servicio, institución o centro que corresponda en el plazo d eterminado en la convocatoria.","D":"Superación de las pruebas de selección; nombramiento conferido por el órgano competente; e incorporación a una plaza del servicio, institución o centro que corresponda en todo caso en el plazo determinado en la convocatoria."},"c":"C"},{"id":523,"q":"Según dice la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, en el proceso de la adquisición de la condición de personal estatutario fijo, no podrán recibir nombramiento y quedarán sin efecto las act uaciones de quienes:","o":{"A":"No acrediten que reúnen los requisitos y condiciones exigidos en la convocatoria, una vez superado el proceso selectivo.","B":"No acrediten que reúnen los requisitos y condiciones exigidos en la convocatoria, con carácter previo a la superación del proceso selectivo.","C":"No acrediten que reúnen los requisitos y condiciones exigidos en la convocatoria, una vez firmada la convocatoria.","D":"Una vez superado el proceso selectivo, automáticamente se procede al nombramiento por el órgano competente."},"c":"A"},{"id":524,"q":"La pérdida de la condición de personal estatutario regulada en la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, se produce:","o":{"A":"Siempre en caso de pena de inhabilitación especial para empleo o cargo público, afecte o no al correspondiente nombramiento.","B":"En caso de que se adopte la pena de inhabilitación absoluta sea firme o no.","C":"En caso de que se adopte la pena de inhabilitación especial para la correspondiente profesión, siempre que esta exceda de seis años.","D":"En caso de que se adopte la pena de inhabilitación especial para la correspondiente profesión, siempre que esta exceda de tres años."},"c":"C"},{"id":525,"q":"Conforme a la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, señale cuál de las siguientes afirmaciones no es correcta:","o":{"A":"La jubilación puede ser forzosa o voluntaria.","B":"Para que la persona interesada pueda prolongar su permanencia en servicio activo hasta cumplir los 70 años, bastará con que lo solicite voluntariamente.","C":"La jubilación forzosa se declarará al cumplir la persona interesada 65 años.","D":"Podrá optar a la jubilación voluntaria, total o parcial, el personal estatutario que reúna los requisitos establecidos en la legislación de Seguridad Social."},"c":"B"},{"id":526,"q":"Procede la extinción de la condición de personal estatutario fijo de los servicios de salud:","o":{"A":"Cuando se produzca la pérdida de la nacionalidad.","B":"En caso de recaer sanción firme disciplinaria de separación del servicio.","C":"Siempre que se imponga una pena principal o accesoria de inhabilitación especial para empleo o cargo público o para el ejercicio de la correspondiente profesión.","D":"Todas las anteriores respuestas son correctas."},"c":"D"},{"id":527,"q":"En materia de retribuciones, la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, prevé que:","o":{"A":"El sistema retributivo del personal estatutario se estructura en retribuciones básicas y retribuciones complementarias.","B":"La evaluación del personal estatutario a efectos de determinación de una parte de la retribuciones complementarias se establecerá a través de procedimientos fundados en los principios igualdad, objetividad y transparencia.","C":"El sistema retributivo del personal estatutario responde a los principios de cualificación técnica y profesional.","D":"Todas las respuestas son correctas."},"c":"D"},{"id":528,"q":"De acuerdo con la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud, señale la respuesta correcta respecto a las retribuciones del personal estatutario de los servicios de salud:","o":{"A":"Las retribuciones básicas son: el sueldo asignado a cada categoría en función del título exigido para su desempeño; los trienios; y las pagas extraordinarias.","B":"Las retribuciones básicas serán iguales en todos los servicios de salud independientemente de la anualidad en la que se perciban.","C":"El personal estatutario temporal percibirá la totalidad de las retribuciones que, en el correspondiente servicio de salud, correspondan a su nombramiento, con excepción del complemento de carrera.","D":"El complemento de atención continuada está destinado a retribuir la iniciativa continuada y permanente de la persona titular del puesto."},"c":"A"},{"id":529,"q":"La pérdida de la condición de personal estatutario de los servicios de salud se produce cuando la incapacidad permanente sea declarada:","o":{"A":"En grado de incapacidad permanente total para la profesión habitual.","B":"En grado de incapacidad absoluta para todo trabajo.","C":"En grado de gran invalidez.","D":"Todas las respuestas son correctas."},"c":"D"},{"id":530,"q":"En el supuesto del personal estatutario de los servicios de salud:","o":{"A":"El período de localización es aquel período de tiempo en el que el personal se encuentra únicamente en situación de disponibilidad.","B":"Se considera período de descanso todo período de tiempo que no sea tiempo de trabajo.","C":"El trabajo por turnos es una forma de organización del trabajo en equipo con arreglo al ritmo rotatorio y siempre de tipo continuo.","D":"El período de localización es aquel período de tiempo en el que el personal se encuentra en situación de disponibilidad a los solos efectos de asegurar su posible localización."},"c":"B"},{"id":531,"q":"Para el personal estatutario de los servicios de salud, el período nocturno tendrá la siguiente duración:","o":{"A":"Mínima de siete horas e incluirá necesariamente el período comprendido entre las cero y las cinco horas de cada día natural.","B":"Mínima de ocho horas e incluirá necesariamente el período comprendido entre las cero y las cinco horas de cada día natural.","C":"Mínima de ocho horas e incluirá necesariamente el período comprendido entre las doce y las cinco horas de cada día natural.","D":"Mínima de siete horas e incluirá necesariamente el período comprendido entre las doce y las cinco horas de cada día natural."},"c":"A"},{"id":532,"q":"Según establece la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud:","o":{"A":"Resulta incompatible para el personal estatutario de los servicios de salud el ejercicio de las funciones sanitarias con cualquier otro tipo de funciones.","B":"Al personal estatutario de los servicios de salud le resulta aplicable el mismo régimen de incompatibilidades establecido para el personal funcionario.","C":"Atendiendo a lo que establezca la legislación vigente, el personal estatutario de los servicios de salud podrá compatibilizar las funciones sanitarias y docente.","D":"Para el personal licenciado sanitario el complemento específico resulta irrenunciable."},"c":"C"},{"id":533,"q":"La Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud regula el descanso semanal. Señale la respuesta que no es correcta:","o":{"A":"El personal tendrá derecho a un período mínimo que siempre será fijo de descanso ininterrumpido con una duración media de 24 horas semanales.","B":"El período de referencia para el cálculo del período de descanso semanal será de tres meses.","C":"En el caso de que no se hubiera disfrutado del tiempo mínimo de descanso semanal en el período de tres meses se producirá una compensación a través del régimen de descansos alternativos.","D":"El período de referencia para el cálculo del período de descanso semanal será de dos meses."},"c":"B"},{"id":534,"q":"Conforme a la Ley 55/2003, de 16 de diciembre, del Estatuto Marco del personal estatutario de los servicios de salud:","o":{"A":"El personal tendrá derecho a una vacación retribuida cuya duración no será inferior en ningún caso a 30 días naturales.","B":"El personal estatutario de los servicios de salud podrá elegir sustituir el período de vacación por una compensación económica.","C":"Solo podrá ser sustituido por una compensación económica el período vacacional anual mediante la programación funcional de los centros, cuando así lo aconsejen razones organizativas.","D":"Anualmente, el personal tendrá derecho a una vacación retribuida cuya duración no será inferior a 30 días naturales, o al tiempo que proporcionalmente corresponda en función del tiempo de servicios."},"c":"D"},{"id":535,"q":"La excedencia voluntaria solicitada por el personal estatutario de los servicios de salud por interés particular exige haber prestado servicios efectivos en cualquiera de las Administraciones públicas durante:","o":{"A":"Los cinco años inmediatamente anteriores.","B":"Los cuatro años inmediatamente anteriores.","C":"Los dos años inmediatamente anteriores.","D":"Los tres años inmediatamente anteriores."},"c":"A"},{"id":536,"q":"La Ley 8/1997, de 26 de junio, de ordenación Sanitaria de Euskadi, establece que la Administración sanitaria vasca debe garantizar la tutela general de la salud pública a través de:","o":{"A":"Medidas preventivas.","B":"Promoción de la salud.","C":"Prestaciones sanitarias individuales.","D":"Son correctas todas las respuestas."},"c":"D"},{"id":537,"q":"La Ley 8/1997, de 26 de junio, de ordenación Sanitaria de Euskadi, reconoce la universalidad del derecho a la protección de la salud para:","o":{"A":"Todas las personas residentes en el territorio de Euskadi, así como para las personas transeúntes.","B":"Todas las personas residentes en Euskadi o fuera de Euskadi, así como para las personas transeúntes.","C":"Solo para las personas que tengan vecindad administrativa en Euskadi.","D":"Solo para las personas de quienes pueda predicarse la condición política de vascos."},"c":"A"},{"id":538,"q":"Señale cuál de los siguientes principios no se enuncian entre los principios informadores del sistema sanitario de Euskadi en la Ley 8/1997, de 26 de junio, de ordenación Sanitaria de Euskadi:","o":{"A":"Universalidad.","B":"Solidaridad ciudadana.","C":"Equidad.","D":"Calidad de los servicios."},"c":"B"},{"id":539,"q":"La Ley 8/1997, de 26 de junio, de ordenación Sanitaria de Euskadi, establece respecto a las áreas de salud que:","o":{"A":"La Comunidad Autónoma del País Vasco se divide territorialmente en áreas de salud de acuerdo con la situación socio -económica de cada demarcación geográfica.","B":"En cada área de salud pueden ponerse en práctica las actuaciones esenciales que requiere la tutela general de la salud pública y exclusivamente la asistencia sanitaria primaria .","C":"En cada área de salud se garantizará una adecuada ordenación de la atención primaria y su coordinación con la atención especializada.","D":"Son correctas la a) y la c)."},"c":"C"},{"id":540,"q":"La Ley 8/1997, de 26 de junio, de ordenación Sanitaria de Euskadi prevé la creación de sistemas de información necesarios para facilitar el ejercicio adecuado de los distintos niveles de responsabilidad en el sistema. A tal fin, los datos de carácter perso nal relativos a la salud podrán ser recabados y tratados siempre que se cumplan los siguientes requisitos:","o":{"A":"Siempre debe constar el previo consentimiento de la persona afectada.","B":"Si no consta el previo consentimiento de la persona afectada se requiere que la actuación se encuentre debidamente autorizada y se efectúe previo procedimiento de disociación que garantice el anonimato de la información.","C":"Que conste el previo consentimiento de la persona afectada por escrito y que se garantice el anonimato de la información.","D":"Basta con que la actuación se encuentre debidamente autorizada."},"c":"B"},{"id":541,"q":"La Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi al contemplar los derechos y deberes ciudadanos, alude a:","o":{"A":"La obligación de dejar constancia escrita de todo proceso diagnóstico o terapéutico.","B":"La obligación de dejar constancia por cualquier medio de todo proceso diagnóstico.","C":"La obligación de dejar constancia por cualquier medio de todo proceso diagnóstico o terapéutico.","D":"No existe en la Ley ninguna previsión a este respecto, de modo que será el personal facultativo el que decida si el proceso diagnóstico o terapéutico debe quedar registrado."},"c":"A"},{"id":542,"q":"El contrato -programa, tal y como establece la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi:","o":{"A":"Es el instrumento jurídico mediante el que se articulan las relaciones entre el Gobierno Vasco y las organizaciones del ente público Osakidetza -Servicio Vasco de Salud para la provisión de servicios sanitarios.","B":"Es el instrumento jurídico mediante el que se articulan de manera directa las relaciones entre el Departamento competente en materia de sanidad y las organizaciones del ente público Osakidetza -Servicio Vasco de Salud que tiene naturaleza jurídica de concie rto.","C":"Es el instrumento jurídico mediante el que se articulan de manera directa las relaciones entre el Departamento competente en materia de sanidad y las organizaciones del ente público Osakidetza -Servicio Vasco de Salud que tiene naturaleza jurídica de un con venio de carácter especial.","D":"Ninguna respuesta es correcta."},"c":"C"},{"id":543,"q":"El consejo de administración de Osakidetza -Servicio Vasco de Salud está integrado por:","o":{"A":"La persona titular de la presidencia y por un número no superior a cinco miembros en representación de la Administración de la Comunidad Autónoma de Euskadi.","B":"La persona titular de la presidencia y por un número no superior a tres miembros en representación de la Administración de la Comunidad Autónoma de Euskadi.","C":"La persona titular de la presidencia y por cinco miembros en representación del Departamento competente en materia de sanidad.","D":"La persona titular de la presidencia, la Consejería del Departamento competente en materia de sanidad y tres miembros en representación de la Administración de la Comunidad Autónoma de Euskadi."},"c":"A"},{"id":544,"q":"Según establece la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi:","o":{"A":"El Plan de Salud de Euskadi debe ser aprobado por el Parlamento Vasco.","B":"El Departamento competente en materia de sanidad debe elaborar semestralmente y remitir al Parlamento un informe con la evaluación de los objetivos y determinaciones del Plan de Salud de Euskadi.","C":"El Departamento competente en materia de sanidad debe elaborar anualmente y remitir al Parlamento un informe con la evaluación de los objetivos y determinaciones del Plan de Salud de Euskadi.","D":"Son correctas las respuestas a) y c)."},"c":"C"},{"id":545,"q":"A los efectos de la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi, las plantillas de personal del ente público Osakidetza -Servicio Vasco de Salud:","o":{"A":"Serán aprobadas por la Presidencia a propuesta del consejo de administración.","B":"Se denomina así al número de efectivos de carácter estructural con que cuentan tanto su organización central de administración como las organizaciones de servicios dependientes de Osakidetza -Servicio Vasco de Salud.","C":"Deberán ajustarse al número máximo de efectivos, según grupos profesionales, que anualmente aprobará su consejo de administración a propuesta del Departamento de Sanidad.","D":"Deberán ajustarse al número máximo de efectivos, según grupos de titulación, que anualmente aprobará el Departamento de Sanidad."},"c":"B"},{"id":546,"q":"En el ámbito territorial de la Comunidad Autónoma de Euskadi, las inspecciones necesarias para asegurar el cumplimiento de lo previsto en la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi y en el resto de la legislación sanitaria correspond e:","o":{"A":"A la inspección de trabajo del País Vasco adscrita al Departamento de trabajo y empleo del Gobierno Vasco.","B":"En todos los casos a las corporaciones locales de la Comunidad Autónoma.","C":"Al Departamento competente en materia de sanidad.","D":"La inspección en materia sanitaria no es competencia de la Comunidad Autónoma de Euskadi."},"c":"C"},{"id":547,"q":"Señale cuál de los siguientes criterios no está contemplado en la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi para la clasificación de las infracciones en leves, graves o muy graves:","o":{"A":"La cuantía de la indemnización solicitada.","B":"Los riesgos para la salud.","C":"El grado de intencionalidad.","D":"La gravedad de la alteración sanitaria y social producida."},"c":"A"},{"id":548,"q":"Según establece la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi, en materia de sanciones señale la respuesta correcta:","o":{"A":"Las infracciones serán sancionadas exclusivamente con sanción pecuniaria o económica.","B":"En los casos de infracciones muy graves, el Gobierno Vasco podrá acordar el cierre temporal del establecimiento, instalación o servicio por un plazo máximo de cinco años.","C":"Sin perjuicio de la multa que proceda imponer, en ciertos casos, la sanción económica que se imponga podrá ser incrementada hasta el triple de la cuantía del beneficio ilícito obtenido.","D":"En los casos de infracciones muy graves, el Gobierno Vasco podrá acordar el cierre temporal del establecimiento, instalación o servicio por un plazo máximo de tres años."},"c":"B"},{"id":549,"q":"Según la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi, las organizaciones a través de las que se procede a la provisión de servicios sanitarios con medios adscritos al ente público Osakidetza -Servicio Vasco de Salud:","o":{"A":"Realizarán su actividad bajo el principio de autonomía económico -financiera y de gestión.","B":"Se configurarán como instituciones de titularidad privada y con personalidad jurídica propia.","C":"Se crearán por ley como entidades de titularidad pública y con personalidad jurídica propia.","D":"Para realizar su actividad dependen presupuestariamente del ente público Osakidetza - Servicio Vasco de Salud."},"c":"A"},{"id":550,"q":"Respecto al personal sujeto al régimen estatutario que establece la Ley 8/1997, de 26 de junio, de Ordenación Sanitaria de Euskadi, señale la respuesta correcta:","o":{"A":"Este vínculo estatutario se adquiere mediante el cumplimiento de los dos siguientes requisitos: superación del proceso selectivo correspondiente y nombramiento conferido por autoridad competente.","B":"Los principios que rigen el procedimiento selectivo para la adquisición del vínculo estatutario son exclusivamente el de igualdad, mérito y capacidad.","C":"Los instrumentos de clasificación del personal sujeto a este régimen estatutario son el grupo de titulación, el grupo profesional, la categoría y el puesto funcional que se desempeñe.","D":"El grupo de titulación constituye el instrumento de clasificación del personal en base al agrupamiento unitario de las aptitudes profesionales y contenido específico da las tareas propias de la prestación."},"c":"C"},{"id":551,"q":"Corresponderá la presidencia del ente p úblico Osakidetza -Servicio Vasco de Salud a:","o":{"A":"Quien ostente la presidencia del Gobierno (Lehendakari) de la Comunidad Autónoma del País Vasco.","B":"La Diputación General del Territorio Histórico en que esté situado el Ente.","C":"La presidencia a quien ostente la titularidad del Departamento de Sanidad y la presidencia de honor a quien ostente la presidencia del Gobierno (Lehendakari) de la Comunidad Autónoma del País Vasco.","D":"Quien ostente la titularidad de del Departamento de Sanidad."},"c":"D"},{"id":552,"q":"La función de nombrar y separar a quienes ocupen las Direcciones de División de la organización central del ente p úblico corresponde a:","o":{"A":"El Consejo de Administración del Ente.","B":"La Dirección General del Ente.","C":"La Presidencia del Ente.","D":"Ninguno de los anteriores."},"c":"A"},{"id":553,"q":"La composición del Consejo del ente público Osakidetza -Servicio Vasco de Salud contará, además de la persona que ejerza la Presidencia:","o":{"A":"Con cinco integrantes en representación de la Administración de la Comunidad Autónoma, que nombrará el Gobierno: una persona a propuesta de la titularidad del Departamento de Hacienda y Administración Pública, otra a propuesta de quien ostente la titularid ad de Bienestar Social y las tres restantes a propuesta de la persona titular de Sanidad.","B":"Con cinco integrantes en representación de la Administración de la Comunidad Autónoma, que nombrará el Gobierno: una persona a propuesta de la titularidad del Departamento de Hacienda y Administración Pública, otra a propuesta de la persona titular de la C onsejería de Presidencia y las tres restantes a propuesta de la persona titular de Sanidad.","C":"Con cinco integrantes en representación de la Administración de la Comunidad Autónoma, que nombrará el Gobierno: dos a propuesta de la persona titular del Departamento de Hacienda y Administración Pública y las tres restantes a propuesta de la persona titu lar de Sanidad.","D":"Ninguna de los anteriores."},"c":"C"},{"id":554,"q":"La pro puesta de Plan Estratégico del ente p úblico Osakidetza -Servicio Vasco de Salud :","o":{"A":"Será formulada por la Dirección General del Ente.","B":"Será aprobada por la Presidencia del Ente.","C":"Será sometida a informe del Consejo de Administración del Ente.","D":"Todas las anteriores son ciertas."},"c":"A"},{"id":555,"q":"La función de convocar, presidir, suspender y levantar las sesiones, arbitrar las deliberaciones del Consejo de Administración del ente público Osakidetza - Servicio vasco de salud y decidir los empates con su voto de calidad corresponderá a:","o":{"A":"La Dirección General.","B":"La Presidencia.","C":"La persona de mayor antigüedad del Consejo de Administración.","D":"Ninguna de las anteriores."},"c":"B"},{"id":556,"q":"La persona titul ar de la Dirección General del ente público Osakidetza - Servicio Vasco de Salud :","o":{"A":"No podrá asistir a las reuniones del Consejo de Administración del Ente.","B":"Presidirá las reuniones del Consejo de Administración del Ente.","C":"Asistirá a las reuniones del Consejo de Administración del Ente con voz y voto.","D":"Asistirá a las reuniones del Consejo de Administración del Ente con voz y sin voto."},"c":"D"},{"id":557,"q":"Corresponde a la organización central de administración y gestió n corporativa del ente público Osakidetza -Servicio Vasco de Salud , en materia de gestión asistencial (señálese la respuesta incorrecta):","o":{"A":"Supervisar el cumplimiento de las políticas generales de calidad y realizar auditorías.","B":"Definir criterios generales y proponer la política de precios correspondiente a la prestación de servicios sanitarios incluida en la cobertura pública.","C":"Coordinar los recursos y, en su caso, proponer medidas de intervención sobre las listas de espera.","D":"Promover protocolos de interés general."},"c":"B"},{"id":558,"q":"Corresponde a la organización central de administra ción y gestión corporativa del ente público Osakidetza -Servicio Vasco de Salud , en materia de gestión de recursos humanos (señálese la respuesta incorrecta):","o":{"A":"Supervisar, controlar y evaluar las políticas de personal del Ente.","B":"Promover acuerdos de cooperación con centros correspondientes a la sanidad privada.","C":"Dirigir el funcionamiento del registro de personal.","D":"Gestionar los procesos de selección y de provisión que el Consejo de Administración determine, por su carácter general, previsible número de aspirantes u otras circunstancias análogas, y, a tal fin, convocarlos, establecer sus bases, programas y contenidos , y designar a los tribunales calificadores de los mismos."},"c":"B"},{"id":559,"q":"Corresponde a cada organizaci ón de servicios sanitarios del ente público Osakidetza -Servicio Vasco de Sa lud el ejercicio de todas las facultades de gestión y administración que se requieran para el ejercicio de la actividad de provisión de servicios sanitarios que tengan encomendada, quedando excluidas únicamente:","o":{"A":"Aquellas facultades de gestión centralizada que los estatutos sociales del ente público Osakidetza -Servicio Vasco de Salud atribuyen expresamente a la organización central del Ente Público y las competencias propias de otras instancias de acuerdo con las Leyes y Reglamentos vigentes.","B":"Aquellas facultades de gestión centralizada que los estatutos sociales del ente público Osakidetza -Servicio Vasco de Salud atribuyen expresamente a la Presidencia del Ente Público y las competencias propias de otras instancias de acuerdo con las Leyes y Reglamentos vigentes.","C":"Aquellas facultades de gestión centralizada que los estatutos sociales del ente público Osakidetza -Servicio Vasco de Salud atribuyen expresamente al Consejo de Administración del Ente Público y las competencias propias de otras instancias de acuerdo con las Leyes y Reglamentos vigentes.","D":"Ninguna de las anteriores."},"c":"A"},{"id":560,"q":"El número de integrantes del equipo directivo de las organizaciones de servicios sanitarios del ente público Osakidetza -Servicio Vasco de Salud:","o":{"A":"Oscilará entre dos y tres.","B":"Oscilará entre tres y cuatro.","C":"Oscilará entre cuatro y cinco.","D":"La normativa que rige su estatuto jurídico no establece un número determinado sino un máximo de cinco."},"c":"D"},{"id":561,"q":"La función de Representar al ente público Osakidetza -Servicio Vasco de Salud en la negociación colectiva del Acuerdo Marco de Condiciones de Trabajo del Personal corresponde a:","o":{"A":"La organización central de administración y gestión corporativa del ente público Osakidetza -Servicio Vasco de Salud .","B":"La Presidencia del ente público Osakidetza -Servicio Vasco de Salud .","C":"El Consejo de Administración del ente público Osakidetza -Servicio Vasco de Salud .","D":"Ninguna de las anteriores."},"c":"A"},{"id":562,"q":"Para el desarrollo de funciones de propuesta y asesoramiento, así como de participación en las organizaciones de servicios sanitarios, existirá un Consejo de Dirección en cada una de ellas, integrado por:","o":{"A":"El equipo directivo, las jefaturas de unidad que se determinen y una representación de personas vocales electas que formen parte de los Consejos Técnicos de participación profesional respectivos.","B":"El equipo directivo, las jefaturas de unidad que se determinen, representantes sindicales y una representación de personas vocales electas que formen parte de los Consejos Técnicos de participación profesional respectivos.","C":"El equipo directivo y las jefaturas de unidad que se determinen.","D":"Todas las anteriores son falsas."},"c":"A"},{"id":563,"q":"Las organizaciones de servicios san itarios del ente público Osakidetza -Servicio Vasco de Salud podrán:","o":{"A":"Descentralizar la organización y su funcionamiento operativo, delegando en quienes ostenten la responsabilidad clínica facultades de gestión, aunque solo en materia de personal y siempre de acuerdo con el marco estratégico, los planes de gestión y el comp romiso del contrato -programa suscrito por la organización.","B":"Descentralizar la organización y su funcionamiento operativo, delegando en quienes ostenten la responsabilidad clínica facultades de gestión, pero solo en materia económica y siempre de acuerdo con el marco estratégico, los planes de gestión y el compromi so del contrato -programa suscrito por la organización.","C":"Descentralizar la organización y su funcionamiento operativo, delegando en quienes ostenten la responsabilidad clínica facultades de gestión tanto en materia económica como de personal, de acuerdo con el marco estratégico, los planes de gestión y el compr omiso del contrato -programa suscrito por la organización.","D":"Todas las anteriores son falsas."},"c":"C"},{"id":564,"q":"En materia específica de inversiones, la competencia para ejecutar las compras de suministros que se consideren centralizadas, así como definir y/o ejecutar, en su caso, las consideradas integradas corresponde a:","o":{"A":"El Consejo de Administración del ente público Osakidetza -Servicio Vasco de Salud .","B":"La organización central de administra ción y gestión corporativa del ente público Osakidetza -Servicio Vasco de Salud .","C":"La organización de servicios del ente público Osakidetza -Servicio Vasco de Salud .","D":"A quien ostente la titularidad de la Dirección -Gerencia de cada organizaci ón de servicios sanitarios del Osakidetza -Servicio Vasco de Salud ."},"c":"B"},{"id":565,"q":"En el ámbito de una organizaci ón de servicios sanitarios del ente público Osakidetza -Servicio Vasco de Salud , presidir los Consejos Técnicos de participación profesional y promover su eficaz funcionamiento es una tarea que corresponde a:","o":{"A":"La Dirección General del Ente.","B":"Quien ostente la titularidad de la Dirección -Gerencia del Ente.","C":"La Dirección Médica del Ente.","D":"Ninguna de las anteriores."},"c":"C"},{"id":566,"q":"Según el Artículo 1 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿qué dos niveles asistenciales se integran en las Organizaciones Sanitarias Integradas (OSI) de Osakidetza?","o":{"A":"Atención especializada y Atención de Urgencias.","B":"Salud Pública y Servicios Sociosanitarios.","C":"Atención hospitalaria y Atención de Emergencias.","D":"Atención primaria y Atención hospitalaria."},"c":"D"},{"id":567,"q":"Según el Artículo 2.1 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿qué objetivo último persigue la configuración de las OSI?","o":{"A":"Reducir el gasto farmacéutico mediante la unificación de compras.","B":"Favorecer la integración clínica de manera que la atención se articule en torno a la persona.","C":"Centralizar los servicios de atención primaria en las sedes hospitalarias.","D":"Eliminar las categorías profesionales de atención primaria para unificarlas con las hospitalarias."},"c":"B"},{"id":568,"q":"Según el Artículo 1 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿bajo qué principio fundamental actuarán las Organizaciones Sanitarias Integradas (OSI) del ente público Osakidetza -Servicio Vasco de Salud ?","o":{"A":"Principio de coordinación territorial y sectorial.","B":"Principio de jerarquía funcional única.","C":"Principio de autonomía económico -financiera y de gestión.","D":"Principio de centralización de todos los recursos."},"c":"C"},{"id":569,"q":"De acuerdo con el Artículo 3 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿cómo se define una OSI de clase \"monográfica\"?","o":{"A":"Es aquella donde solo se integran servicios de atención hospitalaria especializada.","B":"Es aquella cuya actividad asistencial gira en torno a un ámbito específico, integrando sus servicios y dispositivos.","C":"Es una organización que solo atiende a una patología crónica específica.","D":"Es la organización que carece de servicios de atención primaria."},"c":"B"},{"id":570,"q":"Según el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, las OSI de Tipo I se caracterizan, entre otros aspectos, por tener hospitales de carácter universitario y, además, por disponer de:","o":{"A":"Una base poblacional adscrita inferior a 300.000 habitantes.","B":"Una Dirección de Gestión que asume todas las funciones asistenciales.","C":"Unidades o servicios calificados de referencia para el conjunto del sistema sanitario vasco.","D":"Ser organizaciones de servicios de carácter monográfico y de pequeño tamaño."},"c":"C"},{"id":571,"q":"Según el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, para que una OSI sea clasificada como de Tipo III debe integrar, junto con servicios de atención primaria, un hospital de carácter ge neral y tener una base poblacional atendida inferior a:","o":{"A":"500.000 habitantes.","B":"200.000 habitantes.","C":"300.000 habitantes.","D":"100.000 habitantes."},"c":"C"},{"id":572,"q":"Según el Artículo 5 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿cuáles son los tres órganos de participación que conforman la estructura organizativa de las OSI?","o":{"A":"El Consejo de Dirección, el Comité Ejecutivo y el Comité de Ética Asistencial.","B":"El Consejo Clínico Asistencial, el Consejo Social y la Comisión Sociosanitaria.","C":"La Comisión de Seguridad, la Comisión de Docencia y la Comisión de Investigación.","D":"El Consejo de Dirección, el Consejo Social y el Comité de Evaluación."},"c":"B"},{"id":573,"q":"De acuerdo con el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿qué órganos componen el equipo directivo de una OSI, según la estructura general del artículo 5.2?","o":{"A":"Solo la Dirección Gerencia y la Dirección Médica.","B":"Las Direcciones Médica, de Atención Integrada, de Enfermería, de Personas, Económico -Financiera y de Gestión.","C":"El Consejo de Dirección y el Consejo Social exclusivamente.","D":"La Dirección Gerencia y las Jefaturas de Servicio de cada centro de salud."},"c":"B"},{"id":574,"q":"De acuerdo con el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, en las OSI de Tipo IV, la Dirección Gerencia asume, con el apoyo de puestos funcionales asistenciales, las funciones que cor responden a:","o":{"A":"La Dirección de Personas y la Dirección Económico -Financiera.","B":"La Dirección de Personas y la Dirección de Atención Integrada.","C":"La Dirección Médica y la Dirección de Enfermería.","D":"La Dirección de Gestión y el Consejo de Dirección."},"c":"C"},{"id":575,"q":"De acuerdo con el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿cuál de los siguientes NO es un órgano de dirección encargado del gobierno y gestión de las OSI de Tipo I y II?","o":{"A":"La Dirección de Personas.","B":"El Consejo Clínico Asistencial.","C":"La Dirección de Atención Integrada.","D":"La Dirección Económico -Financiera."},"c":"B"},{"id":576,"q":"Según el Artículo 7.3 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿quién tiene la competencia para el nombramiento y cese de la persona titular de la Dirección Gerencia?","o":{"A":"El Consejero o la Consejera de Salud.","B":"La Dirección General del Ente Público Osakidetza.","C":"El Consejo de Administración a propuesta de Lehendakaritza.","D":"La Dirección de Personas de la propia OSI."},"c":"B"},{"id":577,"q":"Según los Artículos 7 y 9 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿cuál es un requisito obligatorio para el nombramiento de los cargos de dirección de una OSI?","o":{"A":"Haber pertenecido al Consejo Clínico Asistencial durante al menos dos años.","B":"Superar un examen de oposición específico para gerencia sanitaria.","C":"Previa convocatoria pública donde se acredite titulación, capacidad y experiencia profesional.","D":"Tener la condición de personal estatutario fijo en la categoría de técnico/a superior."},"c":"C"},{"id":578,"q":"Según el Artículo 8.m del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿a qué dirección corresponde \"orientar la gestión desde una visión integradora empoderando la atención primaria\"?","o":{"A":"Dirección de Atención Integrada.","B":"Dirección Gerencia.","C":"Dirección de Enfermería.","D":"Dirección Económico -Financiera."},"c":"B"},{"id":579,"q":"De acuerdo con el Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿con qué ámbito(s) adicional(es) debe coordinar su actividad la Dirección de Atención Integrada, además de con la atención p rimaria y hospitalaria?","o":{"A":"Con el ámbito de Recursos Humanos y con la Universidad.","B":"Con el ámbito comunitario y socio -sanitario.","C":"Únicamente con el sociosanitario.","D":"Con las entidades locales y las empresas privadas de gestión."},"c":"B"},{"id":580,"q":"Según el Artículo 19.1 del Decreto 100/2018 de las organizaciones sanitarias integradas del ente público Osakidetza -Servicio Vasco de Salud, ¿quién ejerce la presidencia del Consejo Clínico Asistencial?","o":{"A":"La persona titular de la Dirección Gerencia.","B":"La persona titular de la Dirección Médica.","C":"La persona titular de la Dirección de Enfermería.","D":"La persona de mayor antigüedad en la vocalía de Atención Primaria."},"c":"B"},{"id":581,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, son titulares de los derechos y deberes recogidos en esta Declaración:","o":{"A":"Todas las personas que accedan o utilicen las prestaciones y servicios sanitarios que se proporcionan por el sistema sanitario de Euskadi.","B":"Todas las personas nacidas en Euskadi.","C":"Todas las personas empadronadas en Euskadi.","D":"Todas las respuestas anteriores son correctas."},"c":"A"},{"id":582,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, todos los derechos y obligaciones establecidos son exigibles:","o":{"A":"En relación a todas las acciones de carácter sanitario, incluyendo docencia, que se desarrollen en los centros, servicios o establecimientos sanitarios de titularidad pública o privada o concertados de Euskadi. Las acciones relativas a la investigación biomédica quedan fuera de esta Declaración y se rigen por su normativa específica.","B":"En relación a todas las acciones de carácter sanitario, incluyendo docencia, que se desarrollen en los centros, servicios o establecimientos sanitarios de titularidad pública o concertados que integran el sistema sanitario de Euskadi. Las acciones relativa s a la investigación biomédica quedan fuera de esta Declaración y se rigen por su normativa específica.","C":"En relación a todas las acciones de carácter sanitario, incluyendo investigación y docencia, que se desarrollen en los centros, servicios o establecimientos sanitarios de titularidad pública o privada o concertados de Euskadi.","D":"En relación a todas las acciones de carácter sanitario, incluyendo investigación y docencia, que se desarrollen en los centros, servicios o establecimientos sanitarios de titularidad pública o concertados que integran el sistema sanitario de Euskadi."},"c":"D"},{"id":583,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, los principios que informan e inspiran el conjunto de acciones de carácter sanitario que se desarro llen en el sistema sanitario de Euskadi son:","o":{"A":"El respeto a la libertad de la persona, a su dignidad y a la autonomía en las decisiones que afecten a su salud.","B":"El respeto a todo el personal profesional que integra el sistema sanitario de Euskadi.","C":"La promoción de la investigación científica en el marco del sistema sanitario de Euskadi.","D":"Todas las respuestas anteriores son correctas."},"c":"A"},{"id":584,"q":"A los efectos de la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi recogida en el Decreto 147/2015, de 21 de julio, se configuran las siguientes fases de la vida en las que se concretan necesidades específicas:","o":{"A":"1. Neonatología, infancia y adolescencia. 2. Salud sexual y reproductiva, embarazo y parto. 3. Salud laboral. 4. Personas mayores y final de la vida.","B":"1. Infancia y adolescencia. 2. Salud sexual y reproductiva. 3. Salud laboral. 4. Personas mayores.","C":"1. Infancia. 2. Adolescencia, salud sexual y reproductiva. 3. Personas mayores. 4. Final de la vida.","D":"1. Infancia y adolescencia. 2. Salud sexual y reproductiva. 3. Personas mayores. 4. Final de la vida."},"c":"D"},{"id":585,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, las personas pacientes y usuarias del Sistema Sanitario de Euskadi, en relación con la asistencia s anitaria específica referida al final de la vida, tienen derecho a:","o":{"A":"Al acompañamiento de familiares y personas allegadas en los procesos con hospitalización.","B":"Al uso, con carácter general, de habitación individual.","C":"Al acompañamiento espiritual.","D":"Todas las respuestas anteriores son correctas."},"c":"D"},{"id":586,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, la persona paciente o usuaria:","o":{"A":"Debe dejar por escrito las decisiones cuando sea legalmente exigible o recomendable.","B":"Debe dejar por escrito las decisiones cuando se lo solicite el personal profesional que le atienda.","C":"Debe dejar por escrito las decisiones cuando la política del centro sanitario así lo establezca.","D":"Debe dejar por escrito las decisiones cuando puedan tener relevancia a efectos de responsabilidad legal."},"c":"A"},{"id":587,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, los Servicios de Atención a Pacientes y personas Usuarias:","o":{"A":"Estarán disponibles en las Organizaciones de Servicios Sanitarios de Osakidetza - Servicio Vasco de Salud, los centros sanitarios concertados, los centros privados y el departamento competente en materia de sanidad.","B":"Estarán disponibles en las Organizaciones de Servicios Sanitarios de Osakidetza - Servicio Vasco de Salud, los centros sanitarios concertados y el departamento competente en materia de sanidad, pero no existe previsión en relación con los centros privados.","C":"Estarán disponibles en las Organizaciones de Servicios Sanitarios de Osakidetza - Servicio Vasco de Salud, pero no existe previsión en relación con los centros concertados, ni con los privados ni con el departamento competente en materia de sanidad.","D":"Estarán disponibles en las Organizaciones de Servicios Sanitarios de Osakidetza - Servicio Vasco de Salud y en los centros sanitarios concertados y privados, pero no existe previsión en relación con el departamento competente en materia de sanidad."},"c":"B"},{"id":588,"q":"Según el Decreto 147/2015, de 21 de julio, por el que se aprueba la Declaración sobre Derechos y Deberes de las personas en el sistema sanitario de Euskadi, las reclamaciones contra actuaciones del personal:","o":{"A":"Se resolverán atendiendo a las normas disciplinarias específicas previa apertura, en su caso, del expediente informativo correspondiente, sin perjuicio de las responsabilidades que de los hechos pudieran derivarse.","B":"Se resolverán atendiendo a las normas disciplinarias generales previa apertura, en su caso, del expediente informativo correspondiente, sin perjuicio de las responsabilidades que de los hechos pudieran derivarse.","C":"Se resolverán atendiendo a las normas disciplinarias específicas previa apertura, en su caso, del expediente informativo y de expediente de mediación, sin perjuicio de las responsabilidades que de los hechos pudieran derivarse.","D":"Se resolverán atendiendo a las normas disciplinarias generales previa apertura, en su caso, del expediente informativo y de expediente de mediación, sin perjuicio de las responsabilidades que de los hechos pudieran derivarse."},"c":"A"},{"id":589,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, la documentación clínica es:","o":{"A":"La información contenida en la historia clínica.","B":"El soporte de cualquier tipo o clase que contiene un conjunto de datos e informaciones de carácter asistencial y la documentación relativa a las voluntades anticipadas.","C":"El soporte de cualquier tipo o clase que contiene un conjunto de datos e informaciones de carácter asistencial y de investigación biomédica.","D":"El soporte de cualquier tipo o clase que contiene un conjunto de datos e informaciones de carácter asistencial."},"c":"D"},{"id":590,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, la información asistencial:","o":{"A":"Como regla general se proporcionará verbalmente.","B":"Como regla general se proporcionará por escrito.","C":"Como regla general se proporcionará verbalmente y por escrito.","D":"Como regla general se proporcionará por escrito cuando se trate de pacientes menores de edad."},"c":"A"},{"id":591,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, la información asistencial contiene, como mínimo:","o":{"A":"La finalidad y la naturaleza de cada intervención.","B":"La finalidad y la naturaleza de cada intervención y sus riesgos.","C":"La finalidad y la naturaleza de cada intervención, sus riesgos y sus consecuencias.","D":"La finalidad y la naturaleza de cada intervención, sus riesgos, sus consecuencias y los derechos de las personas pacientes."},"c":"C"},{"id":592,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, garantiza el cumplimiento del derecho a la información asistencial:","o":{"A":"La persona facultativa responsable de la persona paciente","B":"La persona facultativa responsable de la persona paciente y el personal profesional que le atienda durante el proceso asistencial o le aplique una técnica o un procedimiento concreto.","C":"La persona facultativa responsable de la persona paciente y el personal de enfermería.","D":"El centro sanitario."},"c":"B"},{"id":593,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, la persona titular del derecho a la información asistencial es:","o":{"A":"La persona paciente. También serán informadas las personas vinculadas a ella, por razones familiares o de hecho, en la medida que la persona paciente lo permita de manera expresa o tácita.","B":"La persona paciente. También serán informadas las personas vinculadas a ella, por razones familiares o de hecho, en la medida que la persona paciente lo permita de manera expresa.","C":"La persona paciente. También serán informadas las personas vinculadas a ella, por razones familiares o de hecho, en la medida que la persona paciente lo permita por escrito.","D":"La persona paciente. También serán informadas las personas vinculadas a ella, por razones familiares o de hecho."},"c":"A"},{"id":594,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, cuando existe riesgo inmediato grave para la integridad física o psíquica de la persona enferma y no es posible conseguir su autorización:","o":{"A":"El personal facultativo podrá llevar a cabo las intervenciones clínicas indispensables en favor de la salud de la persona paciente, con el consentimiento de sus familiares.","B":"El personal facultativo podrá llevar a cabo las intervenciones clínicas indispensables en favor de la salud de la persona paciente, con el consentimiento de quien ostente la representación legal.","C":"El personal facultativo podrá llevar a cabo las intervenciones clínicas indispensables en favor de la salud de la persona paciente, con autorización judicial.","D":"El personal facultativo podrá llevar a cabo las intervenciones clínicas indispensables en favor de la salud de la persona paciente, sin necesidad de contar con su consentimiento."},"c":"D"},{"id":595,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, el personal facultativo proporcionará a la persona paciente, antes de recabar s u consentimient
