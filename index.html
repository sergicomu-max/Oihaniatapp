 hombros están detenidos en la pelvis menor.","B":"El engatillamiento corresponde a un feto grande con mecanismo de rotación ausente y suele requerir maniobras complejas.","C":"En el engatillamiento, el hombro posterior queda impactado sobre el pubis, pero el anterior desciende con normalidad.","D":"La distocia bilateral se caracteriza por la detención de ambos hombros en la pelvis menor y es una situación rara."},"c":"D"},{"id":348,"q":"¿Cuál de las siguientes afirmaciones sobre la maniobra de Wood (tornillo de Wood) empleada en la distocia de hombros es correcta?","o":{"A":"Se ejerce presión sobre la cara anterior del hombro posterior para inducir rotación y convertirlo en hombro anterior.","B":"Su objetivo principal es disminuir el diámetro bisacromial mediante aducción del hombro anterior.","C":"Se realiza aplicando fuerza en sentido antihorario en todos los casos para liberar el hombro impactado.","D":"Es una técnica destinada exclusivamente a desimpactar el hombro posterior sin modificar su orientación."},"c":"A"},{"id":349,"q":"En el contexto de una distocia de hombros en la que han fallado McRoberts, la presión suprapúbica y el tornillo de Wood, ¿cuál de las siguientes actuaciones está adecuadamente indicada?","o":{"A":"Colocar a la mujer en posición “a cuatro patas” para favorecer la desimpactación del hombro posterior.","B":"Repetir tracción cefálica intensa para intentar liberar el hombro anterior.","C":"Utilizar la maniobra de Rubin como primera intervención antes de solicitar ayuda.","D":"Realizar de inmediato una episiotomía amplia, dado que la distocia es un problema de partes blandas."},"c":"A"},{"id":350,"q":"Respecto a las presentaciones de nalgas, señale la opción INCORRECTA:","o":{"A":"En la presentación de nalgas puras, los pies suelen situarse a la altura de los hombros debido a la flexión ventral de las piernas.","B":"La presentación de nalgas completas incrementa los diámetros de la presentación porque participan los miembros inferiores.","C":"La presentación de nalgas incompletas se asocia a un mayor riesgo de prolapso de pies o rodillas cuando las membranas están íntegras.","D":"La presentación de nalgas puras es la más frecuente, con una incidencia del 65– 70 %."},"c":"C"},{"id":351,"q":"¿Cuál de las siguientes situaciones clínicas sugiere más claramente una presentación de nalgas incompletas?","o":{"A":"Bolsa rota y aparición de un pie fetal a nivel vaginal.","B":"Feto en postura sentada, con caderas y rodillas flexionadas.","C":"Feto con miembros inferiores extendidos y pies junto a los hombros.","D":"Conformación de la presentación exclusivamente por la pelvis fetal."},"c":"A"},{"id":352,"q":"En relación con las frecuencias de las presentaciones de nalgas, ¿cuál de las siguientes combinaciones es correcta?","o":{"A":"Nalgas puras 65–70 %, nalgas completas 5 %, nalgas incompletas 25–30 %.","B":"Nalgas puras 25–30 %, nalgas completas 65–70 %, nalgas incompletas 5 %.","C":"Nalgas puras 5 %, nalgas completas 25–30 %, nalgas incompletas 65–70 %.","D":"Nalgas puras 25–30 %, nalgas completas 5 %, nalgas incompletas 65–70 %."},"c":"A"},{"id":353,"q":"En relación con el Traje Anti-Choque No Neumático (TANN) y su papel en el manejo del choque hipovolémico posparto, señale la opción correcta:","o":{"A":"El TANN actúa principalmente aumentando la resistencia vascular sistémica mediante vasoconstricción farmacológica, por lo que su uso debe reservarse para centros de alta complejidad.","B":"Al ejercer compresión circunferencial de las extremidades inferiores y pelvis, el TANN aumenta el retorno venoso, la precarga y el gasto cardíaco, además de ejercer compresión directa sobre la aorta descendente.","C":"Su indicación en primer nivel de atención requiere necesariamente pérdidas sanguíneas superiores a 1000 ml y una PAS < 90 mmHg.","D":"El TANN está contraindicado en transporte sanitario debido a la posibilidad de empeorar la perfusión de órganos vitales en condiciones de hipovolemia severa."},"c":"B"},{"id":354,"q":"Respecto al manejo inicial (ABC) de una paciente con sospecha de choque hipovolémico, señale la opción INCORRECTA:","o":{"A":"Como parte del abordaje “A” y “B”, se evalúa la vía aérea y puede iniciarse oxígeno por máscara con reservorio a 10–15 L/min.","B":"Durante el paso “C”, puede colocarse a la paciente en elevación de piernas a 30° o en posición de litotomía para valorar la pelvis.","C":"La monitorización continua incluye presión arterial, frecuencia cardíaca, saturación de oxígeno y valoración del gasto urinario al menos cada hora.","D":"La toma de muestras inicial incluye hemograma, hemoclasificación, PT, PTT, fibrinógeno, creatinina, lactato y electrólitos, no es necesario colocar dos vías venosas periféricas de grueso calibre de manera inmediata."},"c":"D"},{"id":355,"q":"Respecto a la monitorización de la gestante con un monitor-desfibrilador, ¿cuál es la colocación correcta de las palas?","o":{"A":"Una pala en región infraclavicular derecha y la otra en la zona de la punta cardiaca, utilizando gel conductor.","B":"Ambas palas en la región infraclavicular para evitar interferencias con el útero.","C":"Una pala en la región esternal y otra en la región lumbar izquierda.","D":"Una pala en el hemitórax derecho y la otra en la parte posterior del tórax (posición anteroposterior), sin necesidad de gel conductor."},"c":"A"},{"id":356,"q":"¿Cuál de las siguientes afirmaciones es correcta respecto a la cesárea de rescate durante la parada cardiorrespiratoria en la gestante a término?","o":{"A":"La cesárea de rescate solo mejora la supervivencia fetal, sin evidencias de beneficio para la madre.","B":"La extracción fetal mejora la eficacia de las compresiones torácicas al eliminar la compresión de la vena cava y reducir la demanda circulatoria uteroplacentaria.","C":"La anoxia se produce más lentamente en la embarazada a término debido al aumento de la capacidad residual funcional.","D":"Antes de realizar una cesárea de rescate es imprescindible confirmar el latido cardiaco fetal mediante auscultación."},"c":"B"},{"id":357,"q":"¿Cuál es la condición materna más frecuentemente asociada con muerte perinatal por hipoxia intrauterina y asfixia al nacer?","o":{"A":"Insuficiencia placentaria.","B":"Prolapso de cordón.","C":"Trastornos hipertensivos maternos.","D":"Abruptio placentae."},"c":"D"},{"id":358,"q":"En relación con la mortalidad materna mundial, ¿cuál de las siguientes afirmaciones describe correctamente la situación actual?","o":{"A":"Una gran parte de las muertes maternas que ocurren cada año podría evitarse, ya que más de dos tercios se relacionan con causas prevenibles.","B":"La mayoría de las muertes maternas son inevitables y no pueden prevenirse con las intervenciones disponibles.","C":"Solo una mínima proporción de los fallecimientos maternos anuales se debe a causas prevenibles.","D":"Las muertes maternas se deben principalmente a enfermedades crónicas no asociadas al embarazo, lo que limita las posibilidades de prevención."},"c":"A"},{"id":359,"q":"¿Cuál de las siguientes afirmaciones sobre la asfixia fetal en el parto pretérmino es correcta?","o":{"A":"El feto a término presenta mayor vulnerabilidad neurológica a la hipoxia debido a la inmadurez de los mecanismos de autorregulación cerebral.","B":"La prevalencia de asfixia fetal es similar entre el parto pretérmino y el parto a término.","C":"Aunque el feto pretérmino puede sobrevivir a periodos más largos de asfixia, esta supervivencia se asocia paradójicamente a un mayor riesgo de lesión cerebral por hipotensión e hipoperfusión prolongadas.","D":"El feto pretérmino es menos vulnerable a los efectos adversos de la hipoxia que el feto a término debido a su menor demanda metabólica."},"c":"C"},{"id":360,"q":"Según la evidencia actual, ¿cuál es la recomendación respecto al momento del clampaje del cordón umbilical en la asistencia al parto pretérmino?","o":{"A":"Clampar inmediatamente tras el nacimiento, antes de los 10 segundos.","B":"Realizar el clampaje antes de los 20 segundos para evitar complicaciones.","C":"Evitar el clampaje antes de los 30 segundos, siempre que el neonato esté estable.","D":"Retrasar el clampaje obligatoriamente al menos 2 minutos en todos los casos."},"c":"C"},{"id":361,"q":"Respecto a los criterios diagnósticos del trabajo de parto pretérmino, señale la opción INCORRECTA:","o":{"A":"La presencia de contracciones uterinas regulares definidas como 4 en 20 minutos u 8 en una hora forma parte de los criterios diagnósticos.","B":"La presencia de contracciones aisladas, aunque sin cambios cervicales, confirma el diagnóstico de trabajo de parto pretérmino.","C":"La dilatación cervical ≥ 2 cm y un acortamiento ≥ 80 % es compatible con trabajo de parto pretérmino.","D":"Una puntuación de Bishop ≥ 6 se considera un criterio incluido en el diagnóstico de trabajo de parto pretérmino."},"c":"B"},{"id":362,"q":"Según las recomendaciones de la Guía Umamanita para el acompañamiento a familias tras una muerte perinatal, señale la opción INCORRECTA:","o":{"A":"Presentarse, escuchar activamente y mantener la calma forman parte de las recomendaciones básicas.","B":"Es importante apoyar a los/las padres/madres explicándoles sus opciones y acompañarlos en sus decisiones.","C":"Es adecuado intentar consolar a los/las padres/madres recordándoles que podrán tener más hijos/as en el futuro.","D":"Se aconseja utilizar el nombre del/de la bebé y hablar con ambos progenitores de manera equitativa."},"c":"C"},{"id":363,"q":"Respecto al apoyo entre profesionales implicados en la atención al duelo perinatal, señale la opción INCORRECTA:","o":{"A":"Es recomendable crear grupos de apoyo entre compañeros/as y tratar el tema en sesiones clínicas.","B":"Combinar la atención a nacimientos y muertes por parte del/de la mismo/a profesional ayuda a normalizar la situación y reduce el desgaste emocional.","C":"Si atender una pérdida supone un conflicto personal, se debe comunicar a la persona superior jerárquica para valorar una reorganización del equipo.","D":"Es importante reconocer el trabajo de los/as compañeros/as, apoyarse mutuamente y asegurar tiempos de respiro entre casos emocionalmente intensos."},"c":"B"},{"id":364,"q":"Una mujer de 29 años, primípara, acude a urgencias 48 horas después de un parto vaginal eutócico. Refiere malestar general, escalofríos y dolor en hipogastrio. Está lactando y no refiere alergias medicamentosas. En la valoración inicial presenta una tensión arterial de 112/68 mmHg, frecuencia cardiaca de 108 lpm, frecuencia respiratoria de 20 rpm, y saturación de oxígeno del 97 %. La temperatura en la primera medición es de 38,2 ºC y, seis horas más tarde, de 38,1 ºC. Se encuentra decaída pero orientada, sin signos de shock. A la exploración abdominal se evidencia un útero doloroso y subinvolucionado; los loquios son malolientes, el punto perineal se observa sin signos de infección, los pechos no muestran signos de mastitis, no hay globo vesical y la herida obstétrica está cicatrizando adecuadamente. ¿Cuál de las siguientes opciones es correcta?","o":{"A":"No cumple criterios de fiebre puerperal porque la temperatura debería ser mayor de 38,5 ºC en las primeras 24 horas postparto.","B":"Cumple criterios de fiebre puerperal porque presenta dos mediciones superiores a 38 ºC separadas 6 horas, dentro del periodo entre 24 horas y 6 semanas posparto.","C":"No cumple criterios de fiebre puerperal porque el diagnóstico se limita exclusivamente a la primera semana posparto.","D":"No cumple criterios de fiebre puerperal porque la fiebre debe aparecer únicamente a partir de la primera semana posparto."},"c":"B"},{"id":365,"q":"En relación con la exploración sistemática de la mujer en el posparto, ¿cuál de los siguientes elementos forma parte de la valoración correcta de la exploración por sistemas?","o":{"A":"Valorar únicamente la involución uterina y la cantidad de loquios, ya que son los parámetros esenciales del posparto.","B":"Evaluar la coloración cutánea, la presencia de palidez conjuntival, la exploración de mamas, la revisión de genitales y la valoración de miembros inferiores.","C":"Centrarse en la herida quirúrgica y en los signos de infección sistémica, dejando el resto de la valoración para consultas posteriores.","D":"Valorar exclusivamente el estado emocional de la mujer y descartar síntomas depresivos en esta primera exploración."},"c":"B"},{"id":366,"q":"Respecto a la infección puerperal, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La infección puerperal es una entidad rara y representa menos del 1 % de las muertes maternas en países en vías de desarrollo.","B":"La principal causa de infección puerperal es la mastitis.","C":"La infección puerperal constituye la principal causa de fiebre en el posparto y puede ser responsable de hasta un 15 % de las muertes maternas en países en desarrollo.","D":"La infección puerperal es leve y rara vez se propaga más allá del útero."},"c":"C"},{"id":367,"q":"Respecto al tratamiento farmacológico de la hemorragia posparto, señale la opción correcta:","o":{"A":"El misoprostol rectal debe utilizarse como primera elección porque ha demostrado mayor eficacia y menos efectos secundarios que otros uterotónicos.","B":"La metilergometrina es el segundo fármaco de elección salvo en mujeres con hipertensión, en quienes debe evitarse.","C":"El carboprost se administra por vía intravenosa cada 15 minutos hasta un máximo de 8 dosis.","D":"El ácido tranexámico solo es eficaz si se administra después de las primeras 3 horas del inicio de la hemorragia."},"c":"B"},{"id":368,"q":"Respecto al manejo de la inversión uterina aguda, señale la opción correcta:","o":{"A":"El tratamiento de elección es la reducción manual rápida por vía vaginal, empujando el fondo uterino hacia su posición normal.","B":"Los relajantes uterinos están contraindicados, ya que dificultan la maniobra de reducción manual.","C":"Una vez reducida la inversión, debe evitarse el uso de uterotónicos para disminuir el riesgo de dolor uterino.","D":"El tratamiento inicial debe ser la administración inmediata de uterotónicos para favorecer la contracción y recolocación del útero."},"c":"A"},{"id":369,"q":"En relación a la diástasis de la sínfisis del pubis, ¿cuál de los siguientes síntomas NO es característico de esta patología?","o":{"A":"Dolor intenso en respuesta a la presión sobre la sínfisis del pubis.","B":"Dolor cuando se aducen los trocánteres.","C":"Edematización y dificultad en la marcha.","D":"Dificultad para flexionar la cadera al extender los miembros inferiores."},"c":"B"},{"id":370,"q":"Respecto a las complicaciones de la episiorrafia en el posparto, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Los hematomas posparto suelen remitir espontáneamente y no requieren reapertura de la sutura.","B":"El dolor asociado a un hematoma posparto suele mejorar con analgesia convencional.","C":"La infección de la cicatriz debe tratarse abriendo la sutura y resuturando inmediatamente.","D":"Los hematomas posparto pueden despegar planos de tejidos pélvicos, por lo que debe abrirse la sutura y vaciarse la colección cuanto antes."},"c":"D"},{"id":371,"q":"Según la Clasificación Internacional de Enfermedades, ¿cuál de los siguientes NO corresponde a un síntoma típico de la depresión posparto?","o":{"A":"Incremento marcado de la actividad psicomotora y necesidad reducida de sueño.","B":"Ansiedad, nerviosismo y llanto.","C":"Trastornos del sueño y pérdida del apetito.","D":"Ideas de culpa y de inutilidad, incluso en los episodios leves."},"c":"A"},{"id":372,"q":"¿Cuál de las siguientes afirmaciones sobre el Cuestionario de Depresión Postnatal de Edimburgo (EPDS) es INCORRECTA?","o":{"A":"Explora síntomas emocionales como ansiedad, tristeza y culpa.","B":"Evalúa cómo se ha sentido la mujer en los últimos 7 días.","C":"Incluye preguntas sobre pérdida de apetito, sueño y síntomas somáticos.","D":"Es una herramienta de cribado para detectar riesgo de depresión posnatal."},"c":"C"},{"id":373,"q":"¿Cuál de los siguientes ítems del EPDS evalúa directamente la presencia de ideación autolesiva en el posparto?","o":{"A":"“Me he sentido tan infeliz que he tenido dificultad para dormir.”","B":"“He pensado en hacerme daño a mí misma.”","C":"“He estado ansiosa y preocupada sin motivo.”","D":"“Las cosas me oprimen o agobian.”"},"c":"B"},{"id":374,"q":"¿Cuál de las siguientes afirmaciones sobre el Inventario de Depresión de Beck (BDI) es correcta?","o":{"A":"Consta de 15 ítems, cada uno puntuado de 0 a 4.","B":"Contiene 21 ítems con respuestas de intensidad creciente puntuadas de 0 a 3.","C":"Es un cuestionario específico para depresión posparto.","D":"No incluye ningún ítem relacionado con culpa o autocrítica."},"c":"B"},{"id":375,"q":"Respecto a la psicosis puerperal, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El DSM-IV la clasifica como un trastorno afectivo con especificador posparto.","B":"La mayoría de los casos se asocian exclusivamente a causas hormonales posparto.","C":"Su prevalencia es de aproximadamente 1–2 casos por cada 10000 partos.","D":"Los episodios suelen presentar un comienzo súbito y rápida fluctuación de síntomas."},"c":"D"},{"id":376,"q":"En relación con la lactancia materna en madres con psicosis puerperal tratada con neurolépticos, ¿cuál de las siguientes afirmaciones es INCORRECTA?","o":{"A":"La SEGO indica en su protocolo la suspensión de la lactancia materna en estos casos.","B":"Otras entidades no recomiendan la suspensión sistemática, señalan que la concentración en leche se relaciona con la plasmática materna y estiman que el lactante ingiere aproximadamente el 3 % de la dosis materna por kg/día.","C":"El mantenimiento de la lactancia puede favorecer el vínculo materno-filial y solo debe evitarse en un brote agudo, pudiendo requerir separación temporal.","D":"La conducta general recomendada es suspender inmediatamente la lactancia en todos los casos al iniciar neurolépticos."},"c":"D"},{"id":377,"q":"¿Cuál de los siguientes elementos de la Tríada de Virchow se ve favorecido durante el embarazo por la compresión del útero grávido sobre la vena cava inferior y las venas ilíacas?","o":{"A":"Hipercoagulabilidad.","B":"Lesión endotelial.","C":"Éstasis venosa.","D":"Activación de la fibrinólisis."},"c":"C"},{"id":378,"q":"Respecto a los signos clínicos exploratorios de la TVP, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El signo de Homans se desencadena al realizar una flexión plantar pasiva del pie y genera dolor en la pantorrilla.","B":"El signo de Deneck se localiza en el hueco poplíteo y aparece al comprimir la región.","C":"El signo de Tschmark se identifica en la parte interna del pie mediante presión suave.","D":"El signo de Homans provoca dolor en la pantorrilla y hueco poplíteo ante la dorsiflexión pasiva del pie."},"c":"D"},{"id":379,"q":"¿Cuál de los siguientes signos exploratorios sugiere TVP al presionar la zona del hueco poplíteo, provocando dolor localizado?","o":{"A":"Signo de Deneck.","B":"Signo de Tschmark.","C":"Signo de Homans.","D":"Signo de Trendelenburg."},"c":"B"},{"id":380,"q":"Una gestante de 10 semanas, con antecedente de TVP hace 2 años y portadora de una trombofilia hereditaria de riesgo moderado, acude a consulta. No presenta episodios en curso. ¿Cuál de las siguientes opciones es la estrategia más razonable para reducir el riesgo tromboembólico durante el embarazo?","o":{"A":"No realizar profilaxis, ya que el último episodio fue >1 año antes del embarazo.","B":"Emplear HBPM a dosis intermedias (como tinzaparina 75 UI/kg/día) durante toda la gestación, pero suspender la anticoagulación en el posparto inmediato.","C":"Emplear HBPM a dosis profilácticas solo durante el puerperio.","D":"Mantener tratamiento con HBPM a dosis intermedias durante todo el embarazo y todo el puerperio, debido al riesgo elevado de recurrencia."},"c":"D"},{"id":381,"q":"Durante una consulta de control, un/una matrón/a evalúa a una gestante con factores de riesgo moderados para tromboembolismo venoso. Además de registrar correctamente los hallazgos en la Cartilla Maternal, ¿cuál de las siguientes actuaciones representa una intervención clave y específica de la matrona en la prevención de complicaciones tromboembólicas?","o":{"A":"Indicar la realización urgente de un dímero D y solicitar un eco-Doppler venoso.","B":"Monitorizar el cumplimiento de tratamientos prescritos, detectar signos precoces de alarma y derivar con rapidez si surge sospecha de complicación.","C":"Ajustar la dosis de heparina de bajo peso molecular según la evolución del embarazo.","D":"Prescribir medias de compresión de nivel II y programar revisiones con hematología cada 2 semanas."},"c":"B"},{"id":382,"q":"Respecto a las manifestaciones de la toxoplasmosis congénita, señale la opción que NO se asocia típicamente a las infecciones precoces (adquiridas antes de las 20 semanas):","o":{"A":"Hidrocefalia.","B":"Calcificaciones intracraneales.","C":"Coriorretinitis.","D":"Hepatoesplenomegalia con fiebre y meningoencefalitis."},"c":"D"},{"id":383,"q":"En relación con el Síndrome de Membrana Hialina (SDR) del/de la recién nacido/a, señale la opción INCORRECTA:","o":{"A":"Suele aparecer en las primeras horas de vida con polipnea, tiraje, quejido y cianosis en aire ambiente debido al colapso alveolar por déficit de surfactante.","B":"La incidencia aumenta significativamente por debajo de las 32 semanas de gestación y puede alcanzar hasta el 50 % en RN menores de 28 semanas.","C":"Puede observarse también en recién nacidos a término, especialmente en los nacidos por cesárea electiva o hijos de madres diabéticas con mal control metabólico.","D":"El surfactante exógeno es útil, pero no reduce la necesidad de ventilación mecánica ni la mortalidad asociada al cuadro."},"c":"D"},{"id":384,"q":"¿Cuál de las siguientes afirmaciones describe correctamente el mecanismo inicial implicado en la retinopatía del prematuro (ROP)?","o":{"A":"El nacimiento prematuro provoca un aumento inmediato de la angiogénesis retiniana debido al ambiente hiperóxico intrauterino.","B":"La interrupción del ambiente hipóxico intrauterino detiene el crecimiento normal de los vasos retinianos, favoreciendo fases posteriores de proliferación anómala.","C":"La angiogénesis retiniana se completa antes de la semana 30, por lo que los prematuros extremos rara vez desarrollan ROP.","D":"Los factores placentarios inhiben la formación de vasos retinianos, por lo que la prematuridad disminuye el riesgo de ROP."},"c":"B"},{"id":385,"q":"Respecto al procedimiento correcto del Método Madre Canguro, ¿cuál de las siguientes afirmaciones es verdadera?","o":{"A":"El/La recién nacido/a debe colocarse en contacto piel con piel directamente sobre el tórax materno en posición horizontal, manteniendo preferentemente ropa ligera para evitar fluctuaciones térmicas.","B":"La monitorización cardiorrespiratoria es obligatoria en todos los RN durante el método, independientemente de su estabilidad clínica o edad gestacional.","C":"La temperatura ambiental recomendada durante la realización del método es de 23–25 ºC, garantizando control térmico antes, durante y después del procedimiento.","D":"El uso de sujetador materno de algodón está recomendado para mejorar la sujeción del RN y evitar movimientos torácicos excesivos."},"c":"C"},{"id":386,"q":"En un/una recién nacido/a de 72 horas, observa ictericia que alcanza ambas piernas desde las rodillas hasta los tobillos, sin datos analíticos disponibles. Según la valoración clínica de la ictericia mediante la progresión céfalo-caudal (zonas de Kramer), ¿cuál de las siguientes estimaciones es la más probable?","o":{"A":"Bilirrubina sérica estimada entre 4 y 7 mg/dl.","B":"Bilirrubina sérica estimada entre 5 y 8,5 mg/dl.","C":"Bilirrubina sérica estimada entre 6 y 11,5 mg/dl.","D":"Bilirrubina sérica estimada entre 9 y 17 mg/dl."},"c":"D"},{"id":387,"q":"Respecto a la prevención de la aspiración meconial, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Se recomienda la aspiración sistemática de boca y nariz en todos los RN con líquido meconial, independientemente de su estado clínico.","B":"La amnioinfusión es una medida claramente establecida y recomendada para reducir la concentración de meconio intraparto.","C":"En un RN que nace vigoroso, reactivo y con respiración eficaz, no debe realizarse ninguna maniobra de aspiración rutinaria.","D":"Debe evitarse siempre la ventilación con mascarilla incluso si no se dispone de equipos para aspiración traqueal selectiva."},"c":"C"},{"id":388,"q":"¿Cuál de las siguientes afirmaciones describe correctamente la evolución del tono muscular en el/la recién nacido/a según la edad gestacional?","o":{"A":"A las 28 semanas el/la prematuro/a muestra un tono flexor completo en las cuatro extremidades, aunque aún débil.","B":"A las 32 semanas comienza a hacerse evidente el tono flexor en caderas y tobillos, coincidiendo con el incremento de la mielinización subcortical.","C":"El tono flexor en miembros superiores aparece de forma precoz, alrededor de las 28–30 semanas de gestación.","D":"El/La recién nacido/a a término presenta mayor tono extensor debido a la maduración completa del sistema piramidal."},"c":"B"},{"id":389,"q":"¿Cuál de los siguientes enunciados describe correctamente la aplicación de la hipotermia terapéutica en el/la recién nacido/a con Encefalopatía Hipóxico Isquémica (EHI)?","o":{"A":"La hipotermia debe iniciarse lo antes posible, idealmente dentro de las primeras 6 horas de vida, y mantenerse durante 72 horas, con una reducción de la temperatura cerebral de 3–4 ºC.","B":"El enfriamiento puede iniciarse de forma segura en RN de cualquier edad gestacional, siempre que exista evidencia clínica de hipoxia intraparto.","C":"El objetivo principal de la hipotermia es disminuir el metabolismo hepático para prevenir la acidosis metabólica.","D":"La técnica de elección es el enfriamiento selectivo de cabeza, ya que el enfriamiento corporal total ha demostrado menor eficacia."},"c":"A"},{"id":390,"q":"¿Cuál de los siguientes es un criterio que NO permite aplicar correctamente el tratamiento con hipotermia terapéutica en el/la recién nacido/a con sospecha de Enfermedad Hipóxico Isquémica (EHI)?","o":{"A":"Recién nacido/a con encefalopatía leve tras episodio hipóxico intraparto.","B":"Recién nacido/a ≥35 semanas con evidencia clínica de hipoxia-isquemia y encefalopatía moderada.","C":"Recién nacido/a en el que el enfriamiento pasivo se inició a las 5 horas y tiene 7 horas de vida en total al llegar al hospital.","D":"Recién nacido/a sin malformaciones estructurales y sin disfunción multiorgánica grave intraútero."},"c":"A"},{"id":391,"q":"¿Cuál de los siguientes hallazgos debe alertar de forma más específica sobre la posible presencia de válvulas de uretra posterior en un recién nacido varón?","o":{"A":"Ausencia de micción durante las primeras 24 horas de vida.","B":"Chorro urinario débil o en forma de goteo durante la micción.","C":"Aumento moderado de la frecuencia urinaria en las primeras horas.","D":"Deposiciones meconiales tardías asociadas a distensión abdominal."},"c":"B"},{"id":392,"q":"¿Cuál de los siguientes factores se asocia de forma más clara a un mayor riesgo de infección del tracto urinario en el/la recién nacido/a?","o":{"A":"Sexo femenino y gestación a término sin antecedentes familiares.","B":"Antecedente materno de ITU, prematuridad y hallazgo prenatal de malformaciones nefrourológicas.","C":"Parto eutócico sin complicaciones y líquido amniótico claro.","D":"Uso de bolsa estéril para recogida de orina durante el cribado neonatal."},"c":"B"},{"id":393,"q":"Una puérpera primípara consulta a las 72 horas del parto porque presenta dolor intenso en ambos pezones durante la lactancia. Refiere que el/la recién nacido/a realiza tomas frecuentes pero se muestra irritable y no parece saciarse. A la exploración, se observan grietas en los pezones. ¿Cuál es la actuación más adecuada?","o":{"A":"Suspender la lactancia materna temporalmente.","B":"Iniciar tratamiento antibiótico empírico.","C":"Valorar la técnica de agarre y corregir la postura.","D":"Administrar suplementos de fórmula de forma inmediata."},"c":"C"},{"id":394,"q":"Recién nacido/a sano/a de 4 días de vida alimentado con lactancia materna exclusiva. Presenta pérdida de peso del 9% respecto al nacimiento. La madre refiere tomas frecuentes pero duda de si produce suficiente leche. ¿Cuál es la actitud más adecuada?","o":{"A":"Iniciar suplementación con fórmula de forma sistemática.","B":"Suspender lactancia materna y pasar a lactancia artificial.","C":"Considerar la situación como fisiológica sin intervención.","D":"Evaluar la lactancia materna y ofrecer apoyo y corrección."},"c":"D"},{"id":395,"q":"En relación con las prácticas que favorecen el inicio y mantenimiento de la lactancia materna, señale la opción correcta:","o":{"A":"Se recomienda limitar las tomas nocturnas para mejorar el descanso materno.","B":"El uso precoz de chupete favorece la instauración de la lactancia.","C":"El colecho está contraindicado en todos los casos.","D":"La lactancia materna debe ser a demanda, incluyendo el periodo nocturno."},"c":"D"},{"id":396,"q":"Respecto a la valoración de una toma eficaz de lactancia materna, ¿cuál de los siguientes hallazgos indica un problema?","o":{"A":"Boca bien abierta con labios evertidos.","B":"Deglución visible o audible.","C":"Dolor persistente en el pezón durante la toma.","D":"Lactante que suelta espontáneamente el pecho."},"c":"C"},{"id":397,"q":"Respecto a la lactancia materna en niños/as con labio leporino y paladar hendido, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El éxito de la lactancia depende del tamaño y localización del defecto, pudiendo requerir alternativas como leche extraída.","B":"La lactancia materna es imposible en todos los casos de paladar hendido.","C":"El labio leporino aislado siempre impide la lactancia materna.","D":"La succión es siempre eficaz en estos/as niños/as."},"c":"A"},{"id":398,"q":"Señala la respuesta correcta sobre el calostro:","o":{"A":"El calostro se segrega desde el primer día del posparto hasta el final de la lactancia.","B":"El calostro tiene un contenido en lactosa y grasas superior al de la leche madura.","C":"El calostro es un líquido de color amarillo oscuro que contiene una mayor proporción de proteínas y minerales, así como anticuerpos e inmunoglobulinas A (Ig A).","D":"El calostro aparece entre el quinto y el séptimo día del posparto, tras la leche madura."},"c":"C"},{"id":399,"q":"¿Cuál de las siguientes afirmaciones sobre la extracción manual de leche materna y los métodos de extracción es correcta?","o":{"A":"La extracción manual es siempre superior a los sacaleches, especialmente en casos de separación prolongada como bebés prematuros/as o madres que trabajan fuera de casa.","B":"Los sacaleches eléctricos de doble extracción permiten reducir a la mitad el tiempo necesario para extraer la leche de ambos pechos.","C":"No es necesario lavarse las manos antes de la extracción manual porque la leche humana contiene propiedades que retrasan el crecimiento de bacterias.","D":"Los mejores sacaleches manuales son aquellos que requieren el uso de ambas manos para imitar el efecto de succión del/de la bebé."},"c":"B"},{"id":400,"q":"¿Cuál de las siguientes sustancias o componentes se encuentra en la leche humana y qué función o característica se le atribuye?","o":{"A":"La vitamina K se encuentra en altas concentraciones en la leche humana para prevenir hemorragias en el lactante.","B":"La interleucina 6 se halla a gran concentración en la leche y se ha relacionado con la presencia de inmunoglobulina A (Ig A).","C":"El hierro se encuentra en la leche humana a altas concentraciones para prevenir la anemia ferropénica.","D":"El factor de crecimiento epidérmico se relaciona con la protección frente al virus de la inmunodeficiencia humana."},"c":"B"},{"id":401,"q":"¿Cuál de los siguientes procesos ocurre después de las 20 semanas de gestación en la glándula mamaria?","o":{"A":"Proliferación máxima del epitelio alveolar y formación de nuevos conductos.","B":"Cese de la proliferación alveolar y comienzo de la capacidad secretora de las células epiteliales.","C":"Eyección de leche por contracción de las células mioepiteliales inducida por oxitocina.","D":"Desarrollo embrionario de los conductos principales por acción de estrógenos placentarios."},"c":"B"},{"id":402,"q":"¿Qué efecto tiene la progesterona sobre la producción de leche durante el embarazo, y qué ocurre tras el parto para que se inicie la lactogénesis?","o":{"A":"La progesterona estimula la producción de lactosa mediante la activación directa de la lactosa sintetasa, y tras el parto su aumento repentino desencadena la secreción láctea.","B":"La progesterona inhibe la producción de alfa-lactoalbúmina, y al disminuir bruscamente tras el parto, permite que la prolactina estimule la lactosa sintetasa y la producción de lactosa.","C":"La progesterona compite con el lactógeno placentario por los mismos receptores, y su descenso posparto favorece la unión del lactógeno a la glándula mamaria.","D":"La progesterona aumenta la liberación de dopamina hipotalámica, lo que inhibe la prolactina, y tras el parto la succión elimina este efecto inhibidor localmente."},"c":"B"},{"id":403,"q":"Señala la respuesta correcta sobre la eyección láctea.","o":{"A":"La leche fluye espontáneamente desde los alvéolos hacia los conductos gracias a la gravedad y a la succión continua del/ de la niño/a.","B":"La oxitocina se libera desde el lóbulo anterior de la hipófisis en respuesta a la succión y actúa relajando los conductos lactíferos para facilitar el flujo de leche.","C":"La eyección láctea es un reflejo local que ocurre solo en la mama estimulada, sin participación hormonal ni del sistema nervioso central.","D":"El reflejo de eyección láctea puede inhibirse por estrés, dolor o adrenalina, y suele ocurrir aproximadamente un minuto después de iniciada la succión."},"c":"D"},{"id":404,"q":"¿Cuál es el fármaco actualmente recomendado para la inhibición de la lactancia, y en qué situación se usa una dosis única de 1,0 mg?","o":{"A":"Bromocriptina, 5 mg/día durante 2 semanas, indicada solo si la mujer ya ha iniciado la lactancia.","B":"Cabergolina, en dosis única de 1,0 mg si la mujer aún no ha iniciado la lactancia.","C":"Benzoato de estradiol intramuscular, 5 mg/día durante 3-4 días, asociado a progestágenos.","D":"Vendaje compresivo con hielo y analgésicos, como primera línea de tratamiento farmacológico."},"c":"B"},{"id":405,"q":"Según el Plan Nacional de Sangre de Cordón Umbilical 2020-2025, ¿cuál de las siguientes opciones es uno de los objetivos estratégicos recogidos en el documento?","o":{"A":"Desarrollar programas de calidad comunes que incluyan revisión de requisitos técnicos de colectas, criterios comunes en bancos e implantación de auditorías.","B":"Alcanzar un inventario de 100.000 unidades de SCU con celularidad superior a 10 x 10⁸ CNT, eliminando todas las unidades previas.","C":"Promover exclusivamente el uso consolidado de la SCU para trasplante hematopoyético, sin considerar usos en desarrollo o futuribles.","D":"Centralizar toda la formación de profesionales y autoridades sanitarias en una única institución sin participación autonómica ni de la ONT."},"c":"A"},{"id":406,"q":"En relación con los programas de promoción de la donación de sangre de cordón umbilical (SCU), señale la opción correcta respecto a la información que debe proporcionarse a las donantes:","o":{"A":"La información sobre la donación de SCU debe ser facilitada exclusivamente por los/las médicos/as de atención primaria, sin intervención de personal de enfermería o matrón/as.","B":"Solo se debe informar a la donante en el momento del parto, para garantizar que la decisión sea reciente y voluntaria.","C":"Los puntos de información deben asegurar una información universal que garantice la libre decisión de la donante previa al parto, con tiempo suficiente para meditar y revocar el consentimiento antes de la donación.","D":"Una vez que la donante firma el consentimiento en el curso de preparación al parto, no puede revocarlo en ningún momento posterior."},"c":"C"},{"id":407,"q":"En relación con el consentimiento informado para la donación de sangre del cordón umbilical, ¿cuál de las siguientes afirmaciones es correcta según la normativa descrita?","o":{"A":"La persona paciente debe recibir información adecuada previamente y puede aceptar o negarse libremente, quedando constancia en su historia clínica.","B":"El consentimiento debe ser siempre verbal, independientemente del procedimiento.","C":"El consentimiento puede obtenerse en cualquier momento, incluso sin haber proporcionado información previa a la persona paciente.","D":"Solo los/las profesionales sanitarios/as tienen obligaciones legales, sin requerirse veracidad en los datos aportados por la persona paciente."},"c":"A"},{"id":408,"q":"Según el protocolo de obtención del consentimiento informado para la donación de sangre del cordón umbilical (SCU), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El consentimiento informado debe obtenerse preferentemente durante el trabajo de parto para asegurar una decisión inmediata.","B":"La información previa debe ser exclusivamente escrita, sin necesidad de explicación oral por parte de profesionales.","C":"El consentimiento informado debe entregarse durante la gestación y obtenerse cuando la madre esté en condiciones adecuadas, nunca durante el parto.","D":"La decisión de donar debe tomarse obligatoriamente tras una entrevista clínica con un profesional sanitario."},"c":"C"},{"id":409,"q":"En relación con los criterios de selección de donantes de sangre del cordón umbilical (SCU), señala la respuesta correcta:","o":{"A":"Pueden ser donantes todas las mujeres independientemente de su estado de salud si el parto se realiza en un hospital autorizado.","B":"El criterio principal de selección es el tipo de parto (vaginal o cesárea) para garantizar la calidad de la muestra.","C":"La existencia de antecedentes familiares de enfermedades genéticas no influye en la selección si no están confirmadas analíticamente.","D":"Las gestantes deben ser sanas, sin enfermedades infecciosas ni genéticas, y haber firmado el consentimiento informado antes del parto."},"c":"D"},{"id":410,"q":"¿Cuál de las siguientes situaciones constituye un criterio de exclusión obstétrico para la donación de sangre del cordón umbilical (SCU)?","o":{"A":"Parto prematuro por debajo de la semana 34 de gestación.","B":"Parto a término entre las semanas 38 y 40 con peso fetal adecuado.","C":"Parto vaginal sin complicaciones.","D":"Placenta con peso superior a 650 gramos."},"c":"A"},{"id":411,"q":"En relación con los criterios de exclusión demográficos y médico-sociales, señala la respuesta correcta:","o":{"A":"Las mujeres menores de 18 años pueden donar si cuentan con autorización familiar.","B":"Haber padecido hepatitis C no contraindica la donación si está resuelta.","C":"Las vacunas con virus atenuados no afectan a la posibilidad de donar.","D":"El consumo de drogas por vía parenteral es un criterio de exclusión por riesgo infeccioso."},"c":"D"},{"id":412,"q":"En la valoración de una donante de sangre de cordón umbilical (SCU), señala la respuesta correcta:","o":{"A":"Solo es necesario realizar una analítica, sin necesidad de historia clínica ni exploración física.","B":"La historia clínica debe incluir antecedentes personales y familiares, así como datos del otro progenitor.","C":"La exploración física no es relevante si la gestante se encuentra aparentemente sana.","D":"No es necesario evaluar la evolución de la gestación actual para aceptar la donación."},"c":"B"},{"id":413,"q":"¿Cuál es la diferencia clave entre certificación y acreditación de calidad de los bancos de sangre de cordón umbilical (BSCU)?","o":{"A":"La certificación la otorgan entidades independientes como entidad nacional de acreditación (ENAC), mientras que la acreditación se basa en el prestigio de la entidad entre la comunidad usuaria (ej. NetCord).","B":"La certificación se refiere únicamente al producto final (SCU), mientras que la acreditación evalúa solo los procesos de transporte.","C":"La certificación es obligatoria por el RD-Ley 9/2014, mientras que la acreditación es voluntaria y sin valor legal.","D":"La certificación la concede cada Comunidad Autónoma, mientras que la acreditación la otorga el gobierno central."},"c":"A"},{"id":414,"q":"Sobre los Tipos de unidades de obtención de Sangre de Cordón Umbilical, ¿cuál es la diferencia clave entre Unidades de Obtención Fijas y No Fijas?","o":{"A":"Las Fijas tienen contrato con el BSCU; las No Fijas no.","B":"Las Fijas son solo para donación dirigida; las No Fijas para donación altruista.","C":"Las Fijas no requieren personal formado; las No Fijas sí.","D":"Las Fijas dependen de la Coordinación Autonómica; las No Fijas son autónomas."},"c":"A"},{"id":415,"q":"¿Quién debe realizar la extracción de la Sangre de Cordón Umbilical (SCU)?","o":{"A":"Solo el/la médico/a de obstetricia.","B":"Solo el/la matrón/a.","C":"El personal del banco de SCU.","D":"El/La médico/a o el/la matrón/a que atienda el parto, siempre con formación previa."},"c":"D"},{"id":416,"q":"¿Cuál es la recomendación sobre el tiempo de pinzamiento del cordón en donación altruista de laSangre de Cordón Umbilical (SCU)?","o":{"A":"Pinzamiento inmediato (<30 segundos) para maximizar volumen.","B":"Pinzamiento a los 60 segundos, respetando el beneficio para el recién nacido.","C":"Pinzamiento a los 120 segundos para garantizar la calidad.","D":"El tiempo de pinzamiento es indiferente para la donación."},"c":"B"},{"id":417,"q":"Según el Artículo 1 del Decreto, ¿cuál NO es un principio que rige la donación de leche humana en Euskadi?","o":{"A":"Donación voluntaria y altruista.","B":"Anonimato de la donante y de las personas receptoras.","C":"Distribución exclusivamente bajo prescripción médica.","D":"Remuneración económica para fomentar la donación."},"c":"D"},{"id":418,"q":"¿A qué organismo se adscribe el banco de leche humana donada de Euskadi?","o":{"A":"Al Departamento de Salud del Gobierno Vasco.","B":"Al Centro Vasco de Transfusión y Tejidos Humanos.","C":"A la Comisión de Salud del Parlamento Vasco.","D":"A Osakidetza directamente."},"c":"B"},{"id":419,"q":"¿Quiénes pueden ser receptoras de leche humana donada?","o":{"A":"Lactantes menores de 32 semanas o con menos de 1.500 gramos, por prescripción facultativa.","B":"Cualquier lactante cuya madre lo solicite.","C":"Todas las personas recién nacidas ingresadas en cualquier hospital.","D":"Solo aquellas cuyas madres tengan contraindicación legal."},"c":"A"},{"id":420,"q":"¿Qué tipo de análisis se realiza a las donantes del banco de leche humana donada de Euskadi tras la entrevista personal?","o":{"A":"Análisis genético para detectar enfermedades hereditarias.","B":"Análisis serológico para descartar infecciones transmisibles por leche.","C":"Análisis de composición nutricional de la leche.","D":"Análisis toxicológico obligatorio."},"c":"B"},{"id":421,"q":"¿Dónde se realiza la extracción de la leche donada si hablamos del banco de leche humana donada de Euskadi ?","o":{"A":"En el propio banco de leche.","B":"En los hospitales de referencia.","C":"En el domicilio de la donante.","D":"En los centros de atención primaria."},"c":"C"},{"id":422,"q":"¿Cuál es la condición de temperatura para la conservación de la leche donada si se congela inmediatamente?","o":{"A":"< -18 °C.","B":"< -10 °C.","C":"< 0 °C.","D":"< 4 °C pero sin llegar a congelar."},"c":"A"},{"id":423,"q":"¿Quién elabora los procedimientos operativos sobre transporte de la leche donada si hablamos del Decreto 146/2018?","o":{"A":"El Departamento de Salud.","B":"El propio banco de leche.","C":"El Centro Vasco de Transfusión y Tejidos Humanos.","D":"Los hospitales receptores."},"c":"C"},{"id":424,"q":"¿Qué deben incluir los centros de recogida de leche donada en cuanto a conservación?","o":{"A":"Condiciones para su conservación y custodia.","B":"Un punto de recogida sin horario fijo.","C":"Autorización para procesar la leche.","D":"Congeladores portátiles para donantes."},"c":"A"},{"id":425,"q":"¿Qué sistema de identificación se utiliza para garantizar la trazabilidad en el banco según el Decreto 146/2018?","o":{"A":"Número de la seguridad social de la donante.","B":"Fecha de nacimiento de la donante.","C":"Nombre completo de la donante.","D":"Código de barras."},"c":"D"},{"id":426,"q":"¿Qué requisito deben cumplir las unidades de cuidados intensivos neonatales para administrar leche donada Decreto 146/2018?","o":{"A":"Disponer de un sistema de alarma audiovisual en los equipos de almacenamiento.","B":"Tener un convenio con la industria láctea","C":"Contar con al menos dos pediatras por turno.","D":"Realizar análisis microbiológicos diarios."},"c":"A"},{"id":427,"q":"¿Para qué tipo de leche se aplica el procedimiento del Artículo 12 del Decreto 146/2018?","o":{"A":"Leche humana donada para investigación.","B":"Leche materna dirigida al propio hijo o hija.","C":"Leche de fórmula administrada en hospitales.","D":"Leche pasteurizada para bancos exteriores."},"c":"B"},{"id":428,"q":"¿Quién realiza las inspecciones para asegurar el cumplimiento del Decreto 146/2018?","o":{"A":"El Centro Vasco de Transfusión y Tejidos Humanos.","B":"El Comité de Lactancia.","C":"La dirección competente en planificación, ordenación y evaluación sanitarias.","D":"Osakidetza."},"c":"C"},{"id":429,"q":"¿Cuál de las siguientes situaciones se considera una amenorrea secundaria?","o":{"A":"Ausencia de menstruación antes de la menarquia.","B":"Ausencia de menstruación durante la lactancia.","C":"Ausencia de menstruación durante 6 meses en una mujer previamente menstruante.","D":"Ausencia de menstruación a los 14 años sin desarrollo de caracteres sexuales secundarios."},"c":"C"},{"id":430,"q":"En la etiología de las amenorreas, señala la afirmación correcta:","o":{"A":"En el síndrome de Rokitansky-Küster-Hauser, las pacientes presentan cariotipo 46,XY, caracteres sexuales secundarios femeninos normales y agenesia vaginal, asociándose frecuentemente a malformaciones renales.","B":"El seudohermafroditismo femenino por déficit de 21α-hidroxilasa cursa con fenotipo masculinizado, cariotipo 46,XX, niveles elevados de 17-OH progesterona y niveles bajos de gonadotropinas.","C":"En la disgenesia gonadal del síndrome de Turner, las pacientes presentan cariotipo 45,XO, niveles bajos de gonadotropinas y presencia de folículos ováricos funcionales, aunque con malformaciones extragenitales.","D":"La imperforación del himen es una causa de amenorrea primaria verdadera, ya que los ovarios no producen ciclos menstruales, y se caracteriza por la ausencia total de hematocolpos y hematometra."},"c":"B"},{"id":431,"q":"Según la definición de la FIGO, ¿cuál de las siguientes situaciones se considera hemorragia uterina anormal?","o":{"A":"Sangrado uterino que presenta alteraciones en volumen, frecuencia o regularidad durante varios meses.","B":"Menstruaciones regulares cada 28 días con duración de 5 días sin repercusión clínica.","C":"Menstruación que dura 4 días con cantidad moderada y regularidad mensual.","D":"Ciclos menstruales entre 24 y 38 días sin síntomas asociados."},"c":"A"},{"id":432,"q":"¿Cuál de las siguientes opciones NO se menciona como un elemento o estrategia incluida en la prevención de los riesgos de la actividad sexual del adolescente?","o":{"A":"Proporcionar información básica sobre los riesgos del coito no protegido y las medidas para evitarlo.","B":"Fortalecer valores que se opongan a las conductas grupales de sexo no protegido.","C":"Incluir actividades que pongan de manifiesto la influencia de los medios de comunicación sobre las conductas sexuales.","D":"Promover la abstinencia sexual como único método válido hasta el matrimonio."},"c":"D"},{"id":433,"q":"¿Cuál es la causa más frecuente de la Hemorragia Uterina Disfuncional (HUD) en la adolescente?","o":{"A":"Ciclos anovulatorios con estímulo estrogénico sin oposición de progesterona.","B":"Ciclos ovulatorios regulares.","C":"Exceso de progesterona sobre el endometrio.","D":"Alteraciones estructurales uterinas en la mayoría de los casos."},"c":"A"},{"id":434,"q":"En relación con la influencia sociocultural en la salud reproductiva:","o":{"A":"No influye en las prácticas reproductivas.","B":"Solo afecta a países en desarrollo.","C":"Influye en las relaciones afectivo-sexuales y en los comportamientos de salud.","D":"Es irrelevante para la atención sanitaria."},"c":"C"},{"id":435,"q":"¿Cuál de las siguientes definiciones describe correctamente la anorgasmia?","o":{"A":"Ausencia de deseo sexual acompañada de dolor durante la relación.","B":"Incapacidad persistente o retraso del orgasmo tras una excitación sexual normal.","C":"Dolor genital recurrente asociado al coito.","D":"Aumento excesivo del deseo sexual sin control."},"c":"B"},{"id":436,"q":"En relación con los trastornos de la sexualidad en pacientes con enfermedades cardiovasculares, señala la respuesta correcta:","o":{"A":"La actividad sexual supone un esfuerzo físico muy elevado y prolongado que aumenta significativamente el riesgo de infarto en todas las personas pacientes.","B":"Los fármacos cardiovasculares no influyen en la función sexual.","C":"La hipertensión arterial no se relaciona con disfunciones sexuales en hombres.","D":"En la enfermedad coronaria, los factores psicológicos como el miedo al infarto o a la muerte pueden afectar negativamente a la sexualidad."},"c":"D"},{"id":437,"q":"En relación con las enfermedades neurológicas y su impacto en la sexualidad, señala la respuesta correcta:","o":{"A":"Las enfermedades neurológicas afectan poco a la sexualidad porque no intervienen en la respuesta sexual.","B":"La respuesta sexual no depende del sistema nervioso central.","C":"Las alteraciones neurológicas pueden afectar directamente a la respuesta sexual al interferir en los centros nerviosos implicados.","D":"La epilepsia no se asocia a disfunciones sexuales."},"c":"C"},{"id":438,"q":"¿Cuál de los siguientes es un objetivo de los programas de salud sexual según el Plan de Atención a la Mujer?","o":{"A":"Limitar la educación sexual únicamente a la edad adulta.","B":"Promover una vivencia de la sexualidad integral, responsable y respetuosa.","C":"Priorizar exclusivamente la prevención del embarazo sobre otros aspectos.","D":"Evitar la participación social en políticas de salud sexual."},"c":"B"},{"id":439,"q":"En relación con la atención a la patología ginecológica en el programa de salud reproductiva, señale la opción correcta:","o":{"A":"Comprende información, exploración, tratamiento y seguimiento de las patologías.","B":"Incluye únicamente la realización de exploraciones ginecológicas.","C":"Se centra exclusivamente en el tratamiento farmacológico de las enfermedades.","D":"Se limita a patologías detectadas en el cribado de cáncer."},"c":"A"},{"id":440,"q":"En relación con la salud sexual y reproductiva en la mujer, señale la respuesta correcta:","o":{"A":"Se limita exclusivamente a la ausencia de enfermedad del aparato reproductor.","B":"Solo abarca la etapa fértil de la mujer.","C":"Incluye bienestar físico, mental y social en todos los aspectos del sistema reproductivo.","D":"No contempla aspectos sociales ni culturales."},"c":"C"},{"id":441,"q":"¿Cuál de las siguientes afirmaciones describe de forma más precisa el cambio endocrino característico de la menopausia?","o":{"A":"Descenso de estrógenos y disminución de FSH y LH por retroalimentación negativa aumentada.","B":"Aumento de estrógenos y descenso de gonadotrofinas por pérdida de sensibilidad ovárica.","C":"Descenso de estrógenos que provoca un aumento compensatorio de FSH y LH debido a la pérdida de retroalimentación negativa ovárica.","D":"Mantenimiento de niveles estables de estrógenos y aumento progresivo de progesterona por agotamiento folicular."},"c":"C"},{"id":442,"q":"¿Cuál de los siguientes cambios es característico de la vaginitis atrófica secundaria al déficit estrogénico en la menopausia?","o":{"A":"Aumento del glucógeno epitelial que favorece la proliferación de bacilos de Döderlein y mantiene un pH vaginal ácido.","B":"Disminución del número de capas del epitelio vaginal, con reducción del glucógeno y pérdida de la flora lactobacilar, lo que conduce a un pH vaginal elevado.","C":"Engrosamiento del epitelio vaginal y aumento de los fondos de saco debido a estímulo androgénico relativo.","D":"Descenso del pH vaginal que favorece infecciones recurrentes y dispareunia."},"c":"B"},{"id":443,"q":"¿Cuál de las siguientes afirmaciones sobre los síntomas vasomotores de la menopausia es correcta?","o":{"A":"Se originan por una elevación del umbral termorregulador, lo que produce vasoconstricción periférica y aumento de la temperatura corporal central.","B":"Suelen aparecer principalmente después de cinco años de la menopausia y rara vez en la transición menopáusica.","C":"Entre los factores que aumentan su intensidad se encuentran el tabaco, la obesidad y el sedentarismo, mientras que la raza y la menopausia quirúrgica se consideran factores no modificables.","D":"Los sofocos consisten en una sensación brusca de frío con sudoración, debida a un descenso agudo de la temperatura corporal central."},"c":"C"},{"id":444,"q":"¿Cuál de las siguientes afirmaciones sobre los efectos del tabaco en la menopausia es correcta?","o":{"A":"El tabaquismo retrasa el inicio de la menopausia debido a la mayor actividad estrogénica periférica, lo que disminuye el riesgo de osteoporosis.","B":"El tabaco acelera el metabolismo de los estrógenos, adelanta la menopausia entre 1 y 2 años y aumenta la pérdida ósea, especialmente en columna vertebral y radio distal.","C":"Las mujeres fumadoras presentan menor sintomatología climatérica debido al efecto vasodilatador de la nicotina.","D":"El tabaco acelera la menopausia, pero no influye en la pérdida ósea en la posmenopausia temprana."},"c":"B"},{"id":445,"q":"Respecto a los programas sanitarios de atención al climaterio, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Están dirigidos fundamentalmente a mujeres mayores de 65 años, con el objetivo prioritario de iniciar tratamiento hormonal sustitutivo de forma protocolizada.","B":"Se basan exclusivamente en atención individualizada por parte del equipo de ginecología, sin incluir actividades grupales dirigidas por matrón/as.","C":"El principal objetivo es el cribado sistemático del cáncer ginecológico en mujeres perimenopáusicas, siendo opcional el componente educativo.","D":"Sus intervenciones combinan valoración individual físico-psicosocial y actividades grupales de educación para la salud, con sesiones de ejercicio y relajación que suelen extenderse entre 8 y 12 semanas."},"c":"D"},{"id":446,"q":"¿Qué porcentaje de mujeres padecen síntomas vasomotores durante la transición menopáusica?","o":{"A":"Alrededor de un 80% de las mujeres experimentan síntomas vasomotores durante la transición menopáusica, aunque tan solo un 20-30% consultan para tratarlos.","B":"Alrededor de un 60% de las mujeres experimentan síntomas vasomotores durante la transición menopáusica, aunque tan solo un 20-30% consultan para tratarlos.","C":"Alrededor de un 40% de las mujeres experimentan síntomas vasomotores durante la transición menopáusica, aunque tan solo un 20-30% consultan para tratarlos.","D":"Alrededor de un 60% de las mujeres experimentan síntomas vasomotores durante la transición menopáusica, aunque tan solo un 10-20% consultan para tratarlos."},"c":"A"},{"id":447,"q":"¿Qué cambio caracteriza el acortamiento del ciclo menstrual alrededor de los 40 años?","o":{"A":"Prolongación de la fase lútea debido a menor liberación de FSH.","B":"Disminución de la fase folicular por adelanto de la ovulación.","C":"Ausencia completa de ovulación desde el inicio.","D":"Aumento de la duración total del ciclo por retraso de la ovulación."},"c":"B"},{"id":448,"q":"¿Cuál de las siguientes definiciones NO corresponde correctamente a una alteración menstrual frecuente durante el climaterio?","o":{"A":"Polimenorrea: ciclos menores de 21 días.","B":"Menorragia: menstruación con sangrado intenso o prolongado.","C":"Metrorragia: sangrado durante la menstruación.","D":"Amenorrea: ausencia de menstruación."},"c":"C"},{"id":449,"q":"¿Cuál de las siguientes afirmaciones NO es correcta respecto al tratamiento de los síntomas genitales durante el climaterio?","o":{"A":"Las mujeres con antecedentes personales de cáncer de mama pueden utilizar preparados que contengan estradiol si la dosis es baja.","B":"Los anillos vaginales presentan mayor aceptabilidad por ser más cómodos y fáciles de usar.","C":"El tratamiento hormonal vaginal se administra inicialmente a diario durante 2 a 4 semanas.","D":"La eficacia del tratamiento hormonal vaginal es similar para cremas, óvulos y comprimidos."},"c":"A"},{"id":450,"q":"¿En cuál de las siguientes situaciones sí estaría justificada la determinación de FSH y LH durante la atención al climaterio?","o":{"A":"Mujer de 52 años con ciclos irregulares.","B":"Mujer de 48 años con sofocos típicos.","C":"Mujer de 35 años con síntomas sugestivos de menopausia.","D":"Cualquier mujer en climaterio como análisis rutinario."},"c":"C"},{"id":451,"q":"¿Cuál de las siguientes exploraciones sí debe realizar el/la matrón/a durante la valoración física de la mujer en el climaterio?","o":{"A":"Determinación rutinaria de niveles de FSH y LH en todas las mujeres mayores de 50 años.","B":"Exploración general con peso, talla e IMC, presión arterial y exploración perineal y mamaria.","C":"Ecografía pélvica obligatoria en cada consulta.","D":"Resonancia magnética para valorar riesgo de osteoporosis."},"c":"B"},{"id":452,"q":"¿Cuál de las siguientes afirmaciones describe correctamente el impacto de los grupos en los programas de atención al climaterio?","o":{"A":"La participación en grupos suele disminuir la percepción de calidad de vida de las mujeres.","B":"Los grupos solo sirven para impartir información, sin generar interacción entre las participantes.","C":"La existencia de los grupos no influye en la experiencia de las mujeres.","D":"Las mujeres suelen organizar actividades sociales y culturales complementarias tras finalizar las sesiones."},"c":"D"},{"id":453,"q":"Se considera que un aborto es habitual o recurrente cuando:","o":{"A":"Se producen dos o más abortos consecutivos o cuatro abortos intercalados.","B":"Se produce un aborto en el primer trimestre y otro en el segundo.","C":"Se producen tres o más abortos consecutivos o cinco abortos intercalados.","D":"Se producen cuatro abortos consecutivos o cinco abortos intercalados."},"c":"A"},{"id":454,"q":"Según la evidencia científica actual, ¿cuál es el factor de riesgo más importante de infertilidad en las sociedades occidentales?","o":{"A":"La edad de la mujer, especialmente a partir de los 40 años.","B":"El índice de masa corporal elevado.","C":"El consumo de tabaco en la pareja.","D":"La frecuencia de las relaciones sexuales."},"c":"A"},{"id":455,"q":"Según lo establecido en la Ley de Reproducción Humana Asistida, la donación de gametos se considera:","o":{"A":"Un contrato lucrativo entre la persona donante y el centro autorizado.","B":"Un contrato gratuito, formal y secreto entre la persona donante y el centro autorizado.","C":"Un contrato gratuito, formal y secreto entre la persona donante y la persona receptora.","D":"Un acuerdo comercial regulado por el Ministerio de Sanidad."},"c":"B"},{"id":456,"q":"Los coitos programados están especialmente indicados en:","o":{"A":"Parejas mayores de 40 años con causa clara de esterilidad.","B":"Parejas jóvenes (menores de 35 años), con poco tiempo intentando embarazo y con estudios básicos normales.","C":"Parejas con alta ansiedad y fallo ovárico precoz.","D":"Mujeres con necesidad obligada de estimulación ovárica intensa."},"c":"B"},{"id":457,"q":"En el interrogatorio femenino dentro del estudio de infertilidad, ¿qué elementos deben recogerse?","o":{"A":"Únicamente la edad de la menarquia y la fecha de la última menstruación.","B":"Motivo de consulta, tiempo de infecundidad, uso previo de anticonceptivos, antecedentes ginecológicos (embarazos, partos, abortos) y aspectos sexuales como la frecuencia del coito.","C":"Solo los antecedentes obstétricos y la fórmula menstrual.","D":"Datos psicosociales y frecuencia de relaciones sexuales."},"c":"B"},{"id":458,"q":"En la valoración inicial realizada por el/la matrón/a en una consulta de reproducción, ¿qué hallazgo tiene una relación directa con la posible alteración de la ovulación?","o":{"A":"Índice de masa corporal dentro de la normalidad pero presión arterial ligeramente elevada.","B":"Porcentaje de grasa corporal inferior al 10 %, compatible con desnutrición o sobreentrenamiento.","C":"Ausencia de antecedentes familiares de infertilidad.","D":"Regularidad en los ciclos menstruales pero presencia ocasional de cefaleas tensionales."},"c":"B"},{"id":459,"q":"¿Cuál de los siguientes microorganismos se considera habitual en la flora vaginal sana?","o":{"A":"Haemophilus influenzae.","B":"Mobiluncus.","C":"Lactobacillus.","D":"Listeria monocytogenes."},"c":"C"},{"id":460,"q":"Respecto a la vaginosis bacteriana (VB), señale la opción que NO es cierta:","o":{"A":"La VB representa aproximadamente el 60 % de las infecciones vaginales y se caracteriza por una disminución de Lactobacillus y un aumento de anaerobios hasta 10–100 veces.","B":"La presencia de leucorrea grisácea no viscosa y adherente, junto con un olor a pescado al mezclar el exudado con KOH al 10 %, son hallazgos característicos.","C":"El tratamiento de la pareja sexual se recomienda de manera sistemática para reducir las recurrencias.","D":"Entre los factores de riesgo se incluyen el embarazo, la promiscuidad sexual, el uso de DIU y las duchas vaginales."},"c":"C"},{"id":461,"q":"Respecto a la Enfermedad Inflamatoria Pélvica (EIP), señale la opción que NO es correcta:","o":{"A":"La inserción o retirada del Dispositivo Intra Uterino (DIU) en condiciones de escasa asepsia puede favorecer la aparición de EIP.","B":"La fase preovulatoria del ciclo incrementa el riesgo debido a la mayor filancia y permeabilidad del moco cervical.","C":"La EIP puede elevar el riesgo de embarazo ectópico entre 4 y 6 veces respecto a mujeres sin antecedentes.","D":"La ectopia cervical, más frecuente en mujeres jóvenes, constituye un factor de riesgo reconocido para EIP."},"c":"B"},{"id":462,"q":"¿Cuál de los siguientes hallazgos clínicos es típico de la Enfermedad Inflamatoria Pélvica (EIP)?","o":{"A":"Dolor a la movilización del cérvix durante la exploración vaginal.","B":"Dolor hipogástrico habitualmente unilateral de leve intensidad.","C":"Leucorrea clara y sin olor, característica de procesos no infecciosos.","D":"Dispareunia superficial sin otros síntomas acompañantes."},"c":"A"},{"id":463,"q":"Según la clasificación de los prolapsos, ¿en cuál de los siguientes grados la porción más distal del prolapso se sitúa entre 1 y 2 cm por debajo del himen?","o":{"A":"Grado I.","B":"Grado II.","C":"Grado III.","D":"Grado IV."},"c":"C"},{"id":464,"q":"¿Cuál de los siguientes ejercicios del suelo pélvico se caracteriza por trabajar la contracción muscular por niveles, imaginando la vagina como un tubo con “plantas” que se ascienden y descienden progresivamente?","o":{"A":"El ejercicio rápido.","B":"El ejercicio en onda.","C":"El ejercicio lento.","D":"El ejercicio del ascensor."},"c":"D"},{"id":465,"q":"Según las recomendaciones de la OMS sobre planificación familiar, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El periodo intergenésico mínimo óptimo entre embarazos es de un año.","B":"Se recomienda no sobrepasar las cinco gestaciones por mujer.","C":"La edad recomendada para iniciar los embarazos es después de los 20 años.","D":"Se debe evitar el embarazo después de los 35-38 años."},"c":"C"},{"id":466,"q":"Según la OMS, ¿cuál de los siguientes es un beneficio directo de la planificación familiar?","o":{"A":"Aumenta la tasa de natalidad en adolescentes para garantizar el relevo generacional.","B":"Reduce la necesidad de recurrir al aborto peligroso, que representa un 13% de la mortalidad materna mundial.","C":"Promueve el embarazo después de los 40 años para reducir la mortalidad infantil.","D":"Favorece el crecimiento ilimitado de la población para estimular la economía."},"c":"B"},{"id":467,"q":"¿Cuál de las siguientes afirmaciones sobre los métodos de barrera es correcta?","o":{"A":"Los preservativos masculino y femenino son los únicos métodos de barrera que reducen el riesgo de ITS además de prevenir embarazos.","B":"El diafragma se utiliza sin necesidad de espermicida y no requiere medición previa por un profesional.","C":"Todos los métodos de barrera protegen contra las infecciones de transmisión sexual (ITS).","D":"La esponja vaginal tiene una tasa de fallo menor en mujeres que ya han tenido hijos (multíparas) que en nulíparas."},"c":"A"},{"id":468,"q":"Señala la respuesta correcta sobre la anticoncepción hormonal:","o":{"A":"Los anticonceptivos hormonales que no requieren participación activa de la usuaria para su uso continuado (como DIU-LNG o implantes) presentan mayor efectividad en la práctica clínica.","B":"El principal efecto adverso de los anticonceptivos de solo gestágeno (MSG) es un aumento significativo del riesgo de trombosis venosa profunda.","C":"Los anticonceptivos hormonales combinados (AHC) están indicados en mujeres lactantes y fumadoras mayores de 35 años por su alta seguridad.","D":"El riesgo de cáncer de mama asociado a los anticonceptivos hormonales combinados es permanente y no desaparece tras suspender su uso."},"c":"A"},{"id":469,"q":"¿Cuál de las siguientes actuaciones es correcta en el asesoramiento y seguimiento de una mujer portadora de DIU?","o":{"A":"Antes de la inserción del DIU, es obligatorio realizar una ecografía sistemática para valorar la posición y el tamaño del útero, ya que mejora la eficacia del método.","B":"El primer control tras la inserción del DIU debe realizarse después del primer periodo menstrual y antes de los 3 meses, preguntando por efectos adversos y pudiendo valorar la posición del DIU con ecografía si se dispone.","C":"Si en un control rutinario no se visualizan los hilos del DIU y la ecografía confirma que está en cavidad uterina, se debe retirar inmediatamente y colocar uno nuevo.","D":"La presencia de Actinomyces en una portadora de DIU sintomática no requiere la retirada del dispositivo, solo tratamiento antibiótico ambulatorio."},"c":"B"},{"id":470,"q":"¿Cuál de las siguientes afirmaciones sobre la atención del/de la matrón/a en métodos anticonceptivos quirúrgicos es correcta?","o":{"A":"La ligadura tubárica es un método que no requiere ingreso hospitalario y es eficaz desde el momento de la intervención.","B":"En la vasectomía, la eficacia anticonceptiva es inmediata tras la cirugía, por lo que no necesita ningún control posterior.","C":"Tras la inserción del dispositivo intratubárico Essure®, la mujer debe usar otro método anticonceptivo durante los 3 meses posteriores.","D":"El/La matrón/a no puede solicitar pruebas preoperatorias como hemograma o coagulación, ya que esa función es exclusiva del/de la ginecólogo/a o urólogo/a."},"c":"C"},{"id":471,"q":"Según el artículo 9.1 de la Ley Orgánica 2/2010, de 3 de marzo, ¿cuál de los siguientes objetivos NO se menciona expresamente como parte de la formación en salud sexual y reproductiva en el sistema educativo?","o":{"A":"La promoción de una visión de la sexualidad en términos de igualdad, corresponsabilidad, diversidad, placer, deseo, libertad y respeto, con especial atención a la prevención de la violencia de género y la violencia sexual.","B":"El reconocimiento de la diversidad sexual y el desarrollo armónico de la sexualidad en cada etapa del ciclo vital, con especial atención a la adolescencia y juventud.","C":"La promoción exclusiva de la abstinencia sexual como método principal para prevenir embarazos no deseados e infecciones de transmisión sexual.","D":"La prevención de enfermedades e infecciones de transmisión sexual, especialmente del VIH y del VPH, visibilizando la realidad de las personas VIH+/SIDA y sus necesidades para superar la discriminación."},"c":"C"},{"id":472,"q":"En relación con la protección y garantía de los derechos sexuales y reproductivos en el ámbito ginecológico y obstétrico, según el artículo 27 del Real Decreto 825/2010, señale la respuesta correcta:","o":{"A":"El consentimiento informado en los tratamientos invasivos durante la atención al parto es recomendable, pero no preceptivo, cuando se trate de urgencias obstétricas que pongan en riesgo la vida de la madre o del feto.","B":"Las administraciones públicas deben promover la disminución del intervencionismo en la atención obstétrica, evitando prácticas no avaladas por la evidencia científica y reforzando el parto respetado y el consentimiento informado, incluyendo medidas para incrementar el personal especializado.","C":"La no separación del/de la recién nacido/a de su madre es un derecho absoluto que debe garantizarse en todo caso, incluso cuando existan indicaciones clínicas claras que aconsejen el ingreso del neonato en una unidad de cuidados especiales.","D":"El respeto a la decisión sobre la forma de alimentación del/de la recién nacido/a se limita al ámbito de la sanidad pública, quedando excluidos los centros privados por no estar sujetos a las mismas exigencias de promoción de derechos sexuales y reproductivos."},"c":"B"},{"id":473,"q":"En relación con las medidas de prevención y respuesta frente a formas de violencia contra las mujeres en el ámbito de la salud sexual y reproductiva, según el Real Decreto 825/2010, señala la respuesta correcta:","o":{"A":"El contrato de gestación por subrogación es nulo de pleno derecho solo si se realiza con precio, pero no cuando se acuerda de forma altruista sin contraprestación económica.","B":"Las administraciones públicas promoverán campañas institucionales para informar de la ilegalidad de la gestación por sustitución, pero no pueden instar acciones judiciales contra la publicidad que la promueva, ya que ello corresponde exclusivamente a las personas particulares afectadas.","C":"La promoción comercial de la gestación por sustitución está permitida siempre que no se ofrezca explícitamente un precio por la gestante, pues la Ley General de Publicidad solo sanciona la publicidad de servicios sanitarios ilegales cuando hay ánimo de lucro.","D":"Los poderes públicos deben velar por evitar el aborto forzoso y la anticoncepción o esterilización forzosas, prestando especial atención a las mujeres con discapacidad, y se promoverán programas específicos de salud sexual y reproductiva para este colectivo."},"c":"D"},{"id":474,"q":"En relación con el procedimiento de actuación del comité clínico previsto en el Real Decreto 825/2010, de 25 de junio, para la interrupción voluntaria del embarazo por causas médicas (supuesto de enfermedad fetal grave o incompatible con la vida), señale la respuesta correcta:","o":{"A":"Una vez emitido el primer diagnóstico, la mujer debe solicitar directamente al comité clínico que emita dictamen, y este dispondrá de 10 días para pronunciarse, prorrogables en cualquier caso sin necesidad de motivación.","B":"Si el dictamen del comité confirma el diagnóstico, lo transmitirá al órgano competente de la Comunidad Autónoma en el plazo de 24 horas, para que notifique a la interesada y esta pueda acceder a la interrupción exclusivamente en un centro de su propia red sanitaria autonómica.","C":"La mujer no puede designar a ningún especialista para que se integre en el comité clínico, ya que las personas miembros de dicho comité, son designadas exclusivamente por la autoridad sanitaria sin intervención de la persona paciente.","D":"El comité clínico debe emitir su dictamen en un plazo máximo de 10 días, salvo que, motivadamente, se acredite que las pruebas diagnósticas o de otro tipo requieran un plazo mayor."},"c":"D"},{"id":475,"q":"En relación con la información contenida en el sobre cerrado del artículo 5 del Real Decreto 825/2010, señala la opción correcta:","o":{"A":"La información del sobre puede ser facilitada también por vía telefónica o electrónica si la mujer lo prefiere.","B":"El sobre debe incluir necesariamente información sobre ayudas públicas para mujeres embarazadas, derechos laborales, centros de anticoncepción y centros de asesoramiento voluntario.","C":"La imagen institucional no puede figurar en el sobre para garantizar la confidencialidad.","D":"El sobre se entrega únicamente en los supuestos de interrupción por grave riesgo para la salud de la mujer."},"c":"B"},{"id":476,"q":"Según el artículo 8 del Real Decreto 825/2010, ¿cuál es el procedimiento correcta en el caso de una mujer de 16 o 17 años que desea interrumpir voluntariamente el embarazo?","o":{"A":"Presta su consentimiento acompañada de su representante legal, quien debe entregar un documento al personal sanitario.","B":"No necesita consentimiento ni información a sus representantes legales porque es mayor de 16 años.","C":"Solo puede intervenir si sus representantes legales lo autorizan por escrito de forma expresa.","D":"El personal médico puede prescindir de la información a los/las representantes legales si la mujer lo alega, sin necesidad de ninguna valoración adicional."},"c":"A"},{"id":477,"q":"¿Cuál de las siguientes combinaciones describe un conjunto de factores que aumentan claramente el riesgo de cáncer de mama, y cuya relación está además respaldada por un posible mecanismo biológico identificado?","o":{"A":"Menopausia tardía, baja densidad ósea y niveles altos de andrógenos, mediante un incremento documentado de la metilación del ADN.","B":"Sobrepeso en la premenopausia, lesiones mamarias benignas sin atipia y exposición intraútero a dietilestilbestrol, mediante aumento de estrógenos periféricos.","C":"Nuliparidad, alta densidad mamaria y niveles altos de IGF-1, mediante mayor exposición acumulada a estrógenos y proliferación mamaria mantenida.","D":"Estatura baja, antecedentes familiares en parientes de segundo grado y menarquia tardía, mediante disminución de la maduración glandular."},"c":"C"},{"id":478,"q":"¿Cuál de las siguientes afirmaciones refleja con mayor precisión las limitaciones del cribado mamográfico poblacional?","o":{"A":"Aunque el cribado mamográfico permite diagnosticar un porcentaje importante de cánceres asintomáticos, hasta un 15% de las neoplasias pueden presentarse como masa palpable sin expresión mamográfica, y un 30% aparecen en el intervalo entre dos cribados.","B":"El cribado mamográfico evita la aparición de neoplasias de intervalo, reduciendo su tasa a menos del 10% de los casos evaluados entre ciclos consecutivos de cribado.","C":"El cribado mamográfico detecta prácticamente todos los cánceres de mama asintomáticos, y menos del 5% de las neoplasias se diagnostican por masa palpable sin hallazgos en la mamografía previa.","D":"Las campañas de cribado detectan el 100% de los cánceres en mujeres dentro del rango de edad establecido, por lo que los diagnósticos fuera de estas edades son excepcionales."},"c":"A"},{"id":479,"q":"¿Cuál de las siguientes combinaciones refleja situaciones en las que debe sospecharse especialmente la existencia de una neoplasia mamaria?","o":{"A":"Dolor mamario bilateral cíclico asociado al ciclo menstrual (presente hasta en el 40% de las mujeres en edad fértil), secreción lechosa bilateral en mujeres jóvenes (hasta un 5% de los casos evaluados) y adenopatías axilares dolorosas reactivas a procesos inflamatorios (alrededor del 60% de las adenopatías palpables).","B":"Masa mamaria palpable indolora como forma de inicio en más del 50% de los casos; dolor mamario localizado no cíclico que constituye el único síntoma hasta en el 15% de las neoplasias; y secreción mamaria unilateral hemática en mujeres mayores de 40 años.","C":"Secreción mamaria transparente bilateral sin masa asociada, presente aproximadamente en un 8% de las consultas por alteraciones mamarias; dolor mamario difuso en ambas mamas en mujeres peri menopáusicas, descrito hasta en un 25% de este grupo; y adenopatías axilares reactivas bilaterales detectadas clínicamente en un 12% de revisiones rutinarias.","D":"Dolor mamario cíclico asociado al ciclo en un 30–35% de las mujeres pre menopáusicas; secreción láctea inducida por manipulación en un 10% de consultas no patológicas; y adenopatías axilares menores de 1 cm relacionadas con infecciones respiratorias en un 20% de los episodios evaluados en Atención Primaria."},"c":"B"},{"id":480,"q":"En relación a las lesiones intraepiteliales cervicales (CIN) y sus alteraciones histológicas características, señale la opción correcta: ¿cuál de las siguientes combinaciones incluye únicamente hallazgos histológicos propios de una lesión pre maligna del cérvix?","o":{"A":"Presencia de diferenciación y maduración, estratificación conservada y ausencia de variabilidad en el tamaño y forma de las células escamosas.","B":"Pérdida de la estratificación y de la polaridad celular, ausencia de diferenciación y de maduración, variabilidad en el tamaño y forma de las células escamosas con aumento de la relación núcleo-citoplasma, alteraciones en el núcleo celular (hipercromatismo e irregularidad en la cromatina nuclear), aumento del número de mitosis y eventual presencia de mitosis anormales, y alteraciones limitadas al epitelio de superficie con posible extensión a las glándulas (relleno glandular).","C":"Estratificación intacta con mantenimiento de la polaridad celular, diferenciación y maduración conservadas, células escamosas con tamaño y forma regulares y relación núcleo-citoplasma adecuada, cromatina nuclear sin hipercromatismo ni irregularidad, ausencia de aumento del número de mitosis y sin presencia de mitosis anormales, y alteraciones limitadas al epitelio estrictamente normales sin extensión a glándulas ni relleno glandular.","D":"Diferenciación y maduración presentes en todas las capas del epitelio, polaridad celular conservada, tamaño y forma celulares uniformes sin aumento de la relación núcleo-citoplasma, núcleo celular sin hipercromatismo ni irregularidad de la cromatina, número de mitosis dentro de la normalidad sin mitosis anormales, y epitelio de superficie sin alteraciones ni extensión a glándulas ni fenómenos de relleno glandular."},"c":"B"},{"id":481,"q":"Respecto al papel del virus del papiloma humano (VPH) en la génesis de las lesiones pre malignas y del cáncer del cuello uterino, señale la opción correcta:","o":{"A":"El VPH participa en algunos casos de cáncer de cérvix, pero no puede considerarse un factor indispensable para su desarrollo.","B":"La infección por VPH es frecuente y de transmisión sexual, pero por sí sola no determina que todas las mujeres infectadas desarrollen una lesión pre maligna o un cáncer de cérvix.","C":"La infección por VPH solo se considera relevante en etapas avanzadas y no en la génesis inicial de las lesiones pre malignas.","D":"El VPH es la causa etiológica necesaria, aunque no suficiente, para el desarrollo de las lesiones pre malignas y del cáncer de cérvix."},"c":"D"},{"id":482,"q":"Respecto a la mortalidad por cáncer de cérvix en la Comunidad Autónoma del País Vasco (CAPV) en el año 2023, señale la opción correcta:","o":{"A":"La CAPV presentó en 2023 una tasa de mortalidad de 1,8 por 100.000 mujeres, con un total de 27 defunciones, y una tendencia creciente desde 2001 con un porcentaje de cambio anual (PAC) positivo y significativo.","B":"La CAPV presentó en 2023 una tasa de mortalidad de 1,8 por 100.000 TEE (Tasa Estandarizada por Edad), con 27 fallecimientos por cáncer de cérvix, y una tendencia negativa entre 2001 y 2023 co
