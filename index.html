o escrito, la información básica siguiente:","o":{"A":"Todos los riesgos en condiciones normales, conforme a la experiencia y al estado de la ciencia o directamente relacionados con el tipo de intervención.","B":"Todos los riesgos, siempre que sean graves, en condiciones normales, conforme a la experiencia y al estado de la ciencia o directamente relacionados con el tipo de intervención.","C":"Todos los riesgos probables en condiciones normales, conforme a la experiencia y al estado de la ciencia o directamente relacionados con el tipo de intervención.","D":"Todos los riesgos, siempre que sean probables y graves, en condiciones normales, conforme a la experiencia y al estado de la ciencia o directamente relacionados con el tipo de intervención."},"c":"C"},{"id":596,"q":"Según dispone la Ley 41/2002, de 14 de noviembre, básica reguladora de la autonomía del paciente y de derechos y obligaciones en materia de información y documentación clínica, en caso de que la persona paciente no acepte el alta:","o":{"A":"El personal facultativo, previa comprobación del informe clínico correspondiente, oirá a la persona paciente y, si persiste en su negativa, lo pondrá en conocimiento de la dirección del centro para que confirme o revoque la decisión.","B":"El personal facultativo, previa comprobación del informe clínico correspondiente, oirá a la persona paciente y, si persiste en su negativa, lo pondrá en conocimiento de la autoridad judicial para que confirme o revoque la decisión.","C":"La dirección del centro, previa comprobación del informe clínico correspondiente, oirá a la persona paciente y, si persiste en su negativa, lo pondrá en conocimiento de la autoridad judicial para que confirme o revoque la decisión.","D":"La dirección del centro, previa comprobación del informe clínico correspondiente, oirá a la persona paciente y, si persiste en su negativa, lo pondrá en conocimiento de la autoridad administrativa competente para que confirme o revoque la decisión."},"c":"C"},{"id":597,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, la expresión de los objetivos vitales y valores personales tiene como fin:","o":{"A":"Conocer la voluntad de la persona paciente en relación con la administración de sedación.","B":"Conocer la voluntad de la persona paciente en relación con la finalización de tratamientos de soporte vital.","C":"Ayudar a interpretar las instrucciones y servir de orientación para la toma de decisiones clínicas.","D":"Documentar la actuación del personal profesional sanitario a efectos de responsabilidad legal en situaciones donde la persona paciente no puede expresar su voluntad por sí misma."},"c":"C"},{"id":598,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, en el documento de voluntades anticipadas:","o":{"A":"Se podrá designar una o varias personas representantes para que sean las interlocutoras válidas del personal facultativo o del equipo sanitario.","B":"Se podrá designar exclusivamente una persona representante para que sea la interlocutora válida del personal facultativo o del equipo sanitario.","C":"Se podrá designar una o varias personas representantes para que sean las interlocutoras válidas del personal facultativo o del equipo sanitario, si la persona paciente es menor de edad.","D":"Se podrá designar una o varias personas representantes para que sean las interlocutoras válidas del personal facultativo o del equipo sanitario y facultarles para interpretar sus valores e instrucciones, si la persona paciente está incapacitada judicialmen te."},"c":"A"},{"id":599,"q":"Según la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, si el nombramiento de representante en el documento de instrucciones previas ha recaído en favor de la persona cónyuge o pareja de hecho de la persona otorga nte:","o":{"A":"Se extingue a partir, bien de la interposición de la demanda de nulidad, separación matrimonial o divorcio, bien de la extinción formalizada de la pareja de hecho o unión libre. Para el mantenimiento de la designación será necesario, en caso de nulidad, se paración matrimonial o divorcio, que conste expresamente en la resolución judicial dictada al efecto.","B":"Se extingue a partir bien de la nulidad, separación matrimonial o divorcio, bien de la extinción formalizada de la pareja de hecho o unión libre. Para el mantenimiento de la designación será necesario, en caso de nulidad, separación matrimonial o divorcio, que conste expresamente en la resolución judicial dictada al efecto.","C":"Se extingue a partir, bien de la interposición de la demanda de nulidad, separación matrimonial o divorcio, bien de la extinción formalizada de la pareja de hecho o unión libre. Para el mantenimiento de la designación será necesario, en caso de nulidad, se paración matrimonial o divorcio, que conste expresamente en el documento de instrucciones previas.","D":"Se extingue bien a partir de la nulidad, separación matrimonial o divorcio, bien de la extinción formalizada de la pareja de hecho o unión libre. Para el mantenimiento de la designación será necesario, en caso de nulidad, separación matrimonial o divorcio, que conste expresamente en el documento de instrucciones previas."},"c":"A"},{"id":600,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, las instrucciones sobre el tratamiento pueden referirse:","o":{"A":"A una enfermedad o lesión que la persona otorgante ya padece o a las que eventualmente podría padecer en un futuro.","B":"Exclusivamente a una enfermedad o lesión que la persona otorgante ya padece.","C":"Exclusivamente a una enfermedad o lesión que la persona otorgante eventualmente podría padecer en un futuro","D":"Exclusivamente a una enfermedad o lesión que la persona otorgante eventualmente podría padecer en un futuro, siempre que sea de carácter grave."},"c":"A"},{"id":601,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, el documento de voluntades anticipadas:","o":{"A":"Se formaliza por escrito y mediante uno de los siguientes procedimientos a elección de la persona que lo otorga: ante una notaría; ante la persona funcionaria o empleada pública encargada del Registro Vasco de Voluntades Anticipadas; o ante dos testigos.","B":"Se formaliza por escrito y mediante uno de los siguientes procedimientos a elección de la persona que lo otorga: ante una notaría; ante la persona funcionaria o empleada pública encargada del Registro Vasco de Voluntades Anticipadas; o ante tres testigos.","C":"Se formaliza por escrito y mediante uno de los siguientes procedimientos a elección de la persona que lo otorga: ante una notaría; ante la persona funcionaria o empleada pública encargada del Registro Vasco de Voluntades Anticipadas o del servicio de documentación de un centro sanitario de la Comunidad Autónoma del País Vasco; o ante dos testigos.","D":"Se formaliza por escrito y mediante uno de los siguientes procedimientos a elección de la persona que lo otorga: ante una notaría; ante la persona funcionaria o empleada pública encargada del Registro Vasco de Voluntades Anticipadas o del servicio de docum entación de un centro sanitario de la Comunidad Autónoma del País Vasco; o ante tres testigos."},"c":"B"},{"id":602,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, el documento de voluntades anticipadas puede ser modificado, sustituido por otro o revocado en cualquier momento por la persona otorgante:","o":{"A":"Siempre que conserve la capacidad o actúe con la asistencia de su representante legal y actúe libremente.","B":"Siempre que conserve la capacidad o exista autorización judicial.","C":"Siempre que actúe libremente.","D":"Siempre que conserve la capacidad y actúe libremente."},"c":"D"},{"id":603,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, la voluntad de la persona prevalece sobre las instrucciones contenidas en el documento de voluntades anticipadas ante cualquier intervención clínica siempre que:","o":{"A":"La persona otorgante conserve su capacidad y su libertad de actuación.","B":"La persona otorgante conserve su capacidad, su libertad de actuación y la posibilidad de expresarse.","C":"La persona otorgante conserve su capacidad, su libertad de actuación y la posibilidad de expresarse de manera inequívoca.","D":"La persona otorgante conserve su capacidad, su libertad de actuación y la posibilidad de expresarse de manera inequívoca o a través de la persona interlocutora designada al efecto."},"c":"B"},{"id":604,"q":"Según dispone la Ley 7/2002, de 12 de diciembre, de las voluntades anticipadas en el ámbito de la sanidad, en el documento de voluntades anticipadas se tendrán por no puestas:","o":{"A":"Las instrucciones que en el momento de ser aplicadas resulten contrarias al ordenamiento jurídico.","B":"Las instrucciones que en el momento de ser otorgadas resulten contrarias al ordenamiento jurídico.","C":"Las respuestas a ) y b) son correctas.","D":"Las instrucciones que en el momento de ser aplicadas no se aprueben por el comité de ética del centro."},"c":"A"},{"id":605,"q":"Según dispone la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, podrán tener acceso a los datos personales de las personas fallecidas:","o":{"A":"Las personas vinculadas a la persona fallecida por razones familiares o de hecho así como quienes ostenten la condición de herederas, en todo caso.","B":"Solo las personas vinculadas a la persona fallecida por razones familiares siempre que lo hubiera autorizado expresamente la persona fallecida.","C":"Las personas vinculadas a la persona fallecida por razones familiares o de hecho así como quienes ostenten la condición de herederas, salvo que la persona fallecida lo hubiese prohibido expresamente.","D":"En caso de que la persona fallecida fuera menor de edad, el acceso podrá ejercerse también por sus representantes legales o por el Ministerio Fiscal que siempre actuará de oficio."},"c":"C"},{"id":606,"q":"Señale la respuesta que no es correcta. Según la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales a efectos del tratamiento de los datos, el consentimiento de la persona afectada tiene que ser u na manifestación de voluntad que cumpla las siguientes características:","o":{"A":"Libre.","B":"Verbal.","C":"Específica.","D":"Informada."},"c":"B"},{"id":607,"q":"Con relación al tratamiento de los datos personales de una persona menor de edad, señale la respuesta correcta:","o":{"A":"Únicamente podrá fundarse en su consentimiento cuando sea mayor de dieciséis años.","B":"La Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales no prevé que las personas menores de edad puedan dar su consentimiento válidamente a estos efectos.","C":"Únicamente podrá fundarse en su consentimiento cuando sea mayor de catorce años.","D":"El tratamiento de los datos de las personas menores de dieciséis años, fundado en el consentimiento, solo será lícito si consta el consentimiento de quienes ejercen la patria potestad o tutela, con el alcance que dichas personas determinen."},"c":"C"},{"id":608,"q":"La Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, en su artículo 9 considera categorías especiales de datos aquellos que permitan, respecto a la persona afectada, identificar:","o":{"A":"Su ideología y afiliación sindical.","B":"Su religión y orientación sexual .","C":"Sus creencias u origen racial o étnico.","D":"Todas las respuestas son correctas."},"c":"D"},{"id":609,"q":"La Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales establece que el tratamiento de datos de naturaleza penal podrá llevarse a cabo:","o":{"A":"Solo por profesionales de la abogacía y cuando tengan por objeto recoger la información facilitada por quienes les contraten para el ejercicio de sus funciones.","B":"Por profesionales de la abogacía y de la procura, cuando tengan por objeto recoger la información facilitada por quienes les contraten para el ejercicio de sus funciones.","C":"En los casos previstos por la propia Ley Orgánica 3/2018 y en otras normas de rango reglamentario.","D":"Exclusivamente en los supuestos amparados en una norma de Derecho de la Unión y en la propia Ley Orgánica 2/2018."},"c":"B"},{"id":610,"q":"Respecto al derecho de rectificación que regula la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, señale la respuesta correcta:","o":{"A":"La persona afectada deberá indicar en su solicitud a qué datos se refiere y deberá acompañar, en todo caso, la documentación justificativa de la inexactitud de los datos.","B":"La persona afectada deberá indicar en su solicitud a qué datos se refiere y la corrección que haya de realizarse, y cuando sea preciso, deberá acompañar la documentación justificativa de la inexactitud o carácter incompleto de los datos objeto de tratamien to.","C":"La persona afectada deberá indicar en su solicitud solo la corrección que haya de realizarse y debe siempre acompañar la documentación justificativa de la inexactitud de los datos.","D":"No es necesario que la persona afectada indique expresamente en su solicitud qué datos deben rectificarse."},"c":"B"},{"id":611,"q":"Con relación al tratamiento de datos con fines de videovigilancia, señale la respuesta correcta:","o":{"A":"Solo las personas físicas podrán llevar a cabo el tratamiento de imágenes a través de sistemas de cámaras o videocámaras con la finalidad de preservar la seguridad de las personas y bienes, así como sus instalaciones.","B":"Los datos serán suprimidos, en todo caso, en el plazo máximo de un mes desde su captación.","C":"Los datos serán suprimidos en el plazo máximo de un mes desde su captación, salvo cuando hubieran de ser conservados para acreditar la comisión de actos que atenten contra la integridad de personas, bienes o instalaciones.","D":"En el caso de que los datos hubieran de ser conservados más allá del plazo de un mes desde su captación para acreditar la comisión de actos que atenten contra la integridad de personas, bienes o instalaciones, deberán ser puestas a disposición de la autori dad competente en un plazo máximo de cuarenta y ocho horas desde que se tuviera conocimiento de la existencia de la grabación."},"c":"C"},{"id":612,"q":"Respecto a los sistemas de información de denuncias internas que contempla la Ley Orgánica 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales, es correcta la siguiente afirmación:","o":{"A":"En todo caso, transcurridos tres meses desde la introducción de los datos, deberá procederse a su supresión del sistema de denuncias, salvo que la finalidad de la conservación sea dejar evidencia del funcionamiento del modelo de prevención de la comisión d e delitos.","B":"En todo caso, transcurridos seis meses desde la introducción de los datos, deberá procederse a su supresión del sistema de denuncias, salvo que la finalidad de la conservación sea dejar evidencia del funcionamiento del modelo de prevención de la comisión d e delitos.","C":"En todo caso, y sin excepción, transcurridos seis meses desde la introducción de los datos, deberá procederse a su supresión del sistema de denuncias.","D":"La Ley no prevé plazo temporal alguno para la supresión de los datos del sistema de denuncias."},"c":"A"},{"id":613,"q":"El artículo 1 del Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, añade un concepto específico al objeto de la ley que refuerza el fin último de la norma, ¿cuál es?","o":{"A":"La igualdad de oportunidades.","B":"El empoderamiento de las mujeres.","C":"Lograr una sociedad libre de violencia machista.","D":"La eliminación de roles tradicionales."},"c":"C"},{"id":614,"q":"Según el artículo 2 del Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿a qué entidades privadas les es exigible el cumplimiento de los principios generales de esta ley durante su relación con la administración?","o":{"A":"Solo a las que tengan una plantilla superior a 250 personas.","B":"A todas las empresas con sede en Euskadi.","C":"A las que suscriban contratos o convenios, estén participadas por poderes públicos o sean beneficiarias de ayudas.","D":"Ninguna entidad privada está sujeta a los principios de la ley."},"c":"C"},{"id":615,"q":"Según el Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿cuál de estos es un principio general de actuación de lo s poderes públicos vascos incorporado en la nueva redacción del artículo 3?","o":{"A":"El principio de jerarquía administrativa.","B":"La integración de la perspectiva interseccional.","C":"El principio de celeridad procesal.","D":"La centralización de recursos de acogida."},"c":"B"},{"id":616,"q":"Según el Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, respecto al principio de representación equilibrada, ¿en qué caso se permite excepcionalmente una presencia de mujeres superior al 60%?","o":{"A":"En ningún caso.","B":"Solo si no hay hombres capacitados en el sector.","C":"Cuando sea acorde al objetivo de corregir la histórica situación de infrarrepresentación de las mujeres.","D":"Si el órgano tiene menos de cuatro integrantes."},"c":"C"},{"id":617,"q":"Según el Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿qué planes específicos deben someterse ahora, obligatori amente, a una evaluación previa de impacto en función del género?","o":{"A":"Solo los planes de formación interna.","B":"Los planes territoriales y urbanísticos.","C":"Los planes de marketing de empresas públicas.","D":"Ningún plan, solo los proyectos de ley."},"c":"B"},{"id":618,"q":"Según el Decreto Legislativo 1/2023, de 16 de marzo, por el que se aprueba el texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, ¿qué requisito nuevo deben cumplir las empresas de más de 50 personas trabajadoras para poder recibir subvenciones públicas?","o":{"A":"Tener paridad total en su directiva.","B":"Acreditar haber establecido medidas para prevenir y combatir el acoso sexual y las violencias sexuales.","C":"Tener un departamento exclusivo de igualdad.","D":"Estar inscritas en un registro internacional de igualdad."},"c":"B"},{"id":619,"q":"De acuerdo con lo establecido en el artículo 54 del texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, aprobado por el Decreto Legislativo 1/2023, de 16 de marzo, ¿cómo se define la \"vio lencia machista contra las mujeres\"?","o":{"A":"Solo la violencia física en el hogar.","B":"Una violación de los derechos humanos y un problema de salud pública de primer orden.","C":"Únicamente los delitos contra la libertad sexual.","D":"Un conflicto de convivencia familiar."},"c":"B"},{"id":620,"q":"De acuerdo con lo establecido en el artículo 54.3 del texto refundido de la Ley para la Igualdad de Mujeres y Hombres y Vidas Libres de Violencia Machista contra las Mujeres, aprobado por el Decreto Legislativo 1/2023, de 16 de marzo, ¿qué formas de violen cia se incorporan como casos constitutivos de violencia machista por estar específicamente recogidos en dicho apartado?","o":{"A":"Solo la violencia física y psicológica.","B":"La violencia obstétrica, la política de género y la violencia digital.","C":"Únicamente el acoso laboral.","D":"No se detallan formas, se remite al Código Penal."},"c":"B"},{"id":621,"q":"¿Cuántos Objetivos Generales, clasificados como finalistas e instrumentales, se definen en la estructura del Plan de Salud Euskadi 2030?","o":{"A":"Cinco Objetivos Generales.","B":"Seis Objetivos Generales.","C":"Siete Objetivos Generales.","D":"Ocho Objetivos Generales."},"c":"C"},{"id":622,"q":"Según el Plan de Salud Euskadi 2030, la VISIÓN que se aspira a lograr como país es:","o":{"A":"Convertirnos en el sistema de salud pública más sólido y resiliente de Europa.","B":"Liderar una Euskadi más saludable.","C":"Reducir la morbimortalidad evitable y disminuir las desigualdades en salud antes de 2030.","D":"Lograr la sostenibilidad y excelencia en los sistemas asistenciales sanitarios y sociosanitarios."},"c":"B"},{"id":623,"q":"¿Cuál de los siguientes NO es un principio rector en los que se apoya el Plan de Salud Euskadi 2030?","o":{"A":"La necesaria coordinación y colaboración interinstitucional, entre agentes y en todos los niveles.","B":"Enfoque de Salud en Todas las Políticas y 'Una Sola Salud' ('One Health').","C":"La autosuficiencia presupuestaria del Sistema Sanitario Público.","D":"Contribución al Desarrollo Sostenible."},"c":"C"},{"id":624,"q":"El Objetivo General 1 (OG1) del Plan de Salud Euskadi 2030 se enfoca en:","o":{"A":"Promover la salud de las mujeres y la salud reproductiva en la edad adulta.","B":"Lograr que niñas, niños y adolescentes nazcan, crezcan y se desarrollen con todo su potencial de salud.","C":"Mejorar la salud mental y reducir la morbimortalidad asociada a trastornos mentales.","D":"La prevención y el control de las enfermedades no transmisibles (ENT)."},"c":"B"},{"id":625,"q":"El Objetivo General 4 (OG4) del Plan de Salud Euskadi 2030 se define como “lograr la sostenibilidad y excelencia en los sistemas asistenciales sanitarios y sociosanitarios de Euskadi”, ¿en términos de qué tres conceptos clave?","o":{"A":"Eficiencia, accesibilidad e innovación.","B":"Calidad, humanización y seguridad.","C":"Equidad, intersectorialidad y coordinación.","D":"Investigación, formación y evaluación."},"c":"B"},{"id":626,"q":"¿A qué hace referencia el acrónimo AVAD en el Plan de Salud Euskadi 2030?","o":{"A":"Áreas de Valoración de la Atención al Dependiente.","B":"Años de Vida Activa Desaprovechados.","C":"Atención Vasca a la Adicción a Drogas.","D":"Años de Vida sana perdidos Ajustados por Discapacidad."},"c":"D"},{"id":627,"q":"¿Cuál es uno de los objetivos clave del Plan de Salud Euskadi 2030, reiterado en varias secciones, respecto a la equidad y la gestión de la enfermedad?","o":{"A":"Garantizar la participación de la empresa privada en la gestión de servicios hospitalarios.","B":"Aumentar la esperanza de vida en 5 años en todos los colectivos sociales.","C":"Reducir la morbimortalidad evitable y disminuir las desigualdades en salud.","D":"Implementar un programa de cribado universal para todos los tipos de cáncer."},"c":"C"},{"id":628,"q":"¿Qué enfoque de investigación prioriza el Plan de Salud Euskadi 2030 para asegurar que los avances científicos lleguen de forma efectiva a la práctica clínica y la salud de la población?","o":{"A":"Enfoque de investigación básica y fundamental.","B":"Enfoque de investigación traslacional.","C":"Enfoque de investigación puramente epidemiológica.","D":"Enfoque de investigación competitiva internacional."},"c":"B"},{"id":629,"q":"Según el modelo de evaluación del Plan de Salud Euskadi 2030, ¿cuáles son los cuatro criterios fundamentales para determinar el éxito de las intervenciones?","o":{"A":"Impacto, cobertura, equidad y transparencia.","B":"Relevancia, efectividad, eficiencia y sostenibilidad.","C":"Rentabilidad, participación, innovación y prestigio.","D":"Calidad, calidez, rapidez y ahorro presupuestario."},"c":"B"},{"id":630,"q":"En la lucha contra las desigualdades, ¿qué tipo de soluciones habitacionales promueve el Plan de Salud Euskadi 2030 para las diferentes etapas de la vida?","o":{"A":"Construcción de viviendas de protección oficial exclusivamente rurales.","B":"Soluciones habitacionales asequibles, accesibles y adaptadas al ciclo vital.","C":"Ayudas directas al alquiler únicamente para personas menores de 30 años","D":"Fomento de grandes centros residenciales para todas las personas con enfermedades crónicas."},"c":"B"},{"id":631,"q":"Según la comparativa de la Memoria Económica del Plan de Salud Euskadi 2030, ¿cuál es el programa presupuestario (fuera del gasto general de Osakidetza) con mayor dotación?","o":{"A":"Programa de Salud Pública.","B":"Programa de Farmacia.","C":"Programa de Adicciones.","D":"Programa de Investigación y Planificación."},"c":"B"},{"id":632,"q":"El Plan de Salud Euskadi 2030 busca lograr \"comunidades amigables\" para las personas mayores. ¿Cuál es la finalidad última de esta estrategia?","o":{"A":"Segregar los espacios públicos por franjas de edad.","B":"Adaptar el entorno físico y social para fomentar un envejecimiento activo y con sentido.","C":"Aumentar el número de plazas en residencias geriátricas de alta especialización.","D":"Limitar el acceso de vehículos a las zonas cercanas a los centros de salud."},"c":"B"},{"id":633,"q":"En el ámbito de la salud digital, ¿qué concepto destaca el Plan de Salud Euskadi 2030 para transformar la atención personalizada?","o":{"A":"La teleasistencia robótica obligatoria en todos los domicilios.","B":"La medicina de precisión y la integración de datos genómicos.","C":"La eliminación definitiva de la historia clínica en papel en favor del PDF.","D":"La creación de una red social exclusiva para pacientes crónicos/as."},"c":"B"},{"id":634,"q":"¿Cómo define el Plan de Salud Euskadi 2030 el concepto de \"Intersectorialidad\" en la gestión de la salud?","o":{"A":"La competencia entre diferentes sectores para obtener fondos públicos.","B":"La colaboración entre departamentos del Gobierno para que la salud esté en todas las políticas.","C":"La privatización de sectores sanitarios no críticos.","D":"La creación de un único departamento que gestione salud, educación y vivienda."},"c":"B"},{"id":635,"q":"¿Cuál es la visión del Plan de Salud Euskadi 2030 sobre el uso de la evidencia científica en la toma de decisiones políticas?","o":{"A":"Es un elemento opcional supeditado a la oportunidad política.","B":"Es la base fundamental para el diseño, implementación y evaluación de las políticas de salud.","C":"Solo se debe aplicar en casos de alertas sanitarias internacionales.","D":"Se reserva exclusivamente para el ámbito académico, no para el legislativo."},"c":"B"},{"id":636,"q":"Según el análisis del contexto social del documento de Diagnóstico del Pacto Vasco de Salud de Euskadi, ¿qué factor se identifica como un motor clave para que la ciudadanía del siglo XXI demande un papel más activo en su salud?","o":{"A":"El incremento exclusivo de la esperanza de vida al nacer.","B":"El acceso generalizado a la información y un mayor nivel educativo en la CAPV.","C":"La reducción drástica de las listas de espera en consultas externas.","D":"La implementación de la receta electrónica en todas las farmacias."},"c":"B"},{"id":637,"q":"El documento de Diagnóstico del Pacto Vasco de Salud de Euskadi señala que los flujos migratorios actuales en Euskadi:","o":{"A":"No tienen impacto relevante en el perfil epidemiológico de la comunidad.","B":"Revelan patologías anteriormente poco conocidas en nuestro entorno, pero prevalentes en otras latitudes.","C":"Se limitan exclusivamente a personas en edad laboral con excelente estado de salud inicial.","D":"Han provocado la saturación irreversible de los servicios de urgencias hospitalarias."},"c":"B"},{"id":638,"q":"¿Cuál es uno de los principales desafíos identificados en el documento de Diagnóstico del Pacto Vasco de Salud de Euskadi respecto a la formación y relevo del personal sanitario?","o":{"A":"La excesiva oferta de plazas MIR en todas las especialidades médicas.","B":"La falta de interés de las nuevas generaciones por las profesiones biosanitarias.","C":"La necesidad de planificar el relevo ante la jubilación de cohortes numerosas de profesionales.","D":"La prohibición de la formación continua dentro del horario laboral."},"c":"C"},{"id":639,"q":"Sobre el impacto del cambio global y climático, el documento de Diagnóstico del Pacto Vasco de Salud de Euskadi advierte de la aparición de:","o":{"A":"Patologías ligadas exclusivamente al consumo de alimentos ultraprocesados.","B":"Nuevos vectores y virus anteriormente inexistentes en nuestro entorno, como el virus del Nilo.","C":"Una disminución natural de las enfermedades respiratorias debido al aumento de temperaturas.","D":"La erradicación total de las enfermedades infecciosas estacionales."},"c":"B"},{"id":640,"q":"El documento de Diagnóstico del Pacto Vasco de Salud de Euskadi propone que los indicadores sanitarios para evaluar el sistema deben:","o":{"A":"Basarse exclusivamente en mediciones de actividad (número de consultas y cirugías).","B":"Ser confidenciales y accesibles únicamente para la alta dirección del Departamento de Salud.","C":"Ignorar la perspectiva de género para simplificar la toma de datos estadísticos.","D":"Reflejar resultados en salud y sostenibilidad, y no solo volumen de actividad."},"c":"D"},{"id":641,"q":"¿Cuál es la finalidad principal de los Valores Fundamentales del Pacto Vasco de Salud, según el Libro de Valores y principios?","o":{"A":"Ser la base para la elaboración del futuro Plan Estratégico de Osakidetza.","B":"Establecer la estructura financiera y la autonomía de gestión del sistema de salud.","C":"Ser el fundamento ético y social que soporta la actividad del Sistema Público de Salud de Euskadi.","D":"Garantizar la cobertura universal únicamente a la ciudadanía vasca empadronada."},"c":"C"},{"id":642,"q":"¿Cuál de los siguientes es un Valor Fundamental explícito del Pacto Vasco de Salud, además de la Universalidad y la Equidad?","o":{"A":"La Sostenibilidad del sistema.","B":"La Eficiencia en el gasto.","C":"La Corresponsabilidad.","D":"El Plurilingüismo como eje central de la atención."},"c":"A"},{"id":643,"q":"El principio de Innovación en el Pacto Vasco de Salud se aplica a:","o":{"A":"Exclusivamente a la aplicación de nuevas tecnologías de imagen médica.","B":"La I+D+i en todas las fases y dimensiones de la salud, incluyendo la organizativa y la asistencial.","C":"La importación de modelos de éxito de otros sistemas sanitarios europeos.","D":"La digitalización de la historia clínica en Osakidetza."},"c":"B"},{"id":644,"q":"En el marco del Pacto Vasco de Salud, dentro de los principios rectores, la \"Orientación al Valor\" significa que el sistema debe priorizar:","o":{"A":"Las intervenciones que generen los mejores resultados relevantes para la persona al menor coste posible.","B":"El valor de mercado de las acciones de las empresas proveedoras de tecnología.","C":"El incremento constante de las infraestructuras físicas sobre la inversión en personal.","D":"La compra masiva de medicamentos de marca sobre los genéricos."},"c":"A"},{"id":645,"q":"¿En qué grandes ámbitos se estructuran las Líneas Estratégicas del Pacto Vasco de Salud?","o":{"A":"Cinco Líneas Estratégicas. prevención y promoción de la salud; atención a la enfermedad; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y Gobernanza.","B":"Seis Líneas Estratégicas: prevención y promoción de la salud; atención a la enfermedad; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y transparencia y participación ciudadana.","C":"Seis Líneas Estratégicas: prevención y promoción de la salud; atención a la enfermedad; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y gobernanza.","D":"Seis Líneas Estratégicas: prevención y promoción de la salud; atención sociosanitaria; áreas prioritarias de salud; calidad, innovación y sostenibilidad; desarrollo de las y los profesionales; y gobernanza."},"c":"C"},{"id":646,"q":"¿Cuál es el papel de la Atención Primaria y Comunitaria dentro de las Líneas Estratégicas del Pacto Vasco de Salud?","o":{"A":"Actuar como un servicio de triaje rápido para derivar todos los casos al hospital.","B":"Ser un servicio opcional para quienes no dispongan de seguro privado.","C":"Limitarse a la atención administrativa y la gestión de bajas laborales.","D":"Ser la base estratégica que cohesione y sustente todo el sistema de salud vasco."},"c":"D"},{"id":647,"q":"En relación con la Línea Estratégica 06 sobre \"Cronicidad\" del Pacto Vasco de Salud, ¿qué objetivo se persigue primordialmente?","o":{"A":"Institucionalizar a todas las personas con enfermedades crónicas en centros especializados.","B":"Reforzar la autonomía y corresponsabilidad de las personas con enfermedades crónicas.","C":"Sustituir las consultas médicas presenciales por seguimiento telefónico automático.","D":"Reducir la cobertura de medicamentos para patologías de larga duración."},"c":"B"},{"id":648,"q":"La Línea Estratégica 07 sobre \"Atención Sociosanitaria\" del Pacto Vasco de Salud subraya la necesidad de:","o":{"A":"Separar definitivamente las competencias de Salud de las de Servicios Sociales.","B":"Mejorar la coordinación y el tránsito de las personas entre el sistema sanitario y el social.","C":"Eliminar las ayudas a la dependencia para fomentar el ahorro público.","D":"Obligar a las personas pacientes a elegir entre atención médica o apoyo social."},"c":"B"},{"id":649,"q":"Respecto a la \"Salud Mental\" (Línea 11), el Pacto Vasco de Salud pone el foco en:","o":{"A":"La promoción del bienestar emocional y la detección precoz, especialmente en jóvenes.","B":"El aislamiento preventivo de las personas con trastornos mentales graves.","C":"La medicalización sistemática de cualquier malestar emocional de la ciudadanía.","D":"La reducción de la plantilla de psicología en los centros de salud primaria."},"c":"A"},{"id":650,"q":"La Línea Estratégica 18 sobre \"Digitalización en Salud\" del Pacto Vasco de Salud busca la transformación digital para:","o":{"A":"Reemplazar al personal sanitario por sistemas de inteligencia artificial autónomos.","B":"Eliminar el papel de todos los archivos históricos sin digitalizar previamente.","C":"Facilitar la accesibilidad, la personalización de la atención y la eficiencia organizativa.","D":"Crear una base de datos pública con el historial clínico de toda la ciudadanía."},"c":"C"},{"id":651,"q":"¿Cuál es el Objetivo General establecido para la “Estrategia de Seguridad del Paciente 20 -30”?","o":{"A":"Reducir a cero los eventos adversos mediante la incorporación de tecnología robótica.","B":"Mejorar la calidad asistencial del sistema sanitario vasco.","C":"Promover el máximo nivel de seguridad posible, minimizando la probabilidad de ocurrencia de incidentes de seguridad en el transcurso de la asistencia sanitaria.","D":"Centralizar la gestión de riesgos en un único organismo fuera de Osakidetza."},"c":"C"},{"id":652,"q":"El principio hipocrático al que se hace referencia en la “Estrategia de Seguridad del Paciente 20 -30”, y que la ciudadanía asume que se verifica en el transcurso de la actividad asistencial, es:","o":{"A":"Salus populi suprema lex esto (l a salud del pueblo es la ley suprema).","B":"Corpus sanum in mente sana (m ente sana en cuerpo sano).","C":"Lex artis ad hoc (l ey del arte para el caso).","D":"Primum non nocere (p rimero no hacer daño)."},"c":"D"},{"id":653,"q":"¿Cuáles son las dos nuevas Líneas de Acción incorporadas en la “Estrategia de Seguridad del Paciente 20 -30” que responden a una necesidad percibida por las personas expertas?","o":{"A":"Seguridad en Pediatría y Buenas Prácticas en el Uso de Biológicos.","B":"Atención en Cuidados Paliativos y Seguridad Domiciliaria.","C":"La Seguridad de Paciente en Emergencias y la Prevención del Suicidio.","D":"Seguridad en Salud Mental y Prevención de las Úlceras por Presión."},"c":"C"},{"id":654,"q":"De acuerdo con la “Estrategia de Seguridad del Paciente 20 -30”, ¿cómo se denomina al incidente de seguridad que, a diferencia del incidente sin daño, sí ocasiona algún tipo de daño a las personas atendidas?","o":{"A":"Error no evitable.","B":"Circunstancia notificable.","C":"Fallo latente.","D":"Evento Adverso."},"c":"D"},{"id":655,"q":"¿Cuál es el enfoque principal de la Línea de Acción Corporativa L2 de la “Estrategia de Seguridad del Paciente 20 -30”?","o":{"A":"Implicación de pacientes en su seguridad.","B":"Conciliación de la medicación.","C":"Atención a las segundas y terceras víctimas.","D":"Gestión de los incidentes de seguridad."},"c":"C"},{"id":656,"q":"¿Cuál de los siguientes es el Objetivo Específico número 1 de la “Estrategia de Seguridad del Paciente 20 -30”, enfocado en el cambio interno?","o":{"A":"Garantizar la continuidad de las líneas de acción y proyectos previamente implantados.","B":"Impulsar la cultura de seguridad de p aciente en las organizaciones de servicios de Osakidetza, promoviendo la formación y sensibilización como aspectos clave.","C":"Optimizar la prescripción de pruebas diagnósticas que utilizan radiación ionizante.","D":"Implantar un sistema de identificación inequívoca de pacientes en todas las fases del proceso asistencial."},"c":"B"},{"id":657,"q":"La Línea de Acción Corporativa L8 de la “Estrategia de Seguridad del Paciente 20 -30” está dedicada a:","o":{"A":"Conciliación de la medicación.","B":"Prevención y control de las infecciones relacionadas con la asistencia sanitaria.","C":"Seguridad en el proceso asistencial gestación -parto -puerperio.","D":"Seguridad transfusional."},"c":"B"},{"id":658,"q":"¿Qué documento se menciona en la “Estrategia de Seguridad del Paciente 20 - 30” como el que determinó que las personas atendidas por un sistema medicalizado (tipo 061/112) presentan un mayor porcentaje de incidentes de seguridad en el entorno de Emergencias?","o":{"A":"Estudio Nacional de Efectos Adversos en centros hospitalarios (ENEAS).","B":"Estudio APEAS.","C":"Estudio EVADUR.","D":"Informe del Instituto de Medicina de los Estados Unidos (IOM)."},"c":"C"},{"id":659,"q":"El capítulo de Formación de la “Estrategia de Seguridad del Paciente 20 -30” señala que, además de impulsar el desarrollo de prácticas seguras, las organizaciones comprometidas orientan sus esfuerzos a aumentar la formación en los llamados:","o":{"A":"Factores humanos o factores no técnicos.","B":"Factores biomédicos y patofisiológicos.","C":"Factores económicos y de sostenibilidad.","D":"Factores organizativos de Osakidetza."},"c":"A"},{"id":660,"q":"¿Cuál de las siguientes Líneas de Acción de la “Estrategia de Seguridad del Paciente 20 -30” NO está relacionada con el sistema de utilización del medicamento?","o":{"A":"L5. Conciliación de la medicación.","B":"L14. Buenas prácticas asociadas a la utilización de medicación.","C":"L6. Optimización en la prescripción de pruebas diagnósticas que utilizan radiación ionizante.","D":"L7. Seguridad transfusional (Nota: la seguridad transfusional se considera una línea separada, aunque implica la administración de productos sanguíneos)."},"c":"C"},{"id":661,"q":"Según el diagnóstico del II Plan para la Igualdad de Mujeres y Hombres en Osakidetza, ¿qué porcentaje de mujeres y hombres, respectivamente, componía la plantilla total de Osakidetza en enero de 2025?","o":{"A":"60% mujeres y 40% hombres","B":"75% mujeres y 25% hombres","C":"80% mujeres y 20% hombres","D":"90% mujeres y 10% hombres"},"c":"C"},{"id":662,"q":"Una de las metas del II Plan para la Igualdad de Mujeres y Hombres en Osakidetza es la “CAPACITACIÓN EN IGUALDAD”. ¿Cuál es su objetivo principal?","o":{"A":"Reducir la brecha de género en investigación en un 4%.","B":"Conseguir que todas las personas trabajadoras de Osakidetza conozcan el Plan y el Protocolo de Acoso.","C":"Reducir a la mitad las categorías con brecha retributiva superior al 5%.","D":"Garantizar la formación básica, progresiva, permanente y obligatoria de todo el personal de Osakidetza."},"c":"D"},{"id":663,"q":"¿Qué institución aprueba el II Plan para la Igualdad de Mujeres y Hombres en Osakidetza (2025 -2028)?","o":{"A":"Mesa Sectorial de Sanidad.","B":"Emakunde.","C":"Consejo de Administración de Osakidetza.","D":"Dirección General de Osakidetza."},"c":"C"},{"id":664,"q":"De acuerdo con el II Plan para la Igualdad de Mujeres y Hombres en Osakidetza (2025 -2028), ¿qué concepto define, dentro del diagnóstico de la organización, la dificultad invisible que encuentran las mujeres para acceder a puestos de mayor responsabilidad y toma de decisiones?","o":{"A":"Segregación horizontal.","B":"Suelo pegajoso.","C":"Brecha salarial técnica","D":"Techo de cristal."},"c":"D"},{"id":665,"q":"Una de las Metas del II Plan para la Igualdad de Mujeres y Hombres en Osakidetza (2025 -2028) es “CORRESPONSABILIDAD”. ¿Cuál es el objetivo específico asociado a esta meta?","o":{"A":"Reducir el porcentaje de hombres en puestos de dirección.","B":"Reducir a la mitad la brecha de género en investigación.","C":"Reducir, al menos, en un 2% la brecha de género existente en las medidas de conciliación para cuidados.","D":"Aumentar el número de investigaciones con perspectiva de género interseccional en un 4%."},"c":"C"},{"id":666,"q":"¿Cuál fue el objetivo del I Plan de Igualdad, teniendo en cuenta su condición de primer plan estratégico de Osakidetza en esta materia?","o":{"A":"Consolidar los avances logrados y profundizar el proceso transformador.","B":"Establecer unos cimientos sólidos para garantizar el cumplimiento de la legislación y la alineación a los marcos estratégicos.","C":"Reducir la brecha salarial a la mitad en todas las categorías profesionales.","D":"Lograr la aprobación por parte del Consejo de Dirección de Osakidetza en julio de 2025."},"c":"B"},{"id":667,"q":"¿Cuál es la Meta 5 establecida en el II Plan para la Igualdad de Mujeres y Hombres en Osakidetza (2025 -2028)?","o":{"A":"Reducir la brecha de género existente en las medidas de conciliación para cuidados.","B":"Capacitación en Igualdad, garantizando la formación progresiva del personal.","C":"Igualdad Salarial, con el objetivo de reducir a la mitad las categorías que tienen una brecha retributiva > 5%.","D":"Investigación, aumentando el número de investigaciones con perspectiva de género."},"c":"C"},{"id":668,"q":"En relación con la violencia machista contra las mujeres, el Plan II Plan para la Igualdad de Mujeres y Hombres en Osakidetza (2025 -2028) establece como línea de actuación prioritaria:","o":{"A":"El refuerzo de la prevención, la detección precoz y la mejora de la respuesta asistencial integrada desde el sistema de salud.","B":"La derivación inmediata de cualquier caso detectado a servicios jurídicos externos, sin intervención del personal sanitario.","C":"La creación de un registro anónimo donde las personas profesionales puedan denunciar conductas sin seguimiento posterior.","D":"La limitación de la atención asistencial únicamente a las consecuencias físicas derivadas de la violencia."},"c":"A"},{"id":669,"q":"El III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028 establece respecto a los mensajes audiovisuales que:","o":{"A":"Deben emitirse en la lengua que decidan las personas responsable de las unidades que utilizan estos sistemas audiovisuales.","B":"Deben emitirse en las dos lenguas oficiales, primero en castellano y luego en euskera.","C":"Deben emitirse en las dos lenguas oficiales, primero en euskera y luego en castellano.","D":"Deben emitirse en una de las dos lenguas oficiales."},"c":"C"},{"id":670,"q":"De acuerdo con el III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028, señale la respuesta correcta:","o":{"A":"Por aplicación de la Ley Orgánica de Protección de Datos Personales y garantía de los derechos digitales no puede constar en los datos personales de cada paciente de Osakidetza su idioma de preferencia para las comunicaciones con Osakidetza.","B":"El signo azul con la letra e indica que la persona paciente no tiene competencia para comunicarse en un idioma que no sea el euskera para las comunicaciones orales con Osakidetza.","C":"En los datos personales de cada paciente, se registrará su idioma de preferencia para las comunicaciones orales con Osakidetza .","D":"A las personas que elijan el euskera como lengua prioritaria en sus comunicaciones con Osakidetza solo se les deberá ofrecer servicios en euskera."},"c":"C"},{"id":671,"q":"En atención al III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028, señale la respuesta correcta:","o":{"A":"“Aukeratu zeure hizkuntza/Elige tu lengua” es el lema de la campaña de activación del registro de la lengua preferente de cada paciente llevada a cabo en 2017.","B":"Se atribuye a todas las direcciones y gerencias de Osakidetza la responsabilidad de realizar la campaña con el lema “Aukeratu zeure hizkuntza/Elige tu lengua”.","C":"“Aukeratu zeure hizkuntza/Elige tu lengua” es el lema de la campaña de activación del registro de la lengua preferente de cada paciente que realizará Osakidetza durante el primer año de planificación.","D":"“Aukeratu zeure hizkuntza/Elige tu lengua” es el lema de la campaña de activación del registro de la lengua preferente de cada paciente que realizará Osakidetza durante el tercer año de planificación."},"c":"C"},{"id":672,"q":"El III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028 contempla que tanto en los servicios de recepción y admisión, como en las unidades asistenciales y administrativas a toda la ciudadanía vascohablante debe garantizarse:","o":{"A":"La recepción en euskera.","B":"La recepción en euskera solo cuando la comunicación oral con pacientes y personas usuarias sea de modo presencial.","C":"La recepción en euskera solo cuando la comunicación con pacientes y personas usuarias sea telefónicamente.","D":"La recepción en euskera solo por las y los empleados que sepan en euskera."},"c":"A"},{"id":673,"q":"El III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028 establece que, en los escritos individualizados de respuesta a solicitudes y reclamaciones de pacientes o personas usuarias de Osakidetza se utilizará:","o":{"A":"La lengua utilizada por cada ciudadano o ciudadana.","B":"Siempre el euskera como lengua preferente.","C":"Siempre las dos lenguas oficiales independientemente de la lengua utilizada por cada ciudadano o ciudadana.","D":"Ambas lenguas oficiales, siendo los escritos contestados primero en euskera y luego en castellano."},"c":"A"},{"id":674,"q":"Siguiendo lo previsto en el III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028, señale la respuesta que no es correcta:","o":{"A":"Se pondrá a disposición del personal bilingüe que lo desee diferentes elementos identificativos portadores del circulo azul con la letra e, signo que invita a relacionarse en euskera.","B":"El signo azul y la letra e solo se utilizará para la identificación individual del personal bilingüe.","C":"En los centros de salud, consultorios y unidades hospitalarias, deberá estar colocado, de modo visible, el cartel que explica a las personas usuarias el significado del signo identificativo con la letra e.","D":"Se estudiará introducir una variante del círculo azul con la letra e para el personal dispuesto a que le hablen en euskera pero que muestra dificultades para expresarse en ciertas situaciones."},"c":"B"},{"id":675,"q":"En atención a lo previsto en el III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028, en todos los centros de atención primaria ha de ponerse en marcha un procedimiento para que, en la medida de las posibilidades, se propongan servicios en euskera a las personas pacientes que hayan registrado esta lengua como preferente y que aún reciban los citados servicios en castellano. Señale a qué servicios se refiere el citado Plan:","o":{"A":"Medicina familiar, pediatría, enfermería y salud mental.","B":"Pediatría, medicina familiar y salud mental.","C":"Medicina familiar, pediatría, enfermería y matrona.","D":"Todas las anteriores respuestas son correctas."},"c":"C"},{"id":676,"q":"Conforme al III Plan de Normalización del Uso del Euskera en Osakidetza 2022 -2028:","o":{"A":"En los casos de los mensajes SMS que se envían a los teléfonos móviles de personas trabajadoras o candidatas, estarán escritos en las dos lenguas oficiales, primero en castellano y luego en euskera.","B":"Los escritos individualizados de respuesta a solicitudes y reclamaciones de las personas trabajadoras deberán redactarse en las dos lenguas oficiales.","C":"Osakidetza ha de garantizar que la información y los servicios ofrecidos tanto al personal empleado como a personas candidatas a través de las tecnologías de la comunicación estén en las dos lenguas oficiales, con el fin de que cada persona haga uso de la lengua de su preferencia.","D":"Las informaciones y comunicaciones no personalizadas dirigidas al personal deberán redactarse en las dos lenguas oficiales y se dará prioridad al castellano."},"c":"C"},{"id":677,"q":"Según el Resumen Ejecutivo del Plan Oncológico Integral de Euskadi (POIE) 2025 -2030, ¿de qué porcentaje de los fallecimientos en Euskadi fue responsable el cáncer en el año 2023?","o":{"A":"22,3%","B":"Menos del 15%","C":"33,8%","D":"0.28"},"c":"D"},{"id":678,"q":"Según el Resumen Ejecutivo del Plan Oncológico Integral de Euskadi (POIE) 2025 -2030, ¿cuáles fueron las dos localizaciones de cáncer más frecuentes en Euskadi en el periodo 2015 -2019, consideradas separadamente por sexo?","o":{"A":"Cáncer colorrectal y cáncer de pulmón.","B":"Cáncer de mama en mujeres y cáncer de próstata en hombres.","C":"Cáncer de páncreas y cáncer de pulmón.","D":"Leucemia y Linfoma de Hodgkin."},"c":"B"},{"id":679,"q":"¿Cuál de las siguientes es una de las aspiraciones definidas en la VISIÓN del Plan Oncológico Integral de Euskadi (POIE) 2025 -2030?","o":{"A":"Mejorar la calidad de vida de las personas: de pacientes, supervivientes y de sus familiares y personas cuidadoras.","B":"Aumentar la cuota de mercado de Osakidetza en el sector oncológico privado.","C":"Garantizar la presencia equilibrada de ambos sexos en los órganos de gestión sanitaria.","D":"Establecer la telemedicina como la única forma de seguimiento oncológico."},"c":"A"},{"id":680,"q":"La Misión del Plan Oncológico Integral de Euskadi (POIE) 2025 -2030 busca generar valor a la ciudadanía vasca en términos de:","o":{"A":"Mayor financiación externa para I+D.","B":"Menores listas de espera y más personal asistencial.","C":"Mejores resultados en salud.","D":"Una mayor supervivencia a los 10 años en todos los tumores."},"c":"C"},{"id":681,"q":"En el Plan Oncológico Integral de Euskadi (POIE) 2025 -2030, la “Centralidad de la persona y humanización” como Principio Rector incluye la incorporación de la perspectiva de género y la atención a:","o":{"A":"La telemonitorización avanzada.","B":"La diversidad.","C":"El personal profesional no implicado directamente.","D":"Las redes sociales."},"c":"B"},{"id":682,"q":"Teniendo en cuenta la introducción y el contexto del Plan Oncológico Integral de Euskadi 2025 -2030. ¿Cuál fue una de las principales áreas de mejora identificadas en la evaluación del Plan Oncológico de Euskadi (POE) 2018 - 2023?","o":{"A":"La excesiva visibilidad del plan entre profesionales sin implicación.","B":"La necesidad de aumentar el número de Comités de Tumores.","C":"La necesidad de reforzar la atención a colectivos específicos (infancia, mayores, personas largas supervivientes).","D":"La ausencia total de un modelo asistencial común."},"c":"C"},{"id":683,"q":"Según el listado de acrónimos del Plan Oncológico Integral de Euskadi (POIE) 2025 -2030, ¿a qué hacen referencia las siglas PROMs?","o":{"A":"Plan de Resultados Oncológicos y Metodología de Seguimiento.","B":"Plan de Riesgos Ocupacionales en Medicina Sanitaria.","C":"Programa de Rehabilitación Oncológica y Mejora de la Supervivencia.","D":"Medidas de Resultados Reportadas por los y las Pacientes."},"c":"D"},{"id":684,"q":"El Plan Oncológico Integral de Euskadi (POIE) 2025 -2030 se alinea con el Plan de Salud de Euskadi 2030. ¿Cuál de las siguientes es una de las prioridades estratégicas de dicho Plan de Salud mencionadas en el documento?","o":{"A":"Creación de una red de servicios privados de salud.","B":"Aumentar la esperanza de vida a 90 años.","C":"Reducir la morbimortalidad evitable y disminuir las desigualdades en salud","D":"Eliminación total del cáncer infantil antes de 2030."},"c":"C"},{"id":685,"q":"¿Cuál es el objeto fundamental de la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, según su Artículo 1?","o":{"A":"Regular los cuidados paliativos avanzados en el Sistema Nacional de Salud.","B":"Modificar el Código Penal para despenalizar la asistencia al suicidio.","C":"Regular el derecho de toda persona a solicitar y recibir la prestación de ayuda para morir y la obligación de las Administraciones de garantizarla.","D":"Establecer el registro de las voluntades anticipadas y testamentos vitales."},"c":"C"},{"id":686,"q":"Conforme al Artículo 5 de la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿qué requisito de nacionalidad se exige para poder recibir la prestación de ayuda para morir?","o":{"A":"Tener la ciudadanía española con residencia legal ininterrumpida de al menos 10 años.","B":"Tener la nacionalidad española o tener residencia legal en España de al menos 5 años.","C":"Ser mayor de edad y tener la nacionalidad española, residencia legal o certificado de empadronamiento que acredite un tiempo de permanencia superior a 12 meses en territorio español.","D":"Tener la nacionalidad española y residencia en el mismo municipio durante los últimos 2 años."},"c":"C"},{"id":687,"q":"Según la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿qué concepto define la ley como la \"administración directa a la persona paciente de una sustancia por parte del personal sanitario competente\"?","o":{"A":"Suicidio médicamente asistido.","B":"Sedación paliativa profunda.","C":"Eutanasia.","D":"Asistencia para morir."},"c":"D"},{"id":688,"q":"Según el Artículo 5 de la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿cuál es la condición que debe padecer la persona paciente para solicitar la prestación de ayuda para morir?","o":{"A":"Padecer una enfermedad incurable en fase terminal o un deterioro funcional grave.","B":"Sufrir una enfermedad que limite gravemente su autonomía.","C":"Padecer una enfermedad grave e incurable o un padecimiento grave, crónico e imposibilitante, causantes de un sufrimiento intolerable.","D":"Sufrir un dolor físico o psíquico que no puede ser tratado con paliativos."},"c":"C"},{"id":689,"q":"Según la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿cuál debe ser la periodicidad mínima con la que el personal facultativo responsable debe consultar a la persona paciente, una vez presentada la solicitud, para confirmar si manti ene su deseo?","o":{"A":"Al menos cada 7 días.","B":"Al menos cada 15 días, debiendo dejarse constancia en la historia clínica.","C":"Al menos cada 30 días, si el procedimiento se extiende.","D":"Una única vez antes de la prestación."},"c":"B"},{"id":690,"q":"Según la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿cuál es el derecho que asiste al personal sanitario directamente implicado en la prestación de ayuda para morir?","o":{"A":"Derecho a la reubicación en un puesto de trabajo diferente.","B":"Derecho a un incremento salarial por la complejidad de la prestación.","C":"Derecho a la objeción de conciencia.","D":"Derecho a recibir asistencia jurídica de oficio."},"c":"C"},{"id":691,"q":"Según la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿qué define como \"padecimiento grave, crónico e imposibilitante\"?","o":{"A":"Aquel que implica la existencia de sufrimiento físico o psíquico constante.","B":"Aquel que genera una limitación que incide directamente sobre la autonomía física y capacidad de expresar su voluntad de la persona paciente.","C":"La dependencia de otra persona para la realización de al menos dos actividades básicas de la vida diaria.","D":"Una dolencia que ha sido declarada irreversible y con un pronóstico de vida inferior a seis meses."},"c":"B"},{"id":692,"q":"Según la Ley Orgánica 3/2021, de 24 de marzo, de regulación de la eutanasia, ¿cuál es el plazo que tiene la persona facultativa responsable para comunicar la resolución favorable a la Comisión de Garantía y Evaluación para su posterior verificación?","o":{"A":"Dentro de las 24 horas siguientes a la resolución.","B":"Dentro del día siguiente natural a la resolución.","C":"7 días desde la resolución favorable.","D":"No existe un plazo establecido para esta comunicación."},"c":"D"},{"id":693,"q":"¿Cuál es el principio general que establece la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas?","o":{"A":"La libre acumulación de empleos públicos.","B":"La incompatibilidad para desempeñar más de un puesto en el sector público, salvo excepciones.","C":"La compatibilidad automática entre empleo público y privado.","D":"La compatibilidad solo en el ámbito sanitario."},"c":"B"},{"id":694,"q":"Con carácter general, el personal comprendido en la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, podrá desempeñar:","o":{"A":"Dos puestos públicos si uno es a tiempo parcial.","B":"Un segundo puesto público únicamente con autorización previa y en los supuestos previstos por la Ley.","C":"Cualquier actividad privada sin limitación.","D":"Dos puestos públicos si pertenecen a distinta Administración."},"c":"B"},{"id":695,"q":"Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿qué requisito es imprescindible para autorizar la compatibilidad con una actividad privada?","o":{"A":"Que la actividad sea sanitaria.","B":"Que no se supere la jornada ordinaria establecida.","C":"Que no se comprometa la imparcialidad o independencia del personal público.","D":"Que lo autorice la jefatura inmediata sin más trámites."},"c":"C"},{"id":696,"q":"Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿puede percibirse más de una remuneración con cargo a los presupuestos públicos?","o":{"A":"Sí, siempre que no superen el salario mínimo.","B":"No, salvo en los casos expresamente previstos en la Ley.","C":"Sí, sin limitación alguna.","D":"Solo si se trata de diferentes Administraciones autonómicas."},"c":"B"},{"id":697,"q":"Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿qué ocurre si se desempeña una actividad incompatible sin autorización?","o":{"A":"No ocurre nada si es fuera del horario laboral.","B":"Se considera falta leve.","C":"Puede dar lugar a responsabilidad disciplinaria.","D":"Solo se devuelve la remuneración percibida."},"c":"C"},{"id":698,"q":"Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, ¿qué actividades están exceptuadas del régimen general de incompatibilidades?","o":{"A":"Las actividades docentes o de investigación en determinados supuestos.","B":"Cualquier actividad privada.","C":"Solo actividades artísticas.","D":"Actividades comerciales propias sin límite."},"c":"A"},{"id":699,"q":"Según la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, para que se autorice la compatibilidad para un segundo puesto público es necesario que:","o":{"A":"Sea en el mismo centro de trabajo.","B":"Sea la jornada completa.","C":"Sea en los supuestos tasados y no se modifique la jornada y horario del puesto principal.","D":"Lo apruebe el personal trabajador del servicio."},"c":"C"},{"id":700,"q":"La finalidad principal de la Ley 53/1984, de 26 de diciembre, de Incompatibilidades del personal al servicio de las Administraciones Públicas, es:","o":{"A":"Incrementar los ingresos del personal público.","B":"Garantizar la dedicación y la imparcialidad en el servicio público.","C":"Permitir la pluriactividad generalizada.","D":"Reducir el número de personal público."},"c":"B"}];

// ── STATE ──
const S = { mode:'all', queue:[], idx:0, answered:false, shuffle:false };
let banTimer = null;

// ── DB ──
const KEY = 'matronit_v1';
let db = (() => { try { const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); } catch(e){} return {hist:[],qs:{},streak:0,maxStreak:0,todayN:0,todayDate:null,_today:null}; })();
const save = () => { try { localStorage.setItem(KEY,JSON.stringify(db)); } catch(e){} };
const dstr = () => new Date().toISOString().slice(0,10);

function ensureDay(){
  const t=dstr();
  if(db.todayDate!==t){
    if(db.todayDate&&db._today) db.hist.push({date:db.todayDate,...db._today});
    db.todayDate=t; db._today={ok:0,err:0,skip:0}; db.todayN=0;
  }
  if(!db._today) db._today={ok:0,err:0,skip:0};
}

function record(id,ok){
  ensureDay();
  if(!db.qs[id]) db.qs[id]={ok:0,err:0};
  if(ok){ db.qs[id].ok++; db._today.ok++; db.streak++; db.maxStreak=Math.max(db.maxStreak,db.streak); }
  else   { db.qs[id].err++; db._today.err++; db.streak=0; hideBanner(); }
  db.todayN++; save(); refreshHeader();
  if(ok && db.streak===3) showBanner(3);
  else if(ok && db.streak>3 && db.streak%5===0) showBanner(db.streak);
}
function recordSkip(id){
  ensureDay(); db._today.skip++; db.streak=0; db.todayN++; save(); refreshHeader(); hideBanner();
}

// ── THEME ──
function applyTheme(){
  const dark=document.getElementById('tgl-dark').checked;
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  localStorage.setItem('matronit_theme',dark?'dark':'light');
}
function initTheme(){
  const t=localStorage.getItem('matronit_theme')||'light';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('tgl-dark').checked=t==='dark';
}

// ── VIEW ──
function switchView(v,btn){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(v==='analytics') renderAnalytics();
}

// ── MODE ──
function setMode(m,btn){
  S.mode=m;
  document.querySelectorAll('.mbt').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('goto-row').style.display=m==='all'?'flex':'none';
  buildQueue(); loadCard();
}

function buildQueue(){
  let pool;
  if(S.mode==='wrong'){
    pool=Q.filter(q=>{ const s=db.qs[q.id]; return s&&s.err>0; });
    if(!pool.length){ pool=Q; showToast('Sin errores aún, mostrando todas'); }
  } else if(S.mode==='rand'){
    pool=[...Q].sort(()=>Math.random()-.5).slice(0,30);
  } else {
    const hard=Q.filter(q=>{ const s=db.qs[q.id]; if(!s) return false; const t=s.ok+s.err; return t>=2&&s.err/t>=.5; });
    const rest=Q.filter(q=>!hard.includes(q));
    pool=[...hard,...rest];
  }
  S.queue=pool; S.idx=0; refreshProg();
}

// ── CARD ──
function loadCard(){
  const q=S.queue[S.idx];
  if(!q){
    document.getElementById('qtxt').textContent='¡Completado! 🎉';
    document.getElementById('opts').innerHTML='';
    return;
  }
  S.answered=false;
  document.getElementById('card').classList.remove('flip');
  document.getElementById('bnext').style.display='none';
  const back=document.getElementById('back');
  back.className='face back';

  const s=db.qs[q.id];
  const hard=document.getElementById('qhard');
  if(s){ const t=s.ok+s.err; hard.style.display=t>=2&&s.err/t>=.5?'inline-flex':'none'; }
  else hard.style.display='none';

  document.getElementById('qnum').textContent=`Pregunta ${q.id} · ${Q.length} totales`;
  document.getElementById('qtxt').textContent=q.q;

  // Build options
  let entries=Object.entries(q.o);
  const origCorrect=q.c.split('/').map(x=>x.trim());
  const letters=['A','B','C','D'];
  if(S.shuffle) entries=[...entries].sort(()=>Math.random()-.5);
  const n2o={};
  entries.forEach(([ol],i)=>{ n2o[letters[i]]=ol; });
  const correct=letters.slice(0,entries.length).filter(nl=>origCorrect.includes(n2o[nl]));

  const container=document.getElementById('opts');
  container.innerHTML='';
  container.classList.add('su');
  setTimeout(()=>container.classList.remove('su'),300);
  entries.forEach(([ol,txt],i)=>{
    const nl=letters[i];
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=`<span class="opt-l">${nl}</span><span>${txt}</span>`;
    b.onclick=()=>choose(nl,correct,q.id,n2o);
    container.appendChild(b);
  });
  refreshProg();
}

function choose(chosen,correct,id,n2o){
  if(S.answered) return;
  S.answered=true;
  const ok=correct.includes(chosen);
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const l=b.querySelector('.opt-l').textContent;
    if(correct.includes(l)) b.classList.add('ok-opt');
    if(l===chosen&&!ok) b.classList.add('err-opt');
  });
  const back=document.getElementById('back');
  document.getElementById('rico').textContent=ok?'✓':'✗';
  const rl=document.getElementById('rlbl');
  rl.className='r-lbl '+(ok?'ok':'err');
  rl.textContent=ok?'¡Correcto!':'Incorrecto';
  if(ok){ document.getElementById('rans').textContent=''; }
  else {
    const ct=correct.map(nl=>`${nl}: ${S.queue[S.idx].o[n2o[nl]]||''}`).join(' / ');
    document.getElementById('rans').innerHTML=`Correcta: <strong>${ct}</strong>`;
  }
  back.classList.add(ok?'ok':'err');

  // Sync back height
  const front=document.getElementById('front');
  back.style.minHeight=front.offsetHeight+'px';

  setTimeout(()=>document.getElementById('card').classList.add('flip'),160);
  record(id,ok);
  document.getElementById('bnext').style.display='block';
  if(ok){ const p=document.getElementById('p-streak'); p.classList.add('do-pop'); setTimeout(()=>p.classList.remove('do-pop'),350); }
}

function next(){ S.idx++; if(S.idx>=S.queue.length){ if(S.mode==='all') S.idx=0; else buildQueue(); } loadCard(); }
function skip(){ const q=S.queue[S.idx]; if(q&&!S.answered) recordSkip(q.id); next(); }

// ── GOTO ──
function goTo(){
  const n=parseInt(document.getElementById('goto-in').value);
  if(isNaN(n)||n<1||n>Q.length){ showToast('Número inválido (1–'+Q.length+')'); return; }
  const i=S.queue.findIndex(q=>q.id===n);
  if(i===-1){ showToast('Pregunta '+n+' no disponible'); return; }
  S.idx=i; loadCard();
  document.getElementById('goto-in').value='';
}

// ── BANNER ──
function showBanner(n){
  document.getElementById('ban-n').textContent=n;
  document.getElementById('banner').classList.add('on');
  spawnConf();
  clearTimeout(banTimer);
  banTimer=setTimeout(hideBanner,5000);
}
function hideBanner(){ document.getElementById('banner').classList.remove('on'); clearTimeout(banTimer); }

// ── CONFETTI ──
function spawnConf(){
  const c=document.getElementById('conf'); c.innerHTML='';
  const colors=['#a47de8','#4ea86a','#e8a03a','#e06060','#60a8e0','#f0ece3'];
  for(let i=0;i<36;i++){
    const el=document.createElement('div'); el.className='conf-p';
    el.style.cssText=`left:${Math.random()*100}%;background:${colors[~~(Math.random()*colors.length)]};width:${6+Math.random()*6}px;height:${6+Math.random()*6}px;border-radius:${Math.random()>.5?'50%':'2px'};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.7}s`;
    c.appendChild(el);
  }
  setTimeout(()=>c.innerHTML='',4000);
}

// ── HEADER ──
function refreshHeader(){
  ensureDay();
  document.getElementById('s-streak').textContent=db.streak;
  document.getElementById('s-today').textContent=db.todayN;
  const p=document.getElementById('p-streak');
  db.streak>=3?p.classList.add('hot'):p.classList.remove('hot');
  const all=Object.values(db.qs);
  const tot=all.reduce((s,x)=>s+x.ok+x.err,0);
  const ok=all.reduce((s,x)=>s+x.ok,0);
  document.getElementById('s-acc').textContent=tot>0?Math.round(ok/tot*100)+'%':'—';
}

function refreshProg(){
  const t=S.queue.length, pct=t?Math.round(S.idx/t*100):0;
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('plbl').textContent=`${S.idx}/${t}`;
  document.getElementById('qinfo').textContent=
    S.mode==='wrong'?`${t} con errores`:S.mode==='rand'?'30 aleatorias':`${t} preguntas`;
}

// ── TOAST ──
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2600);
}

// ── ANALYTICS ──
function renderAnalytics(){
  ensureDay();
  const all=Object.entries(db.qs);
  const totAns=all.reduce((s,[,x])=>s+x.ok+x.err,0);
  const totOk=all.reduce((s,[,x])=>s+x.ok,0);
  const totErr=all.reduce((s,[,x])=>s+x.err,0);
  const uniq=all.length;
  const acc=totAns?Math.round(totOk/totAns*100):0;
  document.getElementById('an-sub').textContent=`${uniq} preguntas practicadas`;
  document.getElementById('mgrid').innerHTML=[
    {l:'Total respuestas',v:totAns,s:'desde el inicio'},
    {l:'Precisión',v:acc+'%',s:`${totOk} correctas`},
    {l:'Racha máxima',v:db.maxStreak,s:'seguidas'},
    {l:'Hoy',v:db.todayN,s:'respuestas'},
    {l:'Vistas',v:uniq,s:`de ${Q.length}`},
    {l:'Fallos',v:totErr,s:'para repasar'},
  ].map(m=>`<div class="mcard"><div class="m-lbl">${m.l}</div><div class="m-val">${m.v}</div><div class="m-sub">${m.s}</div></div>`).join('');

  // Weekly bars
  const days=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const wk=days.map(dt=>{ const e=dt===db.todayDate?db._today:db.hist.find(h=>h.date===dt); return {dt,ok:e?.ok||0,err:e?.err||0}; });
  const mx=Math.max(...wk.map(d=>d.ok+d.err),1);
  const dn=['D','L','M','X','J','V','S'];
  document.getElementById('bars').innerHTML=wk.map(d=>{
    const tot=d.ok+d.err, pct=Math.round(tot/mx*100);
    const nm=dn[new Date(d.dt+'T12:00:00').getDay()];
    return `<div class="bc"><div class="bv">${tot||''}</div><div class="bo"><div class="bi" style="height:${pct}%"></div></div><div class="bl">${nm}</div></div>`;
  }).join('');

  // Difficult
  const diff=all.map(([id,s])=>{ const t=s.ok+s.err,r=t?s.err/t:0; return {id:+id,...s,t,r}; })
    .filter(x=>x.t>=2&&x.r>=.4).sort((a,b)=>b.r-a.r).slice(0,10);
  const db2=document.getElementById('diffbox');
  if(!diff.length){ db2.innerHTML=`<div class="empty"><div class="empty-ico">✨</div>Sin preguntas difíciles aún</div>`; }
  else {
    db2.innerHTML=`<div class="diff-hdr"><span style="font-size:12px;font-weight:600;color:var(--txt2)">Pregunta</span><span style="font-size:12px;font-weight:600;color:var(--txt2)">Error</span></div>`+
    diff.map(d=>{ const q=Q.find(x=>x.id===d.id); const qt=q?q.q.slice(0,90)+(q.q.length>90?'…':''):`#${d.id}`; return `<div class="diff-item"><span class="diff-num">#${d.id}</span><span class="diff-q">${qt}</span><span class="diff-rate">${Math.round(d.r*100)}%</span></div>`; }).join('');
  }

  // History
  const allDays=[...db.hist];
  if(db.todayDate&&db._today) allDays.push({date:db.todayDate,...db._today});
  const rec=allDays.slice(-14).reverse();
  const hb=document.getElementById('histbox');
  if(!rec.length){ hb.innerHTML=`<div class="empty"><div class="empty-ico">📅</div>¡Empieza a estudiar!</div>`; }
  else {
    hb.innerHTML=rec.map(d=>{
      const tot=(d.ok||0)+(d.err||0)+(d.skip||0), acc2=tot?Math.round((d.ok||0)/tot*100):0;
      const lbl=d.date===dstr()?'Hoy':new Date(d.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
      return `<div class="hist-row"><span class="hist-date">${lbl}</span><div class="hpills"><span class="pn">${tot}</span><span class="pg">✓${d.ok||0}</span><span class="pr">✗${d.err||0}</span>${tot?`<span class="pn">${acc2}%</span>`:''}</div></div>`;
    }).join('');
  }
}

// ── INIT ──
initTheme();
ensureDay();
db.streak=db.streak||0; db.maxStreak=db.maxStreak||0;
buildQueue(); loadCard(); refreshHeader();
</script>
