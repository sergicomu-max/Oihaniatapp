<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MatronitApp">
<title>MatronitApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --bg:#f5f3ee; --surf:#fff; --surf2:#eeeae2; --surf3:#e4e0d7;
  --txt:#18160f; --txt2:#6b6355; --txt3:#a09880;
  --acc:#7c4dbd; --acc-l:#ede8f7; --acc-d:#5c34a0;
  --ok:#2a6e3f;  --ok-l:#e4f3ea;
  --err:#b03030; --err-l:#faeaea;
  --brd:#ddd8ce; --head:#fff;
  --streak:#c67c20; --streak-l:#fdf3e2;
  --sh: 0 2px 16px rgba(0,0,0,.07);
  --r:14px; --rS:10px; --rXS:6px;
  --safe-top: env(safe-area-inset-top,0px);
  --safe-bot: env(safe-area-inset-bottom,0px);
}
[data-theme="dark"] {
  --bg:#100f0d; --surf:#1c1a16; --surf2:#252319; --surf3:#2e2b24;
  --txt:#f0ece3; --txt2:#a09070; --txt3:#6b6050;
  --acc:#a47de8; --acc-l:#241b38; --acc-d:#c4a0ff;
  --ok:#4ea86a;  --ok-l:#142a1d;
  --err:#e06060; --err-l:#2a1414;
  --brd:#2e2b24; --head:#161410;
  --streak:#e8a03a; --streak-l:#2a200a;
  --sh: 0 2px 16px rgba(0,0,0,.4);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%;font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.5;color:var(--txt);background:var(--bg);transition:background .25s,color .25s;overscroll-behavior:none}

/* ── LAYOUT SHELL ── */
.app{
  display:flex;flex-direction:column;
  min-height:100%;
  max-width:560px;
  margin:0 auto;
}

/* ── HEADER ── */
.hdr{
  position:sticky;top:0;z-index:200;
  background:var(--head);
  border-bottom:1px solid var(--brd);
  padding:0 16px;
  padding-top:var(--safe-top);
  height:calc(56px + var(--safe-top));
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  transition:background .25s,border-color .25s;
}
.logo{font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:-.3px;color:var(--txt);white-space:nowrap}
.logo span{color:var(--acc)}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* stats pills */
.pills{display:flex;gap:6px}
.pill{
  display:flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:20px;
  background:var(--surf2);color:var(--txt2);
  font-size:12px;font-weight:500;
  transition:background .2s,color .2s;
  white-space:nowrap;
}
.pill.hot{background:var(--streak-l);color:var(--streak)}
.pill-icon{font-size:14px;line-height:1}

/* theme toggle */
.tgl-wrap{cursor:pointer;display:flex;align-items:center}
.tgl-wrap input{display:none}
.tgl-track{
  width:40px;height:22px;border-radius:11px;
  background:var(--surf3);
  position:relative;transition:background .3s;
  display:flex;align-items:center;padding:0 4px;
  justify-content:space-between;font-size:10px;
}
.tgl-thumb{
  position:absolute;left:3px;
  width:16px;height:16px;border-radius:50%;
  background:var(--txt2);
  transition:transform .28s cubic-bezier(.4,0,.2,1),background .28s;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
}
[data-theme="dark"] .tgl-thumb{transform:translateX(18px);background:var(--txt)}

/* nav tabs */
.nav-tabs{display:flex;gap:4px}
.ntab{
  padding:5px 12px;border-radius:8px;
  border:1px solid var(--brd);
  background:none;color:var(--txt2);
  font-size:12px;font-weight:500;font-family:inherit;
  cursor:pointer;transition:all .18s;
  white-space:nowrap;
}
.ntab:active{opacity:.7}
.ntab.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}

/* ── VIEWS ── */
.view{display:none;flex:1;flex-direction:column}
.view.on{display:flex}

/* ── STUDY VIEW ── */
.study{
  padding:16px 16px calc(24px + var(--safe-bot));
  gap:14px;
  flex:1;overflow-y:auto;
}

/* top bar: modes + goto */
.topbar{display:flex;flex-direction:column;gap:10px}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.modes{display:flex;gap:6px}
.mbt{
  padding:6px 14px;border-radius:20px;
  border:1px solid var(--brd);background:var(--surf2);
  color:var(--txt2);font-size:12px;font-weight:500;font-family:inherit;
  cursor:pointer;transition:all .18s;
}
.mbt:active{opacity:.7}
.mbt.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.qinfo{font-size:11px;color:var(--txt3);white-space:nowrap}

/* goto row */
.goto-row{display:flex;align-items:center;gap:8px}
.goto-row label{font-size:12px;color:var(--txt2);white-space:nowrap}
.goto-input{
  flex:1;max-width:80px;
  padding:6px 10px;border-radius:8px;
  border:1px solid var(--brd);
  background:var(--surf2);color:var(--txt);
  font-size:13px;font-family:inherit;outline:none;
  -webkit-appearance:none;
}
.goto-input:focus{border-color:var(--acc)}
.goto-btn{
  padding:6px 14px;border-radius:8px;
  border:none;background:var(--acc);color:#fff;
  font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;
}
.goto-btn:active{opacity:.75}

/* shuffle toggle */
.shuf-row{display:flex;align-items:center;gap:8px}
.stgl-wrap{cursor:pointer;display:flex;align-items:center;gap:8px}
.stgl-wrap input{display:none}
.stgl-track{
  width:36px;height:20px;border-radius:10px;
  background:var(--brd);position:relative;
  transition:background .25s;flex-shrink:0;
}
.stgl-wrap input:checked + .stgl-track{background:var(--acc)}
.stgl-thumb{
  position:absolute;top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .25s;
}
.stgl-wrap input:checked + .stgl-track .stgl-thumb{transform:translateX(16px)}
.stgl-label{font-size:12px;color:var(--txt2)}

/* progress */
.pbar-wrap{display:flex;align-items:center;gap:10px}
.pbar{flex:1;height:3px;background:var(--brd);border-radius:2px;overflow:hidden}
.pfill{height:100%;background:var(--acc);border-radius:2px;transition:width .35s ease}
.plbl{font-size:11px;color:var(--txt3);white-space:nowrap;min-width:40px;text-align:right}

/* ── STREAK BANNER ── */
.banner{
  display:none;
  background:linear-gradient(135deg,var(--streak-l),rgba(255,220,100,.15));
  border:2px solid var(--streak);
  border-radius:var(--r);padding:16px;
  text-align:center;position:relative;
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1);
}
.banner.on{display:block}
@keyframes popIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.ban-close{
  position:absolute;top:8px;right:10px;
  background:none;border:none;font-size:20px;
  color:var(--streak);cursor:pointer;line-height:1;opacity:.65;
}
.ban-close:active{opacity:1}
.ban-emoji{font-size:34px;display:block;margin-bottom:4px;animation:bob .6s ease infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.ban-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--streak)}
.ban-sub{font-size:12px;color:var(--streak);opacity:.85;margin-top:2px}

/* ── CARD ── */
.scene{perspective:1100px;min-height:260px}
.card{
  width:100%;min-height:260px;
  position:relative;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r);
  padding:20px;
  background:var(--surf);
  box-shadow:var(--sh);
  border:1px solid var(--brd);
  transition:background .25s,border-color .25s;
}
.back{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;
}
.back.ok{background:var(--ok-l);border-color:var(--ok)}
.back.err{background:var(--err-l);border-color:var(--err)}

.q-num{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:12px}
.q-hard{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--err);background:var(--err-l);padding:2px 7px;border-radius:4px;margin-bottom:8px;
}
.q-txt{
  font-family:'DM Serif Display',serif;
  font-size:17px;line-height:1.42;color:var(--txt);
}

.r-icon{font-size:46px;line-height:1}
.r-lbl{font-family:'DM Serif Display',serif;font-size:26px}
.r-lbl.ok{color:var(--ok)}.r-lbl.err{color:var(--err)}
.r-ans{font-size:13px;color:var(--txt2);max-width:320px}
.r-ans strong{color:var(--txt)}

/* ── OPTIONS ── */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:flex-start;gap:11px;
  padding:13px 14px;
  background:var(--surf2);
  border:1.5px solid transparent;
  border-radius:var(--rS);
  cursor:pointer;text-align:left;
  font-family:inherit;font-size:14px;color:var(--txt);
  transition:background .15s,border-color .15s,transform .12s;
  line-height:1.4;
  -webkit-user-select:none;user-select:none;
}
.opt:active:not(:disabled){transform:scale(.985)}
.opt:disabled{cursor:default}
.opt-l{
  flex-shrink:0;width:24px;height:24px;border-radius:6px;
  background:var(--brd);color:var(--txt2);
  font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.opt.ok-opt{background:var(--ok-l);border-color:var(--ok)}
.opt.ok-opt .opt-l{background:var(--ok);color:#fff}
.opt.err-opt{background:var(--err-l);border-color:var(--err)}
.opt.err-opt .opt-l{background:var(--err);color:#fff}

/* ── CONTROLS ── */
.ctrls{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn-skip{
  flex:1;padding:13px;border-radius:var(--rS);
  border:1px solid var(--brd);background:none;
  font-family:inherit;font-size:14px;font-weight:500;color:var(--txt2);
  cursor:pointer;transition:all .18s;
}
.btn-skip:active{background:var(--surf2);opacity:.7}
.btn-next{
  flex:1;padding:13px;border-radius:var(--rS);
  border:none;background:var(--txt);color:var(--bg);
  font-family:inherit;font-size:14px;font-weight:600;
  cursor:pointer;display:none;transition:opacity .18s;
}
.btn-next.on{display:block}
.btn-next:active{opacity:.75}

/* ── ANALYTICS ── */
.analytics{
  padding:20px 16px calc(24px + var(--safe-bot));
  gap:20px;flex:1;overflow-y:auto;
}
.sec-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--txt);margin-bottom:3px}
.sec-sub{font-size:12px;color:var(--txt3)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;transition:background .25s,border-color .25s}
.m-lbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.m-val{font-family:'DM Serif Display',serif;font-size:28px;color:var(--txt)}
.m-sub{font-size:11px;color:var(--txt3);margin-top:3px}

.chart-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:18px;transition:background .25s,border-color .25s}
.chart-title{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:16px}
.bars{display:flex;gap:6px;align-items:flex-end;height:100px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bo{width:100%;flex:1;background:var(--surf2);border-radius:3px 3px 0 0;display:flex;align-items:flex-end}
.bi{width:100%;border-radius:3px 3px 0 0;background:var(--acc);transition:height .55s ease}
.bl{font-size:9px;color:var(--txt3)}
.bv{font-size:10px;font-weight:600;color:var(--txt2);min-height:14px}

.diff-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;transition:background .25s,border-color .25s}
.diff-hdr{padding:13px 16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between}
.diff-item{padding:12px 16px;border-bottom:1px solid var(--brd);display:flex;gap:10px;align-items:flex-start}
.diff-item:last-child{border-bottom:none}
.diff-num{font-size:10px;font-weight:700;color:var(--err);background:var(--err-l);padding:2px 7px;border-radius:4px;flex-shrink:0}
.diff-q{font-size:12px;color:var(--txt);line-height:1.4;flex:1}
.diff-rate{font-size:11px;font-weight:700;color:var(--err);white-space:nowrap}

.hist-box{background:var(--surf);border:1px solid var(--brd);border-radius:var(--r);padding:16px;transition:background .25s,border-color .25s}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--brd);font-size:12px}
.hist-row:last-child{border-bottom:none}
.hist-date{color:var(--txt2)}
.hpills{display:flex;gap:6px}
.pg{background:var(--ok-l);color:var(--ok);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.pr{background:var(--err-l);color:var(--err);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}
.pn{background:var(--surf2);color:var(--txt2);padding:2px 7px;border-radius:10px;font-size:11px;font-weight:600}

.empty{text-align:center;padding:40px 20px;color:var(--txt3);font-size:13px}
.empty-ico{font-size:36px;margin-bottom:10px}

/* confetti */
.cconf{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden}
.conf-p{position:absolute;top:-10px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translateY(105vh) rotate(700deg);opacity:0}}

/* toast */
.toast{
  position:fixed;bottom:calc(20px + var(--safe-bot));left:50%;transform:translateX(-50%);
  background:var(--txt);color:var(--bg);
  padding:9px 18px;border-radius:20px;
  font-size:12px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .25s;
  z-index:999;white-space:nowrap;
}
.toast.on{opacity:1}

/* animations */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.do-pop{animation:pop .35s ease}
@keyframes su{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.su{animation:su .3s ease}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo">Matronit<span>App</span></div>
    <div class="hdr-right">
      <div class="pills">
        <div class="pill" id="p-streak"><span class="pill-icon">🔥</span><span id="s-streak">0</span></div>
        <div class="pill" id="p-today"><span class="pill-icon">📅</span><span id="s-today">0</span></div>
        <div class="pill"><span class="pill-icon">✅</span><span id="s-acc">—</span></div>
      </div>
      <label class="tgl-wrap" title="Modo oscuro">
        <input type="checkbox" id="tgl-dark" onchange="applyTheme()">
        <div class="tgl-track"><span>☀️</span><span>🌙</span><div class="tgl-thumb"></div></div>
      </label>
      <div class="nav-tabs">
        <button class="ntab on" onclick="switchView('study',this)">Estudiar</button>
        <button class="ntab" onclick="switchView('analytics',this)">Análisis</button>
      </div>
    </div>
  </header>

  <!-- STUDY -->
  <div class="view on study" id="v-study">

    <!-- banner -->
    <div class="banner" id="banner">
      <button class="ban-close" onclick="hideBanner()">×</button>
      <span class="ban-emoji">🌟</span>
      <div class="ban-title">¡Buena Rachita Oihanita!</div>
      <div class="ban-sub">¡Sigue así! 🔥 Ya van <span id="ban-n">3</span> seguidas</div>
    </div>

    <!-- topbar -->
    <div class="topbar">
      <div class="mode-row">
        <div class="modes">
          <button class="mbt on" onclick="setMode('all',this)">Todas</button>
          <button class="mbt" onclick="setMode('wrong',this)">Errores</button>
          <button class="mbt" onclick="setMode('rand',this)">Aleatorio</button>
        </div>
        <span class="qinfo" id="qinfo"></span>
      </div>

      <div class="goto-row" id="goto-row">
        <label>Ir a:</label>
        <input class="goto-input" id="goto-in" type="number" min="1" max="700" placeholder="1–700"
          onkeydown="if(event.key==='Enter')goTo()">
        <button class="goto-btn" onclick="goTo()">Ir</button>
      </div>

      <div class="shuf-row">
        <label class="stgl-wrap">
          <input type="checkbox" id="shuf-chk" onchange="S.shuffle=this.checked;loadCard()">
          <div class="stgl-track"><div class="stgl-thumb"></div></div>
          <span class="stgl-label">Respuestas aleatorias</span>
        </label>
      </div>

      <div class="pbar-wrap">
        <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
        <span class="plbl" id="plbl">0/0</span>
      </div>
    </div>

    <!-- card -->
    <div class="scene">
      <div class="card" id="card">
        <div class="face front" id="front">
          <div class="q-num" id="qnum">—</div>
          <div class="q-hard" id="qhard" style="display:none">⚠️ Difícil</div>
          <div class="q-txt" id="qtxt">Cargando…</div>
        </div>
        <div class="face back" id="back">
          <div class="r-icon" id="rico">✓</div>
          <div class="r-lbl" id="rlbl"></div>
          <div class="r-ans" id="rans"></div>
        </div>
      </div>
    </div>

    <!-- options -->
    <div class="opts" id="opts"></div>

    <!-- controls -->
    <div class="ctrls">
      <button class="btn-skip" onclick="skip()">Saltar →</button>
      <button class="btn-next on" id="bnext" style="display:none" onclick="next()">Siguiente →</button>
    </div>

  </div><!-- /study -->

  <!-- ANALYTICS -->
  <div class="view analytics" id="v-analytics">
    <div>
      <div class="sec-title">Análisis</div>
      <div class="sec-sub" id="an-sub">—</div>
    </div>
    <div class="mgrid" id="mgrid"></div>
    <div class="chart-box">
      <div class="chart-title">Respuestas últimos 7 días</div>
      <div class="bars" id="bars"></div>
    </div>
    <div>
      <div class="sec-title" style="font-size:17px;margin-bottom:10px">Preguntas difíciles</div>
      <div class="diff-box" id="diffbox"></div>
    </div>
    <div>
      <div class="sec-title" style="font-size:17px;margin-bottom:10px">Historial</div>
      <div class="hist-box" id="histbox"></div>
    </div>
  </div>

</div><!-- /app -->

<div class="cconf" id="conf"></div>
<div class="toast" id="toast"></div>

<script>
const Q = [{"id":1,"q":"Según el Código Deontológico de la Enfermería Española, ¿cómo debe actuar la enfermera/o ante un/una paciente terminal?","o":{"A":"Limitar su actuación únicamente a tratamientos curativos.","B":"Priorizar la prolongación de la vida por encima del sufrimiento.","C":"Proporcionar cuidados paliativos con competencia y compasión hasta el final.","D":"Delegar el cuidado en la familia cuando no haya tratamiento curativo."},"c":"C"},{"id":2,"q":"En relación con el secreto profesional, ¿cuál es la actuación correcta de la enfermera/o si debe romperlo por motivos legales? NULA","o":{"A":"Limitar su actuación únicamente a tratamientos curativos.","B":"Priorizar la prolongación de la vida por encima del sufrimiento.","C":"Proporcionar cuidados paliativos con competencia y compasión hasta el final.","D":"Delegar el cuidado en la familia cuando no haya tratamiento curativo."},"c":"A"},{"id":3,"q":"Según el Código Deontológico de la Enfermería Española, ¿cuál es una de las funciones principales de la enfermera/o respecto a las personas con discapacidad o incapacidad?","o":{"A":"Limitar su actuación únicamente a los cuidados asistenciales básicos.","B":"Identificar causas de la incapacidad y contribuir a su prevención, tratamiento o rehabilitación.","C":"Delegar la integración social exclusivamente en trabajadores/as sociales.","D":"Actuar solo cuando exista una enfermedad aguda."},"c":"B"},{"id":4,"q":"Según el Código Deontológico de la Enfermería Española, ¿cómo debe actuar la enfermera/o ante un caso de abuso infantil del que tenga conocimiento?","o":{"A":"Mantener el secreto profesional en todo caso.","B":"Informar únicamente a la familia del menor.","C":"Denunciarlo a las autoridades competentes.","D":"Esperar a tener confirmación absoluta antes de actuar."},"c":"C"},{"id":5,"q":"Según el Código Deontológico de la Enfermería Española ¿cuál es una de las responsabilidades de la enfermera/o para garantizar el desarrollo adecuado del niño/a?","o":{"A":"Limitarse a la atención sanitaria hospitalaria.","B":"Contribuir a que los/as niños/as tengan alimentación, vivienda, educación y cuidados de salud.","C":"Delegar estas funciones exclusivamente en servicios sociales.","D":"Actuar solo en situaciones de enfermedad grave."},"c":"B"},{"id":6,"q":"Según el Código Deontológico de las Matronas Españolas, ¿qué derecho tiene el matrón/a respecto a actuaciones que entren en conflicto con sus creencias éticas o morales?","o":{"A":"Puede negarse mediante el derecho a la objeción de conciencia, sin sufrir discriminación.","B":"Debe ejecutarlas siempre, aunque generen conflicto personal.","C":"Solo puede negarse si cuenta con autorización judicial.","D":"Debe delegarlas automáticamente a otro/a profesional sin informar."},"c":"A"},{"id":7,"q":"Según el Código Deontológico de las Matronas Españolas, ¿qué responsabilidad tiene el matrón/a respecto a los residentes en formación clínica a su cargo?","o":{"A":"Permitir que actúen de forma autónoma sin supervisión.","B":"Evaluarlos únicamente al final del periodo formativo.","C":"Delegar completamente su formación en otros/as profesionales.","D":"Velar por que cumplan el Código Deontológico aplicable y comunicar su nivel formativo."},"c":"D"},{"id":8,"q":"Según el Código deontológico de las Matronas Españolas, ¿cómo debe actuar el matrón/a ante la negativa de una mujer a un tratamiento?","o":{"A":"Debe imponer el tratamiento si lo considera necesario.","B":"Debe respetar la decisión de la mujer, salvo riesgo probado para ella o su hijo/a.","C":"Debe ignorar la decisión si la familia no está de acuerdo.","D":"Debe derivar siempre el caso a otro/ profesional."},"c":"B"},{"id":9,"q":"¿Cuál de las siguientes actuaciones refleja mejor el enfoque asistencial del matrón/a en el Código Deontológico de las Matronas Españolas?","o":{"A":"Proporcionar cuidados integrales basados en evidencia científica y perspectiva holística.","B":"Atender únicamente aspectos biológicos de la mujer.","C":"Centrarse exclusivamente en el embarazo y el parto.","D":"Priorizar protocolos sobre las necesidades individuales."},"c":"A"},{"id":10,"q":"Según la Ley Orgánica 10/1995, en el artículo 199 del Código Penal, ¿qué consecuencia tiene para un profesional revelar secretos de otra persona incumpliendo su deber de sigilo?","o":{"A":"Únicamente una sanción administrativa.","B":"Prisión de uno a cuatro años, multa e inhabilitación profesional.","C":"Solo una multa económica sin otras consecuencias.","D":"Ninguna si la información es veraz."},"c":"B"},{"id":11,"q":"Según el principio del deber de informar, ¿cuál es la actuación correcta del profesional sanitario?","o":{"A":"Ocultar la información a la persona paciente para evitarle sufrimiento.","B":"Informar solo a la familia, aunque la persona paciente quiera saber la verdad.","C":"Mentir a la persona paciente si el diagnóstico es grave.","D":"Proporcionar a la persona paciente la información relevante que solicite, respetando su derecho a decidir."},"c":"D"},{"id":12,"q":"En relación con personas pacientes capaces de decidir, ¿qué papel tiene la calidad de vida en la toma de decisiones?","o":{"A":"No debe tenerse en cuenta en ningún caso.","B":"Es valorada exclusivamente por el/la profesional sanitario/a.","C":"Puede tener la máxima importancia según la valoración de la propia persona paciente.","D":"Solo se considera en enfermedades terminales."},"c":"C"},{"id":13,"q":"En el caso de niños/as con malformaciones congénitas graves, ¿qué criterio suele aplicarse en la toma de decisiones?","o":{"A":"Siempre se aplican todos los tratamientos disponibles.","B":"Se decide exclusivamente según criterios médicos.","C":"Se tiende a respetar la decisión de las personas progenitoras, aunque exista controversia.","D":"Se ignora la gravedad de la malformación."},"c":"C"},{"id":14,"q":"La taxonomía NANDA-II en la edición 13 (2024-2026) se organiza en:","o":{"A":"10 dominios y 30 clases con 5 ejes.","B":"13 dominios y 47 clases con 6 ejes.","C":"12 dominios y 36 clases con 8 ejes.","D":"12 dominios y 36 clases con 7 ejes."},"c":"B"},{"id":15,"q":"Una persona paciente encamada presenta a la vez: deterioro de la movilidad física, riesgo de caídas, deterioro de la integridad cutánea y estreñimiento. Comparten factores de riesgo e intervenciones similares. Según la NANDA esto corresponde a:","o":{"A":"Diagnóstico múltiple.","B":"Diagnóstico de riesgo acumulado.","C":"Diagnóstico de síndrome.","D":"Diagnóstico prioritario complejo."},"c":"C"},{"id":16,"q":"Una paciente gestante acude a la consulta de enfermería y manifiesta: \"Me gustaría aprender técnicas de relajación y ejercicios de respiración para prepararme mejor para el parto\". No presenta complicaciones obstétricas. El personal de enfermería valora su motivación para mejorar su bienestar. ¿qué tipo de diagnóstico NANDA es el más apropiado?","o":{"A":"Diagnóstico de promoción de la salud.","B":"Diagnóstico de riesgo.","C":"Diagnóstico real.","D":"Diagnóstico de síndrome."},"c":"A"},{"id":17,"q":"La Nursing Outcomes Classification (NOC), se estructura como un sistema de medición que permite evaluar la evolución de la persona paciente. ¿De las siguientes afirmaciones cuál es correcta?","o":{"A":"La NOC incluye intervenciones de enfermería codificadas que permiten medir la productividad asistencial.","B":"La NOC utiliza escalas de tipo Likert de 5 puntos para medir un total de 612 resultados sensibles a los cuidados de enfermería.","C":"La NOC es una taxonomía diagnóstica que sustituye a la NANDA en el proceso de valoración.","D":"La NOC se compone de 614 etiquetas de resultados, todas ellas con una definición única y sin necesidad de indicadores."},"c":"B"},{"id":18,"q":"La Nursing Interventions Classification (NIC), define una intervención de enfermería como \"cualquier tratamiento basado en el juicio clínico y el conocimiento que realiza un/una profesional de enfermería para mejorar los resultados de la persona paciente\". ¿cuál de las siguientes opciones describe una característica fundamental de la taxonomía NIC?","o":{"A":"La NIC clasifica exclusivamente las intervenciones dependientes de la prescripción médica.","B":"Cada intervención en la NIC tiene una etiqueta, una definición y un conjunto de actividades específicas, y existen más de 500 intervenciones.","C":"La NIC solo es aplicable en el ámbito hospitalario de agudos, no en atención primaria o comunitaria.","D":"La NIC prioriza los resultados económicos por encima de los resultados clínicos de la persona paciente."},"c":"B"},{"id":19,"q":"La Nursing Outcomes Classification (NOC) se organiza en una estructura taxonómica de tres niveles (Dominios, Clases y Resultados). Además, cada resultado se acompaña de una serie de indicadores. ¿qué utilidad práctica tienen los indicadores dentro de la NOC?","o":{"A":"Los indicadores son sinónimos de las intervenciones NIC y sirven para ejecutar el cuidado.","B":"Los indicadores son síntomas mayores que confirman un diagnóstico NANDA.","C":"Los indicadores son estados o conductas específicas y observables de la persona paciente que se puntúan en una escala para determinar si se ha alcanzado el resultado.","D":"Los indicadores son códigos numéricos que sirven exclusivamente para la facturación (reimbursement)."},"c":"C"},{"id":20,"q":"Dentro de la taxonomía NIC, las intervenciones pueden ser de distintos niveles (por ejemplo, Dominio 2: Fisiológico: Complejo; Dominio 3: Conductual). Una persona paciente que requiere manejo de la ventilación mecánica y otra que requiere educación sanitaria para dejar de fumar. Según la clasificación NIC, estas intervenciones se clasifican respectivamente en:","o":{"A":"Dominio Fisiológico: Básico y Dominio Conductual.","B":"Dominio Fisiológico: Complejo y Dominio de la Familia.","C":"Dominio Fisiológico: Complejo y Dominio Conductual.","D":"Dominio Fisiológico: Básico y Dominio de Seguridad."},"c":"C"},{"id":21,"q":"En el contexto de un Diagnóstico de Enfermería enfocado en el problema, ¿cuál es la función principal de los \"factores relacionados\" según la Taxonomía II de NANDA-I?","o":{"A":"Describir los signos y síntomas que confirman la presencia del diagnóstico.","B":"Identificar las causas o factores contribuyentes que deben ser el objetivo de las intervenciones enfermeras.","C":"Categorizar el diagnóstico dentro de un dominio y una clase específicos.","D":"Determinar la susceptibilidad de la persona paciente a desarrollar un evento adverso."},"c":"B"},{"id":22,"q":"Al planificar los cuidados, si un/una matrón/a utiliza la Clasificación de Resultados de Enfermería (NOC), ¿en qué momento del proceso se debe seleccionar el resultado deseado?","o":{"A":"Después de implementar las intervenciones, para ver si estas funcionaron.","B":"Durante la fase de valoración, para comparar el estado basal con el diagnóstico.","C":"Antes de elegir las intervenciones (NIC), para establecer la meta que guiará el tratamiento."},"c":"C"},{"id":23,"q":"En la práctica clínica, el personal de enfermería utiliza instrumentos estandarizados para complementar la valoración, ¿cuál de los siguientes enunciados sobre los instrumentos de valoración (escalas) es correcto?","o":{"A":"Los instrumentos estándar, basados en la práctica basada en la evidencia, son herramientas que ayudan a la recogida sistemática de datos y cribado de riesgos.","B":"Las escalas estandarizadas sustituyen por completo el juicio clínico del personal de enfermería.","C":"Las escalas de valoración solo son útiles en unidades de cuidados intensivos.","D":"Los resultados de las escalas no necesitan ser registrados en la historia clínica."},"c":"A"},{"id":24,"q":"¿Cómo se estructura jerárquicamente la Taxonomía II de NANDA-I para organizar los diagnósticos de enfermería?","o":{"A":"Se divide en 13 dominios, que a su vez se organizan en clases.","B":"Se organiza por orden alfabético según la etiqueta diagnóstica.","C":"Se agrupa únicamente según los sistemas del cuerpo humano (digestivo, respiratorio, etc.).","D":"Se estructura en base a las 14 necesidades de Virginia Henderson exclusivamente."},"c":"A"},{"id":25,"q":"Un diagnóstico de \"Promoción de la Salud\" se diferencia de uno \"Enfocado en el Problema\" principalmente porque:","o":{"A":"Siempre requiere la presencia de signos y síntomas de enfermedad activa.","B":"Se utiliza exclusivamente en el ámbito comunitario y nunca en hospitales.","C":"Su prioridad siempre es mayor que la de un diagnóstico de riesgo por su carácter preventivo.","D":"No requiere necesariamente de factores relacionados, sino que se centra en la disposición y el deseo de mejorar el bienestar."},"c":"D"},{"id":26,"q":"Al vincular las tres taxonomías (NANDA-NOC-NIC), ¿qué elemento actúa como \"puente\" para evaluar objetivamente si la intervención (NIC) ha sido efectiva para el diagnóstico inicial?","o":{"A":"La eliminación total de todos los factores relacionados del diagnóstico.","B":"El cambio en la puntuación de los indicadores del resultado (NOC).","C":"La realización estricta de todas las actividades descritas en la intervención.","D":"La reclasificación de la persona paciente en un dominio diferente de NANDA-I."},"c":"B"},{"id":27,"q":"¿Cuál de las siguientes afirmaciones sobre la investigación cuantitativa y cualitativa es correcta?","o":{"A":"La investigación cuantitativa se centra en la comprensión de fenómenos desde una perspectiva subjetiva y naturalista.","B":"La investigación cualitativa utiliza datos numéricos para describir variables y examinar relaciones causa-efecto.","C":"La investigación cuantitativa se corresponde con el paradigma positivista y busca medir fenómenos desde fuera.","D":"La investigación cualitativa se corresponde con el paradigma positivista y busca medir fenómenos desde dentro."},"c":"C"},{"id":28,"q":"Un/Una matrón/a desea estudiar la vivencia del parto en mujeres que han tenido una muerte fetal anteparto. Para ello, planea realizar entrevistas en profundidad para comprender el significado de esta experiencia. ¿qué tipo de diseño de investigación cualitativa sería el más adecuado?","o":{"A":"Investigación fenómenológica.","B":"Investigación etnográfica.","C":"Teoría fundamentada.","D":"Método biográfico."},"c":"A"},{"id":29,"q":"En un estudio que compara la eficacia de dos tratamientos para el alivio del dolor en el parto, se asigna aleatoriamente a las mujeres a un grupo que recibe analgesia epidural y a otro que recibe óxido nitroso. ¿qué tipo de diseño de investigación se está utilizando?","o":{"A":"Estudio de cohortes.","B":"Estudio de casos y controles.","C":"Estudio cuasi-experimental.","D":"Ensayo clínico aleatorizado."},"c":"D"},{"id":30,"q":"¿Cuál de las siguientes opciones describe correctamente la diferencia entre los errores Tipo I y Tipo II en el contraste de hipótesis?","o":{"A":"Error Tipo I es aceptar la hipótesis nula cuando es falsa; Error Tipo II es rechazarla cuando es verdadera.","B":"Error Tipo I es rechazar la hipótesis nula cuando es verdadera; Error Tipo II es aceptarla cuando es falsa.","C":"Error Tipo I se minimiza aumentando el tamaño muestral; Error Tipo II se minimiza disminuyendo la seguridad (alfa).","D":"La probabilidad de Error Tipo I es beta y la de Error Tipo II es alfa."},"c":"B"},{"id":31,"q":"Según el contenido del volumen, ¿cuál de las siguientes opciones corresponde a una medida de tendencia central?","o":{"A":"Rango.","B":"Varianza.","C":"Desviación típica.","D":"Mediana."},"c":"D"},{"id":32,"q":"En la estructura de un artículo original, la sección de \"Material y métodos\" debe responder a la pregunta \"¿Cómo se ha hecho el estudio?\" e incluir varias áreas. ¿Cuál de las siguientes NO se menciona como una de esas áreas?","o":{"A":"Diseño.","B":"Resultado esperado.","C":"Población sobre la que se ha hecho el estudio.","D":"Análisis estadístico."},"c":"B"},{"id":33,"q":"Un/Una matrón/a realiza un estudio para determinar la relación entre la estatura materna y la posibilidad de parto eutócico, sin administrar ningún tratamiento ni intervención. Este tipo de estudio, según la clasificación por manipulación, se denomina:","o":{"A":"Experimental.","B":"Cuasi-experimental.","C":"Observacional.","D":"De intervención comunitaria."},"c":"C"},{"id":34,"q":"Cuando se desea analizar si más de dos grupos difieren significativamente entre sí en cuanto a sus medias en una variable medida en un nivel por intervalos, ¿cuál es la prueba estadística paramétrica más adecuada?","o":{"A":"Prueba t de Student.","B":"Coeficiente de correlación de Pearson.","C":"Análisis de varianza unidireccional (ANOVA one-way).","D":"Chi cuadrada (x²)."},"c":"C"},{"id":35,"q":"En el proceso cuantitativo, se define como \"el conjunto de todos los casos que concuerdan con una serie de especificaciones\" y debe situarse claramente por sus características de contenido, lugar y tiempo. ¿A qué concepto se refiere esta definición?","o":{"A":"Muestra.","B":"Población o universo.","C":"Unidad de análisis.","D":"Marco muestral."},"c":"B"},{"id":36,"q":"Un/Una matrón/a desea conocer el grado de asociación entre la satisfacción con el parto (medida en una escala ordinal) y el número de meses de lactancia materna (variable de razón). ¿Qué coeficiente de correlación sería el más apropiado para analizar esta relación?","o":{"A":"Coeficiente de correlación de Pearson (r).","B":"Coeficientes rho de Spearman o tau de Kendall.","C":"Coeficiente de contingencia C de Pearson.","D":"Coeficiente Eta."},"c":"B"},{"id":37,"q":"En relación con las medidas de tendencia central, el texto señala que una de ellas es \"particularmente útil cuando hay valores extremos en la distribución\" porque \"no es sensible a éstos\". ¿A qué medida se refiere?","o":{"A":"Media aritmética.","B":"Moda.","C":"Rango.","D":"Mediana."},"c":"D"},{"id":38,"q":"En la estructura metodológica de un trabajo científico cuantitativo, la sección de \"Discusión\" cumple múltiples funciones. Entre las siguientes opciones, señale la que NO corresponde a una función de esta sección:","o":{"A":"Relacionar los resultados con los estudios existentes y la literatura previa.","B":"Reconocer las limitaciones de la investigación con honestidad.","C":"Presentar los datos crudos y los resultados del análisis estadístico descriptivo.","D":"Sugerir nuevas preguntas, hipótesis o líneas de investigación para el futuro."},"c":"C"},{"id":39,"q":"Son criterios o herramientas para incrementar la \"credibilidad\" (validez cualitativa) de un estudio, EXCEPTO:","o":{"A":"Realizar estancias prolongadas en el campo para disminuir distorsiones provocadas por la presencia de la persona investigadora.","B":"Utilizar muestras probabilísticas con un error muestral inferior al 5% para asegurar la representatividad estadística.","C":"Llevar a cabo triangulación de datos, investigadores o métodos para obtener mayor riqueza interpretativa.","D":"Efectuar chequeo con los participantes para verificar si las interpretaciones del investigador reflejan lo que ellos quisieron expresar."},"c":"B"},{"id":40,"q":"Si, durante el taller de comunicación grupal, una persona participante comenta que en su familia \"cada persona tiene tareas muy claras: el padre trabaja fuera, la madre cuida de la casa y los hijos deben encargarse de sus estudios\", ¿qué función del entorno familiar, de las mencionadas en el texto, estaría identificando principalmente?","o":{"A":"La afectividad, porque las tareas demuestran el amor que se tienen.","B":"La socialización de las personas miembros, ya que les enseña a vivir en comunidad.","C":"La integración en el núcleo social, por el trabajo del padre.","D":"La división del trabajo, al asignar responsabilidades específicas a cada persona miembro."},"c":"D"},{"id":41,"q":"Durante una sesión de terapia grupal, Marta, una participante, comenta que siempre ha sentido que sus problemas de ansiedad son únicos y que nadie puede entenderla. Para su sorpresa, al escuchar los testimonios de otras personas del grupo, descubre que varias de ellas comparten experiencias y miedos muy similares a los suyos. Esto le genera un gran alivio y disminuye su sensación de aislamiento. ¿qué factor terapéutico de Sadock se está manifestando principalmente en esta situación?","o":{"A":"Universalización.","B":"Cohesión.","C":"Catarsis.","D":"Imitación."},"c":"A"},{"id":42,"q":"Un equipo de personas creativas que trabaja en remoto necesita realizar una sesión de \"lluvia de ideas\" (brainstorming) para un nuevo proyecto. Buscan una herramienta que les permita, a todos/as a la vez, plasmar y organizar visualmente sus conceptos de manera interactiva, como si estuvieran frente a una pizarra física en una sala de reuniones. Según las descripciones de las herramientas proporcionadas, ¿cuál de las siguientes opciones sería la más especializada y adecuada para esta necesidad?","o":{"A":"iWork.","B":"Onedrive.","C":"Mindnode.","D":"Stormboard."},"c":"D"},{"id":43,"q":"Durante una reunión grupal para organizar una campaña de sensibilización, Laura interrumpe constantemente a sus compañeros/as cuando exponen sus ideas, hace comentarios sarcásticos sobre sus propuestas y, en una ocasión, le dice a uno de ellos: \"Esa idea es una tontería, mejor deja que opine alguien que sepa del tema\". Su comportamiento está generando un ambiente tenso y desmotivador en el equipo. Según la clasificación de roles negativos, ¿qué rol está desempeñando principalmente Laura?","o":{"A":"Inconformista, porque siempre encuentra algo malo en las propuestas de los demás.","B":"Sabelotodo, porque cree saber más que los demás sobre el tema.","C":"Agresor, porque anula a otras personas y destruye su autoestima.","D":"Buscador de reconocimiento, porque quiere ser el centro de atención."},"c":"C"},{"id":44,"q":"En una primera entrevista de relación de ayuda, después de la acogida inicial, el/la profesional ayuda a la persona a ordenar sus ideas y emociones para comprender mejor su situación. ¿En qué fase se encuentra?","o":{"A":"Acogida y orientación.","B":"Exposición y clarificación del problema.","C":"Confrontación del problema.","D":"Plan de acción."},"c":"B"},{"id":45,"q":"Una persona atraviesa un momento de gran confusión: se siente desbordada por sus emociones, actúa de forma desorganizada y no logra reflexionar con claridad sobre lo que le está ocurriendo. Según los cuatro tiempos de la vivencia de la crisis, ¿en qué fase se encuentra?","o":{"A":"Primer tiempo: agitación y actividad desordenada.","B":"Segundo tiempo: tensión interior y sensación de catástrofe.","C":"Tercer tiempo: aparición de nuevas posibilidades.","D":"Cuarto tiempo: conclusión de la crisis."},"c":"A"},{"id":46,"q":"Según las características de la relación de ayuda, cuando el/la profesional busca que la persona aprenda a manejar sus propias dificultades sin depender siempre de él, está aplicando el principio de:","o":{"A":"Ayuda concreta y puntual.","B":"Ayuda eficaz.","C":"Ayuda en la comunicación.","D":"Ayuda que favorece el crecimiento personal y la autonomía."},"c":"D"},{"id":47,"q":"Un/Una profesional sanitario/a mantiene un encuentro con una persona paciente en el que acapara la palabra, le da consejos sin escuchar sus necesidades y finaliza la conversación sin haber comprendido realmente su situación. Esta actuación se aleja del concepto de relación de ayuda porque se ha convertido en:","o":{"A":"Una relación social.","B":"Una confesión.","C":"Un discurso.","D":"Un interrogatorio."},"c":"C"},{"id":48,"q":"De las siguientes opciones, ¿cuál es una acción fundamental que se debe realizar de forma continuada durante la entrevista y, sobre todo, al finalizar la sesión?","o":{"A":"Tomar notas detalladas en una libreta sin mirar a la persona paciente.","B":"Interrumpir a la persona paciente cuando haga una pausa para demostrar que entendemos el tema.","C":"Cambiar de tema de conversación si la persona paciente se muestra demasiado emocional.","D":"Pedir a la persona paciente un resumen de lo que cree que es más importante (feedback)."},"c":"D"},{"id":49,"q":"Si hablamos de aspectos de la comunicación, ¿cuál es el propósito principal de utilizar un enfoque de resolución de problemas centrado en la persona paciente?","o":{"A":"Demostrar a la persona paciente que el/la profesional tiene la solución correcta para todos sus problemas.","B":"Evitar que la persona paciente se convierta en un agente pasivo y fomentar su participación activa durante la entrevista.","C":"Reducir el tiempo de la consulta para poder atender a más pacientes.","D":"Impedir que la persona paciente exprese sus emociones para no alargar la entrevista."},"c":"B"},{"id":50,"q":"¿Qué actitud debe tener el/la profesional sanitario/a antes de iniciar la entrevista con la persona paciente?","o":{"A":"Ser consciente de su estado físico y emocional.","B":"Ignorar su propio estado emocional para no interferir.","C":"Centrarse únicamente en el estado de la persona paciente.","D":"Mantener una actitud distante para evitar implicación."},"c":"A"},{"id":51,"q":"Durante una entrevista clínica, una persona paciente inmigrante muestra dificultad para comprender las indicaciones del/de la profesional sanitario/a y asiente con la cabeza, aunque posteriormente no sigue las recomendaciones. ¿Cuál es la actuación más adecuada por parte del/de la profesional?","o":{"A":"Repetir la información utilizando términos más técnicos para mayor precisión.","B":"Dar por hecho que la persona paciente ha entendido, ya que ha asentido.","C":"Adaptar el lenguaje, explorar su comprensión y pedirle que resuma la información.","D":"Finalizar la entrevista para no generar incomodidad."},"c":"C"},{"id":52,"q":"Una/Uno enfermera/o, tras una jornada especialmente estresante, inicia una entrevista con una persona paciente que se muestra emocionalmente alterada. Durante la conversación, la/el enfermera/o responde de forma automática y poco empática. ¿Qué principio de la comunicación terapéutica NO se ha respetado?","o":{"A":"Fijar objetivos con la persona paciente.","B":"Ser consciente del propio estado emocional antes de la entrevista.","C":"Resaltar aspectos positivos de la persona paciente.","D":"Acordar la duración de la entrevista."},"c":"B"},{"id":53,"q":"¿Cuál de las siguientes afirmaciones sobre la epidemiología es correcta?","o":{"A":"La epidemiología se limita al estudio de la muerte, la enfermedad y la discapacidad, sin considerar los estados sanitarios positivos.","B":"La epidemiología descriptiva se ocupa de buscar los factores que determinan la distribución de las enfermedades y de identificar asociaciones causales.","C":"La epidemiología analítica estudia la distribución de las enfermedades en relación con las variables lugar, tiempo y persona.","D":"Entre los objetivos de la epidemiología se incluye planificar y evaluar medidas preventivas, terapéuticas, rehabilitadoras y organizativas vinculadas a la salud comunitaria."},"c":"D"},{"id":54,"q":"En una residencia de tercera edad aparece un brote de gripe. Se decide vacunar a las personas residentes no inmunizadas. ¿Sobre qué eslabón de la cadena epidemiológica actúa esta medida?","o":{"A":"Agente causal.","B":"Reservorio.","C":"Mecanismo de transmisión.","D":"Huésped susceptible."},"c":"D"},{"id":55,"q":"Una persona paciente con tuberculosis activa es ingresada en aislamiento respiratorio. ¿Qué objetivo tiene esta medida?","o":{"A":"Eliminar el agente.","B":"Reducir la susceptibilidad del huésped.","C":"Interrumpir la transmisión.","D":"Mejorar el estado general."},"c":"C"},{"id":56,"q":"En un brote infeccioso, se observa aumento de casos en una zona concreta en poco tiempo. Esto corresponde a:","o":{"A":"Epidemiología analítica.","B":"Epidemiología descriptiva.","C":"Ensayo clínico.","D":"Prevención terciaria."},"c":"B"},{"id":57,"q":"¿Cuál de las siguientes medidas rompe la cadena epidemiológica actuando sobre el mecanismo de transmisión?","o":{"A":"Vacunación.","B":"Aislamiento de la persona paciente.","C":"Mejora del estado nutricional.","D":"Tratamiento etiológico."},"c":"B"},{"id":58,"q":"En relación con la esterilización, todas las afirmaciones son correctas, EXCEPTO:","o":{"A":"Es equivalente a desinfección de alto nivel.","B":"Elimina esporas.","C":"Elimina bacterias y virus.","D":"Se puede realizar mediante calor húmedo."},"c":"A"},{"id":59,"q":"Respecto a los antisépticos y desinfectantes, señale la opción correcta, EXCEPTO:","o":{"A":"Los desinfectantes pueden aplicarse sobre piel intacta.","B":"Los desinfectantes se utilizan en superficies.","C":"Los antisépticos se aplican sobre tejidos vivos.","D":"Los antisépticos previenen infecciones."},"c":"A"},{"id":60,"q":"La vigilancia epidemiológica se define como:","o":{"A":"Diagnóstico individual.","B":"Recogida puntual de datos.","C":"Proceso continuo de recogida y análisis.","D":"Tratamiento poblacional."},"c":"C"},{"id":61,"q":"Las Enfermedades de Declaración Obligatoria (EDO):","o":{"A":"Deben notificarse a sistemas sanitarios.","B":"Son solo hospitalarias.","C":"No requieren notificación.","D":"No tienen relevancia epidemiológica."},"c":"A"},{"id":62,"q":"Se detecta aumento de casos de infección en varios hospitales. Se decide recoger datos, analizarlos y actuar. Esto corresponde a:","o":{"A":"Prevención primaria.","B":"Vigilancia epidemiológica.","C":"Diagnóstico clínico.","D":"Rehabilitación."},"c":"B"},{"id":63,"q":"El Sistema de Información Microbiológica (SIM):","o":{"A":"Solo registra mortalidad.","B":"No forma parte de vigilancia.","C":"Solo se usa en hospitales.","D":"Recoge datos de infecciones confirmadas."},"c":"D"},{"id":64,"q":"Un/Una profesional promueve hábitos saludables (dieta, ejercicio) en población sana. Esto corresponde a:","o":{"A":"Prevención secundaria.","B":"Prevención terciaria.","C":"Diagnóstico.","D":"Promoción de la salud."},"c":"D"},{"id":65,"q":"En la relación causa-efecto, una causa necesaria es:","o":{"A":"Siempre suficiente por sí sola.","B":"No influye en la enfermedad.","C":"Imprescindible pero no suficiente.","D":"Factor protector."},"c":"C"},{"id":66,"q":"¿Cuál de los siguientes es un objetivo explícitamente mencionado en la seguridad en el proceso asistencial gestación-parto-puerperio?","o":{"A":"Implementar paquetes de medidas (Bundles) en la hemorragia postparto.","B":"Desarrollar sistemas de verificación para eliminar los riesgos en los diferentes procedimientos.","C":"Unificar criterios asistenciales en un único protocolo corporativo de atención al embarazo normal.","D":"Promover la participación de las mujeres y familiares en el proceso de seguridad en embarazo, parto y puerperio."},"c":"D"},{"id":67,"q":"El manual de Osakidetza (2017) establece varias situaciones en las que es obligatorio cambiar los guantes durante su uso. ¿Cuál de los siguientes enunciados es INCORRECTO respecto a cuándo hay que cambiarse los guantes?","o":{"A":"Hay que cambiarse los guantes en la atención a distintas personas pacientes.","B":"Hay que cambiarse los guantes en los cuidados a una misma persona paciente si se pasa de una zona más contaminada a una zona más limpia.","C":"Hay que cambiarse los guantes al finalizar la jornada laboral, aunque no se hayan roto ni manipulado materiales contaminados.","D":"Hay que cambiarse los guantes en caso de sufrir una salpicadura, rotura o perforación."},"c":"C"},{"id":68,"q":"De acuerdo con el manual de Osakidetza (2017) sobre el uso adecuado de guantes sanitarios frente a la exposición a citostáticos y otros fármacos peligrosos, señale la opción correcta:","o":{"A":"Para la manipulación y administración de citostáticos se recomienda el uso de guante de nitrilo no estéril.","B":"Los guantes de látex estéril son los recomendados para la administración de medicamentos citostáticos a personas pacientes.","C":"Los guantes utilizados en la preparación de citostáticos en cabina de Farmacia pueden reutilizarse si no presentan roturas visibles.","D":"El cambio de guantes entre paciente y paciente no es necesario cuando se administran citostáticos, solo al finalizar la jornada."},"c":"A"},{"id":69,"q":"¿Cuál es el objetivo principal de las precauciones basadas en la transmisión?","o":{"A":"Sustituir las precauciones estándar.","B":"Interrumpir la transmisión de patógenos específicos.","C":"Reducir costes hospitalarios.","D":"Mejorar el confort de la persona paciente."},"c":"B"},{"id":70,"q":"Respecto al Sistema de Notificación para el Aprendizaje en Seguridad de la persona Paciente (SNASP), señala la opción correcta:","o":{"A":"Es un sistema obligatorio y punitivo.","B":"Solo permite notificar eventos adversos con daño.","C":"Es un sistema voluntario, no punitivo y orientado al aprendizaje.","D":"Solo puede ser utilizado por personal médico."},"c":"C"},{"id":71,"q":"¿Cuál es el objetivo principal de la gestión de eventos adversos dentro de la estrategia de seguridad de la persona paciente?","o":{"A":"Sancionar a los/las profesionales implicados/as.","B":"Ocultar los errores para proteger la imagen institucional.","C":"Reducir el tiempo de estancia hospitalaria exclusivamente.","D":"Minimizar el impacto y favorecer el aprendizaje para evitar recurrencias."},"c":"D"},{"id":72,"q":"Durante una guardia, un/una matrón/a detecta que se ha administrado una dosis incorrecta de medicación a una persona paciente, pero no ha producido daño. Decide registrarlo en el sistema de notificación del hospital. ¿Cuál es la finalidad principal de esta notificación?","o":{"A":"Analizar el incidente para prevenir futuros errores.","B":"Registrar únicamente eventos con daño.","C":"Sancionar al/a la profesional implicado/a.","D":"Informar solo a la persona paciente afectada."},"c":"A"},{"id":73,"q":"En un hospital se revisan los eventos adversos ocurridos durante el último año y se concluye que una gran proporción podría haberse evitado con medidas adecuadas. ¿Cuál de los siguientes rangos refleja mejor la evitabilidad según el documento?","o":{"A":"5–10%.","B":"43–70%.","C":"15–25%.","D":">90%."},"c":"B"},{"id":74,"q":"Una persona paciente sufre una complicación derivada de una atención sanitaria que prolonga su estancia hospitalaria y requiere tratamiento adicional. Este evento se clasifica principalmente por su:","o":{"A":"Frecuencia.","B":"Impacto.","C":"Notificación.","D":"Intencionalidad."},"c":"B"},{"id":75,"q":"En una unidad de maternidad, tras varios días con aumento de infecciones puerperales, se realiza una auditoría. Se detecta que el personal sanitario utiliza guantes de forma sistemática, pero la adherencia a la higiene de manos es baja. Además, muchos/as profesionales consideran que el uso de guantes es suficiente para prevenir la transmisión. ¿Cuál sería la medida prioritaria a implementar?","o":{"A":"Reforzar el uso de guantes en todos los procedimientos.","B":"Implantar aislamiento de contacto a todas las personas pacientes.","C":"Mejorar la adherencia a la higiene de manos.","D":"Administrar profilaxis antibiótica sistemática."},"c":"C"},{"id":76,"q":"Un/Una matrón/a atiende un parto eutócico. Durante la asistencia, entra en contacto con fluidos biológicos sin incidencias. Posteriormente, atiende a otra persona paciente sin cambiarse los guantes, aunque no hay contacto visible con sangre. Desde el punto de vista de seguridad de la persona paciente, ¿cuál es la afirmación más correcta?","o":{"A":"Debe cambiarse los guantes y realizar higiene de manos entre personas pacientes.","B":"Los guantes pueden reutilizarse en el mismo turno.","C":"Es correcto si no hay sangre visible.","D":"Solo debe lavarse las manos si hay contaminación visible."},"c":"A"},{"id":77,"q":"En una planta hospitalaria, se detecta un caso de infección nosocomial. El/La matrón/a participa en la revisión del caso y propone medidas. Durante la sesión, algunos/as profesionales sugieren aplicar medidas solo a personas pacientes con diagnóstico confirmado de infección. ¿Cuál es la actuación más adecuada según los principios de seguridad de la persona paciente?","o":{"A":"Aplicar precauciones estándar solo en personas pacientes con infección confirmada.","B":"Aplicar precauciones estándar a todas las personas pacientes.","C":"Aplicar aislamiento únicamente si hay síntomas graves.","D":"Limitar las medidas preventivas para evitar sobrecarga asistencial."},"c":"B"},{"id":78,"q":"¿Cuál de las siguientes es una acción específicamente mencionada para el ámbito del parto en la seguridad en el proceso asistencial gestación-parto-puerperio?","o":{"A":"Despliegue e implantación del protocolo de Atención al parto de emergencia fuera de las áreas de parto.","B":"Evaluar periódicamente el cumplimiento de los protocolos difundidos en el parto.","C":"Crear, impulsar y mantener el grupo de trabajo del proceso asistencial en el parto.","D":"Involucrar a las mujeres y familiares en la toma de decisiones a través del consentimiento informado."},"c":"A"},{"id":79,"q":"En relación con la consulta preconcepcional dentro de la atención maternoinfantil, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Su población diana son las mujeres embarazadas.","B":"Entre sus actividades se incluye identificar riesgos que durante el embarazo puedan ser un peligro para la salud de la madre o del feto.","C":"Su objetivo principal es el control y seguimiento del embarazo trimestre a trimestre.","D":"Se dirige exclusivamente a mujeres con patologías previas conocidas."},"c":"B"},{"id":80,"q":"¿Cuál de las siguientes afirmaciones es correcta sobre la menarquia?","o":{"A":"La menarquia suele aparecer inmediatamente después del inicio del desarrollo mamario, con un intervalo medio de menos de un año.","B":"En los primeros años después de la menarquia es frecuente que los ciclos sean regulares y ovulatorios desde el principio.","C":"Una vez que los ciclos están establecidos, la duración normal del ciclo menstrual es de entre 21 y 35 días, siendo el promedio de 28 días.","D":"La cantidad de pérdida menstrual normal es superior a 8 apósitos empapados por día."},"c":"C"},{"id":81,"q":"Desde la perspectiva planteada para la educación grupal en salud de la mujer, ¿cuál de las siguientes definiciones corresponde a la concepción del \"aprendizaje grupal\"?","o":{"A":"Es un proceso donde el conocimiento es transmitido desde la persona educadora (que lo posee) hacia las personas del grupo (que carecen de él), de forma jerárquica y unidireccional.","B":"Es un proceso de elaboración conjunta donde el conocimiento se construye a partir del análisis de situaciones problemáticas, superando la idea de que es algo acabado que posee una sola persona.","C":"Es un método que busca principalmente la eficiencia administrativa, reduciendo costes sanitarios y el tiempo de consulta mediante la estandarización de la información.","D":"Es una técnica que permite a los/las profesionales sanitarios/as imponer cambios de conducta a las mujeres, utilizando la presión del grupo para modificar hábitos insanos."},"c":"B"},{"id":82,"q":"¿Cuál es su objetivo principal de la educación para la salud en la mujer?","o":{"A":"Transmitir información sanitaria exclusivamente.","B":"Fomentar cambios en actitudes y estilos de vida.","C":"Reducir costes sanitarios.","D":"Sustituir la atención clínica."},"c":"B"},{"id":83,"q":"En relación con la educación sanitaria en la adolescencia, ¿cuál es el papel más adecuado del/de la matrón/a?","o":{"A":"Limitarse a tratar patologías ginecológicas.","B":"Centrarse solo en anticoncepción.","C":"Promover la salud sexual y prevenir conductas de riesgo.","D":"Intervenir solo si hay embarazo."},"c":"C"},{"id":84,"q":"Respecto a la educación sanitaria en el climaterio y menopausia, ¿cuál es la intervención más adecuada?","o":{"A":"No realizar intervención educativa.","B":"Limitarse a tratamiento farmacológico.","C":"Proporcionar cuidados específicos e información.","D":"Derivar siempre a atención especializada."},"c":"C"},{"id":85,"q":"¿Cuál es el enfoque correcto del/de la matrón/a como agente de educación sanitaria en las distintas etapas evolutivas?","o":{"A":"Actuar solo en enfermedad.","B":"Adaptar la educación a las transiciones vitales.","C":"Aplicar el mismo contenido a todas las edades.","D":"Priorizar únicamente el ámbito hospitalario."},"c":"B"},{"id":86,"q":"¿Cuál de las siguientes afirmaciones acerca de la epidemiología de las enfermedades de transmisión sexual (ETS) es correcta?","o":{"A":"La mayor tasa de hospitalización por enfermedad pélvica inflamatoria (EIP) se encuentra en el grupo de 15 a 19 años cuando se ajusta por actividad sexual.","B":"Cuando se calculan las tasas utilizando el porcentaje de personas sexualmente activas por grupo de edad, la mayor tasa de gonorrea, sífilis y clamidias se encuentra en el grupo de 20 a 24 años.","C":"El mayor número de casos de ETS se presenta de forma consistente en el grupo de 15 a 19 años según todos/as los/as autores/as.","D":"La adolescencia no se considera una etapa de especial riesgo para ETS porque las personas adolescentes tienen menos parejas sexuales."},"c":"A"},{"id":87,"q":"¿Cuál de las siguientes opciones refleja correctamente el papel de la educación para la salud en la prevención primaria de las enfermedades de transmisión sexual (ETS)?","o":{"A":"La educación sexual debe iniciarse después del inicio de la actividad sexual, cuando ya se han comenzado las conductas de riesgo.","B":"La educación sexual retrasa el inicio de la actividad coital pero no mejora el uso de métodos anticonceptivos.","C":"La educación para la salud debe realizarse de forma sistemática y universal en las escuelas, iniciándola antes de los 15-16 años.","D":"A partir de los 16 años, cualquier intervención educativa en salud sexual tiene la misma eficacia que en edades más tempranas."},"c":"C"},{"id":88,"q":"¿Cuál de las siguientes afirmaciones sobre las campañas de promoción sanitaria para la prevención de las enfermedades de transmisión sexual (ETS) es correcta?","o":{"A":"Las campañas generales de información sanitaria son muy eficaces en los colectivos de alto riesgo.","B":"La promoción del preservativo debe ofertar aspectos positivos como el disfrute del placer sexual y la tranquilidad.","C":"Utilizar el miedo como herramienta en campañas es muy efectivo porque la amenaza de las ETS se percibe como cercana y cierta.","D":"La mejor medida de prevención de ETS es el uso sistemático del preservativo en todas las relaciones sexuales."},"c":"B"},{"id":89,"q":"Teniendo en cuenta el diseño de programas de prevención del consumo de sustancias adictivas en jóvenes, ¿cuál de las siguientes afirmaciones sobre las características de las personas adolescentes y jóvenes es la correcta?","o":{"A":"Las personas adolescentes consultan frecuentemente al sistema sanitario porque perciben su salud como frágil y vulnerable.","B":"La baja percepción del riesgo y el sentimiento de invulnerabilidad son factores protectores frente al consumo de sustancias.","C":"Las personas adolescentes y jóvenes rara vez consultan al sistema sanitario porque su salud autopercibida es buena.","D":"El sistema sanitario es percibido por las personas jóvenes como un promotor activo de su bienestar y salud."},"c":"C"},{"id":90,"q":"En el contexto de los programas de personas jóvenes para la promoción de estilos de vida saludables, el texto señala que el área de \"sexualidad y salud\" tiene como objetivo principal:","o":{"A":"Conocer las dimensiones del hecho sexual humano (placer, afectos, sentimientos, comunicación y reproducción).","B":"Aprender a utilizar correctamente los diferentes métodos anticonceptivos tanto teórica como prácticamente.","C":"Que los jóvenes perciban el riesgo de infección y reconozcan las prácticas sexuales seguras e inseguras.","D":"Desarrollar competencias para favorecer el ajuste psicosocial, como autoestima y habilidades sociales."},"c":"A"},{"id":91,"q":"Entre las principales causas que intervienen en el desarrollo de conductas de riesgo en adolescentes y jóvenes (como el consumo de alcohol o drogas) se incluyen todas las siguientes EXCEPTO:","o":{"A":"Una alta percepción del riesgo y sentimiento de vulnerabilidad.","B":"La falta de conocimientos y habilidades.","C":"La falta de apoyo familiar.","D":"La búsqueda de sensaciones nuevas."},"c":"A"},{"id":92,"q":"Una mujer acude a consulta de enfermería por dolores de cabeza crónicos e insomnio. Al explorar su situación, refiere que su pareja \"a veces se pone de mal humor\" y le insulta, pero dice que \"no es para tanto\" y que \"todas las parejas discuten\". Según el modelo de Prochaska y Diclemente, ¿cuál sería la actuación más adecuada en esta fase?","o":{"A":"Derivarla inmediatamente a servicios sociales y a la casa de acogida más cercana.","B":"Proponerle que asista a un grupo de mujeres para fortalecer su autoestima y comenzar el cambio.","C":"Ayudarla a elaborar un plan de seguridad detallado y analizar los obstáculos para separarse de su pareja.","D":"Fomentar la duda respecto a la aceptabilidad de la situación, identificando el maltrato con la pérdida de salud y explicando el círculo de la violencia."},"c":"D"},{"id":93,"q":"Una mujer que ya ha iniciado el proceso de separación de su agresor y ha tomado medidas para proteger a sus hijos e hijas, acude a una consulta de seguimiento. Manifiesta sentirse sola, con miedos e incertidumbre sobre el futuro, aunque afirma que no quiere volver con su expareja. Según el modelo de Prochaska y Diclemente, ¿cuál debería ser el objetivo principal del profesional sanitario en este momento?","o":{"A":"Ayudar a mantener las acciones emprendidas, identificar estrategias para prevenir recaídas y mantener la vigilancia sobre el riesgo.","B":"Acompañar a la mujer para determinar el mejor plan a seguir y evitar la precipitación en las decisiones.","C":"Aumentar la toma de conciencia y solucionar la incertidumbre a favor de establecer cambios, analizando obstáculos y miedos.","D":"Ayudar a reconducir el proceso hacia la contemplación, evitando sentimientos de fracaso si reconsidera volver con su pareja."},"c":"A"},{"id":94,"q":"Según la guía rápida de actuación para profesionales de la salud ante la violencia de género y las agresiones sexuales en Euskadi, ¿cuál es la consecuencia principal de que una/un profesional de enfermería active en el programa OSANAIA el check \"Mujer víctima de violencia de género\" dentro del dominio 9?","o":{"A":"Se genera automáticamente un parte de lesiones y una notificación obligatoria al juzgado de guardia.","B":"El sistema ofrece un plan de cuidados preconfigurado y, al integrarse con un RIC, activa una guía específica en Osabide Global.","C":"Se bloquea la posibilidad de modificar cualquier otro dato del dominio 9 durante las siguientes 72 horas.","D":"Se envía un aviso inmediato al equipo de servicios sociales de referencia y al agente de igualdad del centro de salud."},"c":"B"},{"id":95,"q":"Según la guía rápida de actuación para profesionales de la salud ante la violencia de género y las agresiones sexuales en Euskadi, ¿en qué situación o situaciones se debe emitir el parte de lesiones?","o":{"A":"Cuando la mujer lo solicite o lo consienta; cuando se valore un alto riesgo cercano en el tiempo de un episodio grave; o cuando la mujer esté convencida de su utilidad y en proceso de recuperación.","B":"Siempre que se identifiquen lesiones físicas visibles, aunque la mujer se niegue a dar su consentimiento.","C":"Únicamente cuando la mujer lo solicite expresamente, independientemente de la valoración del riesgo.","D":"Solo cuando el personal facultativo considere que existe suficiente evidencia para que el agresor sea condenado."},"c":"A"},{"id":96,"q":"Según la guía rápida de actuación para profesionales de la salud ante la violencia de género y las agresiones sexuales en Euskadi, señala la actuación correcta en relación con los aspectos prácticos del parte de lesiones:","o":{"A":"Antes de la redacción definitiva del parte, este debe leerse a la mujer y solicitar su consentimiento para el envío al juzgado, informándole sobre los pasos y consecuencias.","B":"Se debe evitar detallar el parentesco o la relación con el presunto agresor para no influir en la decisión judicial.","C":"El parte de lesiones debe ser cumplimentado exclusivamente por personal facultativo responsable de la asistencia, quedando prohibida su elaboración por otros profesionales de la salud.","D":"Una vez cumplimentado, el parte de lesiones se archiva únicamente en la historia clínica de la mujer, sin entregar copia a ella ni al juzgado para proteger su confidencialidad."},"c":"A"},{"id":97,"q":"Según la Guía de actuación para profesionales de la salud ante la violencia sexual en mujeres mayores de 14 años, ¿cuál de las siguientes medidas se indica en el plan de actuación en el Servicio de Urgencias para minimizar el impacto psíquico en la mujer agredida?","o":{"A":"Realizar la evaluación ginecológica y médica forense en días distintos para no saturar a la paciente.","B":"Mantener a la mujer en la sala de espera junto a otras personas pacientes para evitar el aislamiento.","C":"Indicar a la mujer que se lave y se cambie de ropa para eliminar restos de agresión antes de la exploración.","D":"Realizar la evaluación ginecológica y médica forense en un solo acto, de manera simultánea y coordinada."},"c":"D"},{"id":98,"q":"Según la Guía de actuación para profesionales de la salud ante la violencia sexual en mujeres mayores de 14 años, en el apartado de anamnesis y examen clínico, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El consentimiento informado para la recogida de muestras médico-legales puede ser únicamente verbal, al igual que para el resto de exploraciones.","B":"La mujer puede mostrar una alta sensibilidad durante la exploración ginecológica, por lo que se debe actuar con lentitud y preguntarle con frecuencia si puede proseguir.","C":"Durante la exploración ginecológica se debe proceder con rapidez para minimizar el malestar emocional de la mujer.","D":"El médico forense puede fotografiar las lesiones sin necesidad de consentimiento informado de la mujer, siempre que lo considere necesario para la investigación."},"c":"B"},{"id":99,"q":"Según la Guía de actuación para profesionales de la salud ante la violencia sexual en mujeres mayores de 14 años, en el apartado de tratamiento preventivo de enfermedades de transmisión sexual (ETS), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La profilaxis frente al VIH debe iniciarse siempre que hayan transcurrido menos de 72 horas desde la agresión, siendo su eficacia máxima en las primeras 2 horas, por lo que no debe demorarse su inicio en Urgencias.","B":"La profilaxis frente al VIH solo se indica si el agresor es conocido y tiene serología positiva confirmada, independientemente del tipo de exposición.","C":"En mujeres correctamente vacunadas frente a hepatitis B con HBsAC > 10 mUI/ml, se debe administrar siempre una dosis de gammaglobulina en las primeras 24 horas.","D":"La vacunación frente al virus del papiloma humano (VPH) está claramente recomendada por todas las sociedades científicas en todos los casos de agresión sexual."},"c":"A"},{"id":100,"q":"Según la Guía de actuación para profesionales de la salud ante la violencia sexual en mujeres mayores de 14 años, en el apartado de atención social, psicológica y jurídica, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Cuando la agresión sexual se produce dentro de la relación de pareja, no es necesario evaluar el riesgo de que la mujer vuelva a su domicilio, ya que la atención se centra exclusivamente en las lesiones físicas.","B":"La mujer agredida puede recibir atención social a través del servicio social de base de su Ayuntamiento, donde le orientarán sobre recursos como alojamiento temporal, ayuda psicológica y asesoramiento jurídico.","C":"En caso de que la persona agredida sea menor de edad, únicamente se debe informar a la familia, sin necesidad de contactar con los servicios sociales.","D":"El centro de crisis de atención a víctimas de violencia sexual 24 horas solo ofrece atención jurídica, excluyendo el acompañamiento psicológico y social."},"c":"B"},{"id":101,"q":"Según la Guía de actuaciones recomendadas en el Sistema Sanitario de Euskadi sobre mutilación genital femenina (MGF), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La OMS, en su clasificación de 1995, define el Tipo III como la resección parcial o total del clítoris y/o del prepucio, conocida como clitoridotomía.","B":"En la revisión de 2007, la OMS enfatiza que el Tipo III se centra en el estrechamiento de la abertura vaginal más que en la eliminación de órganos.","C":"La mutilación genital femenina se practica exclusivamente en niñas menores de 5 años, sin casos documentados en adolescentes o durante el embarazo.","D":"Estudios recientes indican que la edad de las niñas sometidas a MGF está aumentando gradualmente debido a una mayor resistencia por parte de las comunidades."},"c":"B"},{"id":102,"q":"Según la Guía de actuaciones recomendadas en el Sistema Sanitario de Euskadi sobre mutilación genital femenina (MGF), identifica la afirmación correcta sobre las consecuencias para la salud:","o":{"A":"Las complicaciones derivadas de la MGF son exclusivamente a corto plazo, como dolor intenso y hemorragia, sin consecuencias obstétricas a largo plazo.","B":"El grado de mutilación no influye en el tipo de complicación, siendo similares en todos los casos independientemente de si la mujer está infibulada o no.","C":"Entre las consecuencias a medio y largo plazo se incluyen alteraciones ginecológicas, urinarias, fístulas, dispareunia, esterilidad y complicaciones obstétricas como partos prolongados o mayor tasa de cesárea.","D":"Las organizaciones internacionales consideran que la MGF es principalmente un problema cultural sin relación con los derechos humanos fundamentales."},"c":"C"},{"id":103,"q":"Según el apartado de fundamentación ética de la Guía de actuaciones recomendadas en el Sistema Sanitario de Euskadi sobre mutilación genital femenina (MGF), identifica la afirmación correcta:","o":{"A":"La MGF vulnera el principio de no maleficencia por las graves consecuencias para la salud de las afectadas, y también vulnera el principio de justicia por ser una práctica discriminatoria basada en el sexo.","B":"La MGF es considerada éticamente admisible por el Comité Nacional de Bioética de Italia siempre que se realice en condiciones de higiene adecuadas.","C":"La MGF vulnera únicamente el principio de justicia, respetando el principio de no maleficencia al tratarse de una práctica tradicional consentida.","D":"La Convención sobre eliminación de toda forma de discriminación de la mujer (1979) no considera la MGF como una práctica discriminatoria, sino como una cuestión cultural."},"c":"A"},{"id":104,"q":"Según el apartado de actuaciones preventivas generales de la Guía de actuaciones recomendadas en el Sistema Sanitario de Euskadi sobre mutilación genital femenina (MGF), señala la respuesta correcta:","o":{"A":"La estrategia de prevención de la MGF debe desarrollarse exclusivamente en el nivel comunitario, siendo innecesaria la intervención individual o familiar.","B":"La detección de una MGF en una mujer no implica riesgo para sus hijas o niñas de su misma familia, por lo que no requiere medidas de alerta adicionales.","C":"La intervención educativa para la prevención puede incluir de manera proactiva a los hombres de estas comunidades, utilizando herramientas de Atención Familiar y adaptándose a sus características culturales.","D":"Las actuaciones preventivas y de detección de riesgo de MGF recaen exclusivamente en el ámbito hospitalario de ginecología y obstetricia, sin participación de Atención Primaria."},"c":"C"},{"id":105,"q":"¿Cuál de las siguientes afirmaciones sobre la histología y estructura del ovario es correcta?","o":{"A":"La médula ovárica es la zona donde se encuentran la mayoría de los folículos en sus diferentes estados de maduración, incluyendo los folículos de Graaf.","B":"El ovario está recubierto externamente por la túnica albugínea, una capa de tejido conjuntivo denso fibroso con función protectora, y por debajo de esta se encuentra el epitelio ovárico.","C":"Durante la menopausia, el ovario mantiene una actividad folicular constante, aunque los folículos son predominantemente atrésicos.","D":"En la médula del ovario, además de tejido conectivo fibroelástico laxo, vasos y nervios, se pueden encontrar ocasionalmente formaciones como la rete ovarii."},"c":"D"},{"id":106,"q":"En relación con la irrigación, inervación y estructuras de las trompas de Falopio y el útero, indique la opción correcta:","o":{"A":"Las trompas de Falopio reciben irrigación arterial exclusivamente de la arteria uterina, sin participación de la arteria ovárica.","B":"El cuello uterino (cérvix) presenta el mismo tipo de epitelio en toda su superficie: un epitelio cilíndrico con numerosas glándulas que se extiende desde el orificio cervical interno hasta el externo.","C":"La porción más ancha y larga de la trompa de Falopio es la porción ampular, que puede llegar a medir hasta 6 cm y su diámetro aumenta hacia el infundíbulo.","D":"Los vasos linfáticos del cuerpo uterino drenan exclusivamente en los nódulos linfáticos inguinales superficiales, a través del ligamento redondo del útero.."},"c":"C"},{"id":107,"q":"En relación con la anatomía de los genitales externos femeninos, ¿cuál de los siguientes enunciados es el verdadero?","o":{"A":"Los labios menores se insertan en el clítoris mediante dos hojas: la hoja posterior forma el prepucio del clítoris y la hoja anterior forma el frenillo del clítoris.","B":"El clítoris está compuesto por cuerpos cavernosos de tejido eréctil con grandes mallas vasculares, mientras que el glande del clítoris es de naturaleza conjuntiva con revestimiento mucocutáneo muy sensible.","C":"Las glándulas de Bartolino se abren en la base de los labios mayores y su función principal es secretar un líquido lubricante durante el coito, desarrollándose a partir de la menopausia.","D":"El himen es un septo completo que cierra totalmente el ostio vaginal en la mujer virgen, y sus formas más comunes son semilunar, anular y labiado."},"c":"B"},{"id":108,"q":"\"Una enfermera está realizando una valoración de la glándula mamaria a una gestante en el tercer trimestre. Durante la anamnesis, la paciente le pregunta por los cambios que está notando en sus mamas. La enfermera recuerda la anatomía mamaria.” ¿Cuál de las siguientes afirmaciones sobre la glándula mamaría es FALSA?","o":{"A":"La glándula mamaria se extiende desde la segunda hasta la sexta costilla y desde el borde externo del esternón hasta la línea axilar media, presentando una prolongación hacia la axila llamada \"prolongación axilar\".","B":"Los conductos galactóforos, antes de desembocar en el pezón, presentan unas dilataciones bajo la areola denominadas senos lactíferos, donde se acumula la leche que el/la niño/a debe exprimir al mamar.","C":"La irrigación arterial de la mama proviene principalmente de la arteria mamaria interna, la torácica lateral y las intercostales posteriores, formando una rica red de anastomosis que permite incisiones cutáneas sin riesgo de necrosis.","D":"Durante el embarazo y la lactancia, el tamaño de la mama aumenta exclusivamente por el crecimiento del tejido adiposo, mientras que el tejido glandular permanece inalterado hasta la menopausia."},"c":"D"},{"id":109,"q":"Señala el tipo de pelvis que se considera el más favorable para el parto debido a su morfología:","o":{"A":"Pelvis androide.","B":"Pelvis antropoide.","C":"Pelvis platipeloide.","D":"Pelvis ginecoide."},"c":"D"},{"id":110,"q":"Señala el principal desencadenante hormonal de la ovulación en el ciclo ovárico:","o":{"A":"Disminución de estrógenos.","B":"Aumento brusco de LH.","C":"Aumento progresivo de progesterona.","D":"Disminución de FSH."},"c":"B"},{"id":111,"q":"De las siguientes características, identifica la que corresponde a la fase secretora del ciclo endometrial:","o":{"A":"Proliferación activa del endometrio por acción de los estrógenos.","B":"Presenci
