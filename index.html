ipotensión por bloqueo simpático, punción accidental de duramadre con cefalea, lesiones de raíces nerviosas e inyecciones intravasculares o intratecales."},"c":"C"},{"id":230,"q":"¿Cuál de las siguientes afirmaciones sobre la indicación de analgesia neuroaxial en obstetricia es INCORRECTA?","o":{"A":"La analgesia neuroaxial está fuertemente recomendada en partos de nalgas y partos gemelares.","B":"En pacientes con obesidad mórbida, la analgesia neuroaxial puede ser especialmente útil al disminuir la necesidad de anestesia general.","C":"En el parto prematuro, la analgesia neuroaxial se considera una técnica beneficiosa.","D":"El bloqueo epidural facilita la identificación clínica del dolor asociado a la rotura uterina en pacientes con cesárea previa."},"c":"D"},{"id":231,"q":"¿Cuál de las siguientes afirmaciones sobre el uso de técnicas manuales para el alivio del dolor durante el trabajo de parto es INCORRECTA según la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"La evidencia cualitativa existente indica que el masaje puede reducir el dolor y mejorar la experiencia del parto.","B":"Las compresas tibias podrían ser perjudiciales para algunas mujeres, por lo que requieren una evaluación individualizada antes de su aplicación.","C":"La experiencia del profesional que atiende el parto puede influir en la necesidad y elección de técnicas de alivio del dolor.","D":"Las técnicas manuales presentan evidencia de beneficios, pero con certidumbre muy baja respecto a su efecto."},"c":"B"},{"id":232,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con lo expuesto en la guía de la Organización Mundial de la Salud de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"Las opciones no farmacológicas para aliviar el dolor pueden variar ampliamente según el contexto y el entorno donde se atiende el parto.","B":"Las técnicas como hipnoparto o acupuntura cuentan con fuerte evidencia cuantitativa de eficacia para reducir el dolor del trabajo de parto.","C":"Los profesionales deben informar a las mujeres sobre las opciones de alivio del dolor disponibles en su establecimiento y discutir ventajas y desventajas durante la atención prenatal.","D":"La certeza de la evidencia sobre los efectos beneficiosos de las técnicas manuales para el alivio del dolor es muy baja."},"c":"B"},{"id":233,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con lo expuesto en la guía de la Organización Mundial de la Salud (OMS) de cuidados durante el parto para una experiencia positiva respecto al uso de técnicas de relajación durante el trabajo de parto?","o":{"A":"La evidencia cualitativa existente indica que las técnicas de relajación pueden aliviar el dolor, reducir las molestias y mejorar la experiencia materna del parto.","B":"El contexto en el que se presta la atención y el tipo de profesional sanitario pueden influir en la necesidad de alivio del dolor y en las decisiones que toman las mujeres.","C":"Las técnicas de hipnoparto y acupuntura se consideran técnicas de relajación incluidas en la recomendación principal de la OMS para embarazadas sanas.","D":"Las preferencias de la mujer deben guiar la elección de técnicas de relajación, siempre que sean seguras y estén disponibles en el entorno de atención."},"c":"C"},{"id":234,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con lo expuesto en la guía de la Organización Mundial de la Salud de cuidados durante el parto para una experiencia de parto positiva sobre el uso de opioides para el alivio del dolor durante el trabajo de parto?","o":{"A":"Los opioides parenterales como fentanilo, diamorfina y petidina se consideran opciones recomendadas para embarazadas sanas que solicitan alivio del dolor, en función de las preferencias de la mujer.","B":"La petidina no es la opción opioide preferida debido a que los opioides de acción más corta suelen presentar menos efectos secundarios.","C":"Antes de administrar opioides, los profesionales deben informar sobre efectos secundarios como somnolencia materna, náuseas, vómitos y el riesgo de depresión respiratoria neonatal.","D":"En mujeres con antecedentes o presencia actual de adicción a opioides, se recomienda priorizar opioides de larga duración para evitar síndrome de abstinencia durante el parto."},"c":"D"},{"id":235,"q":"Respecto a la alimentación en el puerperio, ¿cuál de las siguientes recomendaciones es correcta?","o":{"A":"La mujer que amamanta debe reducir su ingesta calórica en 300 kcal respecto al embarazo.","B":"La mujer que no amamanta debe mantener la misma ingesta calórica que durante el embarazo.","C":"No es necesario modificar la ingesta de líquidos durante la lactancia.","D":"La mujer que amamanta debe aumentar su ingesta calórica en unas 500 kcal respecto a sus necesidades previas al embarazo."},"c":"D"},{"id":236,"q":"Según las etapas descritas por Rubin en los cambios fisiológicos en el puerperio, señala la características que corresponde a la etapa de aceptación:","o":{"A":"La mujer muestra independencia total y asume completamente su rol materno.","B":"La madre permanece pasiva, dependiente y suele relatar repetidamente su experiencia del parto.","C":"La mujer toma decisiones firmes y no necesita apoyo externo.","D":"Se produce el establecimiento del vínculo afectivo definitivo con el/la recién nacido/a."},"c":"B"},{"id":237,"q":"Respecto a la tristeza posparto o maternity blues, señala la respuesta correcta:","o":{"A":"Es un trastorno grave que afecta a menos del 5% de las puérperas.","B":"Aparece inmediatamente tras el parto y dura varios meses.","C":"Es un proceso leve y transitorio que suele aparecer alrededor del tercer día y resolverse en 7-10 días.","D":"Requiere tratamiento farmacológico en todos los casos."},"c":"C"},{"id":238,"q":"Indica qué afirmación sobre adaptación psicosocial en el puerperio es correcta:","o":{"A":"Los cambios psicosociales tras el nacimiento del bebé son poco frecuentes y suelen indicar un problema de adaptación que requiere intervención psicológica inmediata.","B":"Volver a vivir la experiencia del nacimiento mediante el relato a los demás ayuda a los padres a integrar lo vivido y compararlo con sus expectativas previas.","C":"El padre suele estar completamente preparado para la experiencia del nacimiento y comprende sin dificultad todos los cambios físicos y psicosociales que experimenta su pareja.","D":"La única respuesta emocional importante tras el parto es la reacción materna, siendo la paterna y la de los hermanos irrelevantes para la adaptación psicosocial."},"c":"B"},{"id":239,"q":"Señala la respuesta correcta sobre los cuidados durante el posparto inmediato (primeras dos horas) y la prevención de complicaciones.","o":{"A":"El uso sistemático de oxitocina intramuscular días después del parto es la medida más eficaz para reducir la pérdida de sangre en mujeres normales.","B":"La valoración del estado de la vejiga debe realizarse cada 15 minutos durante las dos primeras horas para evitar el riesgo de retención y hemorragia.","C":"Los factores de riesgo como el parto prolongado o la primiparidad eximen de realizar el control de constantes vitales cada 15 minutos.","D":"La consistencia del útero y la cuantía de la pérdida sanguínea solo deben comprobarse si la mujer presenta antecedentes de hemorragia en partos previos."},"c":"B"},{"id":240,"q":"¿Cuál es el mecanismo fisiológico que explica el incremento de la diuresis (aprox. 3 litros diarios) durante los primeros 4-5 días tras el parto?","o":{"A":"La recuperación inmediata del tono muscular de la vejiga y el esfínter uretral.","B":"La presencia de proteinuria residual y bacteriuria en una vejiga traumatizada.","C":"El mantenimiento de una tasa de filtración glomerular alta junto con un mayor volumen de sangre circulante.","D":"La normalización anatómica de los uréteres y pelvis renales en las primeras 48 horas."},"c":"C"},{"id":241,"q":"Señala la respuesta correcta sobre los cambios fisiológicos durante el puerperio, específicamente en el proceso de involución uterina y la regeneración endometrial:","o":{"A":"El útero disminuye su peso de 1.000 g a unos 300 g al final de la primera semana gracias a la reducción en el número de células miometriales.","B":"Los entuertos son contracciones dolorosas que suelen ser más intensas en mujeres primíparas debido a que su útero mantiene un grado de contracción permanente.","C":"La regeneración del endometrio se produce a partir de la capa profunda de la decidua, cubriendo toda la cavidad uterina en un periodo de 1 a 2 semanas.","D":"En las mujeres que no lactan, la primera menstruación ocurre habitualmente a los 15 días del parto y presenta un carácter bifásico (ovulatorio)."},"c":"C"},{"id":242,"q":"¿Cuál de las siguientes afirmaciones describe correctamente los cambios hematológicos y cardíacos en el puerperio inmediato?","o":{"A":"Se observa leucocitosis con aumento de granulocitos, posible trombocitosis y aumento transitorio del gasto cardiaco que se normaliza en días o semanas.","B":"Aparece leucopenia con linfocitosis y el gasto cardiaco disminuye de forma permanente.","C":"Se produce anemia constante, disminución de plaquetas y reducción del gasto cardiaco mantenida durante meses.","D":"La volemia permanece disminuida de forma prolongada y la bradicardia es permanente."},"c":"A"},{"id":243,"q":"En la vigilancia de la puérpera pasadas las primeras 2 horas tras el parto, señala la respuesta correcta:","o":{"A":"La fiebre puerperal se define como cualquier temperatura superior a 37,5 °C en una única medición.","B":"La deambulación debe retrasarse varios días para evitar complicaciones tromboembólicas.","C":"La retención urinaria es excepcional y no requiere especial vigilancia en el puerperio.","D":"Un sangrado vaginal excesivo obliga a descartar causas como desgarros, restos placentarios o atonía uterina."},"c":"D"},{"id":244,"q":"¿Cuál de las siguientes recomendaciones es correcta al alta de la puérpera?","o":{"A":"Se recomienda el baño diario en lugar de la ducha para mejorar la higiene.","B":"El reinicio de las relaciones sexuales puede considerarse, en general, a partir de las 2 semanas si hay adecuada recuperación.","C":"Las pérdidas de sangre deben desaparecer completamente en las primeras 24 horas.","D":"El ejercicio físico debe evitarse durante al menos 2 meses en todos los casos."},"c":"B"},{"id":245,"q":"¿Cuál es uno de los objetivos principales de la atención en el puerperio inmediato?","o":{"A":"Evitar completamente cualquier cambio fisiológico tras el parto.","B":"Favorecer la involución de los cambios del embarazo y detectar precozmente posibles complicaciones.","C":"Limitar el contacto entre la madre y el recién nacido durante las primeras horas.","D":"Administrar tratamiento farmacológico de forma sistemática."},"c":"B"},{"id":246,"q":"Durante las primeras 2 horas del puerperio, ¿cuál de los siguientes parámetros debe ser controlado de forma sistemática?","o":{"A":"Únicamente la temperatura corporal cada 24 horas.","B":"Las constantes vitales cada 15-20 minutos, el sangrado genital y la contracción uterina.","C":"Solo la alimentación de la madre.","D":"Exclusivamente el estado emocional de la madre."},"c":"B"},{"id":247,"q":"En el puerperio inmediato, una mujer presenta escaso sangrado vaginal externo, útero aumentado de tamaño y mal contraído a la palpación abdominal. Señala la respuesta correcta:","o":{"A":"Es un hallazgo normal debido a la involución uterina fisiológica.","B":"Puede indicar una hemorragia interna con acumulación de sangre en el útero.","C":"Sugiere una adecuada contracción uterina y evolución favorable.","D":"Es un signo de infección puerperal precoz."},"c":"B"},{"id":248,"q":"¿Cuál es la recomendación sobre la realización de la visita domiciliaria a la madre y al/a la recién nacido/a tras el alta puerperal?","o":{"A":"Debe realizarse únicamente si la madre solicita expresamente una revisión a domicilio, y nunca antes de la segunda semana de vida.","B":"Se considera una buena práctica realizarla en la primera semana de vida, antes de ser atendidos en el centro de atención primaria, por una matrona o enfermera con habilidades en cuidados neonatales y puerperales.","C":"Solo está indicada en familias con problemas socioeconómicos graves o cuando el recién nacido presenta bajo peso al nacer.","D":"Debe ser realizada exclusivamente por el pediatra durante el primer mes de vida, y su objetivo principal es administrar las vacunas del recién nacido."},"c":"B"},{"id":249,"q":"¿Cuál es la recomendación de la OMS sobre la frecuencia de las evaluaciones posparto de rutina?","o":{"A":"Una única visita integral a las 12 semanas del nacimiento.","B":"Una visita a las 3 semanas y otra a las 12 semanas posparto.","C":"Evaluaciones a los 3 días, 1 a 2 semanas y 6 semanas posparto.","D":"Contacto diario durante la primera semana, luego a las 4 y 8 semanas."},"c":"C"},{"id":250,"q":"¿Qué acciones se recomiendan específicamente durante la visita posparto integral?","o":{"A":"Realizar únicamente exploración mamaria y de genitales externos.","B":"Evaluación del suelo pélvico, detección universal de depresión posparto con escala de Edimburgo y recomendación de anticoncepción individualizada.","C":"Solicitar una mamografía a todas las pacientes y descartar violencia intrafamiliar solo si hay antecedentes.","D":"Limitar la exploración al abdomen y posponer los temas de lactancia y salud mental para una visita posterior."},"c":"B"},{"id":251,"q":"Según las recomendaciones sobre atención domiciliaria en el puerperio, señala la respuesta correcta:","o":{"A":"El primer contacto con el/la matrón/a de Atención Primaria debe realizarse antes del alta hospitalaria, programándose para el séptimo u octavo día de vida del/de la recién nacido/a.","B":"Se recomienda ofrecer al menos dos consultas en los primeros 40 días tras el alta: la primera entre las 24-48 horas después del alta y la otra al final de la cuarentena.","C":"Las visitas domiciliarias son obligatorias para todas las mujeres, sin posibilidad de realizarlas en un centro de salud u hospital.","D":"La exploración del estado emocional de la mujer solo se sugiere si ella o su familia manifiestan explícitamente algún cambio de ánimo."},"c":"B"},{"id":252,"q":"Una mujer de 32 años, primigesta, ha dado a luz hace 6 semanas y acude a consulta de rehabilitación del suelo pélvico para prevenir incontinencia urinaria futura. Durante la evaluación, se le enseñan ejercicios de contracción selectiva del suelo pélvico. Señala la respuesta correcta sobre la práctica de estos ejercicios:","o":{"A":"Para garantizar la correcta realización del ejercicio de contracción selectiva, se recomienda realizar un tacto muscular vaginal antes de comenzar el entrenamiento; si no es posible, basta con una valoración del núcleo fibroso central.","B":"La contracción selectiva de los músculos del suelo pélvico debe realizarse manteniendo la contracción durante 8-10 segundos y relajando 4-5 segundos.","C":"Durante el ejercicio de contracción perineal y abdominal, se debe realizar una inspiración prolongada y posteriormente una espiración manteniendo la contracción durante 10 segundos.","D":"El reconocimiento de la pelvis ósea y su movilidad se realiza exclusivamente con una maqueta, sin exploración de la pelvis propia de la embarazada."},"c":"A"},{"id":253,"q":"Una mujer de 28 años, primigesta, asiste a un curso de preparación al nacimiento. Durante la sesión dedicada al entrenamiento del suelo pélvico, la matrona le explica la técnica correcta para iniciar los ejercicios y evitar riesgos. Teniendo en cuenta el protocolo de preparación al nacimiento, señala la respuesta correcta:","o":{"A":"Durante la contracción selectiva, es fundamental realizar una apnea (contener la respiración) para maximizar la fuerza del ejercicio.","B":"La valoración del núcleo fibroso central es necesaria para detectar una \"contracción inversa\", la cual podría afectar negativamente al suelo pélvico.","C":"Para asegurar la eficacia del ejercicio de contracción selectiva, la mujer debe contraer simultáneamente los glúteos y los músculos abdominales.","D":"El ejercicio de contracción perineal y abdominal requiere realizar una inspiración profunda mientras se mantiene la contracción durante 3 segundos."},"c":"B"},{"id":254,"q":"¿Cuál es uno de los principales beneficios del ejercicio físico en el posparto?","o":{"A":"Disminuir la producción de leche materna.","B":"Prevenir problemas como disfunción del suelo pélvico y molestias musculoesqueléticas.","C":"Evitar completamente el cansancio en la madre.","D":"Sustituir la necesidad de descanso."},"c":"B"},{"id":255,"q":"¿Cuál de los siguientes es un objetivo fundamental del programa de ejercicios posnatales?","o":{"A":"Restaurar el suelo pélvico y fortalecer la musculatura abdominal y dorsal.","B":"Evitar cualquier tipo de movimiento durante las primeras semanas.","C":"Incrementar exclusivamente la masa muscular de las extremidades superiores.","D":"Reducir la ingesta calórica mediante ejercicio intenso."},"c":"A"},{"id":256,"q":"Respecto a los ejercicios de Kegel en el posparto, señala la respuesta correcta:","o":{"A":"Solo sirven para mejorar la estética corporal.","B":"Están contraindicados en todas las mujeres tras el parto.","C":"Deben realizarse una vez a la semana para ser efectivos.","D":"Se basan en contraer y relajar el músculo pubococcígeo para fortalecer el suelo pélvico."},"c":"D"},{"id":257,"q":"¿Qué dificultad principal hace que la rehabilitación del suelo pélvico sea especialmente compleja en comparación con otros músculos del cuerpo?","o":{"A":"Que la contracción del músculo perineal no es apreciable visualmente por ser un músculo interno.","B":"Que los músculos del periné se fatigan muy rápidamente, impidiendo sesiones largas de ejercicio.","C":"Que solo puede rehabilitarse mediante cirugía, ya que el ejercicio no es efectivo en esta zona.","D":"Que los ejercicios de Kegel están contraindicados en la mayoría de mujeres postparto."},"c":"A"},{"id":258,"q":"¿Cuál de las siguientes situaciones o factores NO se menciona como causa de debilidad o agresión del suelo pélvico?","o":{"A":"El embarazo, debido al mayor peso del útero y el efecto de hormonas como la relaxina.","B":"La falta de estrógenos en el periodo postmenopáusico, que produce flacidez y debilidad muscular.","C":"Realizar ejercicios de Kegel de forma precoz en el postparto, ya que incrementan la presión abdominal.","D":"El uso de ropa ajustada, el estreñimiento y el tabaquismo (por la tos crónica)."},"c":"C"},{"id":259,"q":"¿Cuál de las siguientes afirmaciones sobre los métodos de rehabilitación del suelo pélvico es correcta?","o":{"A":"La electroestimulación para la incontinencia urinaria de esfuerzo debe aplicarse con frecuencias de 10 Hz y con la intensidad máxima tolerable.","B":"El stop test consiste en cortar la micción durante la eliminación y repetir esa contracción treinta veces al terminar de orinar, y se considera el biofeedback más fácil que pueden realizar las pacientes.","C":"En la exploración manual, para valorar la tensión muscular se introducen los dedos pulgar e índice en la vagina, separados 5 cm, apoyados en el músculo pubococcigeo.","D":"Los deportes considerados de menor riesgo para el suelo pélvico son gimnasia, aeróbic, baloncesto y equitación."},"c":"B"},{"id":260,"q":"¿Cuál es la recomendación actual sobre la estancia hospitalaria tras un parto normal?","o":{"A":"Permanece siempre a criterio exclusivo de la puérpera, sin límite establecido.","B":"Depende únicamente de si se realizó o no episiotomía.","C":"Debe ser de al menos 72 horas para garantizar la seguridad.","D":"No debe superar las 48 horas, según la SEGO y la SEN."},"c":"D"},{"id":261,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con lo expuesto en la guía de la Organización Mundial de la Salud de cuidados en el parto para una experiencia de parto positiva respecto al contacto piel con piel (CPP) del recién nacido?","o":{"A":"El contacto piel con piel inmediato ayuda a prevenir la hipotermia en recién nacidos sin complicaciones.","B":"El contacto piel con piel inmediato favorece el inicio de la lactancia materna.","C":"La guía recomienda mantener al recién nacido sin complicaciones en CPP con su madre durante la primera hora tras el nacimiento.","D":"La guía establece que la duración recomendada del contacto piel con piel debe extenderse más allá de la primera hora para recién nacidos sin complicaciones."},"c":"D"},{"id":262,"q":"¿Cuál de las siguientes recomendaciones sobre el baño del recién nacido es correcta según la Organización Mundial de la Salud en su guía de cuidados en el parto para una experiencia de parto positiva?","o":{"A":"El baño se debe retrasar hasta 24 horas después del nacimiento. Si esto no es posible por motivos culturales, el baño se debe retrasar al menos seis horas.","B":"El baño se debe retrasar hasta 24 horas después del nacimiento. Si esto no es posible por motivos culturales, el baño se debe retrasar al menos ocho horas.","C":"El baño se debe retrasar hasta 24 horas después del nacimiento. Si esto no es posible por motivos culturales, el baño se debe retrasar al menos cuatro horas.","D":"El baño se debe retrasar hasta 24 horas después del nacimiento. Si esto no es posible por motivos culturales, el baño se debe retrasar al menos doce horas."},"c":"A"},{"id":263,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con los cuidados del recién nacido durante el período de transición?","o":{"A":"Durante el período de transición, la resistencia vascular pulmonar disminuye y el flujo sanguíneo a los pulmones aumenta de forma considerable.","B":"Las principales alteraciones del período de transición incluyen dificultad respiratoria, mala perfusión y necesidad de oxígeno complementario.","C":"El recién nacido debe ser valorado cada 30 a 60 minutos, evaluando frecuencia cardíaca, frecuencia respiratoria, temperatura, coloración y tono muscular.","D":"Todo recién nacido con sospecha de alteración de la transición debe ser trasladado inmediatamente a una unidad de mayor nivel de cuidados."},"c":"D"},{"id":264,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con la palpación de los pulsos femorales en el/la recién nacido/a?","o":{"A":"Los pulsos femorales pueden ser débiles durante los primeros dos días de vida, por lo que deben palparse con el/la niño/a tranquilo/a.","B":"Para facilitar la palpación, el explorador debe extender suavemente las extremidades inferiores del neonato hasta que queden planas sobre la cama.","C":"En caso de duda sobre la palpación de pulsos femorales, debe repetirse la exploración varias veces antes de considerar cualquier prueba adicional.","D":"Si persisten dudas respecto a los pulsos femorales, debe medirse la presión arterial en extremidades superiores e inferiores para investigar una posible coartación aórtica."},"c":"B"},{"id":265,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con lo que se conoce sobre la exploración y manejo de las clavículas en el/la recién nacido/a?","o":{"A":"Las fracturas de clavícula en el/la recién nacido/a suelen requerir tratamientos específicos porque con frecuencia dejan secuelas a largo plazo.","B":"Algunas fracturas de clavícula pueden no ser evidentes inmediatamente tras el nacimiento y hacerse más palpables en los días posteriores.","C":"Una fractura de clavícula consolidada puede detectarse durante las revisiones posteriores como una protuberancia endurecida.","D":"Muchas fracturas claviculares pasan desapercibidas en el período neonatal y no requieren más intervención que una manipulación cuidadosa para evitar molestias."},"c":"A"},{"id":266,"q":"¿Cuál de las siguientes afirmaciones NO se corresponde con los distintos tipos de edema en el/la recién nacido/a?","o":{"A":"El caput puede cruzar las líneas de sutura y suele desaparecer en 1–2 días.","B":"El cefalohematoma es una hemorragia subperióstica que no cruza las suturas y puede tardar semanas o meses en resolverse.","C":"La hemorragia subgaleal produce una tumefacción muy blanda que puede extenderse desde la nuca hasta la frente debido a la hemorragia bajo la aponeurosis.","D":"El cefalohematoma se presenta típicamente como una tumefacción blanda y laxa que fluye libremente entre planos, pudiendo desplazarse con facilidad hacia regiones alejadas del cuero cabelludo."},"c":"D"},{"id":267,"q":"¿Cuál de las siguientes afirmaciones sobre la exploración de los huesos del cráneo del recién nacido es correcta?","o":{"A":"La presencia de craneotabes requiere estudios complementarios, ya que suele ser un signo de patología ósea que no se resuelve espontáneamente.","B":"La ausencia de movilidad en las suturas sagital, coronal, lamboidea o metópica es un hallazgo normal durante los primeros días de vida del recién nacido.","C":"El moldeamiento de los huesos del cráneo observado en la exploración inicial suele resolverse espontáneamente en los días siguientes al nacimiento.","D":"La movilidad de las suturas indica una posible craneosinostosis y debe investigarse con estudios de imagen."},"c":"C"},{"id":268,"q":"¿Cuál de las siguientes afirmaciones es correcta?","o":{"A":"El parto por cesárea bajo anestesia regional entre las 37 y 39 semanas aumenta el riesgo de intubación neonatal.","B":"El parto vaginal a término aumenta la necesidad de intubación endotraqueal comparado con la cesárea.","C":"En ausencia de otros factores de riesgo prenatales, el parto por cesárea y bajo anestesia regional entre las 37 y 39 semanas de gestación no influye en la probabilidad de que el neonato requiera intubación endotraqueal.","D":"La anestesia general en cesáreas entre las 37 y 39 semanas de gestación disminuye la necesidad de intubación neonatal."},"c":"C"},{"id":269,"q":"¿Cuál es el rango de SpO₂ preductal ideal al minuto 1 de vida del recién nacido?","o":{"A":"70 %–75 %.","B":"60 %-65 %.","C":"80 %-85 %.","D":"85 %-95 %."},"c":"B"},{"id":270,"q":"A los 3 minutos después del nacimiento, la saturación preductal ideal es:","o":{"A":"70 %-75 %.","B":"75 %-80 %.","C":"65 %-70 %.","D":"85 %-95 %."},"c":"A"},{"id":271,"q":"¿En qué minuto la SpO₂ preductal ideal debe encontrarse entre 80 % y 85 %?","o":{"A":"Minuto 2.","B":"Minuto 4.","C":"Minuto 5.","D":"Minuto 10."},"c":"C"},{"id":272,"q":"¿Qué porcentaje aproximado de recién nacidos/as a término presenta respiración espontánea, FC >100 lpm y coloración rosada en los primeros minutos de vida?","o":{"A":"50%.","B":"70%.","C":"80%.","D":"90%."},"c":"D"},{"id":273,"q":"¿Cuál es la recomendación sobre el cribado auditivo neonatal universal y el seguimiento de los/as niños/as que no superan la prueba?","o":{"A":"El cribado debe realizarse únicamente en recién nacidos/as con factores de riesgo, y los que no pasen la prueba serán evaluados antes del año de vida.","B":"La prueba de elección son las otoemisiones por su mayor especificidad, y el cribado debe completarse antes de los 6 meses de edad.","C":"Todos los recién nacidos deben ser sometidos a cribado auditivo en su primer mes de vida, y los que no pasen la prueba deben recibir evaluación audiológica en los primeros 3 meses de vida.","D":"El cribado universal solo está indicado si el coste por caso detectado es inferior al del hipotiroidismo, y los/as niños/as que no pasen la prueba se reevalúan al año."},"c":"C"},{"id":274,"q":"Un/Una recién nacido/a sano/a permanece en la maternidad junto a su madre. Se le realiza cribado neonatal de hipoacusia mediante otoemisiones acústicas y potenciales evocados auditivos automatizados durante el periodo de estancia. La matrona explica a la madre la importancia de esta prueba. Teniendo en cuenta el cribado de hipoacusia neonatal, todas las siguientes afirmaciones son correctas EXCEPTO una:","o":{"A":"Los potenciales auditivos automatizados presentan una sensibilidad del 97-100% y una especificidad del 86-96%.","B":"Los potenciales auditivos evalúan la actividad de la vía auditiva desde el nervio auditivo (extremo distal) hasta el mesencéfalo.","C":"La prevalencia de hipoacusia en recién nacidos/as se estima entre 1,5 y 10 casos por 1.000 nacidos vivos, según el grado de afectación.","D":"En niños/as con factores de riesgo, la incidencia de hipoacusia grave puede elevarse hasta el 9%."},"c":"D"},{"id":275,"q":"¿Cuál es la recomendación sobre la toma de muestras para el cribado metabólico neonatal en los/as recién nacidos/as que reciben el alta precoz durante las primeras 24 horas de vida?","o":{"A":"Se les debe realizar la toma de muestra al cumplir los 15 días de vida, cuando ya han establecido una alimentación regular.","B":"Se les realiza la toma de muestra inmediatamente antes del alta, sin necesidad de una segunda muestra posterior.","C":"La toma de muestra se realizará inmediatamente antes del alta, y deben ser sometidos a cribado metabólico.","D":"Estos niños/as no precisan cribado metabólico porque el alta precoz no afecta a los resultados de las pruebas."},"c":"C"},{"id":276,"q":"¿Qué se recomienda específicamente para aliviar el dolor en los/as recién nacidos/as sometidos/as a la punción del talón para el cribado metabólico?","o":{"A":"Administrar siempre un antiséptico yodado antes de la punción para reducir la sensibilidad local.","B":"Utilizar exclusivamente la estimulación sensorial táctil, sin permitir el amamantamiento ni la sacarosa.","C":"Se debe utilizar el amamantamiento por su madre para aliviar el dolor; si no es posible, administrar sacarosa al 20% por vía oral 2 minutos antes del pinchazo.","D":"Administrar una dosis de 2 a 5 ml de sacarosa al 10% por vía intravenosa inmediatamente después del pinchazo."},"c":"C"},{"id":277,"q":"Un/Una recién nacido/a a término presenta temperatura de 35,5 ºC tras el parto. ¿Cuál es la causa MÁS probable?","o":{"A":"Pérdida de calor por evaporación tras el nacimiento.","B":"Inmadurez del centro termorregulador hipotalámico.","C":"Disminución del metabolismo basal.","D":"Déficit de grasa blanca."},"c":"A"},{"id":278,"q":"En relación con la respiración del RN, ¿Qué hallazgo obliga a sospechar patología?","o":{"A":"Frecuencia respiratoria de 50 rpm.","B":"Respiración irregular con pausas <10 segundos.","C":"Respiración abdominal predominante.","D":"Tiraje intercostal persistente."},"c":"D"},{"id":279,"q":"Un RN inicia lactancia materna. ¿Cuál es el signo MÁS fiable de una correcta alimentación?","o":{"A":"Llanto tras la toma.","B":"Duración de la toma >10 minutos.","C":"Aumento progresivo de peso y diuresis adecuada.","D":"Succión frecuente."},"c":"C"},{"id":280,"q":"Respecto a la eliminación en el RN, señale la opción correcta:","o":{"A":"La ausencia de meconio en 24 h es siempre fisiológica.","B":"El meconio aparece tras la primera semana.","C":"La eliminación de meconio tardía puede indicar patología.","D":"La orina aparece a partir del tercer día."},"c":"C"},{"id":281,"q":"En relación con la prevención del síndrome de muerte súbita del/de la lactante (SMSL), la medida MÁS efectiva es:","o":{"A":"Decúbito supino durante el sueño.","B":"Uso de mantas térmicas.","C":"Dormir en decúbito lateral.","D":"Evitar lactancia materna nocturna."},"c":"A"},{"id":282,"q":"Sobre el sueño y seguridad del/de la recién nacido/a, señale la FALSA:","o":{"A":"El sueño es irregular y fragmentado.","B":"Debe colocarse en decúbito supino para dormir.","C":"El colecho puede aumentar riesgos si no se realiza correctamente.","D":"Es recomendable el uso de almohadas para confort."},"c":"D"},{"id":283,"q":"En relación con la respiración del/de la recién nacido/a, señale la FALSA:","o":{"A":"La presencia de tiraje es un signo normal.","B":"Las pausas respiratorias cortas son fisiológicas.","C":"La respiración puede ser irregular.","D":"La frecuencia respiratoria suele ser elevada."},"c":"A"},{"id":284,"q":"Sobre la termorregulación del recién nacido, señale la FALSA:","o":{"A":"La grasa parda participa en la producción de calor.","B":"La hipotermia puede aumentar el consumo de oxígeno.","C":"El/La recién nacido/a produce calor principalmente mediante temblor.","D":"La evaporación es un mecanismo importante de pérdida de calor."},"c":"C"},{"id":285,"q":"¿Cuál es la función principal de un vínculo afectivo adecuado en el desarrollo del/de la niño/a?","o":{"A":"Evitar que el/la niño/a desarrolle autonomía.","B":"Proporcionar seguridad afectiva y favorecer el desarrollo emocional y social.","C":"Limitar la interacción con otras personas.","D":"Generar dependencia absoluta de los/las cuidadores."},"c":"B"},{"id":286,"q":"Respecto a la formación del vínculo afectivo en la familia, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Se crea de forma inmediata tras el nacimiento y no requiere mantenimiento.","B":"Surge espontáneamente pero necesita tiempo, dedicación y cuidado para consolidarse.","C":"Depende únicamente de factores biológicos.","D":"No influye en la identidad ni en la autoestima del/de la niño/a."},"c":"B"},{"id":287,"q":"Respecto al contacto precoz piel con piel (CPP) entre madre y recién nacido/a, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Favorece la adaptación del/de la recién nacido/a, reduce el estrés y estimula la liberación de oxitocina en la madre.","B":"Disminuye la secreción de oxitocina materna y retrasa la eyección de calostro.","C":"Aumenta los niveles de cortisol en el recién nacido, favoreciendo su adaptación al estrés.","D":"No influye en la lactancia ni en el vínculo afectivo madre-hijo/a."},"c":"A"},{"id":288,"q":"¿Cuál de las siguientes opciones forma parte de la definición más amplia del Método de Cuidado Madre Canguro (MMC)?","o":{"A":"El uso de incubadoras transparentes para mejorar la estimulación visual del neonato.","B":"El contacto piel a piel exclusivamente con la madre durante las primeras 24 horas.","C":"La lactancia materna exclusiva o casi exclusiva y el intento de alta temprana del hospital.","D":"La separación del/ de la recién nacido/a en una habitación individual para evitar infecciones."},"c":"C"},{"id":289,"q":"¿Cuáles un beneficio del Método Madre Canguro (MMC) para los recién nacidos prematuros?","o":{"A":"Aumenta la frecuencia de infecciones nosocomiales pero reduce su gravedad.","B":"Disminuye la producción láctea materna para evitar sobrecarga al prematuro.","C":"Acorta el periodo de sueño para favorecer la estimulación sensorial temprana.","D":"Reduce el dolor ante estímulos dolorosos, con una diferencia de 2 puntos en la escala PIPP a los 90 segundos de una punción en el talón."},"c":"D"},{"id":290,"q":"¿Cuál es una consecuencia de no protocolizar ni estructurar el Método Madre-Padre Canguro (MMC) en las unidades neonatales?","o":{"A":"Los padres aumentan espontáneamente el tiempo de contacto piel con piel para compensar la falta de normas.","B":"Las madres permanecen menos tiempo en canguro de forma espontánea.","C":"Los/as recién nacidos/as presentan mayor estabilidad de constantes vitales por ausencia de manipulación.","D":"Se reduce la variabilidad entre unidades europeas sobre qué niños/as pueden estar en canguro."},"c":"B"},{"id":291,"q":"¿Cuál de las siguientes afirmaciones sobre la posición y el tiempo mínimo del contacto piel con piel en el Método Madre-Padre Canguro (MMC) es correcta?","o":{"A":"El/La niño/a debe colocarse en decúbito supino sobre el abdomen de la madre para favorecer la digestión.","B":"La duración diaria del contacto piel con piel no debería ser inferior a 30 minutos para evitar el estrés por transferencia.","C":"El tiempo mínimo de cada sesión de MMC es de 20 minutos, tiempo suficiente para compensar el estrés de la transferencia.","D":"El/La niño/a se coloca en posición vertical entre los pechos de la madre o sobre el tórax del padre, en decúbito ventral (posición de rana), con la cabeza girada hacia un lado."},"c":"D"},{"id":292,"q":"¿Cuál es la recomendación sobre el cuidado canguro en relación con los procedimientos dolorosos?","o":{"A":"Debe suspenderse durante cualquier procedimiento que pueda causar dolor al/a la recién nacido/a.","B":"Se recomienda realizar los procedimientos dolorosos, si es posible, en método canguro.","C":"Solo se recomienda para procedimientos dolorosos si el/la recién nacido/a tiene más de 37 semanas.","D":"Está contraindicado durante procedimientos dolorosos porque aumenta el estrés del/de la neonato."},"c":"B"},{"id":293,"q":"¿Qué se afirma sobre el cuidado canguro después del alta hospitalaria?","o":{"A":"Solo puede realizarse en la unidad neonatal durante el ingreso, nunca en el domicilio.","B":"Si el/la niño/a no ha llegado a la edad de término, se puede mantener el cuidado canguro en domicilio con el apoyo adecuado.","C":"Está indicado únicamente para recién nacidos a término sin ninguna complicación.","D":"No se recomienda bajo ningún concepto una vez que el/la recién nacido/a ha sido dado de alta."},"c":"B"},{"id":294,"q":"¿Cuál de los siguientes beneficios se ha demostrado en los/las recién nacidos/as a término sanos que practican el contacto piel con piel precoz?","o":{"A":"Aumento del tiempo de llanto y disminución de los niveles de glucosa.","B":"Mayor frecuencia y duración de la lactancia materna.","C":"Disminución de la estabilidad cardiorrespiratoria y aumento de la ansiedad materna.","D":"El agarre al pecho materno en posición correcta se produce solo en el 20,5% de los casos."},"c":"B"},{"id":295,"q":"¿Qué se afirma sobre el contacto piel con piel cuando la madre no puede realizarlo por problemas de salud?","o":{"A":"Debe posponerse hasta que la madre se recupere, sin ninguna alternativa.","B":"El recién nacido debe permanecer en la incubadora hasta que la madre pueda realizar el contacto.","C":"Poner al/a la niño/a sobre el pecho desnudo del padre le ayudará en la lactancia y disminuirá el tiempo de llanto.","D":"Solo se permite el contacto con el padre si el/la niño/a ha llorado durante más de 30 minutos."},"c":"C"},{"id":296,"q":"¿Cuál es la relación entre el tiempo de contacto piel con piel sin interrupción y la probabilidad de que el/la recién nacido/a realice una toma de forma espontánea?","o":{"A":"Con más de 50 minutos de contacto y hasta un máximo de 110 minutos, la probabilidad de hacer una toma de forma espontánea es 8 veces mayor que si el tiempo es inferior a 50 minutos.","B":"Con menos de 30 minutos de contacto, la probabilidad de toma espontánea es 8 veces mayor que con más de 60 minutos.","C":"La probabilidad de toma espontánea no se modifica por el tiempo de contacto, sino solo por el olfato materno.","D":"Se necesita un mínimo de 120 minutos de contacto para duplicar la probabilidad de toma espontánea respecto a 50 minutos."},"c":"A"},{"id":297,"q":"Según la definición de la OMS de 1977, ¿qué característica determina que una expulsión o extracción del producto gestacional sea considerada un aborto?","o":{"A":"Edad gestacional menor de 22 semanas.","B":"Peso del embrión o feto de 500 gramos o menos.","C":"Ausencia de signos vitales tras el nacimiento.","D":"Longitud cráneo-caudal menor de 25 centímetros."},"c":"B"},{"id":298,"q":"¿Cuál es la incidencia estimada del aborto clínicamente reconocible en la población general?","o":{"A":"Entre el 5 y el 15% de todas las gestaciones.","B":"Entre el 10 y el 30% de todas las gestaciones.","C":"Entre el 30 y el 50% de todas las gestaciones.","D":"Más del 50% de todas las gestaciones."},"c":"B"},{"id":299,"q":"Respecto al sangrado vaginal en el embarazo temprano, ¿cuál de las siguientes afirmaciones se ajusta mejor?","o":{"A":"Aunque el sangrado vaginal es poco frecuente en el embarazo (<10%), cuando aparece indica en más del 50% de los casos una pérdida gestacional inminente.","B":"El sangrado vaginal no complicado suele acompañarse de inestabilidad hemodinámica, lo que incrementa el riesgo de aborto en la mayoría de gestantes.","C":"A pesar de ser un signo de alarma, la mayoría de las gestantes con sangrado (20– 25%) continúan con una evolución favorable, y entre el 90 y el 96% mantienen la gestación.","D":"La presencia de sangrado en el primer trimestre se considera un marcador con alto valor predictivo de mortalidad perinatal, motivo por el cual la mayoría de las gestaciones afectadas terminan en un mal resultado."},"c":"C"},{"id":300,"q":"Respecto a las distintas formas clínicas de aborto ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"En el aborto en curso, la distinción clásica entre fase incipiente y aborto inevitable sigue siendo clínicamente útil, ya que la dilatación cervical es fácilmente objetivable incluso en multíparas.","B":"El aborto incompleto y el aborto completo se diferencian fundamentalmente en la presencia de dolor persistente, ya que en el aborto incompleto el dolor suele desaparecer tras la expulsión parcial del tejido gestacional.","C":"El aborto diferido puede presentarse sin sangrado ni dolor, dado que la interrupción de la gestación no se acompaña de expulsión del tejido embrionario y puede no visualizarse el embrión incluso cuando no se trata de una gestación incipiente.","D":"En el aborto completo siempre persiste la hemorragia vaginal debido a la retención parcial del contenido gestacional, lo que obliga a descartar un aborto diferido mediante ecografía."},"c":"C"},{"id":301,"q":"Respecto a la exploración física en la valoración del posible aborto espontáneo, señale la opción correcta:","o":{"A":"La exploración con espéculo permite valorar la dilatación cervical de forma más precisa que el tacto vaginal, motivo por el cual es el método de elección para estimar la reversibilidad del proceso abortivo.","B":"La presencia de un sangrado similar o superior al de una menstruación se asocia a un pronóstico habitualmente desfavorable para la continuidad del embarazo, aunque la extracción de restos ovulares a través del orificio cervical externo no modifica el dolor.","C":"El tacto vaginal permite valorar, además de la dilatación cervical, si el tamaño y la forma del útero se correlacionan con la edad gestacional estimada; sin embargo, esta valoración puede ser difícil en mujeres con miomas, malformaciones uterinas u obesidad.","D":"Debido a su alta fiabilidad, la anamnesis y la exploración física suelen ser suficientes para el diagnóstico de certeza, quedando la ecografía reservada solo para casos con inestabilidad hemodinámica o sangrado incoercible."},"c":"C"},{"id":302,"q":"Respecto al tratamiento médico ambulatorio del aborto espontáneo, señale la opción correcta:","o":{"A":"La combinación de mifepristona seguida de misoprostol ofrece una tasa de éxito del 75% para gestaciones menores de 13 semanas, mientras que el empleo exclusivo de misoprostol alcanza tasas cercanas al 90%, especialmente por vía vaginal.","B":"La mifepristona actúa como análogo de prostaglandina E1, favoreciendo las contracciones uterinas y facilitando la expulsión del tejido ovular al sensibilizar el miometrio al misoprostol.","C":"En gestaciones del segundo trimestre, el protocolo difiere del primer trimestre, ya que se repite la administración de misoprostol hasta la evacuación completa, pudiéndose prescindir de mifepristona sin que ello contraindique el procedimiento cuando no esté disponible.","D":"Entre las contraindicaciones del tratamiento médico ambulatorio destacan la hemorragia vaginal abundante, los abortos incompletos y la presencia de estenosis mitral, aunque la insuficiencia renal no supone un impedimento para iniciar el tratamiento."},"c":"C"},{"id":303,"q":"¿Cuál de las siguientes opciones explica mejor el aumento observado en la incidencia del embarazo ectópico (EE) en los últimos años?","o":{"A":"La disminución de la prevalencia de la enfermedad inflamatoria pélvica y el menor uso de técnicas de reproducción asistida.","B":"El aumento del uso de métodos anticonceptivos, la cirugía tubárica reparadora y las técnicas de reproducción asistida, junto con un mejor diagnóstico precoz.","C":"La reducción del uso de métodos anticonceptivos y una baja frecuencia de diagnóstico precoz.","D":"La ausencia de avances en las técnicas de imagen que permitan detectar el EE de forma temprana."},"c":"B"},{"id":304,"q":"¿Cuál de las siguientes localizaciones del embarazo ectópico aumenta notablemente su frecuencia en técnicas de fecundación asistida en comparación con los ciclos naturales?","o":{"A":"Embarazo ístmico.","B":"Embarazo en la ampolla tubárica.","C":"Embarazo intersticial.","D":"Embarazo fimbrial."},"c":"C"},{"id":305,"q":"Respecto a la clínica del embarazo ectópico (EE), señale la respuesta correcta:","o":{"A":"La metrorragia suele ser abundante, debido a que la caída de progesterona provoca necrosis decidual masiva, siendo típica la expulsión de coágulos voluminosos.","B":"El dolor abdominal es más frecuente que la amenorrea y puede irradiarse al hipogastrio en caso de rotura tubárica.","C":"El shock hipovolémico continúa siendo una forma de presentación relativamente común, ya que la rotura tubárica ocurre en fases muy tempranas del EE gracias al déficit severo de β-hCG.","D":"La clínica del EE se caracteriza por dolor unilateral, metrorragia escasa y amenorrea prolongada, que habitualmente supera las 12 semanas antes del diagnóstico."},"c":"B"},{"id":306,"q":"Respecto a las manifestaciones clínicas de la placenta previa, señale la opción correcta:","o":{"A":"La hemorragia suele ser dolorosa debido a la distensión aguda del segmento inferior y se relaciona habitualmente con el esfuerzo físico.","B":"El sangrado asociado a rotura de membranas es más oscuro, menos abundante y típicamente doloroso.","C":"La placenta previa es la causa más frecuente de histerectomía posparto y supera a la atonía uterina como primera causa de transfusión.","D":"La metrorragia de la placenta previa es típicamente roja brillante, indolora, recidivante y puede desencadenarse por coito o por la distensión del segmento inferior."},"c":"D"},{"id":307,"q":"En relación con los factores de riesgo del Desprendimiento Prematuro Placenta Normo Inserta (DPPNI), señale la respuesta correcta:","o":{"A":"El mioma uterino y la edad materna avanzada son factores de riesgo bien establecidos, con un incremento del riesgo similar en ambos casos, y con odds ratios en rangos equivalentes.","B":"La rotura prematura de membranas incrementa el riesgo de DPPNI por hipertensión materna secundaria a pérdida súbita de líquido amniótico, lo que desencadena vasoconstricción miometrial severa.","C":"El antecedente de un DPPNI previo constituye el factor de riesgo más importante descrito, con un odds ratio muy superior al de otros factores, y su recurrencia suele aparecer más precozmente en gestaciones posteriores.","D":"La cocaína y el tabaco son factores de riesgo bien establecidos con evidencia sólida, ya que su mecanismo hipertensivo y vasoconstrictor ha demostrado de forma concluyente aumentar la incidencia de DPPNI."},"c":"C"},{"id":308,"q":"Respecto a la clínica del Desprendimiento Prematuro de Placenta Normo Inserta (DPPNI), señale la respuesta INCORRECTA:","o":{"A":"La hemorragia externa suele ser de color oscuro y de escasa intensidad, observándose en alrededor del 80% de los casos.","B":"El dolor abdominal está presente en aproximadamente dos tercios de los casos y puede pasar inadvertido o confundirse con dinámica uterina.","C":"La hemorragia vaginal es el mejor indicador clínico de gravedad materna, más útil que el dolor abdominal.","D":"Puede existir discordancia importante entre la cantidad de hemorragia externa y el estado hemodinámico de la gestante."},"c":"C"},{"id":309,"q":"Respecto a los criterios diagnósticos de preeclampsia y preeclampsia grave, según la terminología recomendada por el National High Blood Pressure Education Program Working Group, señale la respuesta INCORRECTA:","o":{"A":"Para diagnosticar preeclampsia grave es imprescindible demostrar proteinuria ≥ 2 g/24 h o ≥ 3+ en tira reactiva, ya que la presencia de síntomas visuales, dolor en epigastrio o restricción del crecimiento fetal no tiene valor diagnóstico sin proteinuria severa.","B":"La preeclampsia se define por cifras tensionales ≥ 140/90 mmHg después de la semana 20 en una mujer previamente normotensa, asociadas a proteinuria ≥ 300 mg/24 h.","C":"La presencia de presión arterial ≥ 160/110 mmHg constituye por sí sola un criterio de preeclampsia grave, incluso si la proteinuria no supera los 300 mg/24 h.","D":"La oliguria < 500 ml/24 h, la elevación de transaminasas ≥ 70 U/l o la trombocitopenia < 100.000/mm³ son criterios de gravedad independientemente de las cifras tensionales."},"c":"A"},{"id":310,"q":"¿Cuál de las siguientes afirmaciones sobre el manejo de la preeclampsia grave es INCORRECTA?","o":{"A":"En la preeclampsia grave deben evitarse sobrecargas de volumen, manteniendo una infusión intravenosa en torno a 75 ml/h y sin superar los 100–125 ml/h para reducir el riesgo de edema pulmonar.","B":"El sulfato de magnesio debe administrarse con una dosis de carga de 4 g en 5–10 minutos, seguido de una perfusión de 1–2 g/h, vigilando reflejos tendinosos profundos, diuresis y frecuencia respiratoria.","C":"El tratamiento antihipertensivo debe iniciarse cuando la presión arterial sistólica ≥ 160 mmHg o la diastólica ≥ 110 mmHg se mantiene más de 15 minutos, pudiéndose utilizar hidralazina o labetalol según las dosis recomendadas.","D":"En menores de 34 semanas, los corticoides sólo deben administrarse si no existen criterios de gravedad materna, pues en presencia de hipertensión severa o dolor en hipocondrio derecho se prefiere evitar su uso para no retrasar la resolución del embarazo."},"c":"D"},{"id":311,"q":"Respecto a la influencia de la diabetes en el embarazo, señale la respuesta correcta:","o":{"A":"La hipertensión es una complicación frecuente en gestantes diabéticas, apareciendo en un 10–20% de los casos y asociándose con mayor probabilidad a preeclampsia, especialmente cuando existe mal control glucémico o nefropatía.","B":"La incidencia de preeclampsia en mujeres con diabetes tipo 1 sin nefropatía es baja, y no se considera indicada la profilaxis con ácido acetilsalicílico en ninguna gestante diabética.","C":"El polihidramnios es infrecuente en gestantes diabéticas, y cuando aparece suele acompañarse de fetos pequeños para la edad gestacional por insuficiencia placentaria.","D":"El parto pretérmino tiene un riesgo similar al de la población general en embarazadas con diabetes bien controlada, por lo que no se considera un factor incrementado en esta población."},"c":"A"},{"id":312,"q":"Respecto a la patogenia de la diabetes gestacional (DG), señale la respuesta correcta:","o":{"A":"La resistencia a la insulina en la diabetes gestacional deriva fundamentalmente de una disminución en la secreción de hormonas placentarias como el lactógeno placentario humano y el cortisol, lo que reduce la necesidad de compensación por parte de las células beta.","B":"En la diabetes gestacional existe un incremento de la resistencia periférica a la insulina que no se explica por una disminución del número de receptores, sino por alteraciones posreceptoras, incluyendo defectos en la fosforilación del receptor de insulina y de proteínas intracelulares como IRS-1.","C":"La principal diferencia fisiopatológica entre la DG y la diabetes tipo 2 radica en que en la DG no existe alteración de la célula beta, sino únicamente resistencia periférica a la insulina inducida por el embarazo.","D":"La resistencia insulínica gestacional se considera un mecanismo simple y monofactorial originado por la acción de una única hormona placentaria, sin participación de citocinas como el TNF-α o de hormonas como la leptina."},"c":"B"},{"id":313,"q":"En relación a la profilaxis y absorción del hierro durante el embarazo, señale la respuesta correcta:","o":{"A":"El hierro no hem, presente en legumbres, vegetales y cereales, tiene una absorción intestinal pobre que puede verse interferida por factores de la dieta, y su absorción mejora con vitamina C y empeora con lácteos, ácido fítico y polifenoles.","B":"El hierro hem, de origen vegetal, tiene una absorción intestinal baja (menos del 5%) y depende en gran medida de la composición de la dieta, por lo que suele requerir suplementación adicional desde el inicio del embarazo.","C":"La profilaxis de la anemia ferropénica requiere suplementación con 90 mg de hierro elemental al día desde el primer trimestre en todas las gestantes, independientemente de sus reservas iniciales de hierro.","D":"La absorción del hierro complementario es mayor cuando se toma junto con las comidas, evitando su administración en ayunas para prevenir interferencias con la absorción intestinal."},"c":"A"},{"id":314,"q":"Según la clasificación modificada de la OMS del riesgo cardiovascular materno, ¿cuál de las siguientes condiciones se clasifica como riesgo OMS III?","o":{"A":"Estenosis pulmonar no complicada","B":"Tetralogía de Fallot reparada.","C":"Defectos del tabique no reparados.","D":"Válvula mecánica."},"c":"D"},{"id":315,"q":"¿Cuál de las siguientes afirmaciones sobre la trombosis venosa profunda (TVP) en el embarazo es correcta?","o":{"A":"La mayoría de las TVP en el embarazo se localizan a nivel poplíteo.","B":"La diferencia de 2 cm o más en la circunferencia de la pantorrilla no tiene valor diagnóstico durante la gestación.","C":"El 70% de las TVP en gestantes son de localización iliofemoral.","D":"La TVP en el embarazo se presenta más frecuentemente en la pierna derecha por la compresión uterina."},"c":"C"},{"id":316,"q":"En relación con el abordaje clínico, terapéutico y organizativo de una gestante con diagnóstico confirmado de hiperemesis gravídica que requiere ingreso hospitalario debido a una deshidratación significativa, alteraciones electrolíticas iniciales y pérdida ponderal progresiva, ¿cuál de las siguientes opciones describe de manera más precisa, completa y acorde con las recomendaciones clínicas habituales la actuación inicial adecuada para estabilizar a la paciente, teniendo en cuenta la necesidad de mantener la homeostasis materno-fetal, evitar complicaciones metabólicas graves como la encefalopatía de Wernicke, reducir el riesgo de deterioro nutricional y garantizar una recuperación progresiva del estado general?","o":{"A":"Establecer ingreso hospitalario preferiblemente en habitación individual, restringiendo las visitas para disminuir estímulos desencadenantes de náuseas; iniciar hidratación intravenosa con soluciones glucosadas alternadas con Ringer lactato hasta 3.000 mL en 24 horas, corrigiendo el desequilibrio hidroelectrolítico según ionograma, e incorporar tiamina intravenosa en pauta de 100 mg/día durante 2–3 días cuando los vómitos son persistentes, con el fin de prevenir encefalopatía de Wernicke antes de continuar el manejo antiemético.","B":"Comenzar tratamiento antiemético de inmediato utilizando ondansetrón como primera línea para controlar el reflejo del vómito, evitando el uso de terapias intravenosas durante las primeras 24 horas para valorar la evolución espontánea del cuadro, ya que la rehidratación agresiva podría empeorar los síntomas digestivos y precipitar descompensación metabólica.","C":"Priorizar la introducción precoz de nutrición parenteral total por catéter venoso central en las primeras horas del ingreso para garantizar un aporte calórico completo desde el inicio, reservando la hidratación intravenosa convencional para fases posteriores si el estado nutricional no mejora.","D":"Limitar inicialmente la intervención al apoyo psicológico y la administración exclusiva de suero fisiológico a bajas velocidades, indicando la metoclopramida únicamente si persisten vómitos durante más de 72 horas, dado que la corrección del desequilibrio metabólico y vitamínico suele ser innecesaria en las primeras fases del tratamiento."},"c":"A"},{"id":317,"q":"En relación con la interpretación integrada de la evidencia disponible sobre el manejo farmacológico y no farmacológico de las náuseas, los vómitos y la pirosis durante el embarazo (considerando la calidad metodológica de los estudios, la ausencia de riesgos significativos asociados a los antiácidos, la equivalencia entre antiácidos simples y combinados con ranitidina en cuanto al alivio del dolor por pirosis, así como la recomendación generalizada de intervenciones dietéticas y de estilo de vida apoyadas en evidencia de muy baja calidad), ¿Cuál de las siguientes afirmaciones refleja de manera más ajustada las conclusiones que pueden derivarse del resumen de evidencia y de las recomendaciones clínicas disponibles?","o":{"A":"La evidencia, aunque mayoritariamente de calidad baja o muy baja, sugiere que los antiácidos son una opción terapéutica razonable y segura para el alivio de la pirosis en embarazadas, mostrando mejoras parciales o completas frente al placebo, una baja incidencia de efectos adversos y sin diferencias significativas cuando se combinan con ranitidina, dentro de un enfoque que debe complementarse con medidas de estilo de vida como la elevación de la cabecera de la cama y la modificación de la dieta; mientras que para las náuseas y vómitos se recomienda iniciar piridoxina como primera opción, pudiendo considerarse antihistamínicos, jengibre o acupresión como alternativas, reservando las fenotiacinas como intervención de último recurso.","B":"Los antiácidos deberían evitarse como tratamiento inicial en la pirosis del embarazo debido a la elevada incertidumbre sobre su eficacia y seguridad, siendo preferible iniciar inhibidores de la bomba de protones; además, medidas como la reducción de cafeína o el fraccionamiento de comidas carecen de cualquier forma de evidencia, por lo que no deben recomendarse.","C":"La ranitidina ha demostrado de manera consistente ser superior a los antiácidos solos para disminuir el dolor por pirosis a corto y largo plazo, por lo que el manejo de elección debe basarse en antagonistas H2 en todas las embarazadas con pirosis, independientemente de la gravedad de los síntomas; los antiácidos deben reservarse exclusivamente para casos refractarios, y solo como coadyuvantes.","D":"Las modificaciones en el estilo de vida y de la dieta, como reducir cafeína, grasas o tamaño de las comidas, constituyen el tratamiento único recomendado, ya que han demostrado evidencia sólida y de alta calidad para resolver tanto la pirosis como las náuseas y vómitos, por lo que no es necesario considerar opciones farmacológicas salvo en casos extremadamente excepcionales."},"c":"A"},{"id":318,"q":"Respecto al diagnóstico del cáncer de mama durante el embarazo, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La mamografía mantiene durante la gestación su sensibilidad habitual y constituye la técnica de elección para explorar la mama, mientras que la ecografía se reserva únicamente para la evaluación de adenopatías axilares o para casos en los que la mamografía resulta indeterminada.","B":"Aunque la mamografía puede realizarse durante el embarazo y supone un riesgo muy bajo para el feto, su sensibilidad disminuye notablemente debido a la densidad mamaria fisiológica aumentada (63–78%), por lo que la técnica de imagen preferida es la ecografía mamaria, ya que permite diferenciar lesiones sólidas de quísticas, evaluar la axila y no implica radiación; aun así, el diagnóstico definitivo debe realizarse mediante biopsia con aguja gruesa o trucut, reservando la extirpación quirúrgica únicamente cuando la biopsia no es concluyente y persiste una alta sospecha clínica.","C":"La exposición a radiación en cualquier cantidad contraindica de manera absoluta la realización de mamografías durante la gestación, por lo que la única técnica diagnóstica adecuada es la ecografía; en caso de duda, se recomienda extirpar quirúrgicamente toda lesión palpable para evitar retrasos diagnósticos.","D":"La ecografía mamaria presenta un rendimiento muy limitado durante el embarazo debido a la distorsión del tejido glandular, por lo que el método diagnóstico más fiable es la mamografía, que debe realizarse en todas las gestantes sintomáticas, complementándose en la mayoría de los casos con resonancia magnética con contraste."},"c":"B"},{"id":319,"q":"Respecto al embarazo tras haber superado un cáncer, especialmente cáncer de mama, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El embarazo tras un cáncer de mama incrementa significativamente el riesgo de recurrencia, por lo que suele considerarse una contraindicación formal.","B":"La gestación después de un cáncer de mama no empeora el pronóstico ni la supervivencia, incluso en mujeres portadoras de mutaciones BRCA1 o BRCA2.","C":"Las mujeres que se quedan embarazadas tras el tratamiento de un cáncer de mama presentan una tasa de mortalidad claramente superior a la de mujeres que no se embarazan.","D":"Debido a los niveles elevados de estrógenos durante la gestación, se recomienda evitar completamente el embarazo tras un cáncer de mama, especialmente en estadios precoces."},"c":"B"},{"id":320,"q":"Respecto a la profilaxis de la isoinmunización Rh(D) en gestantes Rh(D) negativo no sensibilizadas, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Una dosis estándar de 150 µg de inmunoglobulina anti-D es suficiente para neutralizar cualquier hemorragia feto-materna, por lo que no se requieren dosis adicionales ni ajuste según el volumen de sangre fetal detectado.","B":"La administración antenatal de 500 µg en la semana 28 está indicada si previamente se ha documentado una hemorragia feto-materna, ya que la profilaxis sistemática con anti-D antes del parto no ha demostrado disminuir el riesgo de sensibilización.","C":"Tras una hemorragia feto-materna significativa cuantificada mediante test de Kleihauer, debe incrementarse la dosis de inmunoglobulina anti-D calculando 20 µg adicionales por cada ml de sangre fetal detectado que exceda la cantidad cubierta por la dosis estándar, ajustando así el total necesario.","D":"El test de Coombs indirecto debe realizarse inmediatamente después de administrar 100 µg de anti-D para confirmar la aparición de anticuerpos anti-D endógenos, lo cual indica una profilaxis eficaz."},"c":"C"},{"id":321,"q":"Respecto a los mecanismos que regulan el crecimiento fetal desde el inicio de la gestación, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El regulador hormonal materno es el principal estimulante del crecimiento fetal y explica más del 50% de la variabilidad en el peso al nacer.","B":"La contribución genética paterna es el principal determinante del peso al nacimiento y actúa de forma independiente al fenómeno de imprinting.","C":"El regulador ambiental fetal es típicamente restrictivo y limita el efecto de los reguladores genéticos y hormonales maternos.","D":"Aproximadamente el 35–40% de la variación del peso al nacer se atribuye a factores genéticos, predominando la influencia del genotipo materno."},"c":"D"},{"id":322,"q":"En relación al tratamiento del crecimiento intrauterino restringido (CIR), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El reposo materno es una de las intervenciones más recomendadas, ya que mejora el flujo uteroplacentario y ha demostrado aumentar el crecimiento fetal y mejorar el pronóstico perinatal.","B":"La administración de soluciones glucosadas hipertónicas se recomienda como estrategia para mejorar la disponibilidad energética fetal, ya que reproduce el efecto de los embarazos diabéticos, favoreciendo un incremento significativo del crecimiento fetal.","C":"El ácido acetilsalicílico en dosis bajas (75–125 mg) iniciado antes de las 16 semanas reduce la incidencia de preeclampsia y CIR precoz, y es la única intervención farmacológica con evidencia clara de beneficio sobre la función uteroplacentaria.","D":"Los vasodilatadores uterinos, las macromoléculas expansoras plasmáticas y el uso de hormonas de crecimiento han demostrado eficacia clínica en la mejora del flujo placentario y por ello forman parte del tratamiento habitual del CIR."},"c":"C"},{"id":323,"q":"Respecto a la etiología del parto pretérmino (PP) espontáneo, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"El PP espontáneo suele deberse principalmente a alteraciones metabólicas maternas, siendo la infección intraamniótica una causa excepcional y poco relacionada con los mecanismos fisiopatológicos del trabajo de parto.","B":"La infección intraamniótica constituye la causa aislada más común del PP espontáneo y se incluye dentro del conjunto de procesos patológicos que pueden desencadenar este síndrome clínico.","C":"La mayoría de los PP espontáneos se producen por incompetencia cervical aislada, representando esta condición más del 80% de los casos descritos.","D":"El PP espontáneo se considera un evento único y homogéneo, generalmente atribuible a un solo mecanismo fisiopatológico claramente identificable."},"c":"B"},{"id":324,"q":"Respecto al riesgo de parto pretérmino (PP) en mujeres de edad materna avanzada, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Las mujeres mayores de 35 años presentan un riesgo muy elevado de parto pretérmino, tanto espontáneo como yatrogénico, duplicando al de las gestantes jóvenes.","B":"El riesgo de parto pretérmino en gestantes mayores de 35 años es bajo y solo ligeramente superior al de mujeres más jóvenes.","C":"La edad materna avanzada se asocia exclusivamente a un aumento del parto pretérmino yatrogénico, sin influencia sobre el PP espontáneo.","D":"La edad mayor de 35 años constituye uno de los principales factores de riesgo para el PP espontáneo, situándose entre los determinantes más importantes del síndrome."},"c":"B"},{"id":325,"q":"En relación al uso de progesterona en la prevención del parto pretérmino (PP), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La progesterona vaginal solo ha demostrado eficacia en mujeres sintomáticas con dinámica uterina y cuello uterino normal, iniciándose habitualmente después de la semana 30.","B":"El tratamiento con progesterona se recomienda de forma universal en todas las gestantes con factores de riesgo obstétricos, independientemente de la longitud cervical o antecedentes de PP.","C":"La progesterona ha demostrado beneficio en mujeres con antecedente de parto pretérmino previo y en mujeres asintomáticas con cuello uterino corto (< 20 mm), administrándose habitualmente en comprimidos vaginales de 200 mg/24 h desde alrededor de la semana 20 hasta las 34–37 semanas.","D":"La administración de progesterona oral es la opción recomendada en mujeres con cuello uterino corto, ya que ofrece mayor eficacia preventiva que la formulación vaginal."},"c":"C"},{"id":326,"q":"Respecto al uso de glucocorticoides en la administración antenatal para la maduración pulmonar fetal, ¿cuál de las siguientes afirmaciones es INCORRECTA?","o":{"A":"La betametasona y la dexametasona han demostrado diferencias claras en eficacia clínica, siendo la betametasona significativamente superior en los regímenes de administración estudiados.","B":"La pauta recomendada de betametasona consiste en 2 dosis de 12,5 mg por vía intramuscular separadas por 24 horas.","C":"La primera dosis de corticoides debe administrarse incluso cuando exista incertidumbre respecto a la posibilidad de completar el ciclo, dado que el beneficio neonatal puede iniciarse antes de las 24 horas.","D":"El pico de eficacia de los corticoides se sitúa entre el día 1 y el día 7 tras su administración, motivo por el cual es fundamental optimizar el momento del tratamiento."},"c":"A"},{"id":327,"q":"En relación al uso de sulfato de magnesio como estrategia de neuroprotección fetal en gestaciones con riesgo de parto prematuro inminente, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La administración de sulfato de magnesio no ha demostrado ningún beneficio en la reducción de parálisis cerebral en recién nacidos prematuros y por ello no se recomienda su uso rutinario antes del parto.","B":"El sulfato de magnesio ha demostrado disminuir la incidencia y gravedad de la parálisis cerebral en prematuros, recomendándose su administración en gestaciones únicas o múltiples entre las semanas 24+0 y hasta 29+6–33+6 con riesgo de parto inminente.","C":"El uso de sulfato de magnesio debe mantenerse de forma prolongada, independientemente de la proximidad del parto, ya que dosis más elevadas y regímenes largos han demostrado ser más seguros y eficaces.","D":"El bolo inicial de 4 g solo debe administrarse si se ha confirmado previamente la presencia de factores de riesgo neurológico fetal específico, ya que su uso sin mantenimiento no aporta ningún beneficio clínico."},"c":"B"},{"id":328,"q":"En relación con las intervenciones recomendadas sobre el cordón umbilical en recién nacidos/as prematuros/as, ¿qué opción coincide con la evidencia actual?","o":{"A":"Cuando el/la neonato/a se encuentra estable, se aconseja esperar al menos 30 segundos antes de realizar el clampaje, ya que este intervalo se asocia con una reducción de la mortalidad neonatal previa al alta.","B":"En prematuros/as, es preferible clampar el cordón de inmediato para evitar complicaciones, dado que no se ha demostrado ningún beneficio al retrasar el clampaje.","C":"El milking del cordón constituye una práctica recomendada de forma rutinaria en la prematuridad, pues proporciona una transfusión placentaria eficaz sin aumentar riesgos.","D":"Tanto el clampaje tardío como el milking pueden utilizarse indistintamente, porque ambos cuentan con un perfil de seguridad similar en prematuros/as de todas las edades gestacionales."},"c":"A"},{"id":329,"q":"Respecto al manejo del embarazo prolongado en gestaciones de bajo riesgo, ¿cuál de las siguientes afirmaciones es INCORRECTA?","o":{"A":"Antes de decidir entre inducción o conducta expectante, es imprescindible verificar que la datación gestacional sea correcta, ya que una fecha mal establecida puede conducir a intervenciones inapropiadas.","B":"Las sociedades científicas recomiendan ofrecer a la gestante tanto la inducción del parto a partir de la semana 41 como la conducta expectante con vigilancia fetal hasta la semana 42, informando de riesgos y beneficios para decidir de forma compartida.","C":"La inducción del parto a partir de la semana 41 busca reducir la morbimortalidad fetal, evitar el ingreso neonatal y disminuir el riesgo de muerte fetal intraútero, sin aumentar por ello las complicaciones derivadas del procedimiento.","D":"Existe consenso en que la inducción sistemática es superior a la conducta expectante en todas las gestantes de más de 41 semanas, y se considera la estrategia recomendada por las guías clínicas actuales."},"c":"D"},{"id":330,"q":"¿Cuáles de los siguientes parámetros forman parte de las variables biofísicas evaluadas en el perfil biofísico fetal?","o":{"A":"Respiración fetal, movimientos corporales, tono fetal, líquido amniótico y test no estresante.","B":"Frecuencia cardíaca basal, aceleraciones, desaceleraciones, índice cerebro-placentario y peso fetal estimado.","C":"Madurez placentaria, doppler de la arteria umbilical, doppler cerebral medio, movimientos fetales y pH fetal.","D":"Actividad fetal diaria referida por la madre, índice de líquido amniótico, perfil de lactato y variabilidad a corto plazo computarizada."},"c":"A"},{"id":331,"q":"Respecto al uso del test no estresante (NST) durante el seguimiento expectante de las gestaciones prolongadas, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Tiene un valor predictivo positivo muy alto, por lo que un resultado no reactivo predice con gran fiabilidad la presencia de hipoxia fetal.","B":"El análisis automatizado de la variabilidad a corto plazo mejora la precisión diagnóstica, reduciendo la mortalidad perinatal en comparación con el NST convencional.","C":"Debe repetirse únicamente si aparece oligoamnios, ya que por sí solo no contribuye a la evaluación del bienestar fetal.","D":"Su uso sistemático ha demostrado ser superior a cualquier otra prueba disponible para la vigilancia fetal en el embarazo prolongado."},"c":"B"},{"id":332,"q":"Respecto al test estresante con oxitocina (test de Pose), ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Se emplea como prueba de primera línea en la monitorización fetal anteparto, debido a su baja tasa de falsos positivos.","B":"Consiste en inducir clínicamente tres contracciones en 10 minutos mediante oxitocina, y se reserva para casos seleccionados de test no estresante dudoso.","C":"Tiene un valor predictivo negativo limitado, por lo que no resulta útil para descartar compromiso fetal.","D":"Se recomienda su uso rutinario en los embarazos prolongados, dado que presenta menor riesgo para el feto que el test no estresante."},"c":"B"},{"id":333,"q":"Una gestante de 34 años, G3P2, con antecedente de dos cesáreas previas, acude para control ecográfico del tercer trimestre. La ecografía y la RM muestran una placenta con invasión que atraviesa el miometrio y alcanza la serosa uterina, sin evidencia de afectación de vejiga ni de otros órganos pélvicos. Según la clasificación de la Federación Internacional de Ginecología y Obstetricia (FIGO) 2020 del espectro de acretismo placentario (PAS), ¿qué grado corresponde a este hallazgo?","o":{"A":"Grado 1.","B":"Grado 2.","C":"Grado 3a.","D":"Grado 3b."},"c":"C"},{"id":334,"q":"Respecto a la corioamnionitis y su incidencia, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"La corioamnionitis clínica es más frecuente que la histológica en los partos pretérmino.","B":"La incidencia global de corioamnionitis en todas las gestaciones se estima alrededor del 10%.","C":"En gestantes con rotura prematura de membranas pretérmino, la incidencia de corioamnionitis puede alcanzar hasta el 70%.","D":"La incidencia de corioamnionitis aumenta conforme aumenta la edad gestacional, siendo mayor en las 34 semanas que en las 20–24 semanas."},"c":"C"},{"id":335,"q":"¿Cuál de las siguientes opciones se considera un factor de riesgo reconocido para el desarrollo de corioamnionitis?","o":{"A":"La realización de ecografía transvaginal durante el trabajo de parto.","B":"El uso de monitorización interna fetal y mayor número de tactos vaginales durante el parto.","C":"La edad materna adolescente.","D":"La administración de anestesia epidural durante el trabajo de parto."},"c":"B"},{"id":336,"q":"Se considera oligohidramnios cuando:","o":{"A":"El índice de líquido amniótico (ILA o índice de Phelan) es menor de 8 cm.","B":"La bolsa mayor mide menos de 3 cm.","C":"El índice de Phelan es mayor de 5 cm y la bolsa mayor mide más de 2 cm.","D":"El índice de Phelan es inferior a 5 cm o la bolsa mayor mide menos de 2 cm."},"c":"D"},{"id":337,"q":"Respecto al polihidramnios, señale la opción correcta:","o":{"A":"Se considera polihidramnios cuando el índice de Phelan es ≥ 20 cm o la columna máxima es ≥ 6 cm.","B":"El polihidramnios moderado se define cuando el índice de Phelan se sitúa entre 30,1 y 35 cm.","C":"El polihidramnios severo se define cuando el índice de Phelan está entre 25 y 30 cm.","D":"La presencia de una columna máxima de líquido amniótico ≥ 8 cm es criterio diagnóstico de polihidramnios."},"c":"D"},{"id":338,"q":"En relación con las causas y asociaciones del polihidramnios, señale la opción INCORRECTA:","o":{"A":"Las alteraciones gastrointestinales fetales son una causa rara de polihidramnios.","B":"Entre el 50–60% de los polihidramnios son idiopáticos.","C":"Aproximadamente un 30% de los polihidramnios se asocian a anomalías fetales.","D":"En los polihidramnios severos, el riesgo de anomalía fetal puede alcanzar el 80%."},"c":"A"},{"id":339,"q":"Respecto a la incidencia y factores de riesgo de la gestación múltiple, señale la opción INCORRECTA:","o":{"A":"La incidencia de gestación múltiple espontánea es aproximadamente del 1%.","B":"La regla clásica 1/90 permite estimar la incidencia de gestaciones de orden superior.","C":"En España, la incidencia de gestación múltiple ronda el 1% y suele ser menor que en otros países europeos.","D":"La reproducción asistida es el principal factor de riesgo conocido para gestación múltiple."},"c":"C"},{"id":340,"q":"Respecto al manejo intraparto del parto gemelar, señale la opción correcta:","o":{"A":"El parto gemelar es de alto riesgo y debe ser conducido idealmente por un equipo obstétrico y de matronas experimentado.","B":"La anestesia peridural está desaconsejada en el parto gemelar por dificultar la progresión del trabajo de parto.","C":"La monitorización fetal intermitente puede usarse de manera segura en la mayoría de los partos gemelares.","D":"La utilización de prostaglandinas está contraindicada en la gestación gemelar."},"c":"A"},{"id":341,"q":"En una gestación gemelar en la que el primer feto está en cefálica y el segundo en presentación no cefálica, señale la opción correcta:","o":{"A":"Cuando el segundo gemelo pesa menos de 1.500 g, es aceptable el parto vaginal con extracción podálica.","B":"Para pesos del segundo gemelo >1.500 g, la mayoría de autores coincide en que la cesárea sistemática ofrece mejores resultados perinatales.","C":"La diferencia de tamaño entre ambos gemelos rara vez condiciona la elección de la vía del parto.","D":"La versión interna con gran extracción para un segundo gemelo en situación transversal puede realizarse de forma segura por obstetras con experiencia mínima."},"c":"D"},{"id":342,"q":"La placenta que se caracteriza por la existencia de uno o varios lóbulos placentarios adicionales de pequeño tamaño (cotiledones aberrantes) a distancia de la placenta principal, con la que mantiene conexiones vasculares se denomina:","o":{"A":"Placenta succenturiata.","B":"Placenta bilobulada.","C":"Placenta fenestrada.","D":"Placenta extracorial."},"c":"A"},{"id":343,"q":"En relación al malestar psicológico en mujeres con embarazo de alto riesgo, señale la opción correcta:","o":{"A":"El malestar psicológico de tipo mixto representa alrededor del 22% de los casos.","B":"En 2005, la frecuencia global de malestar psicológico en embarazos de alto riesgo fue del 41,6%.","C":"El malestar psicológico predominantemente ansioso aparece en menos del 1% de las gestantes de alto riesgo.","D":"El malestar psicológico predominantemente disfórico representa cerca del 18,7% de los casos."},"c":"B"},{"id":344,"q":"Según el modelo de Bowlby–Parkes modificado por Davidson (1979), señale la opción que presenta las fases del duelo perinatal en el orden correcto:","o":{"A":"Fase de desorganización → Fase de nostalgia y búsqueda → Choque → Reorganización.","B":"Nostalgia y búsqueda → Reorganización → Desorganización → Choque.","C":"Choque → Nostalgia y búsqueda → Desorganización → Reorganización.","D":"Reorganización → Choque → Nostalgia y búsqueda → Desorganización."},"c":"C"},{"id":345,"q":"¿Cuál de las siguientes características se asocia de forma específica a la fase de nostalgia y búsqueda en el duelo perinatal?","o":{"A":"Aumento de la participación social y planificación del futuro.","B":"Sentimientos de vacío, aturdimiento y dificultad para aceptar la pérdida.","C":"Tristeza manifiesta, disminución de la autoestima y retraimiento social persistente durante meses.","D":"Pensamientos e imágenes casi alucinatorias, intentos inconscientes de buscar al bebé, llanto e ira."},"c":"D"},{"id":346,"q":"Según la clasificación de Thoms sobre los tipos anatómico-morfológicos de pelvis, señale la opción correcta:","o":{"A":"La pelvis braquipélica se caracteriza por tener un diámetro transverso más de 3 cm mayor que el conjugado obstétrico.","B":"En la pelvis dolicopélica, el diámetro transverso del estrecho superior es menor que el conjugado obstétrico.","C":"La pelvis platipélica presenta un diámetro transverso igual o hasta 1 cm mayor que el conjugado obstétrico.","D":"En la pelvis mesatipélica, el diámetro transverso del estrecho superior es entre 1 y 3 cm mayor que el conjugado obstétrico."},"c":"B"},{"id":347,"q":"Según la clasificación de Gibbs sobre distocia de hombros, señale la opción correcta:","o":{"A":"En la distocia unilateral, ambos
