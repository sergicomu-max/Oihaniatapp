a de glándulas rectilíneas y mitosis abundantes.","C":"Aparición de vacuolas subnucleares y secreción glandular por acción de la progesterona.","D":"Descamación de la capa funcional del endometrio."},"c":"C"},{"id":112,"q":"¿Cuál de las siguientes afirmaciones describe correctamente el proceso de la gametogénesis?","o":{"A":"Es un proceso en el que células haploides producen gametos diploides mediante mitosis.","B":"Es el proceso por el cual células diploides experimentan meiosis para formar gametos haploides especializados.","C":"Ocurre únicamente en la mujer y comienza antes de la pubertad.","D":"No depende de la acción de hormonas como FSH y LH."},"c":"B"},{"id":113,"q":"\"Un/Una estudiante de enfermería está comparando la gametogénesis femenina y masculina. Al estudiar la ovogénesis, identifica varias diferencias clave respecto a la espermatogénesis. ¿Cuál de las siguientes afirmaciones sobre la ovogénesis es cierta?\"","o":{"A":"Cada ovocito primario origina cuatro óvulos funcionales tras la meiosis.","B":"La ovogénesis comienza en la pubertad con la formación de las ovogonias.","C":"El resultado final de la ovogénesis es un óvulo funcional y tres corpúsculos polares no funcionales.","D":"Los ovocitos de primer orden completan la meiosis I antes del nacimiento."},"c":"C"},{"id":114,"q":"Identifica la afirmación correcta sobre la espermatogénesis:","o":{"A":"Durante la meiosis, un espermatocito primario origina cuatro espermátidas haploides.","B":"La espermatogénesis es un proceso discontinuo que se inicia antes de la pubertad y se detiene en la edad adulta.","C":"Cada espermatocito primario da lugar a un único espermatozoide funcional.","D":"La espermiogénesis corresponde a la fase en la que las espermatogonias se dividen por mitosis."},"c":"A"},{"id":115,"q":"Con respecto a la irrigación y el drenaje linfático del aparato genital femenino, indique cuál de las siguientes afirmaciones es la verdadera.","o":{"A":"La arteria ovárica se origina en la arteria hipogástrica y, tras recorrer el ligamento infundibulopélvico, se anastomosa con la arteria uterina en el ángulo formado por la trompa y el útero.","B":"La vagina recibe irrigación de múltiples fuentes arteriales, incluyendo ramas cervicovaginales de la uterina, arterias vaginales de la hipogástrica, y ramas de la pudenda interna y de la hemorroidal media.","C":"Los vasos linfáticos procedentes del fondo uterino drenan exclusivamente en los ganglios inguinales superficiales, siguiendo el trayecto del ligamento redondo, sin alcanzar nunca los ganglios preaórticos o aórticos laterales.","D":"Las arterias espirales, que son ramas de las arterias radiales internas, alcanzan la proximidad del epitelio superficial únicamente durante la fase proliferativa del ciclo menstrual."},"c":"B"},{"id":116,"q":"En relación con la inervación del aparato genital femenino, todas las siguientes afirmaciones son correctas EXCEPTO una. ¿Cuál de ellas es FALSA?","o":{"A":"Los genitales externos y el tercio inferior de la vagina reciben inervación somática del nervio pudendo (S2-S4), además de inervación autónoma.","B":"El plexo uteroovárico se origina en los ganglios aorticorrenal y mesentérico superior, sigue la arteria ovárica e inerva ovario, trompa y fondo uterino.","C":"Las fibras parasimpáticas del útero y vagina proceden de los nervios esplácnicos pélvicos (S2-S4) a través del plexo hipogástrico inferior.","D":"El plexo de De Lee Frankenhäuser está situado a la altura del fondo uterino y está formado exclusivamente por fibras simpáticas."},"c":"D"},{"id":117,"q":"En relación con la histología del cuerpo del útero, todas las siguientes afirmaciones son correctas EXCEPTO una. ¿Cuál de ellas es FALSA?","o":{"A":"El endometrio es la capa interna del útero y se descama cíclicamente durante la menstruación.","B":"El miometrio es la capa más gruesa del útero y está constituido por fibras musculares lisas.","C":"El peritoneo (serosa) es la capa que recubre externamente el fondo y la cara posterior del cuerpo uterino.","D":"El miometrio no experimenta cambios significativos durante el embarazo, manteniéndose con el mismo grosor y número de fibras."},"c":"D"},{"id":118,"q":"¿A partir de qué estructuras se forma la placenta y cuál es el orden correcto de las capas del corion embrionario en sus etapas iniciales?","o":{"A":"Se forma por la interacción entre la decidua endometrial y el corion; y este se compone, de dentro a fuera de mesénquima extraembrionario, citotrofoblasto y sincitiotrofoblasto.","B":"Se forma por la fusión del saco vitelino y el amnios; con capas ordenadas de fuera a dentro: sincitiotrofoblasto, mesénquima y citotrofoblasto.","C":"Se forma por la unión del miometrio y el epiblasto; las capas del corion son, de dentro a fuera, sincitiotrofoblasto, citotrofoblasto y mesénquima extraembrionario.","D":"Se forma a partir del trofoblasto; y sus capas internas desaparecen tras la implantación."},"c":"A"},{"id":119,"q":"Respecto a la formación de los cotiledones fetales, señale la opción correcta:","o":{"A":"Los cotiledones fetales se originan directamente de las vellosidades libres del espacio intervelloso, sin intervención de los troncos vellositarios de primer orden, y el número habitual es de 2 a 5 por placenta.","B":"A partir de las vellosidades de anclaje se forman troncos vellositarios de primer, segundo y tercer orden que se ramifican ampliamente en el espacio intervelloso; existen entre 60 y 70 troncos vellositarios de primer orden y entre 10 y 30 cotiledones fetales por placenta.","C":"Los troncos vellositarios primitivos se unen para formar exclusivamente vellosidades terciarias que luego reemplazan a los cotiledones fetales, por lo que estos desaparecen en las últimas semanas de gestación.","D":"El número de troncos vellositarios de primer orden y el número de cotiledones fetales es constante en todas las placentas humanas, fijado en 20 estructuras para cada uno."},"c":"B"},{"id":120,"q":"¿Cuál de las siguientes afirmaciones describe correctamente la función de los vasos del cordón umbilical?","o":{"A":"El cordón umbilical contiene una arteria y dos venas; las venas llevan sangre desoxigenada hacia la placenta.","B":"El cordón umbilical contiene dos arterias que llevan sangre desoxigenada hacia la placenta y una vena que devuelve al feto sangre rica en oxígeno, todo ello rodeado por gelatina de Wharton.","C":"Las arterias umbilicales transportan sangre oxigenada hacia el feto y la vena umbilical lleva sangre desoxigenada hacia la placenta.","D":"El cordón umbilical no contiene tejido conectivo y está formado únicamente por vasos sanguíneos recubiertos por el amnios."},"c":"B"},{"id":121,"q":"¿Cuál de las siguientes opciones describe correctamente la función endocrina de la placenta y algunas de las hormonas que produce?","o":{"A":"La placenta únicamente produce progesterona y estradiol, mientras que todas las demás hormonas necesarias para la gestación proceden del hígado fetal.","B":"La placenta produce exclusivamente hormonas proteicas tipo hipofisario, como la hCG y la hPL, pero no interviene en la síntesis de esteroides ni de factores de crecimiento.","C":"La placenta actúa como una glándula endocrina capaz de sintetizar más de 30 hormonas, entre ellas esteroideas (progesterona, E1, E2, E3), hormonas proteicas tipo hipofisario (hCG, hPL, hGH, hCT, ACTH) y hormonas tipo hipotalámico (GnRH, CRH, GHRH, somatostatina), además de factores de crecimiento como inhibina, activina y folistatina.","D":"La placenta solo libera hormonas a la circulación materna, mientras que las hormonas fetales se producen exclusivamente en las glándulas fetales durante toda la gestación."},"c":"C"},{"id":122,"q":"¿Qué proceso fundamental ocurre durante la tercera semana de gestación y establece las tres capas germinales del embrión?","o":{"A":"Neurulación.","B":"Implantación.","C":"Segmentación.","D":"Gastrulación."},"c":"D"},{"id":123,"q":"¿En qué días aproximadamente se cierran los neuroporos embrionarios durante el desarrollo?","o":{"A":"Neuroporo craneal día 21 y neuroporo posterior día 24.","B":"Neuroporo craneal día 25 y neuroporo posterior día 28.","C":"Neuroporo craneal día 30 y neuroporo posterior día 32.","D":"Neuroporo craneal día 28 y neuroporo posterior día 25."},"c":"B"},{"id":124,"q":"¿Cuál de las siguientes opciones NO es un proceso o característica relacionada con la formación del tubo intestinal derivado del endodermo?","o":{"A":"El endodermo forma el techo del saco vitelino.","B":"El plegamiento cefalocaudal incorpora parte del endodermo al embrión.","C":"El tubo gastrointestinal deriva principalmente del endodermo.","D":"El plegamiento lateral evita que el endodermo se incorpore al embrión."},"c":"D"},{"id":125,"q":"¿Cuál de las siguientes afirmaciones sobre el feto alrededor del sexto mes de gestación (24 semanas) es INCORRECTA?","o":{"A":"La piel puede verse rosada o rojiza debido a la visibilidad de los capilares.","B":"Las células alveolares comienzan a producir surfactante pulmonar.","C":"El lanugo se incrementa progresivamente y ya no se desprende.","D":"El feto empieza a acumular grasa y se cubre de vérnix caseoso."},"c":"C"},{"id":126,"q":"¿Cuál de los siguientes tejidos deriva del ectodermo?","o":{"A":"Músculo esquelético.","B":"Epitelio sensitivo.","C":"Bazo.","D":"Hígado."},"c":"B"},{"id":127,"q":"¿Cuál de las siguientes estructuras es un derivado del mesodermo?","o":{"A":"Páncreas.","B":"Sistema nervioso central.","C":"Cartílago.","D":"Amígdalas."},"c":"C"},{"id":128,"q":"¿Qué estructura deriva del endodermo?","o":{"A":"Glándulas sudoríparas.","B":"Hígado.","C":"Médula espinal.","D":"Hueso."},"c":"B"},{"id":129,"q":"El mesodermo de la placa lateral se divide en:","o":{"A":"Parietal y visceral.","B":"Paraxial y axial.","C":"Somítico y esplácnico.","D":"Intermedio y somático."},"c":"A"},{"id":130,"q":"¿Cuál de las siguientes afirmaciones NO corresponde al desarrollo embrionario durante el primer mes?","o":{"A":"Los primeros miembros en aparecer son los brazos, seguidos de las piernas.","B":"El embrión mide menos de 1,5 cm al final del primer mes.","C":"El corazón comienza a latir aproximadamente 60 veces por minuto.","D":"La sangre del embrión circula mezclada con la sangre materna."},"c":"D"},{"id":131,"q":"Gestante de 38 años, sin antecedentes personales relevantes, acude a consulta en la semana 12 de gestación. En el cribado combinado del primer trimestre presenta riesgo elevado de trisomía 21. ¿Cuál es la actuación MÁS adecuada?","o":{"A":"Repetir el cribado en el segundo trimestre.","B":"Realizar directamente tratamiento intrauterino.","C":"Ofrecer una técnica invasiva para confirmación diagnóstica.","D":"No hacer nada, ya que es un falso positivo frecuente."},"c":"C"},{"id":132,"q":"Pareja acude a consulta porque su primer/a hijo/a presenta una enfermedad genética monogénica autosómica recesiva. La mujer está embarazada de 10 semanas. ¿Cuál es la actuación MÁS adecuada en este momento?","o":{"A":"Realizar directamente cordocentesis.","B":"Ofrecer consejo genético y valorar diagnóstico prenatal.","C":"Esperar al nacimiento para confirmar.","D":"Realizar solo ecografías de control."},"c":"B"},{"id":133,"q":"En relación con las técnicas de diagnóstico prenatal, señale la opción correcta:","o":{"A":"Las técnicas invasivas permiten diagnóstico definitivo.","B":"Las técnicas no invasivas confirman el diagnóstico genético.","C":"Las técnicas invasivas se utilizan exclusivamente como cribado.","D":"Las técnicas no invasivas presentan mayor riesgo fetal."},"c":"A"},{"id":134,"q":"Respecto a las enfermedades genéticas, ¿Cuál de las siguientes asociaciones es INCORRECTA?","o":{"A":"Anomalía cromosómica: alteración en número o estructura.","B":"Monogénica: mutación en un solo gen.","C":"Multifactorial: interacción genes y ambiente.","D":"Multifactorial: exclusivamente genética."},"c":"D"},{"id":135,"q":"¿Cuál de las siguientes características corresponde a un programa de screening prenatal?","o":{"A":"Identificación de población de riesgo.","B":"Ausencia de falsos positivos.","C":"Alta especificidad diagnóstica absoluta.","D":"Confirmación de enfermedad genética."},"c":"A"},{"id":136,"q":"¿Cuál de las siguientes combinaciones es más adecuada para el diagnóstico prenatal de cromosopatías?","o":{"A":"Ecografía y marcadores bioquímicos: diagnóstico definitivo.","B":"Screening positivo: confirmación con técnica invasiva.","C":"Cariotipo: técnica no invasiva.","D":"Biología molecular. técnica de cribado."},"c":"B"},{"id":137,"q":"En relación con las técnicas invasivas, ¿Cuál de las siguientes afirmaciones es FALSA?","o":{"A":"Permiten estudio cromosómico fetal.","B":"Incluyen amniocentesis y cordocentesis.","C":"No presentan riesgos para el feto.","D":"Permiten diagnóstico mediante biología molecular."},"c":"C"},{"id":138,"q":"Respecto a las anomalías genéticas, señale la opción correcta:","o":{"A":"Las enfermedades multifactoriales dependen exclusivamente de un gen.","B":"Las anomalías cromosómicas afectan a la estructura o número de cromosomas.","C":"Las enfermedades monogénicas siempre son letales.","D":"Las cromosopatías no pueden detectarse prenatalmente."},"c":"B"},{"id":139,"q":"El consejo genético tiene como principal objetivo:","o":{"A":"Diagnosticar enfermedades genéticas.","B":"Curar enfermedades hereditarias.","C":"Sustituir el diagnóstico prenatal.","D":"Informar y asesorar a la pareja sobre riesgos genéticos."},"c":"D"},{"id":140,"q":"¿Cuál de los siguientes métodos corresponde a una técnica de screening prenatal?","o":{"A":"Marcadores bioquímicos.","B":"Biopsia corial.","C":"Cariotipo fetal.","D":"Amniocentesis."},"c":"A"},{"id":141,"q":"En el contexto del diagnóstico prenatal, ¿qué combinación corresponde correctamente a una estrategia de cribado seguida de confirmación diagnóstica?","o":{"A":"Ecografía y Test de Apgar.","B":"Biopsia corial y Screening bioquímico.","C":"Amniocentesis y Ecografía.","D":"Marcadores bioquímicos y Cariotipo fetal."},"c":"D"},{"id":142,"q":"¿Cuál de los siguientes elementos forma parte del estudio genético prenatal básico?","o":{"A":"Electrocardiograma fetal.","B":"Determinación del cariotipo.","C":"Test de Apgar.","D":"Monitorización uterina."},"c":"B"},{"id":143,"q":"¿Cuál de los siguientes factores está relacionado con la aparición de defectos congénitos y se evalúa en el diagnóstico prenatal?","o":{"A":"Infecciones durante la gestación.","B":"Grupo sanguíneo materno.","C":"Edad paterna exclusivamente.","D":"Sexo fetal."},"c":"A"},{"id":144,"q":"En cuanto a las recomendaciones en la consulta preconcepcional en relación con las enfermedades crónicas más frecuentes, todas las siguientes afirmaciones son correctas EXCEPTO una:","o":{"A":"Se recomienda realizar el cribado de diabetes mellitus a todas las mujeres con un índice de masa corporal superior a 25 y uno o más factores de riesgo para diabetes mellitus.","B":"Se recomienda realizar cribado de hipotiroidismo a todas las mujeres sintomáticas.","C":"Se recomienda realizar cribado de trombofilias a todas las mujeres que presenten antecedentes familiares y/o personales de riesgo.","D":"Se recomienda a las pacientes epilépticas con tratamiento anticonvulsivante tomar 4 mg de ácido fólico desde al menos 3 meses antes de la gestación y durante todo el embarazo."},"c":"C"},{"id":145,"q":"La potencial repercusión de la infección prenatal sobre el desarrollo del feto, así como su alta prevalencia, justifican el cribado de algunas infecciones en la consulta preconcepcional. Entre ellas cabe destacar el siguiente cribado:","o":{"A":"Se recomienda realizar a todas las mujeres cribado de sífilis con prueba específica, treponémica (TPHA, MHA-TP o FTA-ABS).","B":"La tasa de transmisión vertical de VIH sin medidas preventivas es del 40-50%; sin embargo, si durante la gestación se toman las medidas oportunas, la transmisión vertical es inferior al 1%.","C":"Se debe investigar la inmunidad frente a la rubéola de aquellas mujeres que acudan a la consulta preconcepcional y que nunca se hayan realizado las pruebas serológicas o no recuerden haber recibido vacuna.","D":"Está recomendada la investigación de la infección por Listeria para la prevención de malformaciones fetales."},"c":"C"},{"id":146,"q":"La consulta preconcepcional es un tipo de:","o":{"A":"Prevención primaria.","B":"Prevención secundaria.","C":"Prevención terciaria.","D":"Prevención cuaternaria."},"c":"A"},{"id":147,"q":"La mayoría de las mujeres con una edad inferior a 15 o superior a 40 años tienen embarazos que cursan con normalidad, pero en este rango de edades la posibilidad de complicaciones en la gestación aumenta. A este respecto, una de las siguientes afirmaciones es FALSA:","o":{"A":"Las gestantes de 15 a 19 años tienen con mayor frecuencia hijos/as con bajo peso, prematuros y las tasas de mortalidad infantil son mayores.","B":"Las gestantes mayores de 35 años presentan mayor riesgo de cromosomopatías, mayor riesgo de infertilidad y presentan con mayor frecuencia enfermedades crónicas.","C":"Las gestantes mayores de 35 años presentan mayor riesgo de complicaciones durante la gestación y el parto como diabetes gestacional, hipertensión o alteraciones de la placenta.","D":"Las gestantes mayores de 35 años tienen con mayor frecuencia complicaciones durante el parto como: alteración en el RCTG, alteraciones en la tercera etapa y mayores tasas de reanimación neonatal."},"c":"D"},{"id":148,"q":"En cuanto a la diabetes mellitus y la gestación es cierto que:","o":{"A":"Las gestantes diabéticas tienen de 4 a 5 veces más riesgo que la gestante no diabética de presentar complicaciones como aborto espontáneo, alteraciones congénitas (malformaciones óseas, alteraciones cardiovasculares, defectos del tubo neural y alteraciones génito-urinarias), preeclampsia o parto prematuro.","B":"En la consulta preconcepcional uno de los objetivos es alcanzar previa a la gestación un nivel de hemoglobina glicosilada lo más cercana posible a la normalidad (≤media + 4DE).","C":"Se desaconseja la gestación en mujeres diabéticas cuando el nivel de hemoglobina glicosilada sea superior a la media + 7DE.","D":"Se desaconseja la gestación cuando exista nefropatía grave (creatinina plasmática >4mg/dl o proteinuria >3g/24 horas y/o HTA de difícil control)."},"c":"D"},{"id":149,"q":"Las mujeres hipertensas pueden ver agravada su enfermedad durante la gestación. Es cierto que:","o":{"A":"Se debe estudiar el estado general de las pacientes con hipertensión arterial crónica, así como informar de los riesgos de la gestación pero no es el momento adecuado para realizar cambios en la medicación.","B":"Como primera medida se aconsejarán dieta y reposo.","C":"Como tratamiento de elección se recomiendan los inhibidores de la enzima convertidora de angiotensina (IECAS).","D":"Todas las respuestas son correctas."},"c":"B"},{"id":150,"q":"En la consulta preconcepcional, los/as futuros/as padres/madres deben ser interrogados/as sobre el antecedente de enfermedades hereditarias en los/as miembros/as de la familia. Se debe preguntar sobre los siguientes antecedentes familiares:","o":{"A":"Distrofia muscular, hemoglobinopatías y anomalías cromosómicas, entre otras.","B":"Hemofilia, anomalías cromosómicas e hipotiroidismo, entre otras.","C":"Distrofia muscular, hemoglobinopatías y alteraciones de la glándula suprarrenal, entre otras.","D":"Hemofilia, alteraciones en el eje hipotálamo-hipófisis y distrofia muscular, entre otras."},"c":"A"},{"id":151,"q":"Entre las pruebas complementarias en la consulta preconcepcional caben destacar las siguientes:","o":{"A":"Se recomendará a todas las mujeres el análisis de hemoglobina y hematocrito, grupo sanguíneo y Rh y test de VPH.","B":"Se ofertará a todas las mujeres cribado de VIH y de Chlamydia Trachomatis mediante la prueba TPHA.","C":"Se solicitará antígeno de superficie (HBsAg) de la hepatitis B en aquellas mujeres que presenten factores de riesgo.","D":"Existe evidencia sobre la importancia de la detección y tratamiento de la bacteriuria asintomática durante el periodo preconcepcional."},"c":"C"},{"id":152,"q":"Para mejorar el estado de los folatos en la mujer en edad reproductiva se pueden utilizar tres estrategias. Una de las siguientes es INCORRECTA:","o":{"A":"Consumir preparados farmacológicos con ácido fólico y vitaminas liposolubles.","B":"Dar consejo y educación sobre alimentación.","C":"Complementar la alimentación con ácido fólico.","D":"Consumir preparados farmacológicos con ácido fólico y derivados de los folatos."},"c":"A"},{"id":153,"q":"En cuanto a la suplementación farmacológica con yodo es cierto que:","o":{"A":"La carencia de yodo durante el embarazo aumenta las probabilidades de muerte materna, aborto espontáneo y mortalidad fetal precoz.","B":"La carencia de yodo durante el embarazo es la principal causa de lesiones cerebrales y problemas de aprendizaje reversibles.","C":"La Organización Mundial de la Salud estima que un 50% de la población mundial está en riesgo de presentar deficiencia de yodo.","D":"El consumo dietético recomendado durante el embarazo es de 430 µg/día, y durante la lactancia de 490 µg/día."},"c":"A"},{"id":154,"q":"Las indicaciones de cariotipo en la consulta preconcepcional son:","o":{"A":"Padres/Madres de niños/as con alguna enfermedad cromosómica.","B":"Síndrome de Klinefelter.","C":"Síndrome de Turner.","D":"Todas las respuestas son correctas."},"c":"D"},{"id":155,"q":"Las acciones para la promoción de la salud durante la asistencia preconcepcional pueden ser muy eficaces, ya que la mujer y su entorno están más motivados. Se recomiendan las siguientes acciones con el siguiente nivel de evidencia, EXCEPTO una de ellas:","o":{"A":"Recomendar una ingesta equilibrada de nutrientes: IV.","B":"Si el índice de masa corporal es superior a 30 kg/m2, valorar pérdida de peso: Ib.","C":"Aconsejar un consumo moderado de cafeína: IV.","D":"Promover una vida sexual saludable: IV."},"c":"B"},{"id":156,"q":"Durante la gestación es primordial que la dieta sea equilibrada y el aporte de vitamina y oligoelementos sea el adecuado. Se recomendarán:","o":{"A":"1500 mg al día de calcio.","B":"Un aporte inferior a 20.000 UI/día de vitamina A.","C":"30 mg/día de hierro.","D":"Todas las respuestas son correctas."},"c":"D"},{"id":157,"q":"El embarazo por sí solo produce cambios en la anatomía y fisiología de la mujer, que suponen una adaptación continua para permitir el adecuado desarrollo del feto, preparación al parto y la lactancia. Entre los primeros cambios que se suceden, cabe destacar las modificaciones en los genitales. Todas las que se exponen a continuación son modificaciones en los genitales EXCEPTO una de ellas:","o":{"A":"La vulva adquiere una coloración azulada, purpúrea o rojo intensa debido al incremento de su vascularización e hiperemia en la piel y músculos del periné. Esto se conoce con el nombre de Signo de Jaquemier-Chadwick.","B":"El útero aumenta su tamaño de forma progresiva adaptándose al crecimiento fetal. Su forma va cambiando gradualmente, al principio tiene forma de pera y va modificando a forma de esfera, para finalmente adoptar forma ovoidea. Esta modificación se conoce como el Signo de Noble-Budin.","C":"La secreción vaginal aumenta, sobre todo al final del embarazo, provocando que aumente la acidez vaginal, con un pH que oscila entre 3,7-6. Esto evita infecciones vaginales, a excepción de la Cándida Albicans que prolifera en medio ácido.","D":"Durante toda la gestación el útero mantiene una actividad contráctil que no llega a producir dilatación cervical, ya que su intensidad no sobrepasa los 10-20 mmHg. A partir de la semana 24 cuando se perciben las llamadas contracciones de Braxton-Hicks, que son contracciones breves, ocasionales e indoloras."},"c":"B"},{"id":158,"q":"Según avanza la gestación, la gestante sufre también modificaciones cardíacas y cardiovasculares. Caben destacar las siguientes. Sólo una de ellas es correcta:","o":{"A":"La tensión arterial disminuye durante el primer y segundo trimestre, alcanzando los valores mínimos alrededor de la semana 28. Esto es debido a una disminución de las resistencias vasculares periféricas. Durante el tercer trimestre la tensión arterial irá elevándose progresivamente hasta llegar a normalizarse.","B":"Durante el embarazo el corazón aumenta su tamaño en un 20-30% por hipertrofia del músculo cardíaco (cardiomegalia). Debido al aumento del volumen abdominal, el diafragma se eleva y desplaza al corazón hacia arriba y hacia la izquierda; esto se refleja en el electrocardiograma como una desviación del eje eléctrico hacia la izquierda.","C":"El gasto cardíaco se define como el producto de la frecuencia cardíaca y del volumen sistólico. Durante la gestación, el gasto cardíaco aumenta entre un 20-30% respecto a las mujeres no gestantes.","D":"Todas las respuestas anteriores son incorrectas."},"c":"B"},{"id":159,"q":"El volumen sanguíneo aumenta entre el segundo y el tercer mes de embarazo. Esta volemia aumenta a expensas de:","o":{"A":"Volumen plasmático (25%) y masa eritrocitaria (75%).","B":"Volumen plasmático (50%) y masa eritrocitaria (50%).","C":"Volumen plasmático (75%) y masa eritrocitaria (25%).","D":"El volumen sanguíneo aumenta únicamente a expensas del volumen plasmático."},"c":"C"},{"id":160,"q":"Durante la gestación se considera anemia cuando la concentración de hemoglobina es:","o":{"A":"Menor de 11g/dl durante el primer y tercer trimestre, o menor de 10,5 g/dl durante el segundo trimestre.","B":"Menor de 10,5 g/dl durante el primer y tercer trimestre, o menor de 11 g/dl durante el segundo trimestre.","C":"Menor de 11 g/dl durante el primer y segundo trimestre, o menor de 10,5 g/dl durante el tercer trimestre.","D":"Ninguna de las respuestas anteriores es correcta."},"c":"A"},{"id":161,"q":"Las modificaciones anatómicas de la caja torácica durante la gestación conllevan cambios en los volúmenes y capacidades pulmonares. Se inician al principio de la gestación y alcanzan su máximo en el 5º-6º mes para descender al final del embarazo. Los principales cambios de los volúmenes y capacidades pulmonares son los siguientes EXCEPTO uno:","o":{"A":"Volumen espiratorio de reserva disminuye alrededor del 20%.","B":"La capacidad inspiratoria aumenta alrededor de un 10%.","C":"La capacidad vital no sufre modificaciones.","D":"La capacidad residual funcional aumenta alrededor de un 20%."},"c":"D"},{"id":162,"q":"La placenta es considerada un órgano fundamental en el papel de control hormonal a lo largo de toda la gestación. La placenta humana es la encargada de sintetizar tanto hormonas placentarias proteicas como esteroideas. Una de las siguientes afirmaciones es FALSA:","o":{"A":"La hormona placentaria proteica Gonadotropina Coriónica Humana (HCG) se detecta en sangre materna tras la implantación (aproximadamente tercera semana) y en orina a partir de la quinta semana. Los niveles de esta hormona se triplican cada 48 horas hasta alcanzar su pico máximo alrededor de la semana 10.","B":"La secreción de estrógenos comienza en la placenta, cuando cesa su producción en el ovario. La placenta necesita precursores maternos (el principal el estriol) y sobre todo fetales para producir estrógenos.","C":"En la gestación incipiente el encargado de producir progesterona es el cuerpo lúteo, hasta la semana 10 que será secretada por la placenta.","D":"La hormona placentaria proteica Lactógeno Placentario Humano (HPL) se detecta en sangre materna a partir de la tercera semana."},"c":"B"},{"id":163,"q":"La gestación es un estado fisiológico cuyo diagnóstico ha pasado por diferentes etapas, muy marcadas desde la más remota antigüedad. Una de las siguientes pruebas diagnósticas se utilizaba en la antigüedad:","o":{"A":"Alrededor del año 1750 a.C., el diagnóstico del embarazo se realizaba humedeciendo con sangre materna granos de trigo. Si germinaban había embarazo.","B":"Hipócrates de Cos utilizaba la técnica que se basaba en la ingestión de un jarabe elaborado con miel y agua antes de ir a dormir. Si la mujer estaba embarazada, la pócima producía cólicos y si no lo estaban un agradable descanso.","C":"El Papiro de Brugsch, también conocido como Papiro de Berlín (1350 a.C) recoge la prueba diagnóstica basada en beber jugo de piña mezclado con sangre de una puérpera: si la mujer vomitaba estaría embarazada.","D":"Todas las mencionadas fueron pruebas diagnósticas utilizadas en la antigüedad."},"c":"B"},{"id":164,"q":"Actualmente, el diagnóstico de la gestación no suele plantear dificultades, debido al avance en las últimas décadas de las pruebas complementarias, que permiten identificar un embarazo precozmente y con una sensibilidad y especificidad muy cercana al 100 %, con un margen de error casi inexistente. Una de las siguientes afirmaciones es FALSA:","o":{"A":"La hCG aparece en sangre materna a los 8-9 días después de la ovulación, pero su detección en orina no es posible hasta alcanzar un nivel de 500 mUI/ml, lo que corresponde al 4º-5º día de retraso menstrual.","B":"La hCG es sintetizada por el tejido trofoblástico normal (en el embarazo) y patológico (mola hidatiforme y coriocarcinoma). Su función en el embarazo normal es mantener la esteroideogénesis del cuerpo lúteo hasta el momento en que la placenta alcance el desarrollo adecuado para tomar esta función.","C":"Es una glucoproteína formada por dos subunidades: la alfa, que es común a la de la hormona luteinizante (LH), folículo-estimulante (FSH) y tirotropina (TSH); y la beta, que es específica de la hCG.","D":"La hCG es producida en la placenta por el citotrofoblasto, constituyendo la principal fuente de progesterona durante las primeras 6 semanas de embarazo, hasta que la placenta asume su producción."},"c":"D"},{"id":165,"q":"La ecografía transvaginal supone el método de elección para el diagnóstico precoz de la gestación. Podemos afirmar que:","o":{"A":"A partir de las 4 semanas de amenorrea o 18-20 días postfecundación, se puede visualizar la existencia de un saco gestacional de 2 o 3 mm de diámetro.","B":"Entre las semanas 4 y 6 aparece la vesícula vitelina. En este momento es posible visualizar el embrión de 2-5 mm de tamaño y detectar la vitalidad del feto mediante el latido cardíaco.","C":"A partir de las 7 semanas podemos diferenciar el polo cefálico, las extremidades y la bolsa amniótica del embrión; alcanzando éste los 25-27 mm de tamaño.","D":"Todas las respuestas anteriores son correctas."},"c":"A"},{"id":166,"q":"Entre las pruebas inmunológicas para el diagnóstico de la gestación cabe destacar la inmunocromotografía que consiste en:","o":{"A":"Es una prueba inmunológica cuantitativa, y es el método diagnóstico en el que se basan los test de embarazo que se realizan en el domicilio.","B":"Constan de dos membranas porosas que contienen anticuerpos monoclonales.","C":"Es una prueba inmunológica cualitativa, y es el método diagnóstico en el que se basan los test de embarazo que se realizan en el domicilio.","D":"Constan de dos membranas porosas que contienen anticuerpos policlonales."},"c":"C"},{"id":167,"q":"Entre las modificaciones funcionales que sufre la hipófisis durante la gestación se hallan las siguientes. Sólo una es correcta:","o":{"A":"La hormona del crecimiento está inhibida por los efectos del lactógeno placentario.","B":"La hormona Antidiurética o Vasopresina (ADH) aumenta sus niveles.","C":"Los niveles de Hormona Prolactina (PRL) disminuyen desde el inicio de la gestación.","D":"La Hormona Luteinizante (LH) se encuentra aumentada debido al mecanismo de retroalimentación positivo."},"c":"A"},{"id":168,"q":"Durante la gestación se producen las siguientes modificaciones endocrinas EXCEPTO una:","o":{"A":"Los niveles de Tiroxina (T4) y Triyodotironina (T3) aumentan progresivamente durante el embarazo hasta alcanzar la semana 20.","B":"La relación T3/T4 debe permanecer inalterada en el embarazo normal.","C":"La aldosterona se encuentra aumentada desde el principio del embarazo.","D":"Se produce una disminución del cortisol libre y del cortisol unido a proteínas transportadoras."},"c":"D"},{"id":169,"q":"Las modificaciones que se producen en el aparato locomotor son las responsables de muchos de los síntomas que se producen durante el embarazo y pueden llegar a desembocar en alguna patología. Una de las siguientes afirmaciones es correcta:","o":{"A":"A medida que avanza la gestación, se va a producir una hipercifosis para compensar el desplazamiento del centro de gravedad provocado por el peso del feto y los anejos fetales.","B":"Los estrógenos y la relaxina tienen gran influencia en las articulaciones pelvianas; estas hormonas aumentan la laxitud de las articulaciones sacroilíacas, sacro coccígeas, y pubiana.","C":"La gestante adopta una marcha contoneante o de pato. Esta marcha característica puede provocar que la embarazada no pueda permanecer de pie por periodos prolongados de tiempo.","D":"Los músculos oblicuos del abdomen pueden separarse de la línea media produciendo una diástasis de los músculos rectos."},"c":"B"},{"id":170,"q":"En la guía de práctica clínica de atención en el embarazo y puerperio del Ministerio de Sanidad, Servicios Sociales e Igualdad, se sugiere que las visitas prenatales programadas deben coordinarse por:","o":{"A":"Matrón/as.","B":"Matrón/as y médico/as de familia.","C":"Matrón/as y ginecólogo/as.","D":"Matrón/as, ginecólogo/as y médico/as de familia."},"c":"B"},{"id":171,"q":"En relación al número de visitas y resultados en salud-materno fetal, la evidencia disponible según la guía de práctica clínica de atención en el embarazo y puerperio del Ministerio de Sanidad, Servicios Sociales e Igualdad, es la siguiente:","o":{"A":"Se han observado diferencias estadísticamente significativas entre los programas de atención prenatal con visitas reducidas (4-9 visitas) frente a la atención prenatal estándar (13-14 visitas) para los resultados relacionados con la mujer o con el neonato.","B":"En los estudios analizados, las mujeres estuvieron más satisfechas con el esquema de visitas reducidas y los costes del programa de visitas reducidos fueron inferiores, aunque aumentaron los costes en relación a la duración de la estancia hospitalaria de los neonatos, lo que determinó la fuerza de la recomendación.","C":"Con una fuerza de recomendación débil se sugiere un programa de seguimiento de entre 6 y 9 visitas en mujeres con bajo riesgo de desarrollar complicaciones durante el embarazo o el parto.","D":"Ninguna de las respuestas anteriores es correcta."},"c":"C"},{"id":172,"q":"En relación a la utilidad de la exploración rutinaria del Índice de Masa Corporal (IMC), vigilancia de peso y toma de tensión arterial la Guía de Práctica Clínica de atención en el embarazo y puerperio del Ministerio de Sanidad, Servicios Sociales e Igualdad concluye lo siguiente, EXCEPTO:","o":{"A":"Un IMC patológico previo al embarazo y una ganancia ponderal escasa o excesiva durante el embarazo se asocian a varias complicaciones como el parto pretérmino, el aborto, la muerte perinatal, la diabetes gestacional, dar a luz por cesárea, la hipertensión gestacional o dar a luz a un/una bebé pequeño/a o grande para la edad gestacional.","B":"La identificación de proteinuria en la gestante, se relaciona con el desarrollo de la preeclampsia.","C":"Los valores altos de presión arterial sistólica y diastólica se han asociado a un aumento del riesgo de la aparición de preeclampsia en el embarazo.","D":"Debido a que la mayoría de los estudios valorados fueron observacionales, se recomienda calcular el IMC en la primera visita prenatal pero con una fuerza de recomendación débil."},"c":"D"},{"id":173,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio, indique la opción INCORRECTA respecto a la utilidad de exploraciones y procedimientos durante las visitas prenatales:","o":{"A":"La exploración mamaria durante el embarazo no ha demostrado aportar beneficios para promover la lactancia materna ni como método de cribado de cáncer de mama.","B":"La pelvimetría mediante rayos X incrementa el riesgo de cesárea y no aporta beneficios adicionales para la madre o el recién nacido.","C":"La separación de membranas antes del término (37–40 semanas) debe realizarse de manera rutinaria para facilitar el inicio del trabajo de parto.","D":"La citología cervical no debe realizarse de rutina en el embarazo si la mujer tiene citologías previas negativas, recomendándose posponerla hasta 6–8 semanas tras el parto salvo excepciones."},"c":"C"},{"id":174,"q":"En relación con la utilidad de la determinación de urea, creatinina y ácido úrico en mujeres con embarazos sin complicaciones, según la Guía de Práctica Clínica de atención en el embarazo y puerperio, señale la opción correcta:","o":{"A":"La determinación rutinaria de urea está recomendada en el embarazo, ya que múltiples estudios de alta calidad han demostrado una clara relación entre niveles elevados de urea y el riesgo de preeclampsia, especialmente cuando los valores superan los 20 mg/100 mL antes de la semana 20 de gestación.","B":"Aunque algunos estudios retrospectivos han mostrado una asociación entre niveles elevados de creatinina en las primeras 20 semanas del embarazo y el desarrollo posterior de preeclampsia, la evidencia es inconsistente y procede de estudios con limitaciones metodológicas, por lo que no se recomienda su determinación rutinaria en gestantes de bajo riesgo.","C":"La determinación de ácido úrico presenta una alta capacidad predictiva para preeclampsia cuando se mide entre las semanas 11 y 14, por lo que constituye uno de los principales marcadores bioquímicos recomendados para cribado universal según la guía."},"c":"B"},{"id":175,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio del Ministerio de Sanidad, señale la opción correcta respecto al cribado de las hepatitis víricas en la gestación:","o":{"A":"La guía recomienda el cribado universal de hepatitis B únicamente en mujeres con factores de riesgo, como antecedentes de transfusiones, uso de drogas por vía parenteral o prácticas sexuales de riesgo, ya que el beneficio del cribado universal en gestantes no ha sido demostrado.","B":"La guía desaconseja el cribado universal de hepatitis C en las gestantes, ya que la prevalencia en población general es baja y no existe evidencia clara de que su detección permita reducir la transmisión vertical; sin embargo, sí recomienda realizar cribado dirigido en mujeres con factores de riesgo específicos.","C":"La detección del antígeno de superficie de hepatitis B (HBsAg) en gestantes solo debe realizarse si existen sospechas clínicas de infección activa, dado que identificar portadoras asintomáticas no tiene implicaciones en el manejo perinatal.","D":"En el caso de las gestantes con hepatitis C, la guía recomienda repetir sistemáticamente la serología en el tercer trimestre debido a que el riesgo de seroconversión durante el embarazo es significativamente alto en comparación con la población general."},"c":"B"},{"id":176,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio, señale la opción correcta respecto al cribado del Virus de la Inmunodeficiencia Humana (VIH) en gestantes:","o":{"A":"El cribado del VIH debe reservarse únicamente para mujeres con factores de riesgo conocidos, ya que el beneficio del cribado universal no ha sido demostrado.","B":"Se recomienda repetir el cribado de VIH a todas las mujeres en el tercer trimestre, independientemente de su nivel de riesgo, porque existe un riesgo elevado de seroconversión durante la gestación.","C":"La guía recomienda ofrecer un cribado universal de VIH en la primera visita prenatal, y repetirlo solo en gestantes con riesgo de infección o seroconversión.","D":"El cribado de VIH debe posponerse hasta el segundo trimestre, ya que la realización temprana de la prueba aumenta el riesgo de falsos negativos."},"c":"C"},{"id":177,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio del Ministerio de Sanidad, señale la opción correcta respecto al cribado y manejo de toxoplasmosis, rubeola y sífilis durante el embarazo:","o":{"A":"La guía recomienda realizar un cribado universal de toxoplasmosis a todas las gestantes, con serología inicial y controles mensuales si son seronegativas, debido al riesgo elevado de infección primaria durante el embarazo.","B":"El cribado de rubeola debe realizarse exclusivamente en mujeres con factores de riesgo o sin registro vacunal, pero no es necesario si la gestante refiere haber pasado la enfermedad en la infancia.","C":"La guía recomienda ofrecer un cribado universal de sífilis en la primera visita del embarazo, y en caso de resultados positivos, debe confirmarse por pruebas específicas dado el riesgo de falsos positivos.","D":"La guía recomienda realizar cribado sistemático de toxoplasmosis, sífilis y rubeola en el tercer trimestre, incluso si las pruebas del primer trimestre fueron negativas, para garantizar una adecuada vigilancia de seroconversiones."},"c":"C"},{"id":178,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio, señale la opción correcta sobre el consumo de alcohol en el embarazo:","o":{"A":"El consumo moderado de alcohol (1-2 unidades al día) no se ha relacionado con efectos adversos fetales, por lo que puede considerarse seguro.","B":"Las mujeres deben ser informadas de que el consumo excesivo de alcohol en una sola ocasión supone un riesgo para el feto.","C":"La guía recomienda permitir el consumo ocasional de bebidas fermentadas (vino o cerveza) a partir del segundo trimestre.","D":"El consumo de alcohol únicamente supone riesgo en embarazos de alto riesgo, pero no en embarazos sin complicaciones."},"c":"B"},{"id":179,"q":"Respecto a las recomendaciones de la Guía de Práctica Clínica de atención en el embarazo y puerperio en relación con el consumo de alcohol durante la gestación, señale la opción INCORRECTA:","o":{"A":"La guía recomienda la abstinencia completa de alcohol durante el embarazo, e incluso en la etapa preconcepcional, debido a la ausencia de un nivel seguro demostrado de consumo.","B":"Las mujeres deben ser informadas de que los episodios de consumo agudo (“atracones”) definidos como más de cinco bebidas estándar o 7,5 unidades en una sola ocasión, presentan un riesgo significativo para el feto.","C":"Si, pese al consejo profesional, la mujer decide consumir alcohol durante la gestación, la guía indica que el límite seguro se sitúa en un máximo de una unidad al día, ya que cantidades por encima de este umbral se han asociado consistentemente con defectos congénitos mayores.","D":"La guía recomienda realizar intervenciones dirigidas a la reducción del consumo en aquellas mujeres en las que se detecte un consumo de riesgo, particularmente cuando existe un patrón de ingesta repetido o intenso."},"c":"C"},{"id":180,"q":"Según la Guía de Práctica Clínica de atención en el embarazo y puerperio, indique la opción correcta respecto al manejo del tabaquismo durante la gestación:","o":{"A":"La guía indica que las terapias de reemplazo con nicotina (NRT) son seguras para todas las mujeres embarazadas y deben utilizarse como primera línea en cualquier gestante fumadora.","B":"Las mujeres embarazadas que no desean dejar de fumar y rechazan las intervenciones no farmacológicas deben ser informadas sobre los riesgos y beneficios de la terapia sustitutiva con nicotina antes de considerarla.","C":"Se recomienda el uso de parches de nicotina como primera opción, incluso en mujeres que no han intentado previamente una intervención psicológica o conductual.","D":"La guía señala que la consejería para dejar de fumar no debe ofrecerse durante el embarazo, ya que la evidencia de efectividad es limitada y no reduce significativamente el número de gestantes fumadoras."},"c":"B"},{"id":181,"q":"Según la evidencia presentada en la Guía de Práctica Clínica de atención en el embarazo y puerperio, señale la opción correcta sobre el impacto del ejercicio físico regular durante el embarazo en mujeres sin complicaciones:","o":{"A":"El ejercicio físico aeróbico regular durante el embarazo reduce de forma consistente la incidencia de preeclampsia, disminuye el porcentaje de cesáreas y aumenta la edad gestacional al parto, con evidencia considerada de calidad moderada.","B":"El ejercicio físico regular durante el embarazo incrementa el riesgo de parto pretérmino, especialmente cuando se realiza más de tres veces por semana, motivo por el cual la guía recomienda limitar su práctica en mujeres previamente sedentarias.","C":"Según la revisión sistemática de Kramer y otros estudios incluidos, el ejercicio físico regular no muestra efectos significativos sobre la ganancia ponderal materna, la incidencia de preeclampsia, el parto pretérmino, la tasa de cesáreas, la edad gestacional al parto ni el peso del recién nacido, debido a que la calidad de la evidencia disponible es muy baja.","D":"La realización de ejercicio aeróbico durante el embarazo aumenta de manera significativa el peso al nacer y mejora el Apgar a los 5 minutos, por lo que la guía lo recomienda específicamente como estrategia para mejorar resultados neonatales."},"c":"C"},{"id":182,"q":"La estática fetal se debe explorar a partir de la semana 28 de gestación. Se realizará mediante palpación, utilizando las cuatro maniobras de Leopold. Una de las siguientes afirmaciones es INCORRECTA:","o":{"A":"La segunda maniobra de Leopold se realiza con la mujer en decúbito supino, el/la explorador/a al lado derecho de la gestante mirando hacia su cara. El/La explorador/a situará las manos a los lados del útero; mientras que una mano fija al útero, para evitar su desplazamiento y la otra realiza la palpación del feto. Mediante esta maniobra se diagnosticará la posición fetal que podrá ser derecha o izquierda y la situación fetal.","B":"En la tercera manioba de Leopold el/la explorador/a se colocará en la misma posición que al realizar la segunda maniobra, aplicando la mano abierta en forma de «C», oponiendo el pulgar al resto de los dedos, por encima de la sínfisis del pubis con el objetivo de diagnosticar la presentación fetal y la posición fetal.","C":"La cuarta maniobra se realiza con la paciente en decúbito supino y el explorador situado a su derecha y mirando hacia los pies de la gestante. Se diagnostican la presentación fetal, la posición fetal, la actitud fetal y la relación entre la presentación y la pelvis.","D":"Todas las respuestas son correctas."},"c":"B"},{"id":183,"q":"En relación con los métodos clínicos de valoración del bienestar fetal, señale la opción correcta:","o":{"A":"El recuento de movimientos fetales carece de utilidad clínica porque presenta una tasa de falsos positivos superior al 70 %.","B":"La medición de la altura uterina no forma parte de la valoración clínica del bienestar fetal, ya que no se correlaciona con el crecimiento fetal.","C":"El recuento materno de movimientos fetales constituye un método simple, útil y recomendado como valoración clínica básica del bienestar fetal.","D":"La percepción materna de movimientos fetales solo debe considerarse a partir de la semana 32."},"c":"C"},{"id":184,"q":"Con respecto al test basal o test no estresante (NST) como método de monitorización biofísica, indique la opción INCORRECTA:","o":{"A":"Evalúa la respuesta de la frecuencia cardíaca fetal en ausencia de contracciones uterinas.","B":"Un patrón reactivo se caracteriza por aceleraciones adecuadas de la frecuencia cardiaca fetal.","C":"Se considera un método fundamental en la monitorización del bienestar fetal.","D":"El test basal está contraindicado en embarazos de bajo riesgo, ya que puede inducir contracciones."},"c":"D"},{"id":185,"q":"Respecto al Test Basal (o Test No Estresante) empleado en la monitorización biofísica del bienestar fetal, señale la opción INCORRECTA:","o":{"A":"El test basal evalúa la respuesta de la frecuencia cardíaca fetal en ausencia de contracciones uterinas y requiere que la gestante permanezca en decúbito lateral izquierdo para evitar hipotensión materna.","B":"Una variabilidad fetal inferior a 5 latidos por minuto mantenida durante más de 40 minutos puede asociarse a hipoxia fetal y constituye un patrón potencialmente patológico en el test basal.","C":"En gestaciones menores de 32 semanas, las aceleraciones consideradas reactivas son de ≥10 lpm y con una duración mínima de 10 segundos, en lugar de los 15×15 que se exigen a partir de esa edad gestacional.","D":"La ausencia de aceleraciones durante un test basal no reactivo siempre indica acidosis fetal, por lo que debe finalizarse la gestación de manera inmediata."},"c":"D"},{"id":186,"q":"Durante la monitorización antenatal de una gestante de 34 semanas se obtiene un registro cardiotocográfico basal. La línea de base es de 140 latidos por minuto (lpm). La variabilidad se mantiene por debajo de 5 lpm durante 55 minutos, sin cambios tras la aplicación de estimulación vibro acústica. No se observan aceleraciones y aparecen dos deceleraciones variables típicas de menos de 60 segundos. La gestante refiere movimientos fetales durante el registro. En controles previos se habían documentado ciclos de sueño fetal. Según los criterios de interpretación de la monitorización fetal anteparto, señale la opción correcta:","o":{"A":"El registro debe considerarse normal, ya que existen movimientos fetales percibidos y las deceleraciones variables típicas no se relacionan con hipoxia.","B":"La variabilidad <5 lpm durante 55 minutos clasifica el registro como no tranquilizador, por lo que debe completarse la valoración con un perfil biofísico o Doppler.","C":"La ausencia de aceleraciones y la presencia de deceleraciones variables indican acidosis fetal, siendo necesaria la finalización inmediata de la gestación.","D":"La variabilidad <5 lpm es compatible con un ciclo de sueño fetal prolongado, por lo que debe repetirse el test basal en 24–48 horas."},"c":"B"},{"id":187,"q":"¿Dónde se produce inicialmente la oxitocina en su forma inactiva durante la gestación?","o":{"A":"En el lóbulo posterior de la hipófisis.","B":"En los núcleos supraóptico y paraventricular del hipotálamo.","C":"En el sincitiotrofoblasto placentario.","D":"En las membranas fetales."},"c":"B"},{"id":188,"q":"El inicio de las contracciones del parto se debe principalmente a:","o":{"A":"Un aumento brusco y sostenido de los niveles circulantes de oxitocina.","B":"Una mayor sensibilidad del miometrio a la oxitocina debido al aumento de receptores y gap junctions.","C":"Un incremento progresivo de la vasopresina durante la gestación.","D":"La inhibición de la oxitocinasa placentaria al final del embarazo."},"c":"B"},{"id":189,"q":"La prostaglandina que se considera más fisiológica en el inicio y mantenimiento del trabajo de parto es:","o":{"A":"PGF2α.","B":"PGE1.","C":"PGI2 (prostaciclina).","D":"TXA2 (tromboxano)."},"c":"A"},{"id":190,"q":"¿Cuál de los siguientes factores puede adelantar el inicio del parto por estímulo mecánico y distensión uterina?","o":{"A":"Miomas uterinos pequeños.","B":"Ingesta elevada de ácidos grasos esenciales.","C":"Hidramnios, embarazos múltiples o macrosomía.","D":"Disminución de catecolaminas al final del embarazo."},"c":"C"},{"id":191,"q":"¿Cuál de los siguientes diámetros del estrecho superior se considera el más utilizado para el descenso fetal?","o":{"A":"El diámetro transverso máximo (≈13,5 cm).","B":"El conjugado anatómico (11–11,5 cm).","C":"El diámetro oblicuo (≈12 cm).","D":"El diámetro conjugado diagonal."},"c":"C"},{"id":192,"q":"¿Cuál es el diámetro anteroposterior del estrecho inferior durante el parto cuando el cóccix se desplaza hacia atrás?","o":{"A":"9–10 cm.","B":"11 cm.","C":"13 cm.","D":"12 cm."},"c":"D"},{"id":193,"q":"¿Cuál de los siguientes factores puede reducir de forma significativa la amplitud del estrecho inferior y dificultar el desprendimiento fetal?","o":{"A":"Una sínfisis púbica con unión de las ramas isquiopubianas formando un ángulo agudo.","B":"Un diámetro transverso verdadero del estrecho superior de 13 cm.","C":"Un promontorio poco prominente.","D":"La presencia de espinas ciáticas poco marcadas."},"c":"A"},{"id":194,"q":"¿Cuál es la circunferencia correspondiente al diámetro suboccipitobregmático fetal?","o":{"A":"32 cm.","B":"33 cm.","C":"34 cm.","D":"35 cm."},"c":"A"},{"id":195,"q":"La circunferencia occipitomentoniana se asocia a una medida aproximada de:","o":{"A":"33 cm.","B":"35 cm.","C":"27 cm.","D":"32 cm."},"c":"B"},{"id":196,"q":"La Organización Mundial de la Salud (OMS) elaboró en el año 2018 una serie de recomendaciones sobre cuidados durante el parto para una experiencia positiva. Entre las recomendaciones durante el trabajo de parto y nacimiento, recomienda una serie de directrices para la atención respetuosa a la maternidad. Cabe destacar la siguiente:","o":{"A":"En situaciones docentes, la confidencialidad puede flexibilizarse sin autorización expresa, siempre que no se revelen nombres completos ni datos de contacto.","B":"Se recomienda la atención respetuosa de la maternidad, la cual remite a la atención organizada y proporcionada a todas las mujeres de manera que mantenga su dignidad, privacidad y confidencialidad, asegure la integridad física y el trato adecuado y permita tomar una decisión informada y recibir apoyo continuo durante el trabajo de parto y el parto.","C":"La OMS prioriza la seguridad clínica sobre la movilidad y el confort; por ello, recomienda la monitorización cardiotocográfica continua de rutina en gestantes de bajo riesgo aunque restrinja la libre deambulación.","D":"La atención respetuosa permite el ‘consentimiento tácito’ en procedimientos intraparto de baja complejidad, siempre que la mujer haya recibido información general al ingreso."},"c":"B"},{"id":197,"q":"¿Cuál de las siguientes opciones NO corresponde a los recursos necesarios para garantizar una atención respetuosa de la maternidad (ARM) según las recomendaciones sobre cuidados durante el parto para una experiencia de parto positiva de la OMS?","o":{"A":"Establecer mecanismos accesibles de quejas y procesos formales de rendición de cuentas ante maltrato o incumplimiento.","B":"Garantizar un entorno físico con privacidad suficiente, iluminación adecuada y suministro continuo de energía en las áreas de parto.","C":"Incorporar comités externos de auditoría clínica encargados de autorizar cada procedimiento obstétrico antes de su realización.","D":"Proporcionar materiales educativos accesibles, formularios estandarizados de consentimiento informado y medicamentos esenciales disponibles en todo momento."},"c":"C"},{"id":198,"q":"¿Cuál de las siguientes afirmaciones NO coincide con la definición de las fases del período de dilatación según la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"La fase latente incluye contracciones uterinas dolorosas con cambios cervicales variables y una progresión más lenta de la dilatación hasta los 5 cm.","B":"La fase activa comienza a partir de los 5 cm, con contracciones dolorosas y regulares, un borramiento importante y una dilatación más rápida.","C":"La fase activa puede identificarse también como “fase establecida”, y la OMS recomienda sustituir dicha denominación en los protocolos clínicos.","D":"La fase latente puede describirse como “fase inicial” o “fase pasiva”, aunque la OMS prefiere mantener el término clásico “fase latente”."},"c":"C"},{"id":199,"q":"¿Cuál de los siguientes elementos NO forma parte de los recursos necesarios para adoptar las nuevas definiciones de las fases latente y activa del período de dilatación según la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"Disponer de manuales de capacitación actualizados, materiales didácticos para las mujeres y un partograma modificado que indique el inicio de la fase activa.","B":"Proporcionar camas suficientes para ofrecer atención de apoyo a las mujeres antes de que alcancen los 5 cm de dilatación.","C":"Establecer auditorías regulares y mecanismos de seguimiento que evalúen la aplicación de la nueva definición de fase activa.","D":"Implementar programas de formación centrados en la toma de decisiones clínicas avanzadas para acelerar el progreso del trabajo de parto en la fase latente."},"c":"D"},{"id":200,"q":"¿Cuál de las siguientes afirmaciones NO coincide con lo indicado por la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva respecto a la duración de las fases del período de dilatación?","o":{"A":"La fase latente no tiene una duración estándar establecida debido a la dificultad para determinar su inicio real.","B":"La fase activa, desde los 5 cm hasta la dilatación completa, suele durar ≤12 h en primíparas y ≤10 h en multíparas.","C":"La decisión de intervenir cuando la dilatación parece prolongarse debe basarse exclusivamente en el tiempo transcurrido.","D":"La duración del trabajo de parto es muy variable y depende de factores individuales y del embarazo."},"c":"C"},{"id":201,"q":"¿Cuál de las siguientes afirmaciones NO coincide con lo indicado por la Organización Mundial de la Salud en la guía de cuidados durante el parto para una experiencia de parto positiva respecto al umbral de 1 cm/h durante la fase activa?","o":{"A":"El umbral de 1 cm/h no es preciso para identificar riesgo de resultados adversos y no se recomienda su uso.","B":"La aplicación estricta de la línea de alerta ha llevado a intervenciones innecesarias por interpretar erróneamente la lentitud del progreso.","C":"La OMS recomienda mantener la progresión de 1 cm/h como referencia universal para reducir la variabilidad clínica.","D":"La evidencia disponible es insuficiente para justificar el uso de la línea de alerta del partograma como criterio diagnóstico."},"c":"C"},{"id":202,"q":"Según el Grupo de Elaboración de Directrices de la guía de cuidados durante el parto para una experiencia de parto positiva de la Organización Mundial de la Salud, la mediana de duración de la fase activa del período de dilatación, tomando como referencia el inicio a los 5 cm, es de aproximadamente:","o":{"A":"6 horas en primíparas y 4 horas en multíparas.","B":"4 horas en primíparas y 3 horas en multíparas.","C":"3 horas en primíparas y 2 horas en multíparas.","D":"12 horas en primíparas y 10 horas en multíparas."},"c":"B"},{"id":203,"q":"Según la Organización Mundial de la Salud en la guía de cuidados durante el parto para una experiencia de parto positiva, en caso de una presunta lentitud en la progresión del trabajo de parto, el abordaje adecuado consiste en:","o":{"A":"Iniciar automáticamente aceleración con oxitocina para evitar prolongación del parto.","B":"Evaluar cuidadosamente a la mujer para descartar complicaciones y revisar sus necesidades emocionales, psicológicas y físicas.","C":"Aplicar la línea de actuación de 4 horas del partograma de forma sistemática.","D":"Repetir tactos cada hora para confirmar la lentitud y decidir intervención inmediata."},"c":"B"},{"id":204,"q":"¿Qué afirma la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva, sobre el uso del umbral de 1 cm/h de dilatación cervical?","o":{"A":"Que no es un criterio preciso y no se recomienda su uso.","B":"Que debe aplicarse como referencia universal.","C":"Que siempre predice complicaciones.","D":"Que solo se aplica en multíparas."},"c":"A"},{"id":205,"q":"¿Cuál es la recomendación de la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva, en relación con la aceleración del trabajo de parto antes de los 5 cm de dilatación cervical?","o":{"A":"Se recomienda siempre iniciar oxitocina antes de los 5 cm para evitar un progreso lento.","B":"La cesárea temprana está indicada si no se alcanza 1 cm/hora antes de los 5 cm.","C":"No se recomiendan intervenciones médicas para acelerar el parto antes de los 5 cm si madre y feto están en buenas condiciones.","D":"Debe realizarse estimulación sistemática del parto al inicio de la fase latente."},"c":"C"},{"id":206,"q":"La Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva, recomienda para las embarazadas sanas con trabajo de parto espontáneo, una política de demora del ingreso a la sala de preparto hasta el período de dilatación activa:","o":{"A":"Falso. La Organización Mundial de la Salud no recomienda la demora del ingreso hasta el periodo de dilatación activa.","B":"Verdadero. La Organización Mundial de la Salud recomienda la demora del ingreso hasta el periodo de dilatación activa únicamente en el contexto de la investigación rigurosa.","C":"Verdadero. La Organización Mundial de la Salud recomienda la demora del ingreso hasta el periodo de dilatación activa.","D":"Verdadero. La Organización Mundial de la Salud recomienda la demora del ingreso hasta el periodo de dilatación activa pero con una certidumbre muy baja."},"c":"B"},{"id":207,"q":"Según las recomendaciones de la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva. ¿Cuál es el método adecuado para evaluar el bienestar fetal al ingreso en embarazadas sanas con trabajo de parto espontáneo?","o":{"A":"Cardiotocografía (CTG) de rutina en todos los ingresos.","B":"Auscultación con Doppler o estetoscopio de Pinard.","C":"Toma sistemática de muestras de sangre fetal.","D":"Monitorización fetal continua durante las primeras dos horas."},"c":"B"},{"id":208,"q":"¿Cuál de las siguientes afirmaciones NO se ajusta a lo señalado por la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva; sobre el uso de CTG en el ingreso?","o":{"A":"El CTG en el ingreso aumenta probablemente el riesgo de cesárea sin mejorar los resultados perinatales.","B":"El CTG en el ingreso puede desencadenar intervenciones adicionales innecesarias, como CTG continua o la toma de muestras de sangre fetal.","C":"La OMS respalda el uso rutinario de CTG al ingreso.","D":"Una buena historia clínica y un registro claro de la auscultación podrían proteger mejor al profesional frente a demandas que el CTG rutinario."},"c":"C"},{"id":209,"q":"¿Cuál de las siguientes afirmaciones NO coincide con los comentarios asociados a la recomendación sobre el tacto vaginal en la guía de cuidados durante el parto para una experiencia de parto positiva de la Organización Mundial de la Salud?","o":{"A":"Debe evitarse que múltiples profesionales realicen tactos vaginales en la misma mujer para reducir riesgo de infección.","B":"La frecuencia de tactos vaginales puede ajustarse si la condición materna o fetal lo requiere.","C":"Existe evidencia sólida que determina la frecuencia óptima de tactos vaginales para prevenir infecciones.","D":"Debe limitarse el número total de exploraciones, especialmente si hay factores de riesgo de infección."},"c":"C"},{"id":210,"q":"Según la Organización Mundial de la Salud en el documento de cuidados durante el parto para una experiencia de parto positiva, ¿cuál es la técnica recomendada para evaluar la frecuencia cardíaca fetal (FCF) durante el trabajo de parto en embarazadas sanas?","o":{"A":"Cardiotocografía continua desde el ingreso hasta el expulsivo.","B":"Auscultación intermitente mediante Doppler o estetoscopio de Pinard.","C":"Toma sistemática de muestras de sangre fetal cada hora.","D":"Registro electrónico continuo durante la fase activa únicamente."},"c":"B"},{"id":211,"q":"¿Cuál de las siguientes afirmaciones NO concuerda con el protocolo recomendado de auscultación intermitente durante el trabajo de parto según la Organización Mundial de la Salud en el documento de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"Auscultar cada 15–30 minutos en fase activa y cada 5 minutos en expulsivo.","B":"Registrar FCF inicial y presencia de aceleraciones o deceleraciones.","C":"Auscultar durante la contracción y continuar 30 segundos después.","D":"Realizar cada auscultación durante 10 segundos."},"c":"D"},{"id":212,"q":"Según la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva, ¿cuál es la práctica adecuada respecto a la ingesta oral en mujeres de bajo riesgo durante el trabajo de parto?","o":{"A":"Restringir líquidos y alimentos para evitar complicaciones anestésicas.","B":"Permitir solo líquidos claros y prohibir alimentos sólidos.","C":"Permitir la ingesta de líquidos y alimentos según los deseos de la mujer.","D":"Suspender toda ingesta oral desde el inicio de la fase activa."},"c":"C"},{"id":213,"q":"Según la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva, ¿cuál de las siguientes técnicas sí se recomienda para reducir el traumatismo perineal durante el período expulsivo?","o":{"A":"Maniobra de Ritgen.","B":"Masaje perineal.","C":"Tracción del mentón fetal para acelerar el desprendimiento.","D":"Presión en el fondo uterino."},"c":"B"},{"id":214,"q":"¿Cuál de las siguientes afirmaciones NO es correcta según la evidencia revisada por la Organización Mundial de la Salud en su guía de cuidados durante el parto para una experiencia de parto positiva?","o":{"A":"Las compresas tibias reducen los desgarros perineales de tercer y cuarto grado.","B":"El masaje perineal puede aumentar la probabilidad de un perineo indemne.","C":"La maniobra de Ritgen cuenta con evidencia sólida y se recomienda su uso rutinario.","D":"La protección activa del perineo puede reducir desgarros de primer grado."},"c":"C"},{"id":215,"q":"Según la definición de la Organización Mundial de la Salud (OMS) de 1996, ¿cuál de las siguientes características forma parte de la definición de parto normal?","o":{"A":"Se inicia mediante inducción farmacológica y finaliza sin necesidad de instrumentación.","B":"Se inicia de forma espontánea y el recién nacido nace en posición de vértice entre las 37 y 42 semanas.","C":"Se considera siempre un proceso de bajo riesgo, independientemente de la evolución del trabajo de parto.","D":"El recién nacido debe pesar más de 3.500 gramos y nacer antes de las 40 semanas."},"c":"B"},{"id":216,"q":"¿Cuál de las siguientes afirmaciones describe con mayor precisión el propósito y funcionamiento del plan de parto según las recomendaciones actuales?","o":{"A":"Es un documento que establece instrucciones cerradas para el personal sanitario, las cuales deben seguirse estrictamente salvo riesgo vital.","B":"Permite a la mujer planificar de manera detallada el desarrollo del parto, incluyendo la secuencia de intervenciones que se deben aplicar en cada fase.","C":"Funciona como una guía flexible donde la mujer expresa preferencias y expectativas, que pueden modificarse durante el proceso, y cuya aplicación se adapta según la evolución del parto y las indicaciones del equipo profesional.","D":"Se recomienda elaborarlo únicamente a partir de la semana 36 de gestación, cuando se conoce con mayor exactitud la evolución final del embarazo."},"c":"C"},{"id":217,"q":"Según las recomendaciones del American College of Obstetricians and Gynecologists (ACOG), ¿cuál de las siguientes afirmaciones describe adecuadamente la monitorización fetal en mujeres de bajo y alto riesgo durante el trabajo de parto?","o":{"A":"En mujeres de bajo riesgo, se recomienda una monitorización continua desde el inicio del trabajo de parto, mientras que en mujeres de alto riesgo solo es necesaria de forma intermitente cada 30 minutos en ambos estadios.","B":"En las gestantes de bajo riesgo, la monitorización fetal intermitente debe realizarse cada 30 minutos en el primer estadio y cada 15 minutos en el segundo, mientras que en pacientes de riesgo se recomienda considerar el registro cardiotocográfico tanto al ingreso como durante todo el trabajo de parto.","C":"La monitorización intermitente en mujeres de bajo riesgo debe hacerse únicamente durante el segundo estadio del parto, ya que no se ha demostrado beneficio durante el primero.","D":"Para las mujeres de bajo riesgo, el ACOG permite sustituir la monitorización fetal intermitente por auscultación manual cada 60 minutos en ambos estadios, ya que no aumenta el riesgo fetal."},"c":"B"},{"id":218,"q":"¿Cuál de las siguientes afirmaciones refleja de manera más precisa la evidencia disponible sobre la utilidad del partograma en el manejo del trabajo de parto?","o":{"A":"Su uso reduce significativamente la tasa de cesáreas y de partos instrumentados, aunque no tiene impacto en la duración del parto.","B":"Aunque no se ha demostrado que disminuya intervenciones como la oxitocina o las cesáreas, se recomienda su uso porque facilita la estandarización de la asistencia, la visualización de la evolución del parto y la comparación de resultados.","C":"Su principal beneficio demostrado es mejorar las puntuaciones de Apgar a los 5 minutos, especialmente cuando se emplean modelos de partograma con líneas de alerta múltiples.","D":"Existe un consenso claro sobre cuál es el diseño de partograma más efectivo, motivo por el cual su implementación es homogénea en la mayoría de sistemas sanitarios."},"c":"B"},{"id":219,"q":"¿Cuál de las siguientes afirmaciones refleja de forma más precisa la evidencia actual sobre el pinzamiento tardío del cordón umbilical?","o":{"A":"El pinzamiento tardío disminuye la incidencia de ictericia neonatal y aumenta el volumen de sangre disponible para donación, por lo que se recomienda especialmente en madres con baja ferritina.","B":"En neonatos pretérmino, el pinzamiento tardío se asocia a una mayor estabilidad hemodinámica pero aumenta el riesgo de hemorragia intraventricular, por lo que se aconseja restringirlo a embarazos de bajo riesgo.","C":"Una de las principales ventajas en neonatos a término es el incremento de reservas de hierro durante los primeros meses de vida, aunque implica un leve aumento en la incidencia de ictericia que puede requerir fototerapia.","D":"Está contraindicado en gestaciones monocoriales, neonatos pretérmino y casos de retraso del crecimiento intrauterino debido al elevado riesgo de policitemia y descompensación hemodinámica."},"c":"C"},{"id":220,"q":"¿Cuál de los siguientes conjuntos describe correctamente los signos clásicos que indican la separación placentaria durante el tercer periodo del parto?","o":{"A":"Retracción del útero, acortamiento del cordón umbilical y disminución del sangrado vaginal.","B":"Alargamiento del cordón umbilical, salida de mayor volumen de sangre y cambio de la forma uterina de discoide a globular.","C":"Aumento del tono uterino, retracción del cordón hacia el interior y disminución del volumen sanguíneo expulsado.","D":"Descenso de la altura uterina, ausencia de sangrado y aumento de la presión abdominal materna."},"c":"B"},{"id":221,"q":"¿Cuál de las siguientes afirmaciones describe de manera más precisa los criterios diagnósticos y factores de riesgo de la hemorragia posparto (HPP)?","o":{"A":"La hemorragia posparto se define como una pérdida superior a 1.000 ml tras un parto vaginal, y los principales factores de riesgo incluyen edad materna joven, IMC bajo y trabajo de parto corto.","B":"La hemorragia posparto severa se diagnostica cuando la pérdida sanguínea supera los 500 ml.","C":"La hemorragia posparto normal se considera toda pérdida inferior a 1.000 ml, siempre que no existan signos clínicos de inestabilidad hemodinámica.","D":"La hemorragia posparto se define como una pérdida superior a 500 ml tras un parto vaginal, y presenta mayor riesgo en casos de sobredistensión uterina, IMC > 35, gran multiparidad y antecedentes de HPP."},"c":"D"},{"id":222,"q":"Respecto a la hemorragia posparto (HPP), ¿cuál de las siguientes afirmaciones integra correctamente los criterios diagnósticos y los factores de riesgo más relevantes, según la evidencia?","o":{"A":"La HPP se define por ≥ 500 ml en partos vaginales, pero las pérdidas ≥ 1.000 ml solo se consideran severas si van asociadas a inestabilidad hemodinámica. Entre los factores de riesgo destaca la nuliparidad y la edad materna < 20 años.","B":"La clasificación de hemorragia “muy severa” comienza a partir de 2.500 ml y se asocia típicamente a polihidramnios, partos rápidos, gran multiparidad y antecedentes de HPP, entre otros. La inducción del parto, sin embargo, no se considera un factor de riesgo establecido.","C":"La pérdida hemática fisiológica suele ser < 500 ml. La HPP severa se define como ≥ 1.000 ml y la muy severa ≥ 2.500 ml. Entre los factores de riesgo se incluyen IMC > 35, sobredistensión uterina, inducción al parto y partos precipitados.","D":"La HPP se diagnostica únicamente mediante estimación visual de la pérdida sanguínea. Los factores de riesgo validados incluyen solo los relacionados con la placenta (acretismo, retención placentaria), mientras que el IMC o la multiparidad no han mostrado asociación significativa."},"c":"C"},{"id":223,"q":"¿Cuál de las siguientes afirmaciones integra con mayor precisión la complejidad multidimensional del dolor en el parto según la evidencia?","o":{"A":"El dolor percibido durante el parto depende fundamentalmente de factores fisiológicos maternos, siendo mínima la influencia de variables psicológicas o socioculturales en su modulación.","B":"Aunque el dolor en el parto puede ser intenso, no tiene repercusión posterior significativa en la salud física o mental de la mujer, salvo en casos de complicaciones obstétricas graves.","C":"El dolor del parto constituye un síndrome somático-emotivo influido por factores físicos, psicológicos y socioculturales, pudiendo su falta de tratamiento asociarse a consecuencias como depresión posparto, estrés postraumático y deterioro cognitivo.","D":"La percepción del dolor es homogénea entre mujeres primíparas, y las diferencias reportadas (como dolor intenso o intolerable) se deben principalmente a variaciones en el tamaño fetal y la relación feto pélvica."},"c":"C"},{"id":224,"q":"¿Cuál de las siguientes afirmaciones describe la farmacología y clasificación de los opiáceos utilizados en obstetricia?","o":{"A":"Los opiáceos de forma dextrógira (D) son los que presentan mayor potencia analgésica, y los agonistas parciales como la buprenorfina actúan aumentando la liberación presináptica de neurotransmisores como acetilcolina y sustancia P.","B":"La eficacia analgésica de los opiáceos se explica por su acción sobre receptores opioides, inhibiendo la adenilciclasa y disminuyendo la liberación de neurotransmisores. Los agonistas puros incluyen fentanilo, morfina y remifentanilo.","C":"Los antagonistas puros como nalorfina y pentazocina son los fármacos preferidos en obstetricia porque bloquean completamente los receptores opioides evitando el riesgo de depresión respiratoria materna.","D":"Los opiáceos carecen de utilidad en analgesia regional (peridural o intradural), razón por la cual su administración obstétrica se limita exclusivamente a la vía intravenosa o intramuscular."},"c":"B"},{"id":225,"q":"¿Cuál de las siguientes afirmaciones describe con mayor exactitud las características farmacológicas, efectos adversos y limitaciones del uso de opiáceos en obstetricia?","o":{"A":"La variabilidad en la liposolubilidad explica las diferencias en vida media entre distintos opiáceos; además, pueden producir depresión respiratoria materna y neonatal, rigidez torácica, bradicardia y liberación de histamina, siendo especialmente peligrosos si se administran junto a inhibidores de la monoaminooxidasa.","B":"Los opiáceos tienen vida media similar entre sí debido a que todos comparten una liposolubilidad comparable; su mayor riesgo es la hipotensión severa y no presentan paso placentario significativo, por lo que se consideran seguros para el recién nacido.","C":"La eliminación de los opiáceos es principalmente hepática, con muy poca participación renal; su depresión del SNC no se potencia cuando se asocian a otros depresores centrales, y no existe contraindicación conocida con inhibidores de la monoaminooxidasa.","D":"La administración por vía intradural está desaconsejada en obstetricia debido a su elevada incidencia de prurito y retención urinaria; por ello, su principal uso se limita a analgesia intravenosa en la segunda fase del parto."},"c":"A"},{"id":226,"q":"¿Cuál de las siguientes afirmaciones describe de forma más precisa las características farmacológicas y las recomendaciones clínicas sobre el tramadol?","o":{"A":"El tramadol es un agonista selectivo del receptor μ y carece de efectos sobre la recaptación de neurotransmisores, lo que explica su bajo riesgo de depresión respiratoria y su recomendación durante el parto.","B":"Aunque el tramadol posee menor potencial de depresión respiratoria que otros opiáceos, actúa como agonista puro no selectivo de receptores opioides y también inhibe la recaptación de noradrenalina, por lo que no se recomienda su administración antes o durante el parto.","C":"El tramadol presenta un efecto analgésico exclusivamente mediado por la intensificación de la liberación de serotonina, motivo por el cual se considera una alternativa preferente durante la lactancia.","D":"El tramadol no atraviesa la leche materna, por lo que se considera el analgésico de elección en el posparto inmediato, incluso en mujeres en periodo de lactancia."},"c":"B"},{"id":227,"q":"Respecto a los anestésicos locales tipo éster y tipo amida utilizados por vía epidural, ¿cuál de las siguientes afirmaciones es correcta?","o":{"A":"Los anestésicos tipo éster, al metabolizarse en el hígado, presentan vidas medias más largas pero permiten esterilización por calor; por ello su dosis máxima en mg suele ser mayor que la de las amidas, como con la tetracaína frente a la bupivacaína.","B":"La estabilidad de la unión amida permite que anestésicos como lidocaína y mepivacaína toleren la esterilización por calor, pero al requerir metabolismo plasmático por seudocolinesterasa presentan dosis máximas más bajas que los ésteres como la clorprocaína.","C":"Los anestésicos tipo éster, al ser hidrolizados rápidamente por la seudocolinesterasa plasmática, tienen vidas medias cortas y permiten un mayor margen de seguridad; un ejemplo es que la clorprocaína presenta una dosis máxima mayor (8 mg/kg) que la de las amidas como la bupivacaína (2 mg/kg).","D":"Los anestésicos tipo amida no pueden asociarse a adrenalina porque su unión química es inestable ante cambios de pH; esto explica que la ropivacaína tenga una dosis máxima más baja que los anestésicos tipo éster como la procaína."},"c":"C"},{"id":228,"q":"¿Cuál de las siguientes afirmaciones sobre el bloqueo peridural en el trabajo de parto NO es correcta?","o":{"A":"Aunque el bloqueo peridural puede producir hipotensión materna por bloqueo simpático, esta complicación puede minimizarse mediante precarga de fluidos y administración de vasopresores.","B":"El bloqueo peridural puede modificar la dinámica uterina durante su instauración inicial debido a una disminución transitoria de catecolaminas maternas, aunque una vez establecido no altera la contractilidad.","C":"La aparición de cefalea postpunción se debe al descenso de presión del LCR tras perforación de la duramadre, pudiendo requerir un parche hemático para su resolución.","D":"La presencia de infección sistémica controlada con foco local en la zona de punción no contraindica la colocación del peridural."},"c":"D"},{"id":229,"q":"¿Cuál de las siguientes afirmaciones sobre el bloqueo peridural es FALSA?","o":{"A":"El bloqueo peridural no modifica la dinámica uterina una vez instaurada y favorece la dilatación del cuello uterino.","B":"La técnica no modifica la adaptación del feto a la vida extrauterina.","C":"La presencia de temblores y escalofríos en la parturienta tras el peridural es indicativa de infección en el espacio peridural.","D":"Entre las complicaciones se incluyen h
